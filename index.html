<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FastTrack">
<title>Vertriebs-FastTrack</title>
<meta name="theme-color" content="#0b1a22">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Poppins:wght@400;500;600;700&display=swap">
<style>
/* Layout: Arbeits-App – Sidebar mit 4 Phasen / 16 Modulen links, Arbeitsfläche rechts; mobil Top-Bar + Modul-Drawer + Weiter-Leiste */
:root{
  --bg:#0b1a22; --panel:#11252e; --panel2:#17313c; --line:#24434f;
  --fg:#e9f2f4; --muted:#8ea6ae; --teal:#48bdc8; --teal-d:#289bad; --gold:#d9b45c;
  --ok:#5fcf9a; --warn:#e3a54c; --bad:#e07a6f;
  --display:"Anton","Impact","Arial Narrow",sans-serif;
  --body:"Poppins","Segoe UI",system-ui,-apple-system,Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:15px;line-height:1.55;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--teal)}
h1,h2,h3{text-wrap:balance;margin:0}
h1{font-family:var(--display);font-weight:400;font-size:clamp(30px,5vw,46px);line-height:1.02;letter-spacing:.01em;text-transform:uppercase}
h2{font-family:var(--display);font-weight:400;font-size:22px;letter-spacing:.02em;text-transform:uppercase}
h3{font-size:16px;font-weight:600}
p{margin:0}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--teal)}
.muted{color:var(--muted)}
.small{font-size:13px}
.tab{font-variant-numeric:tabular-nums}

/* App shell */
.app{display:grid;grid-template-columns:290px minmax(0,1fr);min-height:100vh}
.side{background:var(--panel);border-right:1px solid var(--line);padding:22px 16px;position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;gap:18px}
.brand{font-weight:700;font-size:15px;letter-spacing:-.01em}
.brand .p{color:var(--teal)}.brand .sep{color:var(--muted);padding:0 4px}
.me{display:flex;align-items:center;gap:12px}
.ring{width:54px;height:54px;flex:none}
.ring circle{fill:none;stroke-width:6}
.ring .bgc{stroke:var(--line)}.ring .fgc{stroke:var(--gold);stroke-linecap:round;transition:stroke-dashoffset .4s}
.ring text{fill:var(--fg);font:600 13px var(--body)}
.phase{display:flex;flex-direction:column;gap:2px}
.phase-h{display:flex;justify-content:space-between;font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:0 8px 4px}
.nav{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:8px;cursor:pointer;color:var(--fg);font-size:14px}
.nav:hover{background:var(--panel2)}
.nav.on{background:var(--panel2);box-shadow:inset 3px 0 0 var(--teal)}
.dot{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line);flex:none;display:grid;place-items:center;font-size:11px;color:var(--muted)}
.dot.done{background:var(--ok);border-color:var(--ok);color:#0b1a22}
.dot.auto{border-color:var(--gold);color:var(--gold)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:6px}

.main{min-width:0;padding-block:28px 110px;padding-inline:clamp(16px,4vw,48px)}
.wrap{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.topbar{display:none}

/* Elements */
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;min-width:0}
.card.hi{border-color:var(--teal-d);background:linear-gradient(160deg,#143843,#11252e)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.lead{font-size:16px;color:var(--muted);max-width:62ch}
.task{border-left:3px solid var(--gold);background:#1a2b2a;border-radius:0 10px 10px 0;padding:14px 16px}
.task b{color:var(--gold);letter-spacing:.08em;font-size:12px;text-transform:uppercase;display:block;margin-bottom:3px}
.quote{font-family:var(--display);font-size:22px;line-height:1.2;text-transform:uppercase;letter-spacing:.01em;color:var(--fg)}
.quote small{display:block;font-family:var(--body);text-transform:none;font-size:14px;color:var(--muted);margin-top:6px;letter-spacing:0}
.label{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--teal);margin-bottom:6px}
ul.clean{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
ul.clean li{padding-left:16px;position:relative}
ul.clean li:before{content:"";position:absolute;left:0;top:.62em;width:7px;height:7px;border-radius:50%;background:var(--teal)}
ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--panel2);border-radius:9px;padding:9px 14px;cursor:pointer;font-weight:500;font-size:14px;text-decoration:none;color:var(--fg)}
.btn:hover{border-color:var(--teal)}
.btn.pri{background:var(--teal);border-color:var(--teal);color:#08161c;font-weight:600}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#1a1405;font-weight:600}
.btn.ghost{background:none}
.btn.sm{padding:6px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

input[type=text],input[type=number],input[type=date],select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-size:14px}
textarea{min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--teal)}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>span{font-size:13px;color:var(--muted)}

.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:500;background:var(--panel2);cursor:pointer}
.pill.on{background:var(--teal);color:#08161c;border-color:var(--teal)}
.badge{display:inline-block;border-radius:999px;padding:2px 9px;font-size:11px;font-weight:600;letter-spacing:.04em}
.b-ok{background:rgba(95,207,154,.15);color:var(--ok)}
.b-warn{background:rgba(227,165,76,.15);color:var(--warn)}
.b-mut{background:var(--panel2);color:var(--muted)}

.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:8px;border-bottom:1px solid var(--line)}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
td input,td select{padding:6px 8px}

.stars{display:inline-flex;gap:3px}
.stars button{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);background:none;cursor:pointer;font-size:12px;color:var(--muted)}
.stars button.on{background:var(--teal-d);border-color:var(--teal-d);color:#fff}

.flow{display:flex;gap:8px;flex-wrap:wrap}
.flow span{flex:1 1 120px;text-align:center;border:1px solid var(--line);border-radius:8px;padding:10px 6px;font-weight:600;font-size:13px;background:var(--panel)}

.kpi{display:flex;flex-direction:column;gap:2px}
.kpi b{font-family:var(--display);font-weight:400;font-size:34px;line-height:1;color:var(--gold)}
.kpi span{font-size:12px;color:var(--muted)}

.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--teal);border-radius:99px;transition:width .3s}

.script{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px}
.script .t{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--teal)}
.script p{font-size:14.5px}
.script mark{background:rgba(217,180,92,.18);color:var(--gold);border-radius:3px;padding:0 3px}

.opt{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:9px;padding:10px 12px;cursor:pointer;background:var(--bg)}
.opt.sel{border-color:var(--teal)}
.opt.right{border-color:var(--ok);background:rgba(95,207,154,.08)}
.opt.wrong{border-color:var(--bad);background:rgba(224,122,111,.08)}

.timer{font-family:var(--display);font-size:72px;line-height:1;color:var(--fg);font-variant-numeric:tabular-nums}
.timer.run{color:var(--teal)}.timer.over{color:var(--bad)}

.modfoot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:18px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--gold);color:#1a1405;padding:9px 16px;border-radius:9px;font-weight:600;font-size:14px;z-index:60;box-shadow:0 6px 20px rgba(0,0,0,.4)}

.listrow{display:grid;grid-template-columns:34px minmax(0,1.2fr) minmax(0,1.4fr) 140px 34px;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.listrow .n{color:var(--muted);font-size:12px}
.iconbtn{width:30px;height:30px;border-radius:7px;border:1px solid var(--line);background:none;cursor:pointer;color:var(--muted)}
.iconbtn:hover{color:var(--bad);border-color:var(--bad)}

.cert{border:2px solid var(--gold);border-radius:16px;padding:32px;background:radial-gradient(circle at 85% 10%,rgba(72,189,200,.16),transparent 55%),var(--panel);text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.cert .lv{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.cert .lv span{border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:600;font-size:13px;color:var(--muted)}
.cert .lv span.on{border-color:var(--gold);color:var(--gold)}

.welcome{max-width:760px;margin:0 auto;padding-block:clamp(28px,7vh,80px) 60px;padding-inline:16px;display:flex;flex-direction:column;gap:26px}
.steps4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.steps4 div{padding:14px 12px;border-right:1px solid var(--line)}
.steps4 div:last-child{border-right:0}
.steps4 b{display:block;font-size:12px;letter-spacing:.08em;color:var(--teal)}
.steps4 span{font-size:13px;color:var(--muted)}

.langs{display:flex;flex-wrap:wrap;gap:4px}
.langs button{border:1px solid var(--line);background:none;border-radius:6px;padding:3px 7px;font-size:11px;font-weight:600;letter-spacing:.06em;cursor:pointer;color:var(--muted)}
.langs button.on{background:var(--teal);border-color:var(--teal);color:#08161c}
.topbar .langsel{width:auto;padding:5px 8px;font-size:13px}
.mobnav{display:none}
.overlay{display:none}

@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;left:0;top:0;bottom:0;width:min(86vw,320px);z-index:50;transform:translateX(-105%);transition:transform .25s;padding-top:calc(22px + env(safe-area-inset-top,0px))}
  .side.open{transform:none}
  .overlay.open{display:block;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:40}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 16px}
  .main{padding-block:20px 110px}
  .grid2,.grid3,.grid4,.steps4{grid-template-columns:minmax(0,1fr)}
  .steps4 div{border-right:0;border-bottom:1px solid var(--line)}
  .listrow{grid-template-columns:28px minmax(0,1fr) 34px;row-gap:6px}
  .listrow .ctx,.listrow .cat{grid-column:2 / 3}
  .mobnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--panel);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));gap:10px}
  .mobnav .btn{flex:1}
  .timer{font-size:56px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{.side,.topbar,.mobnav,.modfoot,.noprint{display:none!important}.app{display:block}body{background:#fff;color:#000}}
</style>
</head>

scripts:{

scripts:{
 warm:[["Przyjaciel / znajomy · WhatsApp","Cześć [Imię], w tle pomagam właśnie budować projekt wokół sprzedawców, cashbacku i budowania sieci. Nie myślę u ciebie o klasycznej sprzedaży, raczej o tym, czy to może być ciekawe dla ciebie albo twojego otoczenia. Masz w najbliższych dniach 10 minut?"],["Przyjaciel / znajomy · osobiście","Nie chcę ci tu nic sprzedawać przy stole. Chcę ci tylko krótko pokazać, co budujemy, bo myślę, że od razu zobaczysz, gdzie może być w tym dźwignia dla twojej sieci."],["Ciepły kontakt · WhatsApp","Cześć [Imię], przy pewnym aktualnym temacie od razu pomyślałem o tobie, bo masz dokładnie odpowiednie kontakty i synergie. Chodzi o połączenie handlu, lojalności klientów i budowy sprzedaży. Chętnie krótko pokażę ci ten pomysł. Kiedy pasuje ci 10 minut?"],["Ciepły kontakt przedsiębiorca","Masz już bazę klientów / sieć. Właśnie dlatego ten temat jest ciekawy: nie chodzi o wysuwanie na pierwszy plan kolejnego produktu, tylko o dodanie do istniejących relacji nowej warstwy wartości."]],
 cold:[["Handlowiec · bezpośrednio","Masz już dostęp do ludzi i firm. Właśnie dlatego chcę ci pokazać nasz model. Nie chodzi o zastąpienie twojego obecnego biznesu, tylko o poszerzenie istniejących kontaktów i struktur o dodatkową dźwignię, którą można monetyzować."],["Szef sprzedaży · dźwignia sieci","U was robi się ciekawie nie na poziomie pojedynczej transakcji, tylko na poziomie struktury. Jeśli twój zespół i tak ma dostęp do przedsiębiorców, możemy sprawdzić, czy ePOINT pasuje jako dodatkowy element do istniejącego procesu."],["Zimny kontakt przedsiębiorca · krótko (Pan/Pani)","Dzień dobry [Imię], kontaktuję się z Panem/Panią bardzo celowo. Budujemy obecnie ekosystem sprzedawców i klientów i szukamy firm z odpowiednim ruchem klientów. Nie chcę niczego tłumaczyć przez telefon – chciałbym tylko w 10 minut sprawdzić, czy to w ogóle ma sens dla Pana/Pani firmy."],["Zimny multiplikator · krótko (Pan/Pani)","Trafiłem na Pana/Panią, ponieważ ma Pan/Pani dostęp do [branża/sieć]. Nie szukamy po prostu kolejnych pojedynczych kontaktów, tylko strategicznych partnerów sieciowych. Jeśli to brzmi zasadniczo interesująco, pokażę logikę w 10 minut."]],

/* ---------- Structure ---------- */

var SC_IDS={warm:["w1","w2","w3","w4"],cold:["c1","c2","c3","c4"],fu:["f1","f2","f3"]};

/* ---------- Derived ---------- */
function tops(){ return S.list.filter(function(c){return c.top;}); }
function contacted(){ return S.list.filter(function(c){return !!c.status;}); }
function scoreOf(c){ return (c.t||0)+(c.p||0)+(c.s||0); }
function netFilled(){ var n=0; for(var i=0;i<5;i++){ if((S.net[i]||"").trim()) n++; } return n; }
function sentTotal(g){ var n=0; SC_IDS[g].forEach(function(id){ n+=S.sent[id]||0; }); return n; }
function quizOk(){ return QUIZ_C.every(function(c,i){ return S.quiz[i]===c; }); }
function nextSteps(){ return S.list.filter(function(c){return c.next && c.date;}).length; }
function dupAll(){ for(var i=0;i<5;i++){ if(!S.dup["d"+i]) return false; } return true; }
function autoDone(id){
  switch(id){
   case "start": return !!S.startedAt;
   case "diag": for(var i=0;i<6;i++){ if(!(S.diag["q"+i]||"").trim()) return false; } return S.diag.type!=null && S.diag.type!=="";
   case "system": return S.pitch.reps>=3;
   case "check": return quizOk() && S.pitch.leaderOk;
   case "list": return S.list.length>=100;
   case "top": return tops().length>=10;
   case "multi": return !!S.multi.seen;
   case "net": return netFilled()>=3;
   case "warm": return sentTotal("warm")>=3;
   case "cold": return sentTotal("cold")>=4;
   case "pipe": return contacted().length>=5;
   case "talk": return S.talks.length>=1;
   case "sprint": var n=0; for(var k in S.sprint) if(S.sprint[k]) n++; return n>=12;

}
function doneCount(){ var n=0; ORDER.forEach(function(id){ if(S.done[id]) n++; }); return n; }
function certLevel(){
  var certified=quizOk() && S.pitch.leaderOk;

/* ---------- Backup ---------- */
var inFrame=(function(){ try{ return window.self!==window.top; }catch(e){ return true; } })();
function backupHTML(){
  var b=L.m.bk;
  return '<div class="card stack" id="backupcard"><div class="row" style="justify-content:space-between"><h2>'+b.title+'</h2><button class="btn sm ghost" data-act="closeBackup">'+b.close+'</button></div>'+
   '<p class="small muted">'+b.hint+'</p>'+
   '<div class="row"><button class="btn pri" data-act="exportFile">'+b.file+'</button><button class="btn" data-act="exportCopy">'+b.copy+'</button></div>'+
   '<label class="field"><span>'+b.loadL+'</span><input type="file" id="impfile" accept=".json,application/json"></label>'+
   '<textarea id="impcode" placeholder="'+esc(b.codePh)+'"></textarea><div class="row"><button class="btn gold" data-act="importCode">'+b.load+'</button></div>'+
   '<details><summary class="small" style="cursor:pointer;color:var(--bad)">'+b.resetSum+'</summary><div class="row" style="margin-top:8px"><button class="btn sm" style="border-color:var(--bad);color:var(--bad)" data-act="resetAll">'+b.resetBtn+'</button></div></details></div>';
}
function showBackup(){
  var box=document.getElementById("backupbox");
  if(box){ box.innerHTML=backupHTML(); box.scrollIntoView({behavior:"smooth"}); return; }
  var w=document.querySelector(".wrap"), d=document.createElement("div"); d.id="backupbox"; d.innerHTML=backupHTML(); w.insertBefore(d,w.firstChild); closeSide(); window.scrollTo(0,0);
}
function importData(txt){
  try{ var d=JSON.parse(txt); if(!d || d.v!==VERSION || !Array.isArray(d.list)) throw 0; S=merge(blank(),migrate(d)); setLang(S.lang); save(); render(); toast(L.m.bk.loaded); }
  catch(e){ toast(L.m.bk.invalid); }
}
function exportFile(){
  var name="fasttrack-"+(S.name||"partner").toLowerCase().replace(/[^a-z0-9]+/g,"-")+"-"+new Date().toISOString().slice(0,10)+".json";
  var data=JSON.stringify(S,null,1);
  if(window.claude && typeof window.claude.use==="function"){
    window.claude.use("downloads").then(function(dl){
      if(!dl){ copyText(data); return; }
      dl.save({filename:name,data:new Blob([data],{type:"application/json"})}).then(function(){toast(L.m.bk.saved);},function(){ toast(L.m.bk.canceled); });
    },function(){ copyText(data); });
    return;
  }
  var a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([data],{type:"application/json"})); a.download=name; document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.parentNode.removeChild(a); },500);
}

/* ---------- Events ---------- */
function go(id){ if(!id||!L.mods[id]) return; S.view=id; save(); render(); window.scrollTo(0,0); try{ history.replaceState(null,"","#"+id); }catch(e){} }
function closeSide(){ var s=document.getElementById("side"), o=document.getElementById("ov"); if(s) s.classList.remove("open"); if(o) o.classList.remove("open"); }
function markContacted(g){ var c=findC(pick[g]); if(c && !c.status) c.status="NEU"; }
function switchLang(l){
  var n=document.getElementById("w_name"), ld=document.getElementById("w_leader");
  var cs=document.getElementById("w_consent");
  if(n) draftName=n.value; if(ld) draftLeader=ld.value; if(cs) draftConsent=cs.checked;
  setLang(l); save(); render();
}

document.addEventListener("click",function(e){
  var g=e.target.closest("[data-go]"); if(g && !g.disabled){ go(g.getAttribute("data-go")); return; }
  var el=e.target.closest("[data-act]"); if(!el) return;
  var a=el.getAttribute("data-act"), id=el.getAttribute("data-id");
  switch(a){
   case "lang": switchLang(el.getAttribute("data-v")); break;
   case "consent": S.consent=true; save(); render(); sync(false); break;
   case "openside": document.getElementById("side").classList.add("open"); document.getElementById("ov").classList.add("open"); break;
   case "closeside": closeSide(); break;
   case "toggleDone": S.done[id]=!S.done[id]; save(); render(); if(S.done[id]) toast(L.ui.toastDone); break;
   case "setType": S.diag.type=+el.getAttribute("data-v"); save(); render(); break;
   case "quiz": S.quiz[+el.getAttribute("data-q")]=+el.getAttribute("data-a"); save(); render(); break;
   case "pitchStart": pitchToggle(); break;
   case "pitchReset": pitchStop(false); S.pitch={reps:0,best:0,leaderOk:S.pitch.leaderOk}; save(); render(); break;
   case "addCat": addCat=+el.getAttribute("data-v"); [].forEach.call(document.querySelectorAll("#catpills .pill"),function(p){p.classList.toggle("on",p===el);}); break;
   case "bulkAdd": var lines=document.getElementById("bulk").value.split(/\n+/).map(function(s){return s.trim();}).filter(Boolean); lines.forEach(function(n){ S.list.push({id:uid(),name:n,ctx:"",cat:addCat}); }); save(); render(); toast(F(L.m.list.bulkToast,{n:lines.length})); break;
   case "delC": S.list=S.list.filter(function(c){return c.id!==id;}); save(); render(); break;
   case "rate": var c=findC(id); c[el.getAttribute("data-k")]=+el.getAttribute("data-v"); save(); render(); break;
   case "copyScript": var grp=el.getAttribute("data-g"), sc=scripts(grp).filter(function(s){return s.id===id;})[0]; copyText(fill(sc.x,findC(pick[grp]))); S.sent[id]=(S.sent[id]||0)+1; markContacted(grp); save(); setTimeout(render,50); break;
   case "waScript": S.sent[id]=(S.sent[id]||0)+1; markContacted(el.getAttribute("data-g")); save(); setTimeout(render,300); break;
   case "copy4": var t=[0,1,2,3].map(function(i){return (S.sent["f4_"+i]||"").trim();}).filter(Boolean).join(" "); if(t) copyText(t); else toast(L.m.cold.fill4); break;
   case "delTalk": S.talks.splice(+el.getAttribute("data-i"),1); save(); render(); break;
   case "weekNext": for(var i=0;i<6;i++) S.kpi["t"+i]=""; save(); render(); toast(L.m.week.closed); break;
   case "copyLink": copyText(location.href.split("#")[0]+"#"+S.lang); break;
   case "print": window.print(); break;
   case "backup": showBackup(); break;
   case "closeBackup": var b=document.getElementById("backupbox"); if(b){ if(S.startedAt) b.parentNode.removeChild(b); else b.innerHTML=""; } break;
   case "exportFile": exportFile(); break;
   case "exportCopy": copyText(JSON.stringify(S)); break;
   case "importCode": var v=document.getElementById("impcode").value.trim(); if(v) importData(v); else toast(L.m.bk.need); break;
   case "resetAll": try{ localStorage.removeItem(KEY); }catch(err){} S=blank(S.lang); lastSent=0; lastSync=0; render(); toast(L.m.bk.reset); break;
  }
});
document.addEventListener("change",function(e){
  var el=e.target, act=el.getAttribute("data-act");
  if(el.id==="impfile" && el.files && el.files[0]){ var r=new FileReader(); r.onload=function(){ importData(String(r.result)); }; r.readAsText(el.files[0]); return; }
  if(act==="langsel"){ switchLang(el.value); return; }
  if(act==="topToggle"){ var c=findC(el.getAttribute("data-id")); c.top=el.checked; if(!c.top) c.first5=false; save(); render(); return; }
  if(act==="first5"){ var c2=findC(el.getAttribute("data-id")), n5=S.list.filter(function(x){return x.first5;}).length; if(el.checked && n5>=5){ el.checked=false; toast(L.m.top.max5); return; } c2.first5=el.checked; save(); return; }
  if(act==="pick"){ pick[el.getAttribute("data-g")]=el.value; render(); return; }
  if(el.hasAttribute("data-cbind") && (el.tagName==="SELECT"||el.type==="checkbox"||el.type==="date")){ cbind(el); if(el.hasAttribute("data-rr")) render(); return; }
  if(el.hasAttribute("data-bind") && el.type==="checkbox"){ setPath(el.getAttribute("data-bind"),el.checked); save(); render(); return; }
});
document.addEventListener("input",function(e){
  var el=e.target;
  if(el.hasAttribute("data-bind") && el.type!=="checkbox"){ setPath(el.getAttribute("data-bind"),el.value); save(); return; }
  if(el.hasAttribute("data-cbind") && el.type==="text"){ cbind(el); return; }
  if(el.hasAttribute("data-mbind")){ S.multi[el.getAttribute("data-mbind")]=el.value; save(); document.getElementById("multibody").innerHTML=multiRows(); return; }
  if(el.id==="lfilter"){ listFilter=el.value; var pos=el.selectionStart; render(); var f=document.getElementById("lfilter"); if(f){ f.focus(); try{f.setSelectionRange(pos,pos);}catch(x){} } }
});
function cbind(el){
  var p=el.getAttribute("data-cbind").split("."), c=findC(p[0]); if(!c) return;
  var v= el.type==="checkbox"?el.checked:el.value;
  if(p[1]==="cat" && v!=="") v=+v;
  c[p[1]]=v; save();
}
document.addEventListener("submit",function(e){
  e.preventDefault();
  var f=e.target;
  if(f.id==="startform"){
    var n=document.getElementById("w_name").value.trim(); if(!n){ toast(L.ui.needName); return; }
    var cb=document.getElementById("w_consent"); if(SYNC && cb && !cb.checked){ toast(L.ui.consentNeed); return; }
    S.name=n; S.leader=document.getElementById("w_leader").value.trim(); S.consent=!!(cb&&cb.checked); S.startedAt=Date.now(); S.view="start"; save(); render(); sync(false); return; }
  if(f.id==="addform"){ var inp=document.getElementById("add_name"), nm=inp.value.trim(); if(!nm){ inp.focus(); return; } S.list.push({id:uid(),name:nm,ctx:document.getElementById("add_ctx").value.trim(),cat:addCat}); save(); render(); var ni=document.getElementById("add_name"); if(ni) ni.focus(); if(S.list.length===30) toast(L.m.list.t30); if(S.list.length===100) toast(L.m.list.t100); return; }
  if(f.id==="talkform"){ var w=document.getElementById("t_who").value.trim(); if(!w) return; S.talks.unshift({at:Date.now(),who:w,lever:document.getElementById("t_lever").value,q:document.getElementById("t_q").value,next:document.getElementById("t_next").value}); var c=S.list.filter(function(x){return x.name===w;})[0]; if(c && (!c.status||c.status==="NEU")) c.status="TERMIN"; save(); render(); toast(L.m.talk.saved); return; }
});

/* ---------- Pitch timer ---------- */
var pT=null, pStart=0;
function pitchToggle(){ if(pT){ pitchStop(true); } else { pStart=Date.now(); document.getElementById("pitchBtn").textContent=L.m.system.stop; pT=setInterval(tick,200); tick(); } }
function tick(){ var el=document.getElementById("timer"); if(!el){ clearInterval(pT); pT=null; return; } var s=(Date.now()-pStart)/1000, left=Math.ceil(60-s); el.textContent=left>0?left:"+"+Math.floor(s-60); el.className="timer tab "+(left>0?"run":"over"); }
function pitchStop(count){
  if(!pT) return; clearInterval(pT); pT=null;
  var s=Math.round((Date.now()-pStart)/1000), m=L.m.system;
  if(count){
    if(s<15) toast(m.short);
    else if(s<=60){ S.pitch.reps++; if(!S.pitch.best||s<S.pitch.best) S.pitch.best=s; save(); toast(F(m.valid,{s:s})); }
    else toast(F(m.long,{s:s}));
  }
  render();
}

/* ---------- Boot ---------- */
var hadSaved=false;
try{ hadSaved=!!localStorage.getItem(KEY); }catch(e){}
load();
var hash=(location.hash||"").replace("#","").toLowerCase();
if(LANGS.indexOf(hash)>=0 && (!hadSaved || !S.startedAt)) S.lang=hash;
setLang(S.lang);
if(hash && L.mods[hash] && S.startedAt) S.view=hash;
try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){}
render();
if(S.startedAt) setTimeout(function(){ if(!S.updatedAt) S.updatedAt=Date.now(); sync(false); },1500);
})();

</script>
