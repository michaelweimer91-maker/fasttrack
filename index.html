 geld:{"lead":"Compensation arises in two ways: once, when a new partner buys a package, and on an ongoing basis from the usage of active customers. Neither comes from messaging alone, and neither is guaranteed.","blocks":[["Closing commission","one-time","A new partner buys a package: Premium package = 3 CP, voucher = 1 CP."],["Airtime","ongoing","Your active customers use ePOINT. Usage that qualifies for compensation generates CP."],["Difference","per occasion","A partner in your line has a lower rank – you receive the difference between the rates, e.g. Area Manager above Team Builder: 3 CP × €2 = €6."],["Team","per occasion","Partners at the same level: team airtime in the model €10 / €3 / €2 per CP over three generations."]],"calcT":"Calculator","calcHint":"CP stands for Commission Points. The euro rate per CP differs for closing and airtime – never lump the two together.","rank":"Your rank","prem":"Premium packages of new partners","vou":"Vouchers","cust":"Active customers","cp":"CP per customer (assumption)","closure":"Closing commission · one-time","air":"Airtime model · per billing period","perCp":"€ per CP","cust2":"active customers","calcNote":"Model calculation before tax, no forecast and no promise. 0.10 CP per customer is an assumption. Qualification, actual usage, costs and payout are determined by the official plan.","tableT":"Ranks, qualification and rates","cols":["Rank","Qualification per chart","Closing € per CP","Airtime € per CP (model)"],"ranks":[["P","Partner","Back office"],["CB","Community Builder","Basic Pack or 50 CP"],["TB","Team Builder","Premium Pack or 100 CP"],["AM","Area Manager","250 CP"],["RD","Regional Director","500 CP"],["SD","Sales Director","2,500 CP"],["CM","Country Manager","5,000 CP"],["IBM","Innercircle Board Member","10,000 CP"]],"tableNote":"From IBM, the model adds a share of the global pool: worldwide company CP × €10, divided by the eligible IBMs. Source: Best Prime compensation chart and commission guideline, as of 12.10.2026; Premium package = 3 CP since 15.09.2026. Check against the current version in the back office before any commitment.","talkT":"How you talk about money","talkQ":"“You earn once from closings and on an ongoing basis from your customers’ usage. How much depends on what you do. I’ll show you the official plan.”","talk":["Never state a monthly amount as an expectation.","Never say “passive income”.","Always label example calculations as a model.","Never buy packages or vouchers – or have them bought – just for a rank."],"openT":"Clarify before any commitment","open":["Costs of the Basic and Premium Pack, one-time and ongoing","When an entitlement arises and when it is paid out","What the 50 % or 30 % rule means for qualification","Whether the team closing rates per chart (€20 / €6 / €4) apply per CP or per closing"],"openBtn":"Copy questions for your sponsor","openMsg":"Hi{l}, before I explain the plan to anyone, I want to be sure about four points: 1) What do the Basic and Premium Pack cost, one-time and ongoing? 2) When does an entitlement arise and when is it paid out? 3) What does the 50 % or 30 % rule mean for qualification? 4) Do the team closing rates of €20 / €6 / €4 apply per CP or per closing? Thanks!","task":"Work out two examples of your own: one closing at your rank and 10 active customers. Then explain in two sentences how compensation arises."},
 haltung:{"lead":"People don’t react to information but to the attitude you come with. Whoever asks for favours gets brushed off. Whoever checks whether it fits is taken seriously.","core":"“I have something good, I’m looking for the people it fits – and I have time to find them.”","coreL":"Your mindset in one sentence","pT":"The 10 principles","whyL":"Why it works","howL":"How to use it","lineL":"Red line","p":[["Sort instead of persuade","Pressure triggers resistance. Whoever checks openly comes across as confident and trustworthy.","“I don’t know if this is for you – let’s check quickly.”","No artificial scarcity."],["Curiosity before information","An open question in someone’s head wants an answer. Explaining everything in chat invites a verdict without a conversation.","In the first message only the topic, the connection and a small next step. Details in the conversation.","It is always clear what it’s about. If someone asks directly about the company, you name it."],["Relevance beats reach","People react to what concerns them.","Every message has a genuine “because you …” sentence.","No invented reasons."],["Whoever asks, leads","People believe what they say themselves. Questions make the need visible.","Ask first, then show. Your share of talking stays below a third.","No leading questions that only allow a yes."],["Small yes steps","A small yes is easier than a big one – and whoever agrees tends to stay.","Only ever ask for the next small step: 10 minutes, a look at the app, a meeting.","No yes by ambushing."],["Experience beats explanation","Your own experience convinces more than any slide.","Show the app live, show your own cashback receipt.","No other people’s or embellished results."],["Give first","Whoever receives a gift is more open. The app is free – a genuine tip.","Start with the customer benefit before you talk about the business.","No “gift” with hidden conditions."],["Eye to eye instead of asking","Whoever apologises makes themselves small. Sales professionals only respect the tone between equals.","Calm, clear, without “Sorry to bother you”.","No arrogance, never badmouth other companies."],["A no is information","Whoever takes rejections personally gives up. Whoever counts them gets better.","Say thanks, set the status, next contact.","No follow-up after a clear no."],["Identity and rhythm","People act according to their self-image. Fixed work blocks beat motivation.","“I’m someone who makes 3 contacts every day.” Tick it off daily.",""]],"fearT":"The fear of the first contact","fear":"Almost everyone has it. It doesn’t disappear by reading, but with the first ten messages.","fearL":[["Start together","You send the first message during the start call while your sponsor listens."],["Start with the gift","An invitation to the free app is easier than any business request."],["Count activity, not results","Your daily goal is “3 messages sent”, not “3 yeses”."]],"wordsT":"Say it like this","words":[["once-in-a-lifetime chance","a model we’re currently testing with a few people"],["passive income","an ongoing income stream that depends on real usage"],["Get in now!","Let’s check whether it fits."],["I want to present something to you.","I want to understand how you’re set up."]],"task":"Read the 10 principles once in full. Pick the two that are hardest for you and pay close attention to them in your next five messages."},
 einw:{"lead":"An objection is not a no but a question that is still open. Whoever takes it seriously wins trust. Whoever brushes it aside loses it.","method":[["Acknowledge","“I understand.”"],["Ask","“What exactly do you mean by that?” – there is often something else behind it."],["Answer honestly","Short, with facts, without promises."],["Move on","“Does that clear it up for you?” – then on to the next step."]],"listT":"The 12 most common objections","search":"Search objections, e.g. time, money, pyramid","none":"No matching objection. Ask your sponsor – and enter the answer below.","behind":"Often behind it:","items":[["“I don’t have time.”","fear of effort","You set the pace. How much time would you realistically have per week? Then we’ll check honestly whether that’s enough."],["“I can’t sell.”","fear of rejection","You don’t have to. You show a free app you use yourself – that’s more recommending than selling. And at the start your sponsor joins the conversations."],["“I don’t know anyone.”","underestimated network","Let’s go through your phone together for 10 minutes – then we’ll see."],["“Is this a pyramid scheme?”","fear of fraud","Good question, you should ask it. It’s direct sales with a real product: customers use a free app and get cashback, merchants retain their customers. Compensation is paid for closings and for the usage of real customers according to an official plan. I’ll show you the documents, then you check for yourself."],["“Is this network marketing?”","reservations about the industry","Yes, the sales side is set up as a partner structure – I’d rather tell you that myself right away. But the interesting part is the mechanism behind it: customer loyalty through real purchases at merchants. Whether that fits you, we’ll check in 15 minutes."],["“What does it cost?”","assessing the risk","As a customer, nothing. As a partner there are starter packages – I’ll show you the exact prices from the current official documents, not from memory."],["“What do you earn with it?”","looking for proof","Honestly: [true answer, e.g. “I’m still at the beginning”]. What matters is how the plan works and what you make of it – I’ll show it to you."],["“Just send me some info.”","polite dodge or real interest","Happy to – but only once I know which information is relevant for you. What interests you more: the app as a customer or the business? Let’s have a 10-minute call afterwards. Thursday or Friday?"],["“I need to think about it.”","an open question","Sure. So that you can think it through well: which point is still open for you? (Then agree on a date for the answer.)"],["“I need to talk to my partner.”","joint decision","Very good. Shall we have the next conversation as three? Then your partner gets the same information first-hand."],["“There are lots of cashback apps.”","comparison","True. Just try it, it’s free: 3 to 30 % at participating local merchants and in more than 1,000 online shops, paid out to your bank account."],["“Is ePAY available yet?”","curiosity about what’s new","No. ePAY is planned for 09.01.2027. What you can use today is the ePOINT app – I’ll show it to you."]],"copyA":"Copy answer","mineT":"My three toughest objections","mineE":"Objection","mineA":"My answer","task":"Practise three objections out loud – with your sponsor or a partner – and enter your own three toughest objections with an answer."},
 kgesetze:{"lead":"Messages, conversations and strategy for the really big ones – network leaders, sales heads and door-openers. Everything follows from these ten sentences. Whoever breaks them loses the king – usually without noticing why.","motto":"You don’t recruit kings.","motto2":"You select them.","pillars":[["Respect for his risk","He has more to lose than to gain. Say it before he thinks it."],["Proof before vision","A real case beats any slide about the future."],["Selection instead of advertising","You check whether he fits – not the other way round."]],"lawsT":"The 10 Royal Laws","laws":[["Select instead of recruiting.","You check whether he fits – not the other way round. Whoever advertises has lost before he speaks."],["Whoever explains more loses status.","Questions instead of slides. Your share of talking in the first conversation is below 30 percent."],["Proof before vision.","A real merchant, a real transaction, a real payout beat any slide about the future. Vision only once the proof is in place."],["His risk first.","A king can lose reputation, team and contract. Say it out loud before he thinks it."],["He calculates, not you.","What he works out himself, he believes. What you calculate for him, he doubts."],["Brand only in the second contact.","No company name in the first contact – otherwise he googles before he gets curious. If he asks directly, you name it."],["Equal rank for the sender.","A king talks to a king or to management. Never to the third row."],["Only real scarcity.","Your capacity, the timing, his region. He sees through anything invented – and then the respect is gone."],["One shot, perfectly prepared.","No king without a dossier. No conversation without a consistent plan."],["Be able to walk away.","With kings, the willingness to accept a no is the strongest pull."]],"useT":"How to use the Royal Class","use":["Read the Royal Laws, throne readiness, royal types and royal sequence once in full. They determine how everything else is used.","Before every king: create a dossier, determine the type, choose the matching message.","Always fill fields in [square brackets] individually. No message goes out unchanged.","“Condition” means: only use the sentence if the condition is demonstrably met."],"task":"Read the ten laws out loud. Mark the two you have broken most often so far."},
 kreife:{"lead":"A king gives you one shot. If one of the six points is missing, you don’t approach him – a burnt king doesn’t come back, and he tells others.","checkT":"Throne readiness: before you approach a king","check":[["Compensation plan free of contradictions","One current original version, one price per product, one entitlement matrix. Professionals read plans like auditors."],["Proof case ready to show","An active merchant, a transaction with attribution in the back office, proof of payout – with the person’s consent."],["Capacity rule set","How many kings will you personally accompany until 09.01.2027? Recommendation: five at most. And the rule then really applies."],["Management committed","Fixed meeting slots for royal conversations are blocked."],["Dossier complete, score ≥ 8","Type, motive, sender and occasion are set."],["Permitted contact route","Existing relationship, referral or business channel. No mass messages."]],"dossT":"Your royal dossiers","dossHint":"The dossiers stay on this device only – they are never transmitted to controlling.","add":"Add king","addPh":"Name of the king","empty":"No dossier yet. Add your first king – a name is enough to start.","edit":"Edit","close":"Close","del":"Delete dossier","delSure":"Really delete?","fields":[["role","Name & role","Position, since when, public function"],["org","Organisation","Company, industry, region"],["size","Size","Organisation or network – keep verified and estimated values separate"],["bind","Ties","Current company, presumed non-compete and non-solicitation clauses"],["frust","Frustration signals","What’s bothering him right now: public statements, changes, withdrawal"],["verb","Connection","Who knows him and you? Mutual contacts as door-openers"],["sender","Sender","Who approaches him – and is that equal rank?"],["anlass","Occasion","A specific, verifiable reason to get in touch now"]],"typeL":"Royal type","motiveL":"Royal motive","stageL":"Stage","scoreL":"Royal score","scoreDate":"Score updated on","scoreT":"The royal score · 0–2 points per criterion","scoreCols":["Criterion","0","1","2"],"score":[["Network & access to decision-makers","hardly any","regional","large and direct"],["Leadership","lone wolf","small team","leads leaders"],["Reliability & pace","unclear","inconsistent","keeps commitments"],["Time in the next 30 days","none","little","firmly planned"],["Entrepreneurial motivation","seeks security","open","thinks in structures and risk"]],"bands":[["8–10","A-king: approach"],["5–7","deepen the dossier"],["0–4","do not approach"]],"scoreNote":"Update the score after every conversation. Never derive it from follower numbers or self-descriptions.","motT":"The four royal motives","motLead":"Money is rarely the motive – kings have it. Whoever only talks about money talks past the king.","motCols":["Motive","You recognise it by","The sentence that hits"],"motives":[["Legacy","talks about “something lasting”, succession, family","What will remain of your organisation when you no longer pull every day?",""],["Recognition","stage, ranks and awards matter to him","The first ones to build this will stand at the front in Frankfurt.","Stage confirmed by the organiser"],["Freedom","frustration about depending on one company or one client","How dependent is your income today on a single company?",""],["Growth","restless, looking for the next market","Where is your next market right now?",""]],"task":"Tick off the six points of throne readiness. Then create a dossier for your first king and give the score honestly."},
 ktypen:{"lead":"Almost every king belongs to one of five types. You determine the type in the dossier – it decides tone, message and eye-opener.","rows":["His concern","What moves him","Tone","Eye-opener","No-go"],"types":[["I","The network king","informal","Top leader of another network company with a large organisation.","Contract clauses, his reputation in his own company, unrest in the team.","An addition instead of a switch. An answer to turnover and to the many in his team without meaningful income.","Leader to leader. Calm, no superlatives.","“Your people shop every month. Everyone earns from this consumption today – except your organisation.”","Badmouthing his company. Approaching team lists. A switching pitch."],["II","The head of structured & financial sales","formal or informal","Owner or director of a financial, insurance or structured sales organisation.","Reputability, liability, licences and supervision, his reputation with clients.","Customer benefit without another financial product. Customer loyalty between advisory appointments. Clean documents.","Factual and solid on numbers. Form of address depending on the relationship.","“You see your client twice a year. What if they had a positive experience with you every week in between?”","Returns, stock market or options as an argument. Hype vocabulary."],["III","The field sales entrepreneur","informal","Owner of a door-to-door, energy, solar, telecom or POS sales business.","Utilisation, margin pressure, turnover of his sales reps, dependence on one client.","Additional value from contacts his team makes anyway. A second pillar.","Direct, practice instead of theory.","“Your team stands in front of hundreds of doors and merchants every day. You get paid for one moment – the closing. After that the contact is worth nothing to you.”","Questioning his core business. Offering to poach his sales reps."],["IV","The door-opener king","formal","Franchisor, head of an association, business club, sales agent organiser, consultant with many business clients.","His reputation with members and clients, neutrality, effort, professional rules.","Being able to give his people real added value. A measurable pilot. No salesperson role.","Institutional, short, with a concrete pilot proposal.","“Your businesses have customer contact every day. How much of this customer relationship stays with them after the purchase?”","Turning him into a salesperson. Putting income in the foreground. Mass emails to his members."],["V","The dormant king","informal","Formerly a big leader, now inactive, disappointed or between two projects.","Failing publicly once more. His credibility. “Yet another new thing.”","Respect for his history. A quiet restart without an announcement. A role instead of a rank.","Personal, appreciative, without pressure.","“You don’t have to prove anything to anyone. The only question is whether your knowledge is working anywhere right now.”","Reminding him of failures. Public announcement before the pilot. Pressure."]],"task":"Determine the type for every king in your dossiers – and before every message read the concern, tone and no-go of his type."},
 ksequenz:{"lead":"Seven stages from dossier to pilot. Each stage has a goal and an exit criterion. Whoever skips a stage loses the king.","goalL":"Goal","exitL":"Exit","steps":[["Dossier","Day 0","Type, motive, sender, occasion and score are set.","Score below 8 → do not approach."],["First contact","Day 1","A reply and a 20-minute meeting. Curiosity, no brand.","Two follow-ups without a reaction → park for 90 days."],["Qualification call","20 minutes","He talks, you check. Update the score.","Score below 5 → park in a friendly way."],["Eye-opener conversation","60 minutes","He formulates the lever himself – with his own numbers.","He sees no lever → don’t push anything further."],["Proof & management","45 minutes","A real case plus a cross-check by management.","Open contract or conditions question → pause until it is clarified."],["Founders’ circle","90 minutes","Written pilot commitment with at least five named starters and a start date.","No commitment within 7 days → follow up in January."],["Pilot","14 days","Starts, first merchant conversations, booked CP.","The review decides: rollout or stop."]],"takt":"<b>Pace:</b> from stage 2 to 6 ideally 21 days. More than 30 days without a next stage means: the king isn’t in the process, he is waiting.","stages":["Dossier","Contact","Call","Eye-opener","Management","Founders’ circle","Pilot","Started","Parked · with follow-up date"],"pipeT":"Your royal pipeline","pipeHint":"Every king is in exactly one stage – with a date and a next step.","pipeCols":["King","Score","Stage","Next step","Date"],"pipeEmpty":"No kings yet. Add them under “Throne readiness & dossier”.","kpiT":"KPIs","kpiCols":["KPI","Definition","Rhythm"],"kpis":[["A-dossiers","Kings with score ≥ 8 and a complete dossier","weekly"],["First contacts","sent, individually adapted first messages","weekly"],["Reply rate","replies ÷ first contacts","weekly"],["Calls","20-minute calls held","weekly"],["Eye-openers","60-minute conversations held","weekly"],["Pilot commitments","in writing, with at least five named starters and a start date","weekly"],["Started partners","from running pilots","weekly"],["Booked CP","from pilots, per back office","weekly"],["Parked kings","with a follow-up date","monthly"]],"planT":"Planning assumption for the first four weeks","plan":"15 A-dossiers → 10 first contacts → 5 calls → 3 eye-opener conversations → 1–2 pilots","planNote":"This is an assumption, not a measured rate. Replace it with your real figures after four weeks.","rhythmT":"The weekly rhythm","rhythm":[["Monday · 15 min","Pipeline review: who is where? Who is due this week? Which king has been waiting too long?"],["Friday · 15 min","Learnings: which message got replies, which didn’t? Adjust texts, update scores."]],"task":"Put every king in your pipeline in exactly one stage – with a next step and a date. Review for 15 minutes every Monday and Friday."},
 knachr:{"lead":"The first message has exactly one job: a 20-minute conversation. Don’t inform, don’t persuade, don’t sell.","forKing":"For which king?","manual":"Adjust [Name] manually","rulesT":"The six rules of the first contact","rules":["A specific, verifiable occasion – no copy-paste.","No company name, no link, no PDF, no numbers.","Curiosity instead of explanation: a question he has never asked himself.","Five sentences max.","A small next step: 20 minutes, two suggested dates.","A way out: “If it doesn’t suit you, just say so.” That takes the pressure off – and makes a reply easier."],"firstT":"First contact · 9 templates","first":[["5.1","Network king","WhatsApp / DM · informal","Hi [Name], I’ve been following for a while how you lead your organisation – especially [specific occasion]. I’m currently working with a few leaders on something that doesn’t change anything about your existing business but answers a question most large organisations never ask: what actually happens to your people’s consumption? Fancy 20 minutes, leader to leader? If it doesn’t suit you, just say so.","Recognition through a real occasion, a question he can’t answer right away, and equal rank instead of asking a favour."],["5.2","Network king","Voice message · approx. 45 sec","Hey [Name], [your name] here. I’m deliberately sending you a voice message instead of a long text. [Occasion in one sentence]. I’m working with a few leaders on something that doesn’t change your business but answers a question I find exciting: what happens to consumption in large organisations? I won’t explain that by voice message – let’s just talk on the phone for 20 minutes. And if it doesn’t interest you, that’s totally fine. Just let me know.","The voice creates a closeness and authenticity that text doesn’t have. Speak calmly, don’t read out, no sales tone."],["5.3","Head of structured & financial sales","Message · formal","Good day [Name], I’m contacting you deliberately because you have built an organisation with genuine client trust – [specific occasion]. I’m working with a few sales owners on an approach that needs no additional financial product and can bind clients to your organisation between advisory appointments. Before I show you anything: would you have 20 minutes to check whether this is relevant for you at all? [Day] or [day]?","It hits his core concern – no extra product, no liability – and leaves him the role of the one who checks."],["5.4","Field sales entrepreneur","WhatsApp · informal","Hi [Name], a quick question between entrepreneurs: your people stand in front of hundreds of doors and merchants every day. You get paid for one single moment – the closing. I’m currently working with a few sales owners on what that contact can still be worth afterwards, without anything changing in your core business. 20 minutes this week? [Day] or [day]?","He immediately sees a blind spot in his own model – and nobody has sold him anything."],["5.5","Door-opener king","Email · formal","Subject: Added value for your [members/franchise partners] – proposal for a small pilot\n\nDear [title name],\n\nI am contacting you because [organisation] stands for [specific occasion].\n\nWe are working on a model that allows businesses to keep their customers engaged even after the purchase – without changing their core business. For this we are looking for a small number of selected partners for a measurable pilot with three to five businesses.\n\nMay I present this to you in 20 minutes? Afterwards you decide whether it is an option for your [members] at all.\n\nKind regards\n[Name] · [Position] · [Phone]","Institutional, short, clearly limited. He remains the decision-maker and doesn’t become a salesperson. Only to business addresses, sent individually."],["5.6","Dormant king","WhatsApp · informal","Hey [Name], I keep thinking back to the time when you built up [specific achievement]. I don’t want to sell you anything or talk you into anything. I’m interested in your honest assessment of something I’m working on with a few leaders – because I hardly know anyone who understands structures like you do. Fancy a coffee or a call?","You ask for his advice, not his participation. That honours him, lowers his guard – and whoever advises starts thinking along."],["5.7","Warm intro: text for the referrer","WhatsApp · informal","[Name of king], I’d like to connect you with [your name]. [He/She] is currently building something with a few sales heads, and I immediately thought of you – because of [occasion]. No pitch, I just think you two should meet. May I connect you?","Borrowed trust is the strongest entry. Ask first, then connect – that respects the king."],["5.8","Your reply after the intro","WhatsApp · informal","Thank you, [referrer]. [Name], great to meet you. [Referrer] told me how you [occasion]. I’ll keep it short: let’s talk for 20 minutes, then you’ll know whether it’s exciting for you. [Day] or [day]?",""],["5.9","Connection request for business contacts","LinkedIn · max. 300 characters · formal","[Name], I have been following your work at [organisation] since [occasion]. With a few sales owners I’m building an additional income layer on top of existing customer relationships and would like to connect – no pitch.","Afterwards: don’t pitch right after the request is accepted. First react to a post, then send an adapted 5.3 or 5.4."]],"reactT":"The first reactions · 14 replies","reactLead":"Every reply leads to a conversation – never to an explanation in chat. Whatever is explained in chat gets judged in chat. And in chat you lose.","reactRules":["Asked directly about the company? Name it. Dodging looks dubious to professionals.","No numbers, no PDFs, no links before the conversation. A number in chat is a promise.","Two follow-ups max. Then that’s it."],"react":[["6.1","“What’s it about?”","","Fair. In one sentence: it’s about how large organisations can turn their people’s everyday consumption into an additional income layer – without changing their business. Anything more would be wasted in chat. 20 minutes, and you’ll know whether it’s relevant for you. [Day] or [day]?",""],["6.2","“Just send me some info.”","","Happy to – but only once I know which information is relevant for you at all. Otherwise you’ll get 20 pages, 18 of which don’t fit your organisation. Give me 15 minutes, then I’ll send you exactly what fits you.",""],["6.3","“Which company is behind it?”","","Best Prime with the ePOINT platform. Feel free to google the name – it just won’t tell you anything about the mechanism I’m talking about. I’ll show you that in 20 minutes with a real case. Does [day] work?","Important: answer honestly. Whoever dodges this question is out."],["6.4","“Is this network marketing?”","","Yes, the sales side is set up as a partner structure – I’d rather tell you that myself right away. But what’s interesting for you isn’t the structure, it’s the mechanism behind it: customer loyalty through real purchases at merchants. Whether that fits you, we’ll check in 20 minutes – without slides.","Whoever says it themselves takes the power out of the objection. Denying it would destroy all trust."],["6.5","“I’m contractually bound.”","","Good that you mention it – I take that seriously. I don’t want you to get into trouble because of us. Let’s look closely in the conversation at what your contract allows and have it checked if necessary. If it doesn’t fit, I’ll tell you myself.","This sentence builds more trust than any presentation. You protect him – not your deal."],["6.6","“No time.”","","I understand – especially in your case. That’s why I’m asking for 20 minutes and not for a project. If it doesn’t fit after that, that’s it. Next week then, [day] or [day]?",""],["6.7","“What would I earn?”","","We’ll work that out together with your real numbers and the valid plan – not with sample calculations from the internet. Anything else would be dubious. Bring three numbers to the conversation, then you’ll see it in black and white.","Important: never a number in chat. What you write is read as a promise."],["6.8","“Sounds exciting.”","","Glad to hear it. Then let’s fix it right away: [day] at [time] or [day] at [time]? Afterwards I’ll send you three short questions to prepare.",""],["6.9","Silence · follow-up 1","after 4 days","Hi [Name], just a quick follow-up so it doesn’t get lost in the chat. Not right now, later or not at all? All three are totally fine.",""],["6.10","Silence · follow-up 2 (last message)","after another 7 days","[Name], I assume the timing isn’t right at the moment – no problem. I won’t get in touch again. If you ever get curious, you know where to find me.","Important: the message is meant honestly – and precisely for that reason it often triggers a reply. After that, really don’t get in touch again."],["6.11","Meeting confirmation with three numbers","","Great, [day] at [time] is set. So that we make good use of the time, please bring three rough numbers:\n1) How many people are active in your organisation?\n2) How many of them earn a meaningful income?\n3) How many merchants and entrepreneurs does your team see regularly?\nEstimates are fine.","Whoever prepares has invested. And he starts calculating before you talk."],["6.12","After the conversation · summary","","Thank you for the open conversation. Two points stick with me: [point 1] and [point 2]. Next step as discussed: [specific action] on [date]. If anything changes before then, just let me know.",""],["6.13","Park in a friendly way","","Thank you for your openness. For me it’s clear: right now it doesn’t fit – and that’s completely fine. I’ll get in touch briefly in [month] to see whether anything has changed for you. Until then, all the best for [his project].",""],["6.14","Follow-up after 90 days","","Hi [Name], as promised I’m getting in touch once. Since our last conversation, [specific, verifiable development] has happened on our side. Is that a topic for you today – or still not? Both are fine.","Condition: only send with a real, verifiable development."]],"task":"Choose the first message that matches the type of your first A-king, fill every square bracket individually and have your sponsor proofread it before sending."},
 kgespr:{"lead":"In a royal conversation he talks, you ask. Your share of talking stays below 30 percent – until the proof.","aT":"A · The qualification call · 20 minutes","aCols":["Minute","Phase","What you say or do"],"a":[["0–2","Frame","“I’ve blocked 20 minutes. Above all I want to understand how you’re set up. At the end we both say honestly whether it makes sense to keep talking. Okay?”"],["2–12","He talks","The five diagnostic questions below. Listen, take notes, don’t comment."],["12–17","Teaser","“I won’t show you the company, but a calculation – with your numbers. For that I need an hour with you.”"],["17–20","Decision","“Does it make sense for you to go through this with your numbers?” Yes → fix a meeting. No → “Thank you, then let’s leave it.”"]],"diagT":"The five diagnostic questions","diag":["How many people in your organisation are really active?","What frustrates you most right now?","How many of your people earn a meaningful income?","What would have to happen for you to say in a year: that was a strong year?","How free are you contractually if you want to do something additional?"],"bT":"B · The eye-opener conversation · 60 minutes","bCols":["Phase","Duration","What happens"],"b":[["1 · Mirror","10 min","Summarise what he said in the call – in his words. “Did I understand you correctly?”",""],["2 · Three questions","15 min","The three eye-opener questions (below). Then stay silent.",""],["3 · His calculation","15 min","He enters his numbers. You calculate with the valid plan – every result clearly labelled as a scenario, never as a forecast.",""],["4 · The proof","10 min","A real case: merchant → customer → purchase → attribution → payout. Live in the back office if possible.",""],["5 · What was held back","5 min","Only when he asks: earning from purchases across the entire partner network.","only as the valid plan provides"],["6 · Closing","5 min","Take-away instead of pressure (real scarcity) and an invitation to the founders’ circle.",""]],"qT":"The three eye-opener questions","q":["How many people do you have in your organisation – and how many of them earn a meaningful income?","What do the others do every month anyway? They shop: groceries, fuel, online.","Who earns from this consumption today? And what if part of it stayed in your organisation – without any of your people having to sell a product?"],"silence":"<b>Silence rule:</b> after the third question stay silent for at least five seconds. Whoever speaks first takes the insight away from him.","cT":"C · The management meeting · 45 minutes","cSub":"He checks the company – not you him.","c":[["Every question is allowed:","structure, payouts, plan, timeline, ePAY status."],["No answer that isn’t true.","“I don’t know, I’ll clarify by [date]” is stronger than any nice answer."],["Call ePAY by its name:","planned for 09.01.2027 – no more and no less."]],"task":"Prepare your next call: frame sentence by heart, the five diagnostic questions on a note, update the score afterwards."},
 keinw:{"lead":"Behind every objection from a king there is a concern about reputation, team or contract. Answer the concern, not the sentence.","behind":"Behind it:","goal":"Goal:","search":"Search objections","items":[["“I already have a business.”","fear of replacement","That’s exactly why I’m talking to you. It shouldn’t replace anything but build on what you already have.","Addition framing"],["“I’ve seen it all before.”","fatigue, scepticism","You’ve probably seen a lot. That’s why I won’t show you a presentation but a real case. If it doesn’t convince you, we’re done in ten minutes.","Proof instead of pitch"],["“My team doesn’t want anything new.”","fear of unrest","Then don’t start with the team. Start with five people you trust – 14 days, quietly. Then you decide.","Small pilot"],["“What if the company doesn’t last?”","company risk","A legitimate question. That’s why you sit down with management before any decision and ask exactly that question.","Management meeting"],["“Are ePAY and the IPO here yet?”","scepticism about the vision","No. ePAY is planned for 09.01.2027, the IPO is an intention. I’m not selling you anything that isn’t there yet – we talk about what works today.","Credibility"],["“What do your top people earn?”","wants proof","I’ll show you real proof of payouts in the conversation – with the person’s consent, no screenshots from groups. The more important question anyway: what comes out with your numbers?","His own calculation"],["“Who else is on board?”","social proof","I only name names with consent – just as I don’t pass on yours. You’ll meet the others in the founders’ circle.","Confidentiality as a value"],["“What do I get that others don’t?”","special deal","No special plan – the plan applies to everyone, otherwise it would be worthless. What you get: my personal time, a direct line to management and a seat in the founders’ circle.","Fairness as a strength"],["“I have to discuss it with my partner.”","reassurance","Very good. Shall we go through it as three? Then your partner gets the same information first-hand.","Bring in the co-decider"],["“Get back to me in three months.”","not now – or an excuse","I will. One more question so I know what to look out for: what would have to have changed in three months for it to fit you?","Find out the real reason"],["“Isn’t this a pyramid scheme?”","question of reputability","A legitimate question – ask it of every sales organisation. My standard: behind every euro there must be real value – a merchant, a customer, a service. Let’s check exactly that with a real case and the contract, gladly with your lawyer too.","Checking instead of assurances"],["“Why should I trust you?”","fundamental question","You shouldn’t yet. Trust comes from proof – that’s why we do a pilot instead of one big decision.","Pilot"]],"task":"Read the twelve objections out loud and practise the three your next king is most likely to raise."},
 kabschl:{"lead":"Urgency yes. Invented scarcity never. Kings have worked with pressure themselves for years – they recognise it after two sentences. A trick that gets exposed doesn’t cost you one king but his whole circle.","fomoT":"Real scarcity: the four FOMO rules","fomo":[["Your capacity","“Until Frankfurt I personally accompany five sales heads at most.”","Turns the status around: now he qualifies with you.","Rule set and kept"],["The timing","“Whoever has a structure before the planned ePAY launch starts with a team instead of alone.”","The real logic of every market launch.","Always phrase ePAY as “planned”"],["Industry & region","“The first in your industry to retain merchants and customers has them.”","Competitive logic he knows from his own business.","no territorial protection that isn’t in the contract"],["The stage","“Whoever has demonstrably started by 09.01. stands at the front in Frankfurt as a founding member.”","With kings, status pulls more strongly than money.","confirmed by the organiser"]],"okT":"Allowed and taboo","okCols":["Allowed","Taboo"],"ok":[["“I only take five because I accompany each one personally.”","“Only three places left!” – if it isn’t true"],["“The pilot runs until [date]. After that I decide who I build with in 2027.”","Deadlines that are then quietly extended"],["“Let’s calculate with your numbers.”","“You can make €10,000 a month here.”"],["“ePAY is planned for 09.01.2027.”","“ePAY is finished” or “guaranteed”"],["“Whoever comes first builds relationships first.”","“Exclusive territory” without a contract"],["Status, stage, role, personal support","Shares, IPO or options as bait"]],"uwg":"Under the German Unfair Competition Act (UWG), false scarcity is a classic case of misleading advertising – on top of the damage to trust.","closeT":"The royal closings","close":[["9.1","The take-away close","Conversation · informal","I don’t want to convince you today. Until Frankfurt I personally accompany five sales heads at most, and I only take those where the pilot shows that it fits both sides. If you want, we’ll check that in 14 days with five of your people. If not, totally fine – then we’ll stay in touch.","With kings, the willingness to walk away is the strongest pull. Condition: the capacity rule applies."],["9.2","The pilot close for door-openers","Conversation · formal","I am not proposing a framework agreement but a pilot with three to five businesses over 14 days. Afterwards you decide on the basis of the numbers whether you recommend it to your [members]. Would a start on [date] suit you?",""]],"gkT":"The Frankfurt founders’ circle","gkLead":"No event, no presentation: a closed working session in which every king calculates with his own numbers and decides for himself at the end.","gkFacts":[["max. 8","sales heads per round"],["90 min","working session, no show"],["1 : 1","personally invited"],["MGMT","management at the table"]],"gkCritT":"Participation criteria – all must be met","gkCrit":["Score ≥ 8 after the eye-opener conversation","Own organisation with access to decision-makers","Contract situation checked and free","Willingness to run a 14-day pilot with at least five people"],"gkFlowT":"The flow · 90 minutes","gkCols":["Minute","What happens"],"gkFlow":[["0–10","Welcome by management. Rules: confidential, no presentation, every question allowed."],["10–25","The proof case live: merchant, customer, purchase, attribution, payout."],["25–55","Working session: everyone calculates with their own numbers – as a scenario, with the valid plan."],["55–75","Open questions to management. Nothing is taboo."],["75–90","Decision: pilot commitment or a friendly no. Then short one-to-one talks."]],"gkChain":["Founders’ circle","Pilot 14 days","Review","Rollout or stop","Stage 09.01."],"gkCond":"Only announce the stage in Frankfurt once the organiser has confirmed it.","invT":"The invitations","inv":[["10.1","Invitation to the founders’ circle","WhatsApp · informal","[Name], after our conversation I’d like to personally invite you to a small round: eight sales heads at most, 90 minutes, with our management. No presentation, but a working session – everyone calculates with their own numbers, every question is allowed. At the end everyone decides for themselves whether to start a 14-day pilot. [Date], [place]. Are you in?",""],["10.2","Invitation to the founders’ circle","Email · formal","Subject: Personal invitation – founders’ circle on [date]\n\nDear [title name],\n\nfollowing our conversation I would like to personally invite you to a small working session: no more than eight entrepreneurs and sales executives, 90 minutes, together with our management.\n\nThere is no presentation. Every participant calculates with their own numbers, every question is allowed. At the end everyone decides for themselves whether to start a 14-day pilot.\n\nDate: [date, time] · Place: [place]\n\nI would be delighted to have you there.\n\nKind regards\n[Name]",""],["10.3","Pilot agreement after the commitment","WhatsApp · informal","As discussed, on [date] we start the 14-day pilot with you and [names of the five starters]. We measure three things: starts, first merchant conversations and booked CP. Review on [date]. After that you decide: rollout or stop. Looking forward to it.",""]],"task":"Put your capacity rule in writing – and only use scarcities whose condition is demonstrably met."},
 kkodex:{"lead":"Kings hear from a single word whether you’re a salesperson. Your vocabulary is your first proof.","swapT":"The language code","swapCols":["Instead of","Say"],"swap":[["once-in-a-lifetime chance","a model we’re currently testing with a few people"],["passive income","an ongoing income layer that depends on real usage"],["financial freedom","a second pillar"],["Get in now!","Let’s check whether it fits."],["business opportunity","an additional income layer for your organisation"],["build a downline","strengthen your existing organisation"],["We have no competition.","I’ll show you a real case – judge for yourself."],["I want to present something to you.","I want to understand how you’re set up."],["Just watch the video.","20 minutes, leader to leader."],["guaranteed, safe","measured, proven in the pilot"],["You have to be quick.","I only accompany a few people personally."],["Stock market, shares, options as bait","don’t use"]],"goodT":"Royal words","good":["structure","existing base","lever","pilot","proof","check","decision-maker","income layer","equal rank","legacy","addition instead of switch"],"badT":"Taboo words","bad":["chance of a lifetime","get rich","guaranteed","immediately","today only","exclusive (without a contract)","passive","dream car","lifestyle"],"rulesT":"The guardrails · eight rules, not negotiable","rules":[["No promises of income, returns or shares.","Numbers only from the valid plan, always labelled as a scenario."],["No invented scarcity.","No deadlines that are extended afterwards."],["No poaching via other companies’ protected team lists.","The king’s contract situation is checked before the start."],["First contact only through an existing relationship, a referral or a business channel.","No mass messages (UWG, GDPR)."],["ePAY, stock market and options only as a plan or intention.","Never as bait."],["No special plans for individual kings.","The plan applies to everyone."],["No names of other leaders and no proof of payouts without their consent.",""],["No badmouthing of other companies","– not even if the king does it himself."]],"legal":"<b>No legal advice:</b> have documents, wording and compensation presentations legally checked before use.","cheatT":"The cheat sheet · read it once before every royal conversation","cheat":[["The mindset","Select, don’t advertise. He checks the company – you check him. Share of talking below 30 percent."],["The first contact","Occasion · curiosity · no brand · five sentences · 20 minutes · a way out."],["The three questions","1. How many of your people earn a meaningful income? 2. What do the others do every month anyway? 3. Who earns from this consumption today?"],["The four real scarcities","Your capacity · the timing before the planned ePAY launch · industry & region · the stage on 09.01."],["The closing","“I don’t want to convince you today. … If you want, we’ll check that in 14 days with five of your people. If not, totally fine.”"],["The exit rules","Score below 8 → don’t approach · 2 follow-ups → park · no lever of his own → don’t push · no commitment in 7 days → January."],["Never","promise income · invent scarcity · numbers in chat · badmouth other companies · poach team lists · sell ePAY or the stock market as finished."]],"footer":["Respect for his risk","Proof before vision","Selection instead of advertising"],"task":"Read the cheat sheet before every royal conversation. Delete the taboo words from your templates."}

scripts:{"warm":[["C1 · Friends & family · the savings tip","Hey [Name], quick savings tip: I recently started using ePOINT, a free app that gives you money back when you shop as usual – including at [shop or store the person uses]. [Only if true: Last week I already got … back.] Shall I send you the link? Takes two minutes.","Give first, own experience, tiny step."],["C2 · Acquaintances & colleagues · with a reason","Hi [Name], you mentioned recently that [real reason: everything is getting more expensive / you order a lot online]. I use an app myself that helps with that: ePOINT – free, 3 to 30 % cashback at participating shops and stores. Want to take a look?","You pick up on what the person said themselves."],["P1 · Friend / warm contact · sort instead of persuade","Hi [Name], I’ve started a side business around a cashback app and immediately thought of you, because [real reason]. I don’t know if it’s for you – let’s check in 15 minutes. If not, that’s totally fine. Does Thursday or Saturday work better?","Relevance, sorting mindset, a way out, an either-or question."],["P2 · Voice message · max. 40 seconds","Hey [Name], I was just thinking of you, because [real reason]. I’ve built something on the side with Best Prime, around the cashback app ePOINT. Happy to show you in 15 minutes – just text me when it suits you.","Your voice creates a closeness that text can’t."],["P3 · Old contact · relationship first, then the topic","Hey [Name], it’s been ages – how are you and [real connection]? I’m also getting in touch because I’m building something new at work and you came to mind. But first tell me what’s going on with you!","Genuine interest first opens the conversation."],["P3b · Old contact · after their reply","Sounds good! About my topic: I’m a partner at Best Prime and I’m helping build sales for the cashback app ePOINT. Would you like to take a look in 15 minutes?","Say clearly what it’s about – and ask for a small step."],["P4 · Reaction to a story or post","Hey [Name], I saw that you [story or post]. Great! Can I ask you something: are you open in principle to a second income stream if it fits your everyday life?","An honest compliment and a permission question instead of a pitch."],["P5 · Referral","Hello [Name], [referrer] recommended that I get in touch with you, because you [reason]. It’s about ePOINT and sales work with Best Prime. Do you have 15 minutes this week?","Borrowed trust – always name the referrer first."]],"cold":[["S1 · Sales professional · eye to eye","Hi [Name], you have access to people and businesses – that’s exactly why I’m reaching out. I’m building a sales field with Best Prime around the cashback app ePOINT. It’s not about replacing your business, but about adding an extra lever to your contacts. 15 minutes next week?","Peer tone, clear benefit for his existing business."],["S2 · Sales head · at structure level","Hi [Name], for you it gets interesting not at the level of single deals but at the level of your structure. I’d like to check with you whether ePOINT fits as an additional income stream for your partners – with all cards on the table about customer benefit, effort and compensation. Do you have 20 minutes next week?","Addresses the role, not the single sale. For real kings: use the Royal Class."],["M1 · Club or community (formal)","Good day [Name], you look after [club or community] with many members. I have a proposal that gives your members a real benefit and costs you nothing: a cashback app that gives people money back when they shop as usual. May I show you in 10 minutes what that could look like – starting as a small pilot?","Added value for his people, no risk, a small pilot."],["M2 · Entrepreneur, cold (formal · in person, LinkedIn, Xing)","Good day [Name], I came across you through [specific connection]. I’m a partner at Best Prime and I’m building a network of entrepreneurs with the cashback app ePOINT who want to offer their contacts real added value. I don’t know whether it fits you – I’d be glad to check that with you in 10 minutes. Would a short exchange next week be possible?","Specific connection, sorting mindset, low entry."],["R1 · Merchant, cold (formal)","Good day [Name], I’m contacting you very deliberately. With ePOINT we are currently building a merchant and customer ecosystem and are looking for businesses with relevant customer traffic. I don’t want to explain anything on the phone – I’d just like to check in 10 minutes whether this makes sense for your business at all.","Respect for his time, checking instead of selling."],["R2 · Merchant, warm","You have a customer base that shops with you regularly. That’s exactly why ePOINT is interesting: your customers get cashback with you and come back – and you become part of a larger merchant network. May I show you in 10 minutes what that looks like in your shop?","His benefit first: his customers coming back."],["T1 · Phone opener","Hi [Name], do you have two minutes? … I’m calling because I’ve started something new and you came to mind right away. I don’t want to explain it in passing – with a screen it works much better in 15 minutes. Does tomorrow evening or the weekend suit you better?","Short, personal, a meeting instead of an explanation."]],"fu":[["After 2 days without reply","Hi [Name], just following up in case my message got lost: do you have 15 minutes this week?","Remind gently, without pressure."],["After 5 days without reply","Hi [Name], I’m following up once, properly: is this interesting in principle, shall we pick it up later, or is it not for you? All three are totally fine.","A decision with a way out."],["After a good first conversation","Thanks for the chat! The most important points for you were [point 1] and [point 2]. Next step: [specific action]. Does [day, time] work for you?","Pin down what was agreed."],["Still unsure","What is the one point that’s currently holding you back from taking a next step? Then we’ll clarify exactly that instead of going through everything again.","Find out the real reason."],["At the agreed “later”","Hi [Name], you said I should get back to you [time]. Is now a better time?","Keep your word."],["After a clear no","Thanks for the clear answer. I won’t follow up on this. And if you ever want the app as a customer, just let me know. All the best!","Keep the relationship – no follow-up about the business."]]},

 start:{"sprint":"Il tuo sprint di 72 ore","started":"avviato il {d}","expired":"concluso","tl":["0–15 min profilo + sistema","15–30 potenziale","30–45 contatto","72 h conversazione"],"quote":["Non devi sapere tutto prima di iniziare.","Devi capire abbastanza per avviare con sicurezza il prossimo passo sensato."],"task":"Segui i moduli in ordine. Non saltare nessun compito. Sapere senza agire non vale come avvio completato. Un cerchio dorato nel menu significa: criterio soddisfatto – allora segna il modulo come completato.","lead":"Questa Academy non è un libro da leggere. È il tuo piano di lavoro e il tuo kit di onboarding: guide, modelli e calcolatori – e ogni fase si conclude con un’azione concreta. Tutto ciò che inserisci viene salvato automaticamente.","cards":["Spiegare il sistema in 60 secondi, usare ePOINT personalmente, capire la remunerazione e l’atteggiamento dietro ogni contatto.","Costruire la lista dei 100 potenziali contatti, dare priorità alla TOP 10 e riconoscere le leve di rete.","Scegliere il modello giusto, attivare i contatti, condurre colloqui e rispondere onestamente alle obiezioni.","Ripetere lo stesso semplice processo di avvio con il partner successivo.","Per i leader: messaggi, colloqui e strategia per network leader, responsabili vendite e apriporte."],"rulesT":"Tre regole per tutto il FastTrack","rules":[["Attività prima della teoria","Leggi solo ciò che ti serve per il prossimo passo. Poi agisci."],["Non parti mai da solo","Entro 24 ore il tuo sponsor fa con te la call di avvio e invia insieme a te il primo messaggio."],["Scrivilo o non è successo","La memoria non è un CRM. Tutto va nell’app."]]},
 diag:{"lead":"Prima di parlare di script, deve essere chiaro cosa ti spinge, quale leva possiedi già e quale competenza svilupperai per prima.","cols":[["Motivo","Perché vuoi iniziare?",["Cosa deve cambiare concretamente?","Quale obiettivo in 12 mesi?","Vendere, guidare o entrambi?"]],["Risorse","Cosa porti con te?",["Contatti / clienti / imprenditori","Team / community / visibilità","Tempo disponibile e accessi ai settori"]],["Competenze","Cosa sai già fare?",["Contatto / fissare appuntamenti","Presentazione / chiusura","Leadership / reclutamento / follow-up"]]],"form":"La tua diagnosi di partenza","type":"Il tuo tipo di partenza più forte","task":"Segna il tuo tipo di partenza più forte e l'area in cui hai bisogno di supporto. Il tuo sponsor / leader imposterà su questo i prossimi 7 giorni.","best":"Il tuo miglior primo passo:"},
 system:{"lead":"Chi non sa spiegare il sistema in modo semplice non può trasmetterlo correttamente. Per questo questa fase è obbligatoria.","flow":["Partner commerciale","Esercente","Clienti","Utilizzo","Ritorno"],"tr":"Allenatore 60 secondi","trHint":"Avvia il timer e spiega l'intero sistema ad alta voce senza leggere. Fermalo quando hai finito. Obiettivo: almeno 3 ripetizioni pulite sotto i 60 secondi.","start":"Avvia","stop":"Stop","reset":"Azzera","reps":"ripetizioni valide (≤ 60 s)","best":"tempo migliore","ready":"pronto per la verifica del leader","short":"Troppo breve – spiega l'intero sistema","valid":"{s} s – ripetizione valida","long":"{s} s – troppo lungo, riprova più breve","sys":[["ePOINT","Live · Commercianti & clienti","L’app di cashback gratuita: chi acquista presso commercianti partner sul territorio o in oltre 1.000 shop online riceve indietro dal 3 al 30 % e può farsi accreditare il saldo sul conto."],["Best Prime","Attivo · Vendita & crescita","L’organizzazione di vendita e community che fa conoscere ePOINT – a clienti, commercianti e nuovi partner. Qui ricevi formazione, strumenti e il tuo sponsor."],["ePAY","Pianificato · Pagamento & utilizzo","Il livello di pagamento e transazioni, previsto per il 09.01.2027. Non promettere nulla che non sia ancora attivo."]],"ben":[["Per il cliente",["soldi indietro sugli acquisti che fa comunque","gratuita, senza abbonamento","sul territorio e online in un’unica app"]],["Per il commerciante",["fidelizzazione e ritorno dei clienti","parte di una rete di commercianti più grande","relazione digitale con il cliente"]],["Per il partner",["provvigione di chiusura una tantum","remunerazione continuativa dall’utilizzo dei clienti attivi","costruire un’organizzazione e duplicare"]]],"coreL":"La tua spiegazione in 60 secondi","core":"«Conosci ePOINT? È un’app di cashback gratuita. Fai acquisti normalmente – nei negozi sul territorio o in oltre 1.000 shop online – e ricevi indietro dal 3 al 30 percento, direttamente sul conto. Sono partner di Best Prime, l’organizzazione di vendita che c’è dietro. Mostro l’app alle persone, acquisisco commercianti e costruisco un team. Per questo vengo remunerato secondo un piano ufficiale: una tantum per le chiusure e in modo continuativo dall’utilizzo dei miei clienti. E con ePAY è prevista una soluzione di pagamento. Vuoi che ti mostri velocemente l’app?»","coreWhy":"Inizia con una domanda, spiega prima il vantaggio per chi ascolta, dice apertamente cosa ne ricavi tu e si chiude con un piccolo passo successivo.","appT":"Prima usala tu – il tuo compito per il giorno 1","appLead":"Chi ha ricevuto cashback di persona non ha più bisogno di un copione. L’esperienza batte la spiegazione.","app":["App ePOINT installata e registrata","Trovati tre commercianti partner vicino a me","Fatto il primo acquisto con cashback"],"task":"Installa l’app ePOINT e usala personalmente. Poi spiega l’intero sistema senza leggere, in massimo 60 secondi – finché funziona in modo chiaro, tranquillo e senza gergo."},
 check:{"lead":"La conoscenza del prodotto ha valore solo se arriva all'interlocutore in parole semplici. Rispondi senza appunti.","right":"Esatto.","wrong":"Non proprio – riguarda il sistema ancora una volta.","selfRight":"Ottimo – allora via alla verifica del leader.","selfWrong":"Allora ripassa il modulo “Il sistema in 60 secondi”.","qrule":"<b>Regola di qualità:</b> prezzi, compensi, funzionalità dei prodotti e dati di mercato si usano solo dai documenti ufficiali Best Prime aggiornati o dal back office. Niente vecchi screenshot né numeri inventati.","unlock":"Sblocco","unlockHint":"Solo quando il tuo leader conferma la tua spiegazione di 60 secondi passi al lavoro sul potenziale.","leaderOk":"Il mio leader{l} ha confermato la mia spiegazione di 60 secondi","unlocked":"Sbloccato per la fase 2","locked":"Non ancora sbloccato","kcT":"Verifica rapida: rispondi liberamente","kcHint":"Rispondi a ogni domanda ad alta voce. Poi confronta con la risposta modello e spunta ciò che sai.","kcShow":"Risposta modello","kcCan":"So rispondere liberamente","kc":[["Cosa riceve un cliente da ePOINT e quanto gli costa?","Dal 3 al 30 % di cashback presso commercianti aderenti sul territorio e in oltre 1.000 shop online, accreditabile sul conto. L’app è gratuita, senza abbonamento."],["Che cos’è Best Prime?","L’organizzazione di vendita che fa conoscere ePOINT – a clienti, commercianti e nuovi partner. Qui ricevi formazione, strumenti e il tuo sponsor."],["Che cos’è ePAY e da quando sarà disponibile?","La soluzione di pagamento pianificata, prevista per il 09.01.2027 – oggi non ancora utilizzabile."],["Per cosa vieni remunerato – e per cosa no?","Secondo il piano ufficiale: una tantum per le chiusure (pacchetti di nuovi partner) e in modo continuativo dall’utilizzo dei clienti attivi. Non per messaggi, colloqui o semplici registrazioni."],["Qual è il tuo primo passo con un nuovo contatto?","Stabilire se è adatto come cliente, partner o moltiplicatore – e chiedere con un messaggio personale un piccolo passo successivo."]]},
 list:{"lead":"La lista non è una rubrica. È il tuo materiale di partenza per clienti, partner, commercianti e moltiplicatori.","count":"nomi nella tua lista del potenziale","goal":"Obiettivo raggiunto","go100":"Partenza riuscita – continua fino a 100","min30":"Oggi almeno 30","add":"Aggiungi nomi","name":"Nome","namePh":"es. Mario Rossi","ctx":"Relazione / contesto (facoltativo)","ctxPh":"es. ristoratore, società sportiva","addBtn":"Aggiungi","tip":"Suggerimento: premi Invio, nome successivo – la categoria resta selezionata.","bulk":"Inserisci molti nomi in una volta","bulkPh":"Un nome per riga","bulkBtn":"Aggiungi tutti","bulkToast":"{n} nomi aggiunti","yours":"La tua lista","search":"Cerca…","empty":"Ancora nessun nome. Inizia con amici e conoscenti – prima raccogli, poi valuti.","ctxCol":"Contesto","cat":"Categoria","remove":"Rimuovi","t30":"30 nomi – obiettivo del giorno raggiunto","t100":"100 nomi – forte!","task":"Inizia con almeno 30 nomi. Obiettivo entro 24 ore: 100 persone. Niente perfezionismo – prima raccogli, poi valuti.","rules":"<b>Regola 1:</b> raccogli nomi, non valutare ancora. <b>Regola 2:</b> la lista può superare i 100. <b>Regola 3:</b> si dà priorità solo dopo aver raccolto. <b>Regola 4:</b> per ogni nome scegli il primo passo: C = invito all’app gratuita, P = colloquio di 15 minuti, M = valore aggiunto per la sua gente. Nel dubbio, C.","kpm":"Passo","kpmOpts":[["K","C · Cliente"],["P","P · Partner"],["M","M · Moltiplicatore"]],"helpT":"Promemoria: a chi puoi pensare","help":[["Famiglia & amici","Fratelli e sorelle, cugini, testimoni di nozze, vecchi migliori amici"],["Lavoro","Colleghi, ex colleghi, capi, clienti, fornitori"],["Tempo libero","Associazione, palestra, tavolo degli amici, gruppo hobby, vicini, genitori dell’asilo e della scuola"],["Imprenditori & commercianti","Lavoratori autonomi, artigiani, titolari di negozi, ristoratori, consulenti"],["Vendita","Assicurazioni, finanza, energia, vendita diretta, agenti"],["Moltiplicatori","Direttivi di associazioni, responsabili di community, amministratori di gruppi, rappresentanti di categoria"],["Vecchi contatti","Scuola, apprendistato, università, luoghi dove hai vissuto – e la tua rubrica dalla A alla Z"]]},
 top:{"lead":"Il focus batte la quantità. La lista ti dà ampiezza – la TOP 10 ti dà velocità.","crit":[["Fiducia","Quanto è buono il tuo accesso?"],["Potenziale","Contatto singolo o moltiplicatore?"],["Apertura","Imprenditoriale / commerciale?"],["Velocità","Quanto presto è possibile un colloquio?"]],"empty":"Prima raccogli nomi – la tua lista dei 100 è ancora vuota.","toList":"Vai alla lista dei 100","rate":"Valuta e seleziona","of":"{n} / 10 contatti TOP","hint":"Assegna da 1 a 5 punti. La lista si ordina per punteggio totale. Segna 10 come TOP e, di questi, i 5 che contatterai nelle prossime 24 ore.","cols":["TOP","Nome","Fiducia","Potenziale","Velocità","Σ","Primi 5"],"quote":["La tua TOP 10 non è per forza fatta dei contatti più ricchi o più noti.","Sono i contatti con il miglior mix di accesso, leva e velocità realistica."],"max5":"Massimo 5 – questo è il focus","task":"Scegli la tua TOP 10 e segna i primi 5 che contatterai entro le prossime 24 ore."},
 multi:{"lead":"Questo modello mostra la leva matematica della duplicazione – non un risultato garantito.","idea":"<b>L'idea:</b> un partner crea una lista del potenziale. Se nell'esempio una parte inizia e ripete lo stesso processo, l'organizzazione cresce in modo esponenziale. Gioca con i valori.","size":"Contatti per lista","rate":"Tasso di avvio in %","levels":"Livelli","cols":["Livello","Partner attivi","Persone nelle liste","Nuovi partner"],"lv":"L","learnT":"Cosa devi imparare","learn":"La leva più grande non nasce dal fatto che una persona fa sempre di più da sola, ma dal fatto che un processo semplice viene ripetuto correttamente da molti.","notT":"Cosa non devi dedurne","not":"L'esempio non è una previsione né una promessa di guadagno o di crescita. I tassi reali dipendono da mercato, qualità, attività e molti altri fattori. Non usare mai questo calcolo come promessa verso i potenziali interessati.","task":"Non “Quante persone posso raggiungere da solo?”, ma “Quanto facilmente la prossima persona può ripetere il mio processo?”"},
 net:{"lead":"I contatti più forti spesso non sono quelli che fanno tutto da soli – ma quelli che aprono le porte giuste.","cols":[["Portafoglio clienti","Relazioni esistenti","Dove ci sono già clienti che acquistano regolarmente e a cui si può aggiungere un vantaggio in modo sensato?"],["Vendite","Strutture esistenti","Quali team commerciali hanno accesso a clienti business o consumatori e cercano una leva in più?"],["Rete","Connector","Chi non deve vendere in prima persona, ma può aprire porte verso imprenditori, community, associazioni o regioni?"]],"title":"La tua matrice di rete","answered":"{n} / 5 risposte","suffix":" – 3 nomi / organizzazioni concreti","quote":["Fare rete non significa raccogliere più biglietti da visita possibile.","Significa collegare due o più risorse esistenti in modo che tutte le parti ne traggano un vero valore."],"task":"Trova oggi almeno 3 contatti in cui la leva di rete è più grande di una singola chiusura. Veri responsabili vendite? Allora prosegui con la Classe dei Re."},
 sc:{"forWho":"Per chi?","manual":"Adatta {ph} a mano","copy":"Copia","used":"usato {n}×","templates":"Modelli","fu":"Modelli di follow-up","why":"Perché funziona:","hint":"Le parti evidenziate in giallo le compili tu. Nessun messaggio parte senza modifiche."},
 warm:{"note":"Quando copi un modello o lo apri in WhatsApp, il contatto selezionato passa automaticamente a “NUOVO” nella pipeline. Adatta il modello al tuo stile prima di inviarlo.","doT":"Cosa funziona","dontT":"Cosa evitare","task":"Adatta un modello al tuo stile e invialo a 2 amici / conoscenti e a 1 contatto caldo.","f4T":"La formula delle 4 frasi – costruisci il tuo messaggio","f4":[["Contesto","Perché tu?"],["Rilevanza","Perché interessante?"],["Curiosità","Non spiegare tutto"],["Passo successivo","10 min / appuntamento"]],"copy4":"Copia il mio messaggio","fill4":"Compila prima le quattro frasi","lead":"Il primo messaggio ha un solo obiettivo: un piccolo sì al passo successivo. Non spiegare, non convincere. Nel dubbio inizia con l’invito all’app gratuita.","f4Hint":"La via d’uscita alla fine («Se no, va benissimo») non è una formula di cortesia: chi si sente libero dice sì più facilmente. E chiedi con due opzioni invece di «Hai tempo uno di questi giorni?».","chanT":"Il canale giusto","chan":[["Messaggio vocale","per i contatti caldi. La tua voce crea vicinanza. Massimo 40 secondi."],["Chiamata","se sei un closer o conosci bene la persona."],["Testo","per persone molto impegnate, contatti freddi e follow-up."]],"ansT":"Le tre risposte tipiche","ans":[["«Di che si tratta esattamente?»","Onesto in due frasi, poi torna all’appuntamento: «In breve: ePOINT è un’app di cashback gratuita e con Best Prime sto costruendo la rete vendite. Cosa potrebbe significare per te, preferisco mostrartelo in 15 minuti invece che in un romanzo. Quando ti va?»"],["«Sembra interessante.»","Fissa subito un appuntamento con due opzioni. Non spiegare oltre."],["«Non mi interessa.»","«Grazie per la risposta sincera! Se un giorno vuoi l’app come cliente, fammi sapere.» Stato «Non interessato», nessun altro follow-up sull’attività."]],"do":["un vero riferimento personale","un vantaggio proprio per questa persona","curiosità invece di un muro di informazioni","un piccolo passo con due opzioni di appuntamento","il modello tradotto con parole tue"],"dont":["copia-incolla senza riferimento","lunghi romanzi sulle provvigioni","allusioni al guadagno","pressione o «solo oggi»","eludere quando qualcuno chiede direttamente dell’azienda"]},
 cold:{"lead":"Professionisti, imprenditori e commercianti non hanno bisogno di trucchi. Hanno bisogno di rilevanza, rispetto per il loro tempo, parità e un passo successivo facile.","rulesT":"Regole per professionisti e imprenditori","rules":["Un motivo concreto e verificabile – niente copia-incolla.","Massimo cinque frasi, niente numeri, niente PDF, niente link.","Un piccolo passo successivo: da 10 a 20 minuti, due proposte di data.","Contatto solo di persona, tramite referenza o canali professionali come LinkedIn e Xing. Nessuna e-mail di massa, nessuna chiamata pubblicitaria non richiesta."],"kingT":"Veri responsabili vendite? Usa la Classe dei Re.","king":"Per network leader, responsabili di vendita strutturata e sul campo e apriporte valgono regole proprie: dossier, punteggio, tipo, messaggi e drammaturgia del colloquio dedicati.","kingBtn":"Alla Classe dei Re","task":"Scegli 2 contatti di vendita + 2 imprenditori o commercianti. Ricerca per contatto al massimo 5 minuti. Poi avvia il contatto."},
 pipe:{"lead":"Le vendite perdono velocità quando i colloqui restano aperti. Ogni contatto ha bisogno di uno stato e di un passo successivo con data.","steps":[["1 · Primo contatto","Verifica la rilevanza, fissa un breve appuntamento. Non spiegare tutto in chat."],["2 · Appuntamento","Domande prima delle spiegazioni: risorse, clienti, team, accessi agli esercenti."],["3 · Follow-up","Mai “fammi sapere”. Fissa sempre una data o una decisione."],["4 · Documentazione","La memoria non è un CRM. Documenta subito."]],"empty":"Qui compaiono i tuoi contatti TOP e tutti quelli che hai contattato.","cols":["Contatto","Stato","Passo successivo","Data","Ha risposto"],"nextPh":"es. appuntamento 15 min","task":"Assegna a ogni contatto attivo uno stato chiaro: NUOVO · APPUNTAMENTO · FOLLOW-UP · DECISIONE · AVVIATO. Le date in rosso sono scadute.","rhythmT":"Due regole per i follow-up","rhythm":["Ogni contatto aperto ha una data per il passo successivo.","Dopo due follow-up senza risposta: pausa. Dopo un no chiaro: nessun follow-up sull’attività."]},
 talk:{"pL":"Partner / rete","mL":"Esercente / azienda","qT":"5 domande chiave","mq":["Quanti clienti avete all'incirca?","Qual è la quota di clienti abituali?","Come fidelizzate i clienti oggi?","Quanto vi costa acquisire un cliente?","Quali altre sedi / reti ci sono?"],"flow":["1. Capire","2. Inquadrare","3. Spiegare in modo mirato","4. Passo successivo"],"quote":["Prima capisci il bisogno. Poi spieghi il vantaggio.","Più parli prima dell'analisi dei bisogni, più rischi di argomentare lontano dalla vera leva."],"prot":"Verbale del colloquio","f":["Contatto / azienda","Leva più grande","Domanda aperta più grande","Passo successivo + data"],"save":"Salva colloquio","saved":"Colloquio salvato","cols":["Data","Contatto","Leva","Domanda aperta","Passo successivo"],"del":"Elimina","lead":"Un buon colloquio è una diagnosi, non una lezione. Da 20 a 30 minuti – e alla fine c’è sempre un passo successivo chiaro, anche se è «non interessato».","phT":"Lo svolgimento","ph":[["Fissare il quadro","2 min","«Bello che sia andata. La mia proposta: prima ti faccio qualche domanda, poi ti mostro di cosa si tratta, e alla fine mi dici sinceramente se fa per te. D’accordo?»"],["Domande","5–8 min","Motivazione, tempo, possibilità – le domande chiave qui sotto. Ascoltare, annotare."],["Mostrare","5 min","«Posso mostrarti velocemente come la uso io?» – l’app dal vivo e la tua storia."],["Inquadrare","5 min","«Da quello che mi hai raccontato, per te il più adatto è …, perché …» – cliente, partner, commerciante o moltiplicatore."],["Decidere","3 min","Una delle domande di chiusura qui sotto – e un appuntamento con data."]],"phNote":"Perché il quadro è così importante: chi all’inizio sente che un no è permesso, poi ascolta rilassato – invece di difendersi interiormente.","pq":["Cosa dovrebbe succedere perché una cosa del genere valga la pena per te?","Quanto tempo potresti investire realisticamente alla settimana?","Con quante persone sei regolarmente in contatto – e preferisci lavorare da solo o in team?","Quali settori / regioni puoi aprire?","Preferisci produrre in prima persona o costruire un’organizzazione?"],"storyT":"La tua storia in 60 secondi","storyHint":"Racconta solo cose vere. Nessun risultato ancora? Allora il tuo innesco è la tua storia.","story":["Prima – dov’ero?","Innesco – cosa mi ha incuriosito?","Ora – cosa faccio, cosa ho vissuto di persona?","Perché te lo mostro"],"storyCopy":"Copia la storia","storyEmpty":"Compila le quattro parti – qui prende forma la tua storia.","closeT":"Domande di chiusura – aperte e oneste","close":[["Scala","«Su una scala da 1 a 10 – quanto è interessante per te?» Da 6: «Cosa ti manca per arrivare a 10?» Sotto 5: «Allora lasciamo perdere l’attività – l’app come cliente potrebbe fare per te?»"],["Focus","«Cosa ti attira di più?»"],["Scegliere la strada","«Vuoi iniziare prima come cliente o subito come partner?»"],["Chiarire","«Cosa dovrebbe essere chiarito perché tu possa decidere?»"],["Appuntamento","«Allora facciamo la tua call di avvio con il mio sponsor – va bene martedì alle 19 o mercoledì alle 18?»"]],"trioT":"Il colloquio a tre con il tuo sponsor","trio":"Nelle prime settimane il tuo sponsor partecipa ai colloqui importanti e tu impari ascoltando. Così lo presenti – solo con informazioni vere:","edif":"«{s} fa questo da [periodo] e mi ha reso l’inizio molto facile. L’ho coinvolto perché può rispondere alle tue domande meglio di me.»","trioRole":"Il tuo ruolo: introdurre, ascoltare, prendere appunti. Dopo, in due, discutete cosa è andato bene.","task":"Entro 72 ore conduci almeno un colloquio qualificato con una vera analisi del bisogno – volentieri come colloquio a tre con il tuo sponsor."},
 sprint:{"lead":"La velocità nasce quando imparare e agire sono collegati direttamente.","sc":"Il tuo scoreboard 72 h","scHint":"Calcolato automaticamente dalla tua lista, dalla pipeline e dai tuoi colloqui.","k":["Nomi nella lista del potenziale","Contatti TOP prioritizzati","Contatti avviati","Risposte / reazioni","Conversazioni qualificate","Passi successivi chiari"],"quote":["Le prime 72 ore non decidono la tua carriera.","Ma spesso decidono se la motivazione diventa vero movimento."],"task":"Nessun partner chiude lo sprint di avvio solo con “Academy guardata”. Conclusione = Academy + attività reale."},
 week:{"lead":"La costanza non nasce dalla motivazione quotidiana, ma da un ritmo ripetibile.","days":[["Lunedì","Focus","Definire obiettivo settimanale, contatti TOP, appuntamenti e leve di rete principali."],["Mercoledì","Competenze","Allenare contatto, obiezioni, conduzione del colloquio o presentazione con il role play."],["Venerdì","Revisione","Controllare i numeri, fissare gli apprendimenti, chiudere i follow-up, preparare la settimana."]],"title":"I 6 numeri che contano davvero","cols":["KPI","Questa settimana","Obiettivo prossima settimana"],"close":"Chiudi la settimana: inizia una nuova settimana","closed":"Nuova settimana iniziata – gli obiettivi restano","imp":"<b>Importante:</b> non misurare solo i risultati. Gli indicatori anticipatori come contatti, colloqui e follow-up ti mostrano molto prima se la prossima settimana sarà forte.","task":"Ogni venerdì 15 minuti di revisione dei numeri. Non giudicare prima che i numeri siano visibili."},
