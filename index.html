 geld:{"lead":"Wynagrodzenie powstaje na dwa sposoby: jednorazowo, gdy nowy partner kupuje pakiet, i na stałe z użytkowania przez aktywnych klientów. Żadne nie powstaje od samego pisania wiadomości i żadne nie jest gwarantowane.","blocks":[["Prowizja od zamknięcia","jednorazowo","Nowy partner kupuje pakiet: pakiet Premium = 3 CP, voucher = 1 CP."],["Airtime","na stałe","Twoi aktywni klienci używają ePOINT. Wynagradzane użytkowanie generuje CP."],["Różnica","przy okazji","Partner w twojej linii ma niższą rangę – dostajesz różnicę między stawkami, np. Area Manager nad Team Builderem: 3 CP × 2 € = 6 €."],["Zespół","przy okazji","Partnerzy na tym samym poziomie: zespołowy airtime w modelu 10 / 3 / 2 € za CP przez trzy pokolenia."]],"calcT":"Kalkulator","calcHint":"CP oznacza Commission Points. Kwota w euro za CP jest inna dla zamknięcia i dla airtime – nigdy ich nie sumuj.","rank":"Twoja ranga","prem":"Pakiety Premium nowych partnerów","vou":"Vouchery","cust":"Aktywni klienci","cp":"CP na klienta (założenie)","closure":"Prowizja od zamknięcia · jednorazowo","air":"Model airtime · na okres rozliczeniowy","perCp":"€ za CP","cust2":"aktywnych klientów","calcNote":"Obliczenie modelowe przed podatkiem, bez prognozy i bez obietnicy. 0,10 CP na klienta to założenie. Kwalifikację, rzeczywiste użytkowanie, koszty i wypłatę określa oficjalny plan.","tableT":"Rangi, kwalifikacja i stawki","cols":["Ranga","Kwalifikacja według grafiki","Zamknięcie € za CP","Airtime € za CP (model)"],"ranks":[["P","Partner","Back office"],["CB","Community Builder","Basic Pack lub 50 CP"],["TB","Team Builder","Premium Pack lub 100 CP"],["AM","Area Manager","250 CP"],["RD","Regional Director","500 CP"],["SD","Sales Director","2.500 CP"],["CM","Country Manager","5.000 CP"],["IBM","Innercircle Board Member","10.000 CP"]],"tableNote":"Od IBM model dodaje udział w puli światowej: światowe CP firmy × 10 €, podzielone przez uprawnionych IBM. Źródło: grafika wynagrodzeń Best Prime i regulamin prowizji, stan na 12.10.2026; pakiet Premium = 3 CP od 15.09.2026. Przed każdą obietnicą porównaj z aktualną wersją w back office.","talkT":"Jak mówisz o pieniądzach","talkQ":"„Zarabia się jednorazowo na zamknięciach i na stałe na użytkowaniu przez twoich klientów. Ile – zależy od tego, co robisz. Pokażę ci oficjalny plan.“","talk":["Nigdy nie podawaj miesięcznej kwoty jako oczekiwania.","Nigdy nie mów „dochód pasywny“.","Przykładowe obliczenia zawsze oznaczaj jako model.","Nigdy nie kupuj ani nie każ kupować pakietów lub voucherów tylko dla rangi."],"openT":"Do wyjaśnienia przed każdą obietnicą","open":["Koszty Basic i Premium Pack, jednorazowe i regularne","Kiedy powstaje uprawnienie i kiedy następuje wypłata","Co reguła 50 % lub 30 % oznacza dla kwalifikacji","Czy zespołowe stawki za zamknięcie według grafiki (20 / 6 / 4 €) obowiązują za CP czy za zamknięcie"],"openBtn":"Kopiuj pytania do sponsora","openMsg":"Cześć{l}, zanim komukolwiek wyjaśnię plan, chcę mieć pewność w czterech punktach: 1) Ile kosztują Basic i Premium Pack, jednorazowo i regularnie? 2) Kiedy powstaje uprawnienie i kiedy następuje wypłata? 3) Co reguła 50 % lub 30 % oznacza dla kwalifikacji? 4) Czy zespołowe stawki za zamknięcie 20 / 6 / 4 € obowiązują za CP czy za zamknięcie? Dzięki!","task":"Oblicz dwa własne przykłady: jedno zamknięcie na swojej randze i 10 aktywnych klientów. Następnie w dwóch zdaniach wyjaśnij, jak powstaje wynagrodzenie."},
 haltung:{"lead":"Ludzie nie reagują na informacje, tylko na postawę, z jaką przychodzisz. Kto prosi, zostaje spławiony. Kto sprawdza, czy to pasuje, jest traktowany poważnie.","core":"„Mam coś dobrego, szukam ludzi, do których to pasuje – i mam czas, żeby ich znaleźć.“","coreL":"Twoja postawa w jednym zdaniu","pT":"10 zasad","whyL":"Dlaczego to działa","howL":"Jak to stosujesz","lineL":"Czerwona linia","p":[["Wybierać zamiast przekonywać","Presja wywołuje opór. Kto otwarcie sprawdza, wydaje się pewny i wiarygodny.","„Nie wiem, czy to dla ciebie – szybko to sprawdźmy.“","Żadnego sztucznego niedoboru."],["Ciekawość przed informacją","Otwarte pytanie w głowie szuka odpowiedzi. Kto wszystko wyjaśni na czacie, zaprasza do oceny bez rozmowy.","W pierwszej wiadomości tylko temat, nawiązanie i mały następny krok. Szczegóły w rozmowie.","Zawsze jest jasne, o co chodzi. Jeśli ktoś bezpośrednio pyta o firmę, podajesz ją."],["Trafność wygrywa z zasięgiem","Ludzie reagują na to, co ich dotyczy.","Każda wiadomość ma prawdziwe zdanie „bo ty …“.","Żadnych wymyślonych okazji."],["Kto pyta, ten prowadzi","Ludzie wierzą w to, co sami powiedzą. Pytania uwidaczniają potrzebę.","Najpierw pytaj, potem pokazuj. Mówisz mniej niż jedną trzecią czasu.","Żadnych sugerujących pytań, na które można odpowiedzieć tylko tak."],["Małe kroki do tak","Małe tak jest łatwiejsze niż duże – a kto się zgodzi, częściej zostaje.","Proś zawsze tylko o następny mały krok: 10 minut, rzut oka na aplikację, spotkanie.","Żadnego tak wymuszonego zaskoczeniem."],["Doświadczenie wygrywa z wyjaśnieniem","Własne doświadczenie przekonuje bardziej niż jakikolwiek slajd.","Pokaż aplikację na żywo, pokaż własny dowód cashbacku.","Żadnych cudzych ani podkoloryzowanych wyników."],["Najpierw dawaj","Kto dostaje prezent, jest bardziej otwarty. Aplikacja jest darmowa – szczera porada.","Zacznij od korzyści dla klienta, zanim zaczniesz mówić o biznesie.","Żadnego „prezentu” z ukrytym warunkiem."],["Jak równy z równym zamiast prośby","Kto się tłumaczy, wydaje się mały. Profesjonaliści sprzedaży szanują tylko ton równego z równym.","Spokojnie, jasno, bez „Przepraszam, że przeszkadzam”.","Bez arogancji, nigdy nie mów źle o innych firmach."],["Nie to informacja","Kto bierze odmowy do siebie, rezygnuje. Kto je liczy, staje się lepszy.","Podziękuj, ustaw status, następny kontakt.","Po jasnym nie – żadnego follow-upu."],["Tożsamość i rytm","Ludzie działają zgodnie z obrazem, jaki mają o sobie. Stałe bloki pracy wygrywają z motywacją.","„Jestem kimś, kto codziennie robi 3 kontakty.“ Odhaczaj każdy dzień.",""]],"fearT":"Strach przed pierwszym kontaktem","fear":"Ma go prawie każdy. Nie znika od czytania, tylko po pierwszych dziesięciu wiadomościach.","fearL":[["Zacznijcie razem","Pierwszą wiadomość wysyłasz podczas callu startowego, a twój sponsor słucha."],["Zacznij od prezentu","Zaproszenie do darmowej aplikacji jest łatwiejsze niż jakiekolwiek zapytanie biznesowe."],["Licz aktywność, nie wyniki","Twój dzienny cel to „3 wysłane wiadomości“, a nie „3 zgody“."]],"wordsT":"Powiedz to tak","words":[["wyjątkowa okazja","model, który właśnie sprawdzamy z nielicznymi"],["dochód pasywny","stały poziom dochodu zależny od rzeczywistego użytkowania"],["Wchodź teraz!","Sprawdźmy, czy to pasuje."],["Chcę ci coś przedstawić.","Chcę zrozumieć, jak jesteś ustawiony."]],"task":"Przeczytaj 10 zasad raz w całości. Wybierz dwie, które są dla ciebie najtrudniejsze, i w kolejnych pięciu wiadomościach zwracaj na nie szczególną uwagę."},
 einw:{"lead":"Obiekcja to nie nie, tylko pytanie, które jest jeszcze otwarte. Kto traktuje ją poważnie, zdobywa zaufanie. Kto ją zbywa, traci je.","method":[["Uznać","„Rozumiem.“"],["Zapytać","„Co dokładnie masz na myśli?“ – często kryje się za tym coś innego."],["Uczciwie odpowiedzieć","Krótko, faktami, bez obietnic."],["Iść dalej","„Czy to ci wyjaśnia sprawę?“ – i do następnego kroku."]],"listT":"12 najczęstszych obiekcji","search":"Szukaj obiekcji, np. czas, pieniądze, piramida","none":"Brak pasującej obiekcji. Zapytaj swojego sponsora – i wpisz odpowiedź poniżej.","behind":"Często kryje się za tym:","items":[["„Nie mam czasu.“","strach przed wysiłkiem","Ty ustalasz tempo. Ile czasu realnie miałbyś tygodniowo? Wtedy uczciwie sprawdzimy, czy to wystarczy."],["„Nie umiem sprzedawać.“","strach przed odrzuceniem","Nie musisz. Pokazujesz darmową aplikację, której sam używasz – to bardziej polecanie niż sprzedawanie. A na początku twój sponsor uczestniczy w rozmowach."],["„Nikogo nie znam.“","niedoszacowana sieć","Przejdźmy razem przez 10 minut twój telefon – wtedy zobaczymy."],["„Czy to piramida finansowa?“","strach przed oszustwem","Dobre pytanie, powinieneś je zadać. To sprzedaż bezpośrednia z prawdziwym produktem: klienci używają darmowej aplikacji i dostają cashback, sprzedawcy zatrzymują swoich klientów. Wynagrodzenie jest za zamknięcia i za użytkowanie przez prawdziwych klientów według oficjalnego planu. Pokażę ci dokumenty, sprawdź sam."],["„Czy to network marketing?“","rezerwa wobec branży","Tak, strona sprzedażowa jest zbudowana jako struktura partnerska – wolę ci to od razu sam powiedzieć. Ale ciekawy jest mechanizm za tym: lojalność klientów przez prawdziwe zakupy u sprzedawców. Czy to do ciebie pasuje, sprawdzimy w 15 minut."],["„Ile to kosztuje?“","ocena ryzyka","Jako klient nic. Jako partner są pakiety startowe – dokładne ceny pokażę ci z aktualnych oficjalnych dokumentów, nie z pamięci."],["„Ile ty zarabiasz?“","szuka dowodu","Szczerze: [prawdziwa odpowiedź, np. „Dopiero zaczynam“]. Ważne jest, jak działa plan i co ty z tego zrobisz – to ci pokażę."],["„Wyślij mi informacje.“","grzeczny unik albo prawdziwe zainteresowanie","Chętnie – ale dopiero, gdy będę wiedział, które informacje są dla ciebie istotne. Co cię bardziej interesuje: aplikacja jako klient czy biznes? Potem 10 minut przez telefon. Czwartek czy piątek?"],["„Muszę się zastanowić.“","otwarte pytanie","Jasne. Żebyś mógł się dobrze zastanowić: który punkt jest dla ciebie jeszcze otwarty? (Potem ustalcie termin na odpowiedź.)"],["„Muszę porozmawiać z partnerem.“","wspólna decyzja","Świetnie. Zróbmy następną rozmowę we trójkę? Wtedy twój partner ma te same informacje z pierwszej ręki."],["„Aplikacji cashback jest dużo.“","porównanie","Zgadza się. Po prostu ją wypróbuj, nic nie kosztuje: od 3 do 30 % u uczestniczących sprzedawców w pobliżu i w ponad 1.000 sklepach internetowych, z wypłatą na konto."],["„Czy ePAY już jest dostępny?“","ciekawość nowego","Nie. ePAY jest planowany na 09.01.2027. Tym, z czego możesz korzystać dziś, jest aplikacja ePOINT – pokażę ci ją."]],"copyA":"Kopiuj odpowiedź","mineT":"Moje trzy najtrudniejsze obiekcje","mineE":"Obiekcja","mineA":"Moja odpowiedź","task":"Przećwicz trzy obiekcje na głos – ze sponsorem lub partnerem – i wpisz swoje trzy najtrudniejsze obiekcje z odpowiedzią."},
 kgesetze:{"lead":"Wiadomości, rozmowy i strategia dla największych – liderów sieci, szefów sprzedaży i otwieraczy drzwi. Wszystko wynika z tych dziesięciu zdań. Kto je łamie, traci króla – zwykle nie wiedząc dlaczego.","motto":"Królów się nie werbuje.","motto2":"Królów się wybiera.","pillars":[["Szacunek dla jego ryzyka","Może stracić więcej, niż może zyskać. Powiedz to, zanim on o tym pomyśli."],["Dowód przed wizją","Jeden prawdziwy przypadek wygrywa z każdym slajdem o przyszłości."],["Wybór zamiast werbowania","To ty sprawdzasz, czy on pasuje – nie odwrotnie."]],"lawsT":"10 praw królewskich","laws":[["Wybieraj, zamiast werbować.","To ty sprawdzasz, czy on pasuje – nie odwrotnie. Kto werbuje, przegrał, zanim się odezwał."],["Kto więcej tłumaczy, traci status.","Pytania zamiast slajdów. Twój udział w mówieniu w pierwszej rozmowie wynosi poniżej 30 procent."],["Dowód przed wizją.","Prawdziwy sprzedawca, prawdziwa transakcja, prawdziwa wypłata wygrywają z każdym slajdem o przyszłości. Wizja dopiero, gdy dowód siedzi."],["Najpierw jego ryzyko.","Król może stracić reputację, zespół i umowę. Powiedz to, zanim on o tym pomyśli."],["On liczy, nie ty.","W to, co sam policzy, wierzy. W to, co ty mu policzysz, wątpi."],["Marka dopiero przy drugim kontakcie.","Żadnej nazwy firmy przy pierwszym kontakcie – inaczej wygoogluje, zanim się zaciekawi. Jeśli zapyta wprost, podajesz ją."],["Równorzędność nadawcy.","Król rozmawia z królem albo z zarządem. Nigdy z trzecim szeregiem."],["Tylko prawdziwy niedobór.","Wasza przepustowość, moment, jego region. Wszystko wymyślone przejrzy – i wtedy znika szacunek."],["Jeden strzał, perfekcyjnie przygotowany.","Żadnego króla bez dossier. Żadnej rozmowy bez spójnego planu."],["Umieć odejść.","Gotowość, by przyjąć nie, jest u królów najsilniejszą siłą przyciągania."]],"useT":"Jak korzystać z Klasy Królewskiej","use":["Przeczytaj raz w całości prawa królewskie, gotowość do tronu, typy królów i sekwencję królewską. Określają, jak używać wszystkiego innego.","Przed każdym królem: załóż dossier, określ typ, wybierz pasującą wiadomość.","Pola w [nawiasach kwadratowych] zawsze wypełniaj indywidualnie. Żadna wiadomość nie wychodzi bez zmian.","„Warunek“ oznacza: używaj zdania tylko wtedy, gdy spełnienie warunku da się udowodnić."],"task":"Przeczytaj dziesięć praw na głos. Zaznacz dwa, które dotąd najczęściej łamałeś."},
 kreife:{"lead":"Król daje ci jeden strzał. Jeśli brakuje jednego z sześciu punktów, nie odzywasz się – spalony król nie wraca i opowiada o tym dalej.","checkT":"Gotowość do tronu: zanim odezwiesz się do króla","check":[["Plan wynagrodzeń bez sprzeczności","Jedna aktualna wersja oryginalna, jedna cena na produkt, jedna matryca uprawnień. Profesjonaliści czytają plany jak biegli rewidenci."],["Przypadek dowodowy do pokazania","Aktywny sprzedawca, transakcja z przypisaniem w back office, dowód wypłaty – za zgodą tej osoby."],["Zasada przepustowości ustalona","Ilu królów osobiście towarzyszycie do 09.01.2027? Rekomendacja: maksymalnie pięciu. Zasada wtedy naprawdę obowiązuje."],["Zarząd potwierdził","Stałe terminy na rozmowy królewskie są zablokowane."],["Dossier wypełnione, punkty ≥ 8","Typ, motyw, nadawca i okazja są ustalone."],["Dozwolona droga kontaktu","Istniejąca relacja, polecenie albo kanał biznesowy. Bez masowych wiadomości."]],"dossT":"Twoje dossier królów","dossHint":"Dossier zostają tylko na tym urządzeniu – nigdy nie są przekazywane do controllingu.","add":"Dodaj króla","addPh":"Imię i nazwisko króla","empty":"Jeszcze brak dossier. Dodaj swojego pierwszego króla – na start wystarczy imię.","edit":"Edytuj","close":"Zamknij","del":"Usuń dossier","delSure":"Na pewno usunąć?","fields":[["role","Imię & rola","Stanowisko, od kiedy, funkcja publiczna"],["org","Organizacja","Firma, branża, region"],["size","Wielkość","Organizacja lub sieć – wartości potwierdzone i szacowane osobno"],["bind","Związanie","Obecna firma, prawdopodobne klauzule o zakazie konkurencji i podbierania"],["frust","Sygnały frustracji","Co go teraz uwiera: publiczne wypowiedzi, zmiany, wycofanie"],["verb","Połączenie","Kto zna jego i was? Wspólne kontakty jako otwieracze drzwi"],["sender","Nadawca","Kto się do niego odzywa – i czy to jest równorzędne?"],["anlass","Okazja","Konkretny, możliwy do udowodnienia powód, by odezwać się teraz"]],"typeL":"Typ króla","motiveL":"Motyw króla","stageL":"Etap","scoreL":"Punkty króla","scoreDate":"Punkty zaktualizowane","scoreT":"Punkty króla · za każde kryterium 0–2 punkty","scoreCols":["Kryterium","0","1","2"],"score":[["Sieć & dostęp do decydentów","prawie brak","regionalny","duży i bezpośredni"],["Przywództwo","samotny wilk","mały zespół","prowadzi kadrę kierowniczą"],["Niezawodność & tempo","niejasne","zmienne","dotrzymuje słowa"],["Czas w ciągu najbliższych 30 dni","brak","mało","stale zaplanowany"],["Motywacja przedsiębiorcza","szuka bezpieczeństwa","otwarty","myśli strukturami i ryzykiem"]],"bands":[["8–10","Król A: odezwij się"],["5–7","pogłęb dossier"],["0–4","nie odzywaj się"]],"scoreNote":"Aktualizuj punkty po każdej rozmowie. Nigdy nie wyprowadzaj ich z liczby obserwujących ani z deklaracji.","motT":"Cztery motywy królów","motLead":"Pieniądze rzadko są motywem – królowie je mają. Kto mówi tylko o pieniądzach, mówi obok króla.","motCols":["Motyw","Rozpoznasz po","Zdanie, które trafia"],"motives":[["Dziedzictwo","mówi o „czymś trwałym“, następcy, rodzinie","Co zostanie z twojej organizacji, gdy nie będziesz jej już codziennie ciągnął?",""],["Uznanie","scena, rangi i wyróżnienia są dla niego ważne","Pierwsi, którzy to zbudują, staną we Frankfurcie z przodu.","Scena potwierdzona przez organizatora"],["Wolność","frustracja zależnością od jednej firmy lub zleceniodawcy","Na ile twój dochód zależy dziś od jednej jedynej firmy?",""],["Wzrost","niespokojny, szuka kolejnego rynku","Gdzie jest u ciebie teraz kolejny rynek?",""]],"task":"Odhacz sześć punktów gotowości do tronu. Potem załóż dossier dla swojego pierwszego króla i uczciwie przyznaj punkty."},
 ktypen:{"lead":"Prawie każdy król należy do jednego z pięciu typów. Typ określasz w dossier – decyduje o tonie, wiadomości i otwieraczu oczu.","rows":["Jego obawa","Co go porusza","Ton","Otwieracz oczu","Tabu"],"types":[["I","Król sieci","ty","Top lider innej firmy sieciowej z dużą organizacją.","Klauzule umowne, jego reputacja we własnej firmie, niepokój w zespole.","Dodatek zamiast zmiany. Odpowiedź na fluktuację i na wielu w jego zespole bez znaczącego dochodu.","Lider do lidera. Spokojnie, bez superlatywów.","„Twoi ludzie robią zakupy co miesiąc. Na tej konsumpcji zarabia dziś każdy – oprócz twojej organizacji.“","Źle mówić o jego firmie. Zwracać się do list zespołu. Pitch o zmianie."],["II","Szef sprzedaży strukturalnej & finansowej","Pan/Pani lub ty","Właściciel lub dyrektor organizacji sprzedaży finansowej, ubezpieczeniowej lub strukturalnej.","Powaga, odpowiedzialność, zezwolenia i nadzór, jego reputacja u klientów.","Korzyść dla klientów bez kolejnego produktu finansowego. Lojalność klientów między spotkaniami doradczymi. Porządna dokumentacja.","Rzeczowo i pewnie w liczbach. Forma zwracania się zależnie od relacji.","„Widzi Pan swojego klienta dwa razy w roku. A co, gdyby pomiędzy tym co tydzień doświadczał Pana pozytywnie?“","Rentowność, giełda lub opcje jako argument. Słownictwo hype’u."],["III","Przedsiębiorca sprzedaży terenowej","ty","Właściciel sprzedaży D2D, energii, PV, telekomunikacji lub POS.","Obłożenie, presja na marże, fluktuacja jego sprzedawców, zależność od jednego zleceniodawcy.","Dodatkowa wartość z kontaktów, które jego zespół i tak nawiązuje. Drugie źródło utrzymania.","Bezpośrednio, praktyka zamiast teorii.","„Twój zespół codziennie stoi przed setkami drzwi i sprzedawców. Płacą ci za jeden moment – zamknięcie. Potem kontakt nie jest już dla ciebie nic wart.“","Kwestionować jego główny biznes. Proponować mu podbieranie jego sprzedawców."],["IV","Król otwieracz drzwi","Pan/Pani","Franczyzodawca, szef związku, klub przedsiębiorców, organizator przedstawicieli handlowych, doradca z wieloma mandatami przedsiębiorców.","Jego reputacja u członków i klientów, neutralność, nakład pracy, prawo zawodowe.","Możliwość dania swoim ludziom realnej wartości dodanej. Mierzalny pilotaż. Żadnej roli sprzedawcy.","Instytucjonalnie, krótko, z konkretną propozycją pilotażu.","„Pana firmy mają codziennie kontakt z klientami. Ile z tej relacji z klientem zostaje u nich po zakupie?“","Robić z niego sprzedawcę. Stawiać dochód na pierwszym planie. Masowe maile do jego członków."],["V","Uśpiony król","ty","Kiedyś wielki lider, dziś nieaktywny, rozczarowany albo między dwoma projektami.","Ponowna publiczna porażka. Jego wiarygodność. „Znowu coś nowego.“","Szacunek dla jego historii. Cichy nowy start bez ogłaszania. Rola zamiast rangi.","Osobiście, z uznaniem, bez presji.","„Nie musisz nikomu niczego udowadniać. Pytanie tylko, czy twoja wiedza gdzieś teraz pracuje.“","Przypominać o porażkach. Publiczne ogłoszenie przed pilotażem. Presja."]],"task":"Określ typ każdego króla w swoich dossier – i przed każdą wiadomością przeczytaj obawę, ton i tabu jego typu."},
 ksequenz:{"lead":"Siedem etapów od dossier do pilotażu. Każdy etap ma cel i kryterium wyjścia. Kto pominie etap, traci króla.","goalL":"Cel","exitL":"Wyjście","steps":[["Dossier","Dzień 0","Typ, motyw, nadawca, okazja i punkty są ustalone.","Punkty poniżej 8 → nie odzywaj się."],["Pierwszy kontakt","Dzień 1","Odpowiedź i termin na 20 minut. Ciekawość, bez marki.","Dwa follow-upy bez reakcji → odłóż na 90 dni."],["Call kwalifikacyjny","20 minut","On opowiada, ty sprawdzasz. Zaktualizuj punkty.","Punkty poniżej 5 → uprzejmie odłóż."],["Rozmowa otwierająca oczy","60 minut","Dźwignię formułuje sam – na własnych liczbach.","Nie widzi dźwigni → nic nie dorzucasz."],["Dowód & zarząd","45 minut","Prawdziwy przypadek plus weryfikacja przez zarząd.","Otwarta kwestia umowy lub warunków → pauza, aż zostanie wyjaśniona."],["Krąg założycieli","90 minut","Pisemna zgoda na pilotaż z co najmniej pięcioma wskazanymi starterami i datą startu.","Brak zgody w ciągu 7 dni → powrót w styczniu."],["Pilotaż","14 dni","Starty, pierwsze rozmowy ze sprzedawcami, zaksięgowane CP.","Przegląd decyduje: rollout albo stop."]],"takt":"<b>Rytm:</b> Od etapu 2 do 6 najlepiej 21 dni. Ponad 30 dni bez kolejnego etapu oznacza: król nie jest w procesie, tylko czeka.","stages":["Dossier","Kontakt","Call","Otwieracz oczu","Zarząd","Krąg założycieli","Pilotaż","Wystartował","Odłożony · z datą powrotu"],"pipeT":"Twój królewski pipeline","pipeHint":"Każdy król jest na dokładnie jednym etapie – z datą i następnym krokiem.","pipeCols":["Król","Punkty","Etap","Następny krok","Data"],"pipeEmpty":"Jeszcze brak królów. Dodaj ich w „Gotowość do tronu & dossier“.","kpiT":"KPI","kpiCols":["KPI","Definicja","Rytm"],"kpis":[["Dossier A","królowie z punktami ≥ 8 i kompletnym dossier","co tydzień"],["Pierwsze kontakty","wysłane, indywidualnie dopasowane pierwsze wiadomości","co tydzień"],["Wskaźnik odpowiedzi","odpowiedzi ÷ pierwsze kontakty","co tydzień"],["Calle","przeprowadzone 20-minutowe calle","co tydzień"],["Otwieracze oczu","przeprowadzone 60-minutowe rozmowy","co tydzień"],["Zgody na pilotaż","pisemne, z co najmniej pięcioma wskazanymi starterami i datą startu","co tydzień"],["Uruchomieni partnerzy","z trwających pilotaży","co tydzień"],["Zaksięgowane CP","z pilotaży, według back office","co tydzień"],["Odłożeni królowie","z datą powrotu","co miesiąc"]],"planT":"Założenie planistyczne na pierwsze cztery tygodnie","plan":"15 dossier A → 10 pierwszych kontaktów → 5 calli → 3 rozmowy otwierające oczy → 1–2 pilotaże","planNote":"To założenie, a nie zmierzony wskaźnik. Po czterech tygodniach zastąp je waszymi prawdziwymi wartościami.","rhythmT":"Rytm tygodnia","rhythm":[["Poniedziałek · 15 min","Przegląd pipeline’u: kto jest gdzie? Kto jest na ten tydzień? Który król czeka za długo?"],["Piątek · 15 min","Wnioski: która wiadomość przyniosła odpowiedzi, a która nie? Dopasuj teksty, zaktualizuj punkty."]],"task":"Ustaw każdego króla w swoim pipeline na dokładnie jednym etapie – z następnym krokiem i datą. W poniedziałki i piątki po 15 minut przeglądu."},
 knachr:{"lead":"Pierwsza wiadomość ma dokładnie jedno zadanie: 20-minutową rozmowę. Nie informować, nie przekonywać, nie sprzedawać.","forKing":"Dla którego króla?","manual":"Dopasuj [Imię] ręcznie","rulesT":"Sześć zasad pierwszego kontaktu","rules":["Konkretna, możliwa do udowodnienia okazja – bez kopiuj-wklej.","Bez nazwy firmy, bez linku, bez PDF-a, bez liczb.","Ciekawość zamiast wyjaśnień: pytanie, którego sobie nigdy nie zadał.","Maksymalnie pięć zdań.","Mały następny krok: 20 minut, dwie propozycje terminu.","Furtka: „Jeśli nie pasuje, po prostu powiedz.“ To zdejmuje presję – i ułatwia odpowiedź."],"firstT":"Pierwszy kontakt · 9 szablonów","first":[["5.1","Król sieci","WhatsApp / DM · ty","Cześć [Imię], od jakiegoś czasu obserwuję, jak prowadzisz swoją organizację – zwłaszcza [konkretna okazja]. Pracuję właśnie z nielicznymi liderami nad czymś, co nic nie zmienia w twoim obecnym biznesie, ale odpowiada na pytanie, którego większość dużych organizacji nigdy sobie nie zadaje: co właściwie dzieje się z konsumpcją twoich ludzi? Masz ochotę na 20 minut, lider do lidera? Jeśli nie pasuje, po prostu powiedz.","Uznanie przez prawdziwą okazję, pytanie, na które nie odpowie od razu, i równorzędność zamiast prośby."],["5.2","Król sieci","Wiadomość głosowa · ok. 45 sek.","Hej [Imię], tu [twoje imię]. Celowo wysyłam ci wiadomość głosową zamiast długiego tekstu. [Okazja w jednym zdaniu]. Pracuję właśnie z kilkoma liderami nad czymś, co nic nie zmienia w twoim biznesie, ale odpowiada na pytanie, które uważam za fascynujące: co dzieje się z konsumpcją w dużych organizacjach? Nie będę ci tego tłumaczył w wiadomości głosowej – zadzwońmy po prostu na 20 minut. A jeśli cię to nie interesuje, to zupełnie w porządku. Po prostu daj znać.","Głos tworzy bliskość i autentyczność, których tekst nie ma. Mów spokojnie, nie czytaj, bez tonu sprzedawcy."],["5.3","Szef sprzedaży strukturalnej & finansowej","Wiadomość · Pan/Pani","Dzień dobry [Imię], odzywam się do Pana celowo, bo zbudował Pan organizację z prawdziwym zaufaniem klientów – [konkretna okazja]. Pracuję z nielicznymi właścicielami organizacji sprzedaży nad podejściem, które obywa się bez dodatkowego produktu finansowego i może wiązać klientów z Pana organizacją między spotkaniami doradczymi. Zanim cokolwiek pokażę: czy miałby Pan 20 minut, żeby sprawdzić, czy to w ogóle jest dla Pana istotne? [Dzień] czy [dzień]?","Trafia w jego główną obawę – brak kolejnego produktu, brak odpowiedzialności – i zostawia mu rolę sprawdzającego."],["5.4","Przedsiębiorca sprzedaży terenowej","WhatsApp · ty","Cześć [Imię], krótkie pytanie między przedsiębiorcami: twoi ludzie codziennie stoją przed setkami drzwi i sprzedawców. Płacą ci za jeden jedyny moment – zamknięcie. Pracuję właśnie z nielicznymi właścicielami sprzedaży nad tym, ile ten kontakt może być wart potem, bez żadnej zmiany w waszym głównym biznesie. 20 minut w tym tygodniu? [Dzień] czy [dzień]?","Od razu dostrzega ślepą plamkę we własnym modelu – a nikt mu niczego nie sprzedał."],["5.5","Król otwieracz drzwi","E-mail · Pan/Pani","Temat: Wartość dodana dla Pana [członków/partnerów franczyzowych] – propozycja małego pilotażu\n\nSzanowny Panie / Szanowna Pani [forma grzecznościowa i nazwisko],\n\nzwracam się do Pana/Pani, ponieważ [organizacja] słynie z [konkretna okazja].\n\nPracujemy nad modelem, dzięki któremu firmy mogą wiązać swoich klientów także po zakupie – bez zmiany swojego głównego biznesu. Szukamy w tym celu niewielkiej liczby wybranych partnerów do mierzalnego pilotażu z trzema do pięciu firm.\n\nCzy mogę przedstawić to w 20 minut? Następnie zdecyduje Pan/Pani, czy w ogóle wchodzi to w grę dla Pana/Pani [członków].\n\nZ wyrazami szacunku\n[Imię] · [funkcja] · [telefon]","Instytucjonalnie, krótko, jasno ograniczone. Pozostaje decydentem i nie staje się sprzedawcą. Tylko na adresy służbowe, wysyłane pojedynczo."],["5.6","Uśpiony król","WhatsApp · ty","Hej [Imię], ciągle wracam myślami do czasu, gdy zbudowałeś [konkretne osiągnięcie]. Nie chcę ci niczego sprzedawać ani do niczego namawiać. Interesuje mnie twoja szczera ocena czegoś, nad czym pracuję właśnie z kilkoma liderami – bo prawie nie znam nikogo, kto rozumie struktury tak jak ty. Masz ochotę na kawę albo call?","Prosisz o jego radę, nie o udział. To go honoruje, obniża opór – a kto doradza, zaczyna współmyśleć."],["5.7","Ciepłe intro: tekst dla polecającego","WhatsApp · ty","[Imię króla], chciałbym cię połączyć z [twoje imię]. [On/Ona] buduje właśnie z nielicznymi szefami sprzedaży coś, przy czym od razu pomyślałem o tobie – ze względu na [okazja]. Bez pitchu, po prostu uważam, że powinniście się poznać. Mogę was połączyć?","Pożyczone zaufanie to najsilniejsze wejście. Najpierw zapytać, potem łączyć – to szanuje króla."],["5.8","Twoja odpowiedź po intro","WhatsApp · ty","Dziękuję, [polecający]. [Imię], bardzo mi miło. [Polecający] opowiedział mi, jak [okazja]. Krótko: porozmawiajmy 20 minut, wtedy będziesz wiedział, czy to dla ciebie ciekawe. [Dzień] czy [dzień]?",""],["5.9","Zaproszenie do kontaktów biznesowych","LinkedIn · max. 300 znaków · Pan/Pani","[Imię], śledzę Pana/Pani pracę w [organizacja] od [okazja]. Z nielicznymi właścicielami sprzedaży buduję dodatkowy poziom przychodu na istniejących relacjach z klientami i chętnie nawiążę kontakt – bez pitchu.","Potem: po akceptacji nie pitchuj od razu. Najpierw zareaguj na post, potem wyślij dopasowane 5.3 lub 5.4."]],"reactT":"Pierwsze reakcje · 14 odpowiedzi","reactLead":"Każda odpowiedź prowadzi do rozmowy – nigdy do wyjaśnień na czacie. Co zostanie wyjaśnione na czacie, na czacie zostanie ocenione. A na czacie przegrywasz.","reactRules":["Pyta wprost o firmę? Podaj ją. Unikanie odpowiedzi wydaje się profesjonalistom niepoważne.","Żadnych liczb, PDF-ów ani linków przed rozmową. Liczba na czacie to obietnica.","Maksymalnie dwa follow-upy. Potem koniec."],"react":[["6.1","„O co chodzi?“","","Uczciwie. W jednym zdaniu: chodzi o to, jak duże organizacje mogą z codziennej konsumpcji swoich ludzi zrobić dodatkowy poziom przychodu – bez zmiany swojego biznesu. Wszystko inne byłoby na czacie zmarnowane. 20 minut i wiesz, czy to dla ciebie istotne. [Dzień] czy [dzień]?",""],["6.2","„Wyślij mi informacje.“","","Chętnie – ale dopiero, gdy będę wiedział, które informacje są dla ciebie w ogóle istotne. Inaczej dostaniesz 20 stron, z których 18 nie pasuje do twojej organizacji. Daj mi 15 minut, a wyślę ci dokładnie to, co do ciebie pasuje.",""],["6.3","„Jaka firma za tym stoi?“","","Best Prime z platformą ePOINT. Nazwę możesz śmiało wygooglować – tylko nie powie ci nic o mechanice, o którą mi chodzi. Tę pokażę ci w 20 minut na prawdziwym przypadku. Pasuje [dzień]?","Ważne: odpowiadaj szczerze. Kto przy tym pytaniu się wykręca, odpada."],["6.4","„Czy to network marketing?“","","Tak, strona sprzedażowa jest zbudowana jako struktura partnerska – wolę ci to od razu sam powiedzieć. Ale dla ciebie ciekawa jest nie struktura, tylko mechanika za nią: lojalność klientów dzięki prawdziwym zakupom u sprzedawców. Czy to do ciebie pasuje, sprawdzimy w 20 minut – bez slajdów.","Kto sam to powie, odbiera obiekcji siłę. Zaprzeczanie zniszczyłoby całe zaufanie."],["6.5","„Jestem związany umową.“","","Dobrze, że o tym mówisz – traktuję to poważnie. Nie chcę, żebyś miał przez nas kłopoty. Przyjrzyjmy się w rozmowie dokładnie, na co pozwala twoja umowa, a w razie potrzeby daj ją sprawdzić. Jeśli to nie pasuje, sam ci to powiem.","To zdanie buduje więcej zaufania niż jakakolwiek prezentacja. Chronisz jego – nie swoje zamknięcie."],["6.6","„Nie mam czasu.“","","Rozumiem – zwłaszcza u ciebie. Dlatego proszę o 20 minut, a nie o projekt. Jeśli potem nie będzie pasować, to tyle. Lepiej w przyszłym tygodniu, [dzień] czy [dzień]?",""],["6.7","„Ile na tym zarobię?“","","Policzymy to razem na twoich prawdziwych liczbach i obowiązującym planie – nie na przykładowych obliczeniach z internetu. Wszystko inne byłoby niepoważne. Przynieś na rozmowę trzy liczby, a zobaczysz to czarno na białym.","Ważne: nigdy liczba na czacie. To, co napiszesz, zostanie odczytane jako obietnica."],["6.8","„Brzmi ciekawie.“","","Cieszę się. To ustalmy to od razu: [dzień] o [godzina] czy [dzień] o [godzina]? Potem wyślę ci trzy krótkie pytania na przygotowanie.",""],["6.9","Cisza · follow-up 1","po 4 dniach","Cześć [Imię], przypominam się raz krótko, żeby nie utonęło na czacie. Teraz nie pasuje, później czy wcale? Każda z trzech odpowiedzi jest w porządku.",""],["6.10","Cisza · follow-up 2 (ostatnia wiadomość)","po kolejnych 7 dniach","[Imię], zakładam, że teraz nie jest dobry moment – nie ma sprawy. Nie będę się już odzywać. Jeśli kiedyś się zaciekawisz, wiesz, gdzie mnie znaleźć.","Ważne: wiadomość jest szczera – i właśnie dlatego często wywołuje odpowiedź. Potem naprawdę już się nie odzywaj."],["6.11","Potwierdzenie terminu z trzema liczbami","","Super, [dzień] o [godzina] aktualne. Żebyśmy dobrze wykorzystali czas, przynieś proszę trzy przybliżone liczby:\n1) Ile osób jest aktywnych w twojej organizacji?\n2) Ile z nich znacząco zarabia?\n3) Ilu sprzedawców i przedsiębiorców twój zespół regularnie spotyka?\nWystarczą szacunki.","Kto się przygotowuje, zainwestował. I zaczyna liczyć, zanim porozmawiacie."],["6.12","Po rozmowie · podsumowanie","","Dzięki za otwartą rozmowę. U mnie zostają dwa punkty: [punkt 1] i [punkt 2]. Następny krok, jak ustaliliśmy: [konkretne działanie] dnia [data]. Jeśli do tego czasu coś się zmieni, po prostu daj znać.",""],["6.13","Uprzejmie odłożyć","","Dzięki za otwartość. Dla mnie jest jasne: teraz nie pasuje – i to jest zupełnie w porządku. Odezwę się krótko w [miesiąc], żeby sprawdzić, czy coś się u ciebie zmieniło. Do tego czasu wszystkiego dobrego dla [jego projekt].",""],["6.14","Powrót po 90 dniach","","Cześć [Imię], jak obiecałem, odzywam się raz. Od naszej ostatniej rozmowy u nas wydarzyło się [konkretny, udokumentowany rozwój]. Czy to jest dziś dla ciebie temat – czy nadal nie? Obie odpowiedzi są w porządku.","Warunek: wysyłaj tylko przy prawdziwym, udokumentowanym rozwoju."]],"task":"Dla swojego pierwszego króla A wybierz pierwszą wiadomość pasującą do jego typu, każdy nawias kwadratowy wypełnij indywidualnie i przed wysłaniem daj ją do przeczytania sponsorowi."},
 kgespr:{"lead":"W rozmowie królewskiej on mówi, ty pytasz. Twój udział w mówieniu wynosi poniżej 30 procent – aż do dowodu.","aT":"A · Call kwalifikacyjny · 20 minut","aCols":["Minuta","Faza","Co mówisz lub robisz"],"a":[["0–2","Ramy","„Zarezerwowałem 20 minut. Przede wszystkim chcę zrozumieć, jak jesteś ustawiony. Na końcu obaj szczerze powiemy, czy ma sens rozmawiać dalej. Okej?“"],["2–12","On opowiada","Pięć pytań diagnostycznych poniżej. Słuchać, notować, nie komentować."],["12–17","Teaser","„Nie pokażę ci firmy, tylko rachunek – z twoimi liczbami. Do tego potrzebuję godziny z tobą.“"],["17–20","Decyzja","„Czy ma dla ciebie sens przejść przez to z twoimi liczbami?“ Tak → ustal termin. Nie → „Dzięki, w takim razie odpuśćmy.“"]],"diagT":"Pięć pytań diagnostycznych","diag":["Ile osób w twojej organizacji jest naprawdę aktywnych?","Co cię teraz najbardziej frustruje?","Ilu twoich ludzi znacząco zarabia?","Co musiałoby się wydarzyć, żebyś za rok powiedział: to był mocny rok?","Na ile jesteś umownie wolny, jeśli chcesz robić coś dodatkowo?"],"bT":"B · Rozmowa otwierająca oczy · 60 minut","bCols":["Faza","Czas","Co się dzieje"],"b":[["1 · Lustro","10 min","Podsumuj, co powiedział w callu – jego słowami. „Czy dobrze cię zrozumiałem?“",""],["2 · Trzy pytania","15 min","Trzy pytania otwierające oczy (poniżej). Potem milcz.",""],["3 · Jego rachunek","15 min","On wpisuje swoje liczby. Liczycie z obowiązującym planem – każdy wynik wyraźnie oznaczony jako scenariusz, nigdy jako prognoza.",""],["4 · Dowód","10 min","Prawdziwy przypadek: sprzedawca → klient → zakup → przypisanie → wypłata. Na żywo w back office, jeśli to możliwe.",""],["5 · To, co zatrzymane","5 min","Dopiero gdy zapyta: współzarabianie na zakupach w całej sieci partnerów.","tylko tak, jak przewiduje obowiązujący plan"],["6 · Zamknięcie","5 min","Take-away zamiast presji (prawdziwy niedobór) i zaproszenie do kręgu założycieli.",""]],"qT":"Trzy pytania otwierające oczy","q":["Ile osób masz w swojej organizacji – i ile z nich znacząco zarabia?","Co pozostali mimo to robią co miesiąc? Robią zakupy: żywność, paliwo, online.","Kto dziś zarabia na tej konsumpcji? I co, gdyby część z tego zostawała w twojej organizacji – bez tego, żeby ktokolwiek z twoich ludzi musiał sprzedawać produkt?"],"silence":"<b>Zasada milczenia:</b> Po trzecim pytaniu milcz co najmniej pięć sekund. Kto pierwszy się odezwie, odbiera mu odkrycie.","cT":"C · Spotkanie z zarządem · 45 minut","cSub":"To on sprawdza firmę – nie wy jego.","c":[["Każde pytanie jest dozwolone:","struktura, wypłaty, plan, harmonogram, status ePAY."],["Żadnej odpowiedzi, która nie jest prawdziwa.","„Nie wiem, wyjaśnię to do [data]“ jest mocniejsze niż każda ładna odpowiedź."],["Nazwać ePAY po imieniu:","planowany na 09.01.2027 – nie więcej i nie mniej."]],"task":"Przygotuj swój następny call: zdanie ramowe na pamięć, pięć pytań diagnostycznych na kartce, potem zaktualizuj punkty."},
 keinw:{"lead":"Za każdą obiekcją króla kryje się obawa o reputację, zespół albo umowę. Odpowiadaj na obawę, nie na zdanie.","behind":"Za tym:","goal":"Cel:","search":"Szukaj obiekcji","items":[["„Mam już biznes.“","strach przed zastąpieniem","Właśnie dlatego z tobą rozmawiam. Nie ma niczego zastępować, tylko budować na tym, co już masz.","rama dodatku"],["„Widziałem to już wszystko.“","zmęczenie, sceptycyzm","Pewnie widziałeś wiele. Dlatego nie pokazuję ci prezentacji, tylko prawdziwy przypadek. Jeśli cię nie przekona, skończymy w dziesięć minut.","dowód zamiast pitchu"],["„Mój zespół nie chce niczego nowego.“","strach przed niepokojem","To nie zaczynaj od zespołu. Zacznij od pięciu osób, którym ufasz – 14 dni, po cichu. Potem decydujesz.","mały pilotaż"],["„A co, jeśli firma tego nie wytrzyma?“","ryzyko firmy","Uzasadnione pytanie. Dlatego przed każdą decyzją siadasz z zarządem i zadajesz właśnie to pytanie.","spotkanie z zarządem"],["„Czy ePAY i giełda już są?“","sceptycyzm wobec wizji","Nie. ePAY jest planowany na 09.01.2027, wejście na giełdę to zamiar. Nie sprzedaję ci niczego, czego jeszcze nie ma – rozmawiamy o tym, co działa dziś.","wiarygodność"],["„Ile zarabiają wasi top ludzie?“","chce dowodu","Prawdziwe dowody wypłat pokażę ci w rozmowie – za zgodą tej osoby, bez zrzutów ekranu z grup. Ważniejsze pytanie i tak brzmi: co wychodzi z twoimi liczbami?","własny rachunek"],["„Kto jeszcze w tym jest?“","dowód społeczny","Nazwiska podaję tylko za zgodą – tak samo jak nie przekazuję twojego. W kręgu założycieli poznasz pozostałych.","poufność jako wartość"],["„Co dostanę, czego inni nie dostają?“","specjalny deal","Żadnego specjalnego planu – plan obowiązuje wszystkich, inaczej nie byłby nic wart. Co dostajesz: mój osobisty czas, bezpośrednią linię do zarządu i miejsce w kręgu założycieli.","uczciwość jako siła"],["„Muszę to omówić z moim partnerem.“","zabezpieczenie","Bardzo dobrze. Przejdziemy przez to we trójkę? Wtedy twój partner ma te same informacje z pierwszej ręki.","włączyć współdecydującego"],["„Odezwij się za trzy miesiące.“","nie teraz – albo wymówka","Zrobię to. Jeszcze jedno pytanie, żebym wiedział, na co zwracać uwagę: co musiałoby się zmienić w ciągu trzech miesięcy, żeby to do ciebie pasowało?","poznać prawdziwy powód"],["„Czy to nie jest piramida finansowa?“","pytanie o powagę","Uzasadnione pytanie – zadawaj je każdej sprzedaży. Moje kryterium: za każdym euro musi stać prawdziwa wartość – sprzedawca, klient, usługa. Sprawdźmy dokładnie to na prawdziwym przypadku i w umowie, chętnie także z twoim prawnikiem.","sprawdzenie zamiast zapewnień"],["„Dlaczego miałbym ci ufać?“","pytanie zasadnicze","Jeszcze nie powinieneś. Zaufanie powstaje przez dowód – dlatego robimy pilotaż zamiast wielkiej decyzji.","pilotaż"]],"task":"Przeczytaj dwanaście obiekcji na głos i przećwicz trzy, które twój następny król najprawdopodobniej zgłosi."},
 kabschl:{"lead":"Pilność tak. Wymyślony niedobór nigdy. Królowie latami sami pracowali presją – rozpoznają ją po dwóch zdaniach. Zdemaskowany trik nie kosztuje jednego króla, tylko całe jego otoczenie.","fomoT":"Prawdziwy niedobór: cztery zasady FOMO","fomo":[["Wasza przepustowość","„Do Frankfurtu osobiście towarzyszę maksymalnie pięciu szefom sprzedaży.“","Odwraca status: teraz to on kwalifikuje się u ciebie.","zasada ustalona i przestrzegana"],["Moment","„Kto przed planowanym startem ePAY ma strukturę, startuje z zespołem, a nie sam.“","Prawdziwa logika każdego startu rynku.","ePAY zawsze formułować jako „planowany“"],["Branża & region","„Pierwszy w twojej branży, kto zwiąże sprzedawców i klientów, ten ich ma.“","Logika konkurencji, którą zna z własnego biznesu.","żadnej ochrony terytorium, której nie ma w umowie"],["Scena","„Kto do 09.01. wystartuje w sposób możliwy do udowodnienia, stanie we Frankfurcie z przodu jako członek założyciel.“","Status działa na królów silniej niż pieniądze.","potwierdzone przez organizatora"]],"okT":"Dozwolone i tabu","okCols":["Dozwolone","Tabu"],"ok":[["„Biorę tylko pięciu, bo każdemu osobiście towarzyszę.“","„Zostały tylko trzy miejsca!“ – jeśli to nieprawda"],["„Pilotaż trwa do [data]. Potem decyduję, z kim buduję w 2027.“","terminy, które potem po cichu się przedłuża"],["„Policzmy na twoich liczbach.“","„Możesz tu zarabiać 10.000 € miesięcznie.“"],["„ePAY jest planowany na 09.01.2027.“","„ePAY jest gotowy“ albo „gwarantowany“"],["„Kto pierwszy przyjdzie, pierwszy buduje relacje.“","„ekskluzywny teren“ bez umowy"],["status, scena, rola, osobiste wsparcie","akcje, wejście na giełdę lub opcje jako przynęta"]],"uwg":"Fałszywy niedobór to według UWG (niemiecka ustawa o zwalczaniu nieuczciwej konkurencji) klasyczny przypadek wprowadzania w błąd – oprócz szkody dla zaufania.","closeT":"Zamknięcia królewskie","close":[["9.1","Zamknięcie take-away","Rozmowa · ty","Nie chcę cię dziś przekonywać. Do Frankfurtu osobiście towarzyszę maksymalnie pięciu szefom sprzedaży i biorę tylko tych, u których pilotaż pokaże, że to pasuje obu stronom. Jeśli chcesz, sprawdzimy to w 14 dni z pięcioma twoimi ludźmi. Jeśli nie, zupełnie w porządku – wtedy zostajemy w kontakcie.","Gotowość do odejścia jest u królów najsilniejszą siłą przyciągania. Warunek: obowiązuje zasada przepustowości."],["9.2","Zamknięcie pilotażem dla otwieraczy drzwi","Rozmowa · Pan/Pani","Nie proponuję Panu umowy ramowej, tylko pilotaż z trzema do pięciu firm przez 14 dni. Potem na podstawie liczb zdecyduje Pan, czy poleci to swoim [członkom]. Czy pasuje Panu start [data]?",""]],"gkT":"Krąg założycieli Frankfurt","gkLead":"Ani event, ani prezentacja: zamknięta sesja robocza, w której każdy król liczy na własnych liczbach i na końcu sam decyduje.","gkFacts":[["max. 8","szefów sprzedaży na sesję"],["90 min","sesja robocza, bez show"],["1 : 1","zaproszeni osobiście"],["ZARZ","zarząd przy stole"]],"gkCritT":"Kryteria udziału – wszystkie muszą być spełnione","gkCrit":["punkty ≥ 8 po rozmowie otwierającej oczy","własna organizacja z dostępem do decydentów","sytuacja umowna sprawdzona i wolna","gotowość do 14-dniowego pilotażu z co najmniej pięcioma osobami"],"gkFlowT":"Przebieg · 90 minut","gkCols":["Minuta","Co się dzieje"],"gkFlow":[["0–10","Powitanie przez zarząd. Zasady: poufnie, bez prezentacji, każde pytanie dozwolone."],["10–25","Przypadek dowodowy na żywo: sprzedawca, klient, zakup, przypisanie, wypłata."],["25–55","Sesja robocza: każdy liczy na własnych liczbach – jako scenariusz, z obowiązującym planem."],["55–75","Otwarte pytania do zarządu. Nic nie jest tabu."],["75–90","Decyzja: zgoda na pilotaż albo uprzejme nie. Potem krótkie rozmowy indywidualne."]],"gkChain":["Krąg założycieli","Pilotaż 14 dni","Przegląd","Rollout albo stop","Scena 09.01."],"gkCond":"Scenę we Frankfurcie zapowiadaj tylko wtedy, gdy organizator ją potwierdził.","invT":"Zaproszenia","inv":[["10.1","Zaproszenie do kręgu założycieli","WhatsApp · ty","[Imię], po naszej rozmowie chcę cię osobiście zaprosić do małego grona: maksymalnie ośmiu szefów sprzedaży, 90 minut, z naszym zarządem. Bez prezentacji, tylko sesja robocza – każdy liczy na własnych liczbach, każde pytanie jest dozwolone. Na końcu każdy sam decyduje, czy startuje z 14-dniowym pilotażem. [Data], [miejsce]. Wchodzisz w to?",""],["10.2","Zaproszenie do kręgu założycieli","E-mail · Pan/Pani","Temat: Osobiste zaproszenie – krąg założycieli [data]\n\nSzanowny Panie / Szanowna Pani [forma grzecznościowa i nazwisko],\n\npo naszej rozmowie chciałbym osobiście zaprosić Pana/Panią do małej sesji roboczej: maksymalnie ośmiu przedsiębiorców i osób odpowiedzialnych za sprzedaż, 90 minut, wspólnie z naszym zarządem.\n\nNie będzie prezentacji. Każdy uczestnik liczy na własnych liczbach, każde pytanie jest dozwolone. Na końcu każdy sam decyduje, czy rozpoczyna 14-dniowy pilotaż.\n\nTermin: [data, godzina] · Miejsce: [miejsce]\n\nByłoby mi miło gościć Pana/Panią.\n\nZ wyrazami szacunku\n[Imię]",""],["10.3","Umowa pilotażowa po zgodzie","WhatsApp · ty","Jak ustaliliśmy, [data] startujemy z 14-dniowym pilotażem z tobą i [imiona pięciu starterów]. Mierzymy trzy rzeczy: starty, pierwsze rozmowy ze sprzedawcami i zaksięgowane CP. Przegląd [data]. Potem decydujesz: rollout albo stop. Cieszę się na to.",""]],"task":"Zapisz swoją zasadę przepustowości na piśmie – i używaj tylko niedoborów, których spełnienie warunku da się udowodnić."},
 kkodex:{"lead":"Królowie po jednym jedynym słowie słyszą, czy jesteś sprzedawcą. Twoje słownictwo to twój pierwszy dowód.","swapT":"Kodeks językowy","swapCols":["Zamiast","Powiedz"],"swap":[["wyjątkowa okazja","model, który właśnie sprawdzamy z nielicznymi"],["dochód pasywny","stały poziom przychodu zależny od rzeczywistego użytkowania"],["wolność finansowa","drugie źródło utrzymania"],["Wchodź teraz!","Sprawdźmy, czy to pasuje."],["okazja biznesowa","dodatkowy poziom przychodu dla twojej organizacji"],["budować downline","wzmocnić twoją istniejącą organizację"],["Nie mamy konkurencji.","Pokażę ci prawdziwy przypadek – oceń sam."],["Chcę ci coś przedstawić.","Chcę zrozumieć, jak jesteś ustawiony."],["Obejrzyj ten film.","20 minut, lider do lidera."],["gwarantowane, pewne","zmierzone, potwierdzone w pilotażu"],["Musisz być szybki.","Osobiście towarzyszę tylko nielicznym."],["giełda, akcje, opcje jako przynęta","nie używać"]],"goodT":"Słowa królewskie","good":["struktura","stan posiadania","dźwignia","pilotaż","dowód","sprawdzać","decydent","poziom przychodu","równorzędność","dziedzictwo","dodatek zamiast zmiany"],"badT":"Słowa tabu","bad":["szansa życia","stać się bogatym","gwarantowane","natychmiast","tylko dziś","ekskluzywnie (bez umowy)","pasywnie","auto marzeń","lifestyle"],"rulesT":"Bariery ochronne · osiem zasad, niepodlegających negocjacji","rules":[["Żadnych obietnic dochodu, zwrotu ani akcji.","Liczby tylko z obowiązującego planu, zawsze oznaczone jako scenariusz."],["Żadnego wymyślonego niedoboru.","Żadnych terminów, które potem się przedłuża."],["Żadnego podbierania przez chronione listy zespołów innych firm.","Sytuacja umowna króla jest sprawdzana przed startem."],["Pierwszy kontakt tylko przez istniejącą relację, polecenie lub kanał biznesowy.","Żadnych masowych wiadomości (UWG, RODO)."],["ePAY, giełda i opcje tylko jako plan lub zamiar.","Nigdy jako przynęta."],["Żadnych specjalnych planów dla pojedynczych królów.","Plan obowiązuje wszystkich."],["Żadnych nazwisk innych liderów ani dowodów wypłat bez ich zgody.",""],["Żadnego źle mówienia o innych firmach","– nawet jeśli król sam to robi."]],"legal":"<b>To nie porada prawna:</b> dokumenty, sformułowania i prezentacje wynagrodzeń przed użyciem daj do sprawdzenia prawnikowi.","cheatT":"Ściągawka · przeczytaj raz przed każdą rozmową królewską","cheat":[["Postawa","Wybierać, nie werbować. On sprawdza firmę – ty sprawdzasz jego. Udział w mówieniu poniżej 30 procent."],["Pierwszy kontakt","okazja · ciekawość · bez marki · pięć zdań · 20 minut · furtka."],["Trzy pytania","1. Ilu twoich ludzi znacząco zarabia? 2. Co pozostali mimo to robią co miesiąc? 3. Kto dziś zarabia na tej konsumpcji?"],["Cztery prawdziwe niedobory","wasza przepustowość · moment przed planowanym startem ePAY · branża & region · scena 09.01."],["Zamknięcie","„Nie chcę cię dziś przekonywać. … Jeśli chcesz, sprawdzimy to w 14 dni z pięcioma twoimi ludźmi. Jeśli nie, zupełnie w porządku.“"],["Zasady wyjścia","punkty poniżej 8 → nie odzywaj się · 2 follow-upy → odłóż · brak własnej dźwigni → nic nie dorzucaj · brak zgody w 7 dni → styczeń."],["Nigdy","obiecywać dochodu · wymyślać niedoboru · liczby na czacie · źle mówić o innych firmach · podbierać przez listy zespołów · sprzedawać ePAY lub giełdę jako gotowe."]],"footer":["Szacunek dla jego ryzyka","Dowód przed wizją","Wybór zamiast werbowania"],"task":"Przeczytaj ściągawkę przed każdą rozmową królewską. Wykreśl słowa tabu ze swoich szablonów."}

scripts:{"warm":[["K1 · Przyjaciele & rodzina · porada oszczędnościowa","Hej [Imię], szybka porada, jak zaoszczędzić: od niedawna używam ePOINT, darmowej aplikacji, dzięki której dostajesz zwrot pieniędzy przy zwykłych zakupach – także w [sklep, z którego korzysta ta osoba]. [Tylko jeśli to prawda: w zeszłym tygodniu dostałem już zwrot …] Wysłać ci link? Zajmie to dwie minuty.","Najpierw dawaj, własne doświadczenie, malutki krok."],["K2 · Znajomi & współpracownicy · z okazją","Cześć [Imię], ostatnio mówiłeś mi, że [prawdziwa okazja: wszystko drożeje / dużo zamawiacie online]. Sam używam aplikacji, która w tym pomaga: ePOINT – za darmo, od 3 do 30 % zwrotu w uczestniczących sklepach i sklepach internetowych. Chcesz zobaczyć?","Nawiązujesz do tego, co ta osoba sama powiedziała."],["P1 · Przyjaciel / ciepły kontakt · wybierać zamiast namawiać","Cześć [Imię], rozpocząłem dodatkowy biznes wokół aplikacji cashback i od razu pomyślałem o tobie, bo [prawdziwy powód]. Nie wiem, czy to coś dla ciebie – sprawdźmy to w 15 minut. Jeśli nie, to zupełnie w porządku. Pasuje ci bardziej czwartek czy sobota?","Trafność, postawa wyboru, furtka, pytanie alternatywne."],["P2 · Wiadomość głosowa · max. 40 sekund","Hej [Imię], właśnie o tobie pomyślałem, bo [prawdziwy powód]. Dodatkowo zbudowałem z Best Prime coś wokół aplikacji cashback ePOINT. Chętnie pokażę ci to w 15 minut – po prostu napisz, kiedy ci pasuje.","Twój głos tworzy bliskość, której nie daje tekst."],["P3 · Stary kontakt · najpierw relacja, potem temat","Hej [Imię], dawno się nie słyszeliśmy – co u ciebie i [prawdziwe nawiązanie]? Odzywam się też dlatego, że zawodowo buduję coś nowego i przyszedłeś mi na myśl. Ale najpierw opowiedz, co u ciebie nowego!","Szczere zainteresowanie na początku otwiera rozmowę."],["P3b · Stary kontakt · po jego odpowiedzi","Super! Co do mojego tematu: jestem partnerem w Best Prime i pomagam budować sprzedaż aplikacji cashback ePOINT. Chcesz rzucić na to okiem przez 15 minut?","Jasno powiedzieć, o co chodzi – i poprosić o mały krok."],["P4 · Reakcja na story lub post","Hej [Imię], widziałem, że [story lub post]. Świetnie! Mogę cię o coś zapytać: czy jesteś w zasadzie otwarty na drugie źródło dochodu, jeśli pasuje do twojej codzienności?","Szczery komplement i pytanie o zgodę zamiast pitchu."],["P5 · Polecenie","Cześć [Imię], [polecający] polecił mi się do ciebie odezwać, bo [powód]. Chodzi o ePOINT i działalność sprzedażową w Best Prime. Masz w tym tygodniu 15 minut?","Pożyczone zaufanie – zawsze najpierw wymień polecającego."]],"cold":[["V1 · Handlowiec · jak równy z równym","Cześć [Imię], masz dostęp do ludzi i firm – właśnie dlatego się odzywam. Z Best Prime buduję obszar sprzedaży wokół aplikacji cashback ePOINT. Nie chodzi o to, żebyś zastąpił swoją pracę, tylko żebyś dołożył swoim kontaktom kolejną dźwignię. 15 minut w przyszłym tygodniu?","Ton równego z równym, jasna korzyść dla jego istniejącego biznesu."],["V2 · Szef sprzedaży · na poziomie struktury","Cześć [Imię], dla ciebie robi się to ciekawe nie na poziomie pojedynczych zamknięć, ale na poziomie twojej struktury. Chciałbym razem z tobą sprawdzić, czy ePOINT pasuje jako dodatkowe źródło dochodu dla twoich partnerów – w otwarty sposób o korzyściach dla klientów, nakładzie pracy i wynagrodzeniu. Masz w przyszłym tygodniu 20 minut?","Zwraca się do roli, nie do pojedynczej sprzedaży. Dla prawdziwych królów: użyj Klasy Królewskiej."],["M1 · Stowarzyszenie lub społeczność (Pan/Pani)","Dzień dobry [Imię], prowadzi Pan/Pani [stowarzyszenie lub społeczność] z wieloma członkami. Mam propozycję, która daje Pana/Pani członkom realną korzyść, a Pana/Panią nic nie kosztuje: aplikację cashback, dzięki której przy zwykłych zakupach otrzymuje się zwrot pieniędzy. Czy mogę w 10 minut pokazać, jak mogłoby to wyglądać – na początek jako mały pilotaż?","Wartość dodana dla jego ludzi, bez ryzyka, mały pilotaż."],["M2 · Przedsiębiorca, na zimno (Pan/Pani · osobiście, LinkedIn, Xing)","Dzień dobry [Imię], trafiłem na Pana/Panią przez [konkretne nawiązanie]. Jestem partnerem w Best Prime i z aplikacją cashback ePOINT buduję sieć przedsiębiorców, którzy chcą zaoferować swoim kontaktom realną wartość dodaną. Nie wiem, czy to pasuje do Pana/Pani – chętnie sprawdzę to razem w 10 minut. Czy w przyszłym tygodniu byłaby możliwa krótka rozmowa?","Konkretne nawiązanie, postawa wyboru, niski próg wejścia."],["H1 · Sprzedawca, na zimno (Pan/Pani)","Dzień dobry [Imię], odzywam się bardzo celowo. Z ePOINT budujemy obecnie ekosystem sprzedawców i klientów i szukamy firm z istotnym ruchem klientów. Nie chcę niczego tłumaczyć przez telefon – chciałbym tylko w 10 minut sprawdzić, czy to w ogóle ma sens dla Pana/Pani firmy.","Szacunek dla jego czasu, sprawdzać zamiast sprzedawać."],["H2 · Sprzedawca, na ciepło","Masz klientów, którzy regularnie u ciebie kupują. Właśnie dlatego ePOINT jest ciekawy: twoi klienci dostają u ciebie cashback i wracają – a ty stajesz się częścią większej sieci sprzedawców. Mogę w 10 minut pokazać ci, jak to wygląda w sklepie?","Najpierw jego korzyść: powrót jego klientów."],["T1 · Początek rozmowy telefonicznej","Cześć [Imię], masz dwie minuty? … Dzwonię, bo zacząłem coś nowego i od razu o tobie pomyślałem. Nie chcę ci tego tłumaczyć w biegu – przy ekranie w 15 minut pójdzie to dużo lepiej. Pasuje ci jutro wieczorem czy raczej w weekend?","Krótko, osobiście, spotkanie zamiast wyjaśnień."]],"fu":[["Po 2 dniach bez odpowiedzi","Cześć [Imię], krótko się przypominam, gdyby moja wiadomość utonęła: masz w tym tygodniu 15 minut?","Delikatnie przypomnieć, bez presji."],["Po 5 dniach bez odpowiedzi","Cześć [Imię], odzywam się raz, porządnie: czy to cię w zasadzie interesuje, mamy wrócić do tego później, czy to nie dla ciebie? Każda z trzech odpowiedzi jest w porządku.","Decyzja z furtką."],["Po dobrej pierwszej rozmowie","Dzięki za rozmowę! Dla ciebie najważniejsze były [punkt 1] i [punkt 2]. Następny krok: [konkretne działanie]. Pasuje ci [dzień, godzina]?","Zapisać to, co ustalone."],["Nadal niepewny","Co to za jedna rzecz, która cię teraz powstrzymuje przed następnym krokiem? Wyjaśnijmy właśnie ją, zamiast przechodzić wszystko od nowa.","Poznać prawdziwy powód."],["W ustalonym „później”","Cześć [Imię], mówiłeś, żebym odezwał się [moment]. Pasuje ci teraz bardziej?","Dotrzymać słowa."],["Po jasnym nie","Dzięki za jasną odpowiedź. Nie będę się już z tym odzywać. A jeśli kiedyś zechcesz aplikację jako klient, daj znać. Wszystkiego dobrego!","Zachować relację – bez biznesowego follow-upu."]]},

 start:{"sprint":"72 saatlik sprintin","started":"başlangıç: {d}","expired":"sona erdi","tl":["0–15 dk profil + sistem","15–30 potansiyel","30–45 iletişim","72 sa görüşme"],"quote":["Başlamadan önce her şeyi bilmek zorunda değilsin.","Bir sonraki mantıklı adımı güvenle atacak kadar anlaman yeterli."],"task":"Modülleri sırayla tamamla. Hiçbir görevi atlama. Aktivitesiz bilgi tamamlanmış bir başlangıç sayılmaz. Menüdeki altın daire kriterin karşılandığı anlamına gelir – o zaman modülü tamamlandı olarak işaretle.","lead":"Bu Akademi okunacak bir kitap değil. Senin çalışma planın ve onboarding çantan: rehberler, şablonlar ve hesaplayıcılar – ve her aşama somut bir eylemle biter. Girdiğin her şey otomatik olarak kaydedilir.","cards":["Sistemi 60 saniyede açıklamak, ePOINT’i bizzat kullanmak, kazanç planını ve her temasın arkasındaki tutumu anlamak.","100 potansiyel kişilik bir liste oluşturmak, TOP 10’u önceliklendirmek ve ağ kaldıraçlarını tanımak.","Doğru şablonu seçmek, kişileri aktive etmek, görüşmeler yapmak ve itirazlara dürüstçe cevap vermek.","Aynı basit başlangıç sürecini bir sonraki partnerle tekrarlamak.","Liderler için: network liderleri, satış liderleri ve kapı açıcılar için mesajlar, görüşmeler ve strateji."],"rulesT":"Tüm FastTrack için üç kural","rules":[["Teoriden önce aktivite","Sadece bir sonraki adım için gerekeni oku. Sonra harekete geç."],["Asla tek başına başlamazsın","Sponsorun 24 saat içinde seninle başlangıç görüşmesini yapar ve ilk mesajı seninle birlikte gönderir."],["Yazmadıysan olmamıştır","Hafıza CRM değildir. Her şey uygulamaya girer."]]},

 system:{"lead":"Sistemi basitçe açıklayamayan onu temiz şekilde aktaramaz. Bu yüzden bu aşama zorunludur.","flow":["Satış ortağı","İşletme","Müşteriler","Kullanım","Tekrar ziyaret"],"tr":"60 saniye antrenörü","trHint":"Zamanlayıcıyı başlat ve tüm sistemi okumadan sesli anlat. Bitince durdur. Hedef: 60 saniyenin altında en az 3 temiz tekrar.","start":"Başlat","stop":"Durdur","reset":"Sıfırla","reps":"geçerli tekrar (≤ 60 sn)","best":"en iyi süre","ready":"lider kontrolüne hazır","short":"Çok kısa – tüm sistemi anlat","valid":"{s} sn – geçerli tekrar","long":"{s} sn – çok uzun, bir kez daha kısalt","sys":[["ePOINT","Canlı · Satıcılar & müşteriler","Ücretsiz cashback uygulaması: yakındaki partner satıcılardan veya 1.000’den fazla online mağazadan alışveriş yapan %3 ile %30 arası geri alır ve bakiyesini hesabına çektirebilir."],["Best Prime","Aktif · Satış & büyüme","ePOINT’i müşteriler, satıcılar ve yeni partnerler arasında tanıtan satış organizasyonu ve topluluk. Eğitim, araçlar ve sponsorunu burada alırsın."],["ePAY","Planlandı · Ödeme & kullanım","09.01.2027 için planlanan ödeme ve işlem katmanı. Henüz aktif olmayan hiçbir şeyi vaat etme."]],"ben":[["Müşteri için",["zaten yaptığı alışverişlerden para iadesi","ücretsiz, abonelik yok","yakında ve online tek uygulamada"]],["Satıcı için",["müşteri sadakati ve geri dönüş","daha büyük bir satıcı ağının parçası","dijital müşteri ilişkisi"]],["Partner için",["kapanış başına tek seferlik komisyon","aktif müşterilerin kullanımından sürekli kazanç","organizasyon kurmak ve çoğaltmak"]]],"coreL":"60 saniyelik açıklaman","core":"“ePOINT’i biliyor musun? Ücretsiz bir cashback uygulaması. Tamamen normal alışveriş yapıyorsun – yakındaki mağazalarda veya 1.000’den fazla online mağazada – ve yüzde 3 ile 30 arasını doğrudan hesabına geri alıyorsun. Ben bunun arkasındaki satış organizasyonu Best Prime’da partnerim. İnsanlara uygulamayı gösteriyorum, satıcı kazanıyorum ve ekip kuruyorum. Bunun için resmi plana göre kazanıyorum: kapanışlar için tek seferlik ve müşterilerimin kullanımından sürekli. ePAY ile bir ödeme çözümü de planlanıyor. Uygulamayı hızlıca göstereyim mi?”","coreWhy":"Bir soruyla başlar, önce dinleyenin faydasını açıklar, senin ne kazandığını açıkça söyler ve küçük bir sonraki adımla biter.","appT":"Önce kendin kullan – 1. gün görevin","appLead":"Bir kez kendisi para iadesi almış olan, artık senaryoya ihtiyaç duymaz. Deneyim açıklamayı yener.","app":["ePOINT uygulaması kuruldu ve kaydolundu","Yakında üç partner satıcı bulundu","Para iadeli ilk alışveriş yapıldı"],"task":"ePOINT uygulamasını kur ve kendin kullan. Sonra tüm sistemi okumadan en fazla 60 saniyede açıkla – net, sakin ve jargonsuz olana kadar."},
 check:{"lead":"Ürün bilgisi ancak karşı tarafa basit bir dille ulaştığında değerlidir. Notlara bakmadan cevapla.","right":"Doğru.","wrong":"Tam değil – sisteme bir kez daha bak.","selfRight":"Harika – o zaman lider kontrolüne geç.","selfWrong":"O zaman “60 saniyede sistem” modülünü bir kez daha gözden geçir.","qrule":"<b>Kalite kuralı:</b> Fiyatlar, kazançlar, ürün özellikleri ve pazar verileri yalnızca güncel resmi Best Prime belgelerinden veya back office'ten kullanılır. Eski ekran görüntüleri ya da uydurma rakamlar yok.","unlock":"Kilit açma","unlockHint":"Liderin 60 saniyelik anlatımını onayladıktan sonra potansiyel çalışmasına geçersin.","leaderOk":"Liderim{l} 60 saniyelik anlatımımı onayladı","unlocked":"2. aşama için kilit açıldı","locked":"Henüz kilit açılmadı","kcT":"Hızlı kontrol: serbestçe cevapla","kcHint":"Her soruyu yüksek sesle cevapla. Sonra örnek cevapla karşılaştır ve bildiklerini işaretle.","kcShow":"Örnek cevap","kcCan":"Serbestçe cevaplayabiliyorum","kc":[["Müşteri ePOINT’ten ne alır ve bu ona ne kadara mal olur?","Yakındaki katılımcı satıcılarda ve 1.000’den fazla online mağazada %3 ile %30 arası para iadesi, hesaba çekilebilir. Uygulama ücretsiz, abonelik yok."],["Best Prime nedir?","ePOINT’i müşteriler, satıcılar ve yeni partnerler arasında tanıtan satış organizasyonu. Eğitim, araçlar ve sponsorunu burada alırsın."],["ePAY nedir ve ne zamandan itibaren kullanılabilir?","09.01.2027 için planlanan bir ödeme çözümü – bugün henüz kullanılamıyor."],["Ne için kazanç alırsın – ne için almazsın?","Resmi plana göre: kapanışlar (yeni partnerlerin paketleri) için tek seferlik ve aktif müşterilerin kullanımından sürekli. Mesajlar, görüşmeler veya sadece kayıtlar için değil."],["Yeni bir kişiyle ilk adımın ne?","Müşteri, partner veya çarpan olarak mı uyduğunu belirlemek – ve kişisel bir mesajla küçük bir sonraki adım istemek."]]},

 cold:{"lead":"Profesyonellerin, girişimcilerin ve satıcıların hileye ihtiyacı yok. İlgililiğe, zamanlarına saygıya, eşit düzeyde bir konuşmaya ve bir sonraki adım için düşük bir eşiğe ihtiyaçları var.","rulesT":"Profesyoneller ve girişimciler için kurallar","rules":["Somut, doğrulanabilir bir vesile – kopyala-yapıştır yok.","En fazla beş cümle, rakam yok, PDF yok, link yok.","Küçük bir sonraki adım: 10 ila 20 dakika, iki randevu önerisi.","İletişim sadece yüz yüze, tavsiye yoluyla veya LinkedIn ve Xing gibi iş kanallarından. Toplu e-posta yok, istenmeyen reklam araması yok."],"kingT":"Gerçek satış liderleri mi? Kraliyet Sınıfı’nı kullan.","king":"Network liderleri, yapısal ve saha satış liderleri ve kapı açıcılar için kendi kuralları geçerlidir: dosya, puan, tip, kendi mesajları ve görüşme dramaturjisi.","kingBtn":"Kraliyet Sınıfı’na","task":"2 satış kişisi + 2 girişimci veya satıcı seç. Kişi başına araştırma en fazla 5 dakika. Sonra ulaş."},
 pipe:{"lead":"Görüşmeler açık kaldığında satış hız kaybeder. Her kişinin bir durumu ve tarihli bir sonraki adımı olmalı.","steps":[["1 · İlk temas","İlgiyi kontrol et, kısa bir randevu al. Sohbette her şeyi anlatma."],["2 · Randevu","Anlatmadan önce sor: kaynaklar, müşteriler, ekipler, işletme erişimi."],["3 · Takip","Asla “bana haber ver” deme. Her zaman tarih veya karar belirle."],["4 · Kayıt","Hafıza bir CRM değildir. Hemen kaydet."]],"empty":"TOP kişilerin ve iletişime geçtiğin herkes burada görünür.","cols":["Kişi","Durum","Sonraki adım","Tarih","Yanıt verdi"],"nextPh":"örn. 15 dk randevu","task":"Her aktif kişiye net bir durum ver: YENİ · RANDEVU · TAKİP · KARAR · BAŞLADI. Kırmızı tarihler gecikmiştir.","rhythmT":"Takip için iki kural","rhythm":["Her açık kişinin bir sonraki adım için tarihi vardır.","Cevapsız iki takipten sonra: ara. Net bir hayırdan sonra: iş takibi yok."]},
 talk:{"pL":"Ortak / ağ","mL":"İşletme / şirket","qT":"5 temel soru","mq":["Yaklaşık kaç müşteriniz var?","Düzenli müşteri oranı ne kadar?","Bugün müşteri bağlılığını nasıl sağlıyorsunuz?","Müşteri kazanmak size ne kadara mal oluyor?","Başka hangi şubeler / ağlar var?"],"flow":["1. Anlamak","2. Konumlandırmak","3. Uygun şekilde açıklamak","4. Sonraki adım"],"quote":["Önce ihtiyacı anla. Sonra faydayı açıkla.","İhtiyaç analizinden önce ne kadar çok konuşursan, asıl kaldıracı ıskalama riskin o kadar artar."],"prot":"Görüşme kaydı","f":["Kişi / şirket","En büyük kaldıraç","En büyük açık soru","Sonraki adım + tarih"],"save":"Görüşmeyi kaydet","saved":"Görüşme kaydedildi","cols":["Tarih","Kişi","Kaldıraç","Açık soru","Sonraki adım"],"del":"Sil","lead":"İyi bir görüşme konferans değil, teşhistir. 20 ila 30 dakika – ve sonunda her zaman net bir sonraki adım vardır, “ilgi yok” olsa bile.","phT":"Akış","ph":[["Çerçeveyi kur","2 dk","“Denk gelmesine sevindim. Önerim şu: önce sana birkaç soru sorayım, sonra neyle ilgili olduğunu göstereyim ve sonunda bana dürüstçe sana uyup uymadığını söyle. Olur mu?”"],["Sorular","5–8 dk","Motivasyon, zaman, olanaklar – anahtar sorular aşağıda. Dinle, not al."],["Göster","5 dk","“Kendim nasıl kullandığımı hızlıca gösterebilir miyim?” – canlı uygulama ve senin hikâyen."],["Yerleştir","5 dk","“Anlattıklarına göre sana en çok … uyuyor, çünkü …” – müşteri, partner, satıcı veya çarpan."],["Karar ver","3 dk","Aşağıdaki kapanış sorularından biri – ve tarihli randevu."]],"phNote":"Çerçeve neden bu kadar önemli: başta hayırın serbest olduğunu duyan, sonra içinden savunmaya geçmek yerine rahatça dinler.","pq":["Böyle bir şeyin sana değmesi için ne olması gerekir?","Haftada gerçekçi olarak ne kadar zaman ayırabilirsin?","Düzenli olarak kaç kişiyle temastasın – ve tek başına mı yoksa ekip halinde mi çalışmayı tercih edersin?","Hangi sektörleri / bölgeleri açabilirsin?","Kendin mi üretmeyi tercih edersin, yoksa organizasyon mu kurmayı?"],"storyT":"60 saniyede hikâyen","storyHint":"Sadece doğruyu anlat. Henüz bir sonucun yok mu? O zaman hikâyen tetikleyicindir.","story":["Önce – neredeydim?","Tetikleyici – beni ne meraklandırdı?","Şimdi – ne yapıyorum, kendim ne yaşadım?","Bunu sana neden gösteriyorum"],"storyCopy":"Hikâyeyi kopyala","storyEmpty":"Dört bölümü doldur – hikâyen burada oluşur.","closeT":"Kapanış soruları – açık ve dürüst","close":[["Ölçek","“1’den 10’a kadar bir ölçekte – bu seni ne kadar ilgilendiriyor?” 6’dan itibaren: “10 için neyin eksik?” 5’in altında: “O zaman işi bırakalım – uygulama müşteri olarak sana uyar mı?”"],["Odak","“Bunda en çok neyi beğeniyorsun?”"],["Yolu seç","“Önce müşteri olarak mı başlamak istersin, yoksa hemen partner olarak mı?”"],["Netleştir","“Karar verebilmen için neyin netleşmesi gerekir?”"],["Randevu","“O zaman başlangıç görüşmeni sponsorumla yapalım – salı 19:00 mı uyar, çarşamba 18:00 mi?”"]],"trioT":"Sponsorunla üçlü görüşme","trio":"İlk haftalarda sponsorun önemli görüşmelere katılır, sen dinleyerek öğrenirsin. Onu böyle tanıtırsın – sadece doğru bilgilerle:","edif":"“{s} bu işi [süre]dir yapıyor ve başlangıcımı çok kolaylaştırdı. Onu dahil ettim çünkü sorularını benden daha iyi cevaplayabilir.”","trioRole":"Senin rolün: tanıtmak, dinlemek, not almak. Sonra ikiniz neyin iyi gittiğini konuşursunuz.","task":"72 saat içinde gerçek bir ihtiyaç analiziyle en az bir nitelikli görüşme yap – en iyisi sponsorunla üçlü görüşme olarak."},
 sprint:{"lead":"Hız, öğrenme ve eylem doğrudan birbirine bağlandığında oluşur.","sc":"72 saatlik skor tablon","scHint":"Listen, pipeline'ın ve görüşmelerinden otomatik olarak hesaplanır.","k":["Potansiyel listesindeki isimler","Önceliklendirilen TOP kişiler","Kurulan temaslar","Yanıtlar / tepkiler","Nitelikli görüşmeler","Net sonraki adımlar"],"quote":["İlk 72 saat kariyerini belirlemez.","Ama çoğu zaman motivasyonun gerçek harekete dönüşüp dönüşmeyeceğini belirler."],"task":"Hiçbir ortak başlangıç sprintini sadece “Academy'ye baktım” ile bitirmez. Tamamlama = Academy + gerçek aktivite."},
