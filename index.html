 geld:{"lead":"Nagrađivanje nastaje na dva načina: jednokratno, kad novi partner kupi paket, i trajno iz korištenja aktivnih kupaca. Nijedno ne nastaje samo pisanjem poruka i nijedno nije zajamčeno.","blocks":[["Provizija za zaključak","jednokratno","Novi partner kupuje paket: Premium paket = 3 CP, vaučer = 1 CP."],["Airtime","trajno","Tvoji aktivni kupci koriste ePOINT. Korištenje koje se nagrađuje stvara CP."],["Razlika","po povodu","Partner u tvojoj liniji ima niži rang – dobivaš razliku između stopa, npr. Area Manager iznad Team Buildera: 3 CP × 2 € = 6 €."],["Tim","po povodu","Partneri na istoj razini: timski airtime u modelu 10 / 3 / 2 € po CP kroz tri generacije."]],"calcT":"Kalkulator","calcHint":"CP znači Commission Points. Iznos u eurima po CP različit je za zaključak i za airtime – nikad ih ne zbrajaj zajedno.","rank":"Tvoj rang","prem":"Premium paketi novih partnera","vou":"Vaučeri","cust":"Aktivni kupci","cp":"CP po kupcu (pretpostavka)","closure":"Provizija za zaključak · jednokratno","air":"Model airtimea · po obračunskom razdoblju","perCp":"€ po CP","cust2":"aktivnih kupaca","calcNote":"Modelni izračun prije poreza, bez prognoze i bez obećanja. 0,10 CP po kupcu je pretpostavka. Kvalifikaciju, stvarno korištenje, troškove i isplatu određuje službeni plan.","tableT":"Rangovi, kvalifikacija i stope","cols":["Rang","Kvalifikacija prema grafikonu","Zaključak € po CP","Airtime € po CP (model)"],"ranks":[["P","Partner","Back office"],["CB","Community Builder","Basic Pack ili 50 CP"],["TB","Team Builder","Premium Pack ili 100 CP"],["AM","Area Manager","250 CP"],["RD","Regional Director","500 CP"],["SD","Sales Director","2.500 CP"],["CM","Country Manager","5.000 CP"],["IBM","Innercircle Board Member","10.000 CP"]],"tableNote":"Od IBM-a model dodaje udio u svjetskom fondu: svjetski CP tvrtke × 10 €, podijeljeno s IBM-ovima koji imaju pravo. Izvor: Best Prime grafikon nagrađivanja i propis o provizijama, stanje 12.10.2026.; Premium paket = 3 CP od 15.09.2026. Prije svakog obećanja usporedi s aktualnom verzijom u back officeu.","talkT":"Kako govoriš o novcu","talkQ":"„Zarađuje se jednokratno na zaključcima i trajno na korištenju tvojih kupaca. Koliko, ovisi o tome što radiš. Pokazat ću ti službeni plan.“","talk":["Nikad ne navodi mjesečni iznos kao očekivanje.","Nikad ne govori „pasivni prihod“.","Primjere izračuna uvijek označi kao model.","Nikad ne kupuj ni ne daj kupiti pakete ili vaučere samo zbog ranga."],"openT":"Razjasniti prije svakog obećanja","open":["Troškovi Basic i Premium Packa, jednokratni i redoviti","Kada nastaje pravo i kada se isplaćuje","Što pravilo od 50 % odnosno 30 % znači za kvalifikaciju","Vrijede li timske stope za zaključak prema grafikonu (20 / 6 / 4 €) po CP ili po zaključku"],"openBtn":"Kopiraj pitanja za sponzora","openMsg":"Bok{l}, prije nego što ikome objasnim plan, želim biti siguran u četiri točke: 1) Koliko koštaju Basic i Premium Pack, jednokratno i redovito? 2) Kada nastaje pravo i kada se isplaćuje? 3) Što pravilo od 50 % odnosno 30 % znači za kvalifikaciju? 4) Vrijede li timske stope za zaključak od 20 / 6 / 4 € po CP ili po zaključku? Hvala!","task":"Izračunaj dva vlastita primjera: jedan zaključak na svom rangu i 10 aktivnih kupaca. Zatim u dvije rečenice objasni kako nastaje nagrađivanje."},
 haltung:{"lead":"Ljudi ne reagiraju na informacije, nego na stav s kojim dolaziš. Tko moli, bude otpravljen. Tko provjerava odgovara li, bude shvaćen ozbiljno.","core":"„Imam nešto dobro, tražim ljude kojima to odgovara – i imam vremena da ih pronađem.“","coreL":"Tvoj stav u jednoj rečenici","pT":"10 načela","whyL":"Zašto djeluje","howL":"Kako to koristiš","lineL":"Crvena linija","p":[["Birati umjesto uvjeravati","Pritisak izaziva otpor. Tko otvoreno provjerava, djeluje sigurno i pouzdano.","„Ne znam je li to za tebe – brzo provjerimo.“","Bez umjetne oskudice."],["Znatiželja prije informacije","Otvoreno pitanje u glavi traži odgovor. Tko sve objasni u chatu, poziva na sud bez razgovora.","U prvoj poruci samo tema, poveznica i mali sljedeći korak. Detalji u razgovoru.","Uvijek je jasno o čemu se radi. Ako netko izravno pita za tvrtku, navedeš je."],["Relevantnost pobjeđuje doseg","Ljudi reagiraju na ono što ih se tiče.","Svaka poruka ima pravu rečenicu „jer ti …“.","Bez izmišljenih povoda."],["Tko pita, vodi","Ljudi vjeruju onome što sami kažu. Pitanja čine potrebu vidljivom.","Prvo pitaj, onda pokaži. Govoriš manje od trećine vremena.","Bez sugestivnih pitanja koja dopuštaju samo da."],["Mali koraci prema da","Malo da je lakše od velikog – a tko pristane, češće i ostaje.","Uvijek traži samo sljedeći mali korak: 10 minuta, pogled na aplikaciju, sastanak.","Bez da iznuđenog iznenađenjem."],["Iskustvo pobjeđuje objašnjenje","Vlastito iskustvo uvjerava više od bilo kojeg slajda.","Pokaži aplikaciju uživo, pokaži vlastiti dokaz o povratu novca.","Bez tuđih ili uljepšanih rezultata."],["Prvo daj","Tko dobije poklon, otvoreniji je. Aplikacija je besplatna – iskren savjet.","Počni s koristi za kupca prije nego što govoriš o poslu.","Bez „poklona“ sa skrivenim uvjetom."],["U ravnini umjesto molbe","Tko se ispričava, čini se malim. Profesionalci u prodaji poštuju samo ton među jednakima.","Mirno, jasno, bez „Oprosti što smetam“.","Bez arogancije, nikad ne loše govoriti o drugim tvrtkama."],["Ne je informacija","Tko odbijanja shvaća osobno, odustaje. Tko ih broji, postaje bolji.","Zahvali, postavi status, sljedeći kontakt.","Nakon jasnog ne nema praćenja."],["Identitet i ritam","Ljudi djeluju prema slici koju imaju o sebi. Fiksni radni blokovi pobjeđuju motivaciju.","„Ja sam netko tko svaki dan napravi 3 kontakta.“ Označi svaki dan.",""]],"fearT":"Strah od prvog kontakta","fear":"Ima ga gotovo svatko. Ne nestaje čitanjem, nego s prvih deset poruka.","fearL":[["Počnite zajedno","Prvu poruku šalješ tijekom početnog poziva dok tvoj sponzor sluša."],["Počni s poklonom","Poziv u besplatnu aplikaciju lakši je od bilo kakvog poslovnog upita."],["Broji aktivnost, ne rezultate","Tvoj dnevni cilj je „3 poslane poruke“, a ne „3 pristanka“."]],"wordsT":"Reci to ovako","words":[["jedinstvena prilika","model koji upravo provjeravamo s nekolicinom"],["pasivni prihod","trajna razina prihoda koja ovisi o stvarnom korištenju"],["Uđi odmah!","Provjerimo odgovara li."],["Želim ti nešto predstaviti.","Želim razumjeti kako si postavljen."]],"task":"Pročitaj 10 načela jednom u cijelosti. Odaberi dva koja su ti najteža i u sljedećih pet poruka posebno pazi na njih."},
 einw:{"lead":"Prigovor nije ne, nego pitanje koje je još otvoreno. Tko ga shvati ozbiljno, osvaja povjerenje. Tko ga odbaci, gubi ga.","method":[["Priznati","„Razumijem.“"],["Pitati","„Što točno pod time misliš?“ – često se iza krije nešto drugo."],["Iskreno odgovoriti","Kratko, s činjenicama, bez obećanja."],["Nastaviti","„Je li ti to time razjašnjeno?“ – pa na sljedeći korak."]],"listT":"12 najčešćih prigovora","search":"Traži prigovor, npr. vrijeme, novac, piramida","none":"Nema odgovarajućeg prigovora. Pitaj svog sponzora – i upiši odgovor u nastavku.","behind":"Često se iza krije:","items":[["„Nemam vremena.“","strah od truda","Ti određuješ tempo. Koliko bi vremena realno imao tjedno? Onda iskreno pogledamo je li to dovoljno."],["„Ne znam prodavati.“","strah od odbijanja","Ne moraš. Pokazuješ besplatnu aplikaciju koju i sam koristiš – to je više preporučivanje nego prodaja. A na početku tvoj sponzor sudjeluje u razgovorima."],["„Ne poznajem nikoga.“","podcijenjena mreža","Prođimo zajedno 10 minuta kroz tvoj mobitel – onda ćemo vidjeti."],["„Je li to piramidalna shema?“","strah od prijevare","Dobro pitanje, trebaš ga postaviti. To je izravna prodaja sa stvarnim proizvodom: kupci koriste besplatnu aplikaciju i dobivaju povrat novca, trgovci zadržavaju svoje kupce. Nagrađuje se za zaključke i za korištenje stvarnih kupaca prema službenom planu. Pokazat ću ti dokumente, pa provjeri sam."],["„Je li to network marketing?“","zadrška prema branši","Da, prodajna strana je postavljena kao partnerska struktura – to ti radije odmah sam kažem. Ali zanimljiv je mehanizam iza toga: vjernost kupaca kroz stvarne kupnje kod trgovaca. Odgovara li ti to, provjerit ćemo za 15 minuta."],["„Koliko to košta?“","procjena rizika","Kao kupac ništa. Kao partner postoje početni paketi – točne cijene pokazat ću ti iz aktualnih službenih dokumenata, ne napamet."],["„Koliko ti zarađuješ?“","traži dokaz","Iskreno: [istinit odgovor, npr. „Tek sam na početku“]. Važno je kako plan funkcionira i što ti od toga napraviš – to ću ti pokazati."],["„Pošalji mi informacije.“","pristojno izbjegavanje ili pravi interes","Rado – ali tek kad znam koje su ti informacije relevantne. Što te više zanima: aplikacija kao kupcu ili posao? Nakon toga 10 minuta telefonski. Četvrtak ili petak?"],["„Moram razmisliti.“","otvoreno pitanje","Naravno. Da možeš dobro razmisliti: koja ti je točka još otvorena? (Zatim dogovorite termin za odgovor.)"],["„Moram razgovarati sa svojim partnerom.“","zajednička odluka","Odlično. Hoćemo li sljedeći razgovor obaviti u troje? Onda tvoj partner ima iste informacije iz prve ruke."],["„Aplikacija za povrat novca ima puno.“","usporedba","Točno. Samo je isprobaj, ne košta ništa: 3 do 30 % kod trgovaca koji sudjeluju u blizini i u više od 1.000 web-shopova, isplativo na račun."],["„Je li ePAY već dostupan?“","znatiželja za novim","Ne. ePAY je planiran za 09.01.2027. Ono što danas možeš koristiti je aplikacija ePOINT – pokazat ću ti je."]],"copyA":"Kopiraj odgovor","mineT":"Moja tri najteža prigovora","mineE":"Prigovor","mineA":"Moj odgovor","task":"Uvježbaj tri prigovora naglas – sa sponzorom ili partnerom – i upiši svoja tri najteža prigovora s odgovorom."},
 kgesetze:{"lead":"Poruke, razgovori i strategija za one najveće – network lidere, čelnike prodaje i otvarače vrata. Sve proizlazi iz ovih deset rečenica. Tko ih prekrši, gubi kralja – najčešće ne shvaćajući zašto.","motto":"Kraljeve se ne vrbuje.","motto2":"Njih se bira.","pillars":[["Poštovanje prema njegovom riziku","On može izgubiti više nego što može dobiti. Izgovori to prije nego što on na to pomisli."],["Dokaz prije vizije","Jedan stvarni slučaj pobjeđuje svaki slajd o budućnosti."],["Odabir umjesto vrbovanja","Ti provjeravaš odgovara li on – ne obrnuto."]],"lawsT":"10 kraljevskih zakona","laws":[["Biraj umjesto da vrbuješ.","Ti provjeravaš odgovara li on – ne obrnuto. Tko vrbuje, izgubio je prije nego što je progovorio."],["Tko više objašnjava, gubi status.","Pitanja umjesto slajdova. Tvoj udio u govoru u prvom razgovoru ispod je 30 posto."],["Dokaz prije vizije.","Stvarni trgovac, stvarna transakcija, stvarna isplata pobjeđuju svaki slajd o budućnosti. Vizija tek kad dokaz sjedne."],["Prvo njegov rizik.","Kralj može izgubiti ugled, tim i ugovor. Izgovori to prije nego što on na to pomisli."],["On računa, ne ti.","U ono što sam izračuna, vjeruje. U ono što mu ti izračunaš, sumnja."],["Marka tek u drugom kontaktu.","Bez imena tvrtke u prvom kontaktu – inače će guglati prije nego što postane znatiželjan. Ako izravno pita, navodiš je."],["Ravnopravnost pošiljatelja.","Kralj razgovara s kraljem ili s upravom. Nikad s trećim redom."],["Samo stvarna oskudica.","Vaš kapacitet, trenutak, njegova regija. Sve izmišljeno on prozre – i tada nestaje poštovanja."],["Jedan hitac, savršeno pripremljen.","Nema kralja bez dosjea. Nema razgovora bez plana bez proturječja."],["Znati otići.","Spremnost da prihvatiš ne kod kraljeva je najjača privlačna sila."]],"useT":"Kako koristiš Kraljevsku klasu","use":["Pročitaj kraljevske zakone, zrelost za prijestolje, tipove kraljeva i kraljevsku sekvencu jednom u cijelosti. Oni određuju kako se koristi sve ostalo.","Prije svakog kralja: izradi dosje, odredi tip, odaberi odgovarajuću poruku.","Polja u [uglatim zagradama] uvijek ispuni pojedinačno. Nijedna poruka ne odlazi neizmijenjena.","„Uvjet“ znači: rečenicu koristi samo ako je uvjet dokazivo ispunjen."],"task":"Pročitaj deset zakona naglas. Označi dva koja si dosad najčešće kršio."},
 kreife:{"lead":"Kralj ti daje jedan hitac. Ako nedostaje jedna od šest točaka, ne javljaš mu se – spaljeni kralj se ne vraća i o tome priča dalje.","checkT":"Zrelost za prijestolje: prije nego što se obratiš kralju","check":[["Plan nagrađivanja bez proturječja","Jedna aktualna izvorna verzija, jedna cijena po proizvodu, jedna matrica prava. Profesionalci čitaju planove kao revizori."],["Dokazni slučaj spreman za pokazati","Aktivni trgovac, transakcija s pripisivanjem u back officeu, dokaz o isplati – uz suglasnost osobe."],["Pravilo kapaciteta utvrđeno","Koliko kraljeva do 09.01.2027. osobno pratite? Preporuka: najviše pet. Pravilo tada stvarno i vrijedi."],["Uprava je potvrdila","Fiksni termini za kraljevske razgovore su blokirani."],["Dosje ispunjen, bodovi ≥ 8","Tip, motiv, pošiljatelj i povod su utvrđeni."],["Dopušten put kontakta","Postojeći odnos, preporuka ili poslovni kanal. Bez masovnih poruka."]],"dossT":"Tvoji kraljevski dosjei","dossHint":"Dosjei ostaju samo na ovom uređaju – nikad se ne prenose u controlling.","add":"Dodaj kralja","addPh":"Ime kralja","empty":"Još nema dosjea. Dodaj svog prvog kralja – ime je dovoljno za početak.","edit":"Uredi","close":"Zatvori","del":"Izbriši dosje","delSure":"Stvarno izbrisati?","fields":[["role","Ime & uloga","Pozicija, od kada, javna funkcija"],["org","Organizacija","Tvrtka, branša, regija"],["size","Veličina","Organizacija ili mreža – potvrđene i procijenjene vrijednosti odvojeno"],["bind","Vezanost","Trenutna tvrtka, vjerojatne klauzule o zabrani konkurencije i preuzimanja"],["frust","Signali frustracije","Što ga trenutno smeta: javne izjave, promjene, povlačenje"],["verb","Poveznica","Tko poznaje njega i vas? Zajednički kontakti kao otvarači vrata"],["sender","Pošiljatelj","Tko mu se obraća – i je li to ravnopravno?"],["anlass","Povod","Konkretan, dokaziv razlog da se javiš sada"]],"typeL":"Tip kralja","motiveL":"Motiv kralja","stageL":"Faza","scoreL":"Kraljevski bodovi","scoreDate":"Bodovi ažurirani","scoreT":"Kraljevski bodovi · po kriteriju 0–2 boda","scoreCols":["Kriterij","0","1","2"],"score":[["Mreža & pristup donositeljima odluka","jedva","regionalno","velik i izravan"],["Vodstvo","samostalac","mali tim","vodi rukovoditelje"],["Pouzdanost & tempo","nejasno","promjenjivo","drži obećanja"],["Vrijeme u sljedećih 30 dana","nema","malo","čvrsto planirano"],["Poduzetnička motivacija","traži sigurnost","otvoren","razmišlja u strukturama i riziku"]],"bands":[["8–10","A-kralj: javi se"],["5–7","produbi dosje"],["0–4","ne javljaj se"]],"scoreNote":"Ažuriraj bodove nakon svakog razgovora. Nikad ih ne izvodi iz broja pratitelja ili samoprocjena.","motT":"Četiri kraljevska motiva","motLead":"Novac je rijetko motiv – njega kraljevi imaju. Tko govori samo o novcu, promašuje kralja.","motCols":["Motiv","Prepoznaješ po","Rečenica koja pogađa"],"motives":[["Nasljeđe","govori o „nečemu trajnom“, nasljedniku, obitelji","Što ostaje od tvoje organizacije kad više ne vučeš svaki dan?",""],["Priznanje","pozornica, rangovi i nagrade su mu važni","Prvi koji ovo izgrade stoje naprijed u Frankfurtu.","Pozornicu je potvrdio organizator"],["Sloboda","frustracija zbog ovisnosti o jednoj tvrtki ili naručitelju","Koliko tvoj prihod danas ovisi o jednoj jedinoj tvrtki?",""],["Rast","nemiran, traži sljedeće tržište","Gdje je kod tebe trenutno sljedeće tržište?",""]],"task":"Označi šest točaka zrelosti za prijestolje. Zatim izradi dosje za svog prvog kralja i pošteno dodijeli bodove."},
 ktypen:{"lead":"Gotovo svaki kralj pripada jednom od pet tipova. Tip određuješ u dosjeu – on odlučuje o tonu, poruci i otvaraču očiju.","rows":["Njegova briga","Što ga pokreće","Ton","Otvarač očiju","Zabranjeno"],"types":[["I","Network kralj","ti","Top lider druge network tvrtke s velikom organizacijom.","Ugovorne klauzule, njegov ugled u vlastitoj tvrtki, nemir u timu.","Dodatak umjesto promjene. Odgovor na fluktuaciju i na mnoge u njegovom timu bez značajnog prihoda.","Lider lideru. Mirno, bez superlativa.","„Tvoji ljudi kupuju svaki mjesec. Na toj potrošnji danas zarađuju svi – osim tvoje organizacije.“","Loše govoriti o njegovoj tvrtki. Obraćati se popisima tima. Pitch za prelazak."],["II","Čelnik strukturne & financijske prodaje","Vi ili ti","Vlasnik ili direktor organizacije financijske, osigurateljne ili strukturne prodaje.","Ozbiljnost, odgovornost, dozvole i nadzor, njegov ugled kod klijenata.","Korist za klijente bez dodatnog financijskog proizvoda. Vezanost klijenata između savjetodavnih termina. Uredna dokumentacija.","Činjenično i sigurno u brojkama. Oslovljavanje prema odnosu.","„Svog klijenta vidite dvaput godišnje. Što ako Vas između toga svaki tjedan doživi pozitivno?“","Prinos, burza ili opcije kao argument. Hype-vokabular."],["III","Poduzetnik terenske prodaje","ti","Vlasnik D2D, energetske, PV, telekom ili POS prodaje.","Iskorištenost, pritisak na marže, fluktuacija prodavača, ovisnost o jednom naručitelju.","Dodatna vrijednost iz kontakata koje njegov tim ionako ostvaruje. Drugi oslonac.","Izravno, praksa umjesto teorije.","„Tvoj tim svaki dan stoji pred stotinama vrata i trgovaca. Plaćen si za jedan trenutak – zaključak. Nakon toga kontakt ti više ništa ne vrijedi.“","Dovoditi u pitanje njegov osnovni posao. Nuditi mu preuzimanje njegovih prodavača."],["IV","Kralj otvarač vrata","Vi","Davatelj franšize, čelnik udruženja, poduzetnički klub, organizator trgovačkih zastupnika, savjetnik s mnogo poduzetničkih mandata.","Njegov ugled kod članova i klijenata, neutralnost, trud, strukovno pravo.","Moći dati svojim ljudima stvarnu dodanu vrijednost. Mjerljiv pilot. Bez uloge prodavača.","Institucionalno, kratko, s konkretnim prijedlogom pilota.","„Vaše tvrtke svakodnevno imaju kontakt s kupcima. Koliko tog odnosa s kupcem ostaje kod njih nakon kupnje?“","Pretvoriti ga u prodavača. Stavljati prihod u prvi plan. Masovni e-mailovi njegovim članovima."],["V","Uspavani kralj","ti","Nekad veliki lider, danas neaktivan, razočaran ili između dva projekta.","Ponovno javno podbaciti. Njegova vjerodostojnost. „Opet nešto novo.“","Poštovanje prema njegovoj povijesti. Tihi novi početak bez najave. Uloga umjesto ranga.","Osobno, s uvažavanjem, bez pritiska.","„Nikome ništa ne moraš dokazivati. Pitanje je samo radi li tvoje znanje trenutno negdje.“","Podsjećati na neuspjehe. Javna najava prije pilota. Pritisak."]],"task":"Za svakog kralja u svojim dosjeima odredi tip – i prije svake poruke pročitaj brigu, ton i zabrane njegova tipa."},
 ksequenz:{"lead":"Sedam faza od dosjea do pilota. Svaka faza ima cilj i izlazni kriterij. Tko preskoči fazu, gubi kralja.","goalL":"Cilj","exitL":"Izlaz","steps":[["Dosje","Dan 0","Tip, motiv, pošiljatelj, povod i bodovi su utvrđeni.","Bodovi ispod 8 → ne javljaj se."],["Prvi kontakt","Dan 1","Odgovor i termin od 20 minuta. Znatiželja, bez marke.","Dva praćenja bez reakcije → parkiraj na 90 dana."],["Kvalifikacijski poziv","20 minuta","On priča, ti provjeravaš. Ažuriraj bodove.","Bodovi ispod 5 → ljubazno parkiraj."],["Razgovor otvarač očiju","60 minuta","Polugu formulira sam – sa svojim vlastitim brojkama.","Ne vidi polugu → ništa ne dodaješ."],["Dokaz & uprava","45 minuta","Stvarni slučaj plus provjera od strane uprave.","Otvoreno pitanje ugovora ili uvjeta → pauza dok se ne razjasni."],["Krug osnivača","90 minuta","Pisana potvrda pilota s najmanje pet imenovanih startera i datumom početka.","Nema potvrde unutar 7 dana → ponovno u siječnju."],["Pilot","14 dana","Startovi, prvi razgovori s trgovcima, knjiženi CP.","Pregled odlučuje: rollout ili stop."]],"takt":"<b>Ritam:</b> Od faze 2 do 6 idealno 21 dan. Dulje od 30 dana bez sljedeće faze znači: kralj nije u procesu, nego u čekanju.","stages":["Dosje","Kontakt","Poziv","Otvarač očiju","Uprava","Krug osnivača","Pilot","Pokrenut","Parkiran · s ponovnim kontaktom"],"pipeT":"Tvoj kraljevski pipeline","pipeHint":"Svaki kralj stoji u točno jednoj fazi – s datumom i sljedećim korakom.","pipeCols":["Kralj","Bodovi","Faza","Sljedeći korak","Datum"],"pipeEmpty":"Još nema kraljeva. Dodaj ih pod „Zrelost za prijestolje & dosje“.","kpiT":"KPI","kpiCols":["KPI","Definicija","Ritam"],"kpis":[["A-dosjei","kraljevi s bodovima ≥ 8 i potpunim dosjeom","tjedno"],["Prvi kontakti","poslane, pojedinačno prilagođene prve poruke","tjedno"],["Stopa odgovora","odgovori ÷ prvi kontakti","tjedno"],["Pozivi","vođeni pozivi od 20 minuta","tjedno"],["Otvarači očiju","vođeni razgovori od 60 minuta","tjedno"],["Potvrde pilota","pisane, s najmanje pet imenovanih startera i datumom početka","tjedno"],["Pokrenuti partneri","iz tekućih pilota","tjedno"],["Knjiženi CP","iz pilota, prema back officeu","tjedno"],["Parkirani kraljevi","s datumom ponovnog kontakta","mjesečno"]],"planT":"Planska pretpostavka za prva četiri tjedna","plan":"15 A-dosjea → 10 prvih kontakata → 5 poziva → 3 razgovora otvarača očiju → 1–2 pilota","planNote":"To je pretpostavka, a ne izmjerena stopa. Nakon četiri tjedna zamijeni je svojim stvarnim vrijednostima.","rhythmT":"Tjedni ritam","rhythm":[["Ponedjeljak · 15 min","Pregled pipelinea: tko je gdje? Tko je na redu ovaj tjedan? Koji kralj predugo čeka?"],["Petak · 15 min","Učenja: koja je poruka donijela odgovore, a koja nije? Prilagodi tekstove, ažuriraj bodove."]],"task":"Postavi svakog kralja u svom pipelineu u točno jednu fazu – sa sljedećim korakom i datumom. Ponedjeljkom i petkom po 15 minuta pregleda."},
 knachr:{"lead":"Prva poruka ima točno jedan zadatak: razgovor od 20 minuta. Ne informirati, ne uvjeravati, ne prodavati.","forKing":"Za kojeg kralja?","manual":"Ručno prilagodi [Ime]","rulesT":"Šest pravila prvog kontakta","rules":["Konkretan, dokaziv povod – bez kopiraj-zalijepi.","Bez imena tvrtke, bez linka, bez PDF-a, bez brojki.","Znatiželja umjesto objašnjenja: pitanje koje si nikad nije postavio.","Najviše pet rečenica.","Mali sljedeći korak: 20 minuta, dva prijedloga termina.","Izlaz: „Ako ne odgovara, samo reci.“ To skida pritisak – i olakšava odgovor."],"firstT":"Prvi kontakt · 9 predložaka","first":[["5.1","Network kralj","WhatsApp / DM · ti","Bok [Ime], već neko vrijeme pratim kako vodiš svoju organizaciju – posebno [konkretan povod]. Trenutno s malo lidera radim na nečemu što ne mijenja ništa u tvom postojećem poslu, ali odgovara na pitanje koje si većina velikih organizacija nikad ne postavi: što se zapravo događa s potrošnjom tvojih ljudi? Imaš li volje za 20 minuta, lider lideru? Ako ne odgovara, samo reci.","Priznanje kroz stvarni povod, pitanje na koje ne može odmah odgovoriti i ravnopravnost umjesto molbe."],["5.2","Network kralj","Glasovna poruka · oko 45 sek.","Hej [Ime], ovdje [tvoje ime]. Namjerno ti šaljem glasovnu poruku umjesto dugog teksta. [Povod u jednoj rečenici]. Trenutno s nekoliko lidera radim na nečemu što ne mijenja ništa u tvom poslu, ali odgovara na pitanje koje mi je zanimljivo: što se događa s potrošnjom u velikim organizacijama? To ti neću objašnjavati glasovnom porukom – jednostavno se čujmo telefonom 20 minuta. A ako te ne zanima, sasvim je u redu. Samo javi.","Glas stvara blizinu i autentičnost koju tekst nema. Govori mirno, ne čitaj, bez prodavačkog tona."],["5.3","Čelnik strukturne & financijske prodaje","Poruka · Vi","Dobar dan [Ime], ciljano Vam se javljam jer ste izgradili organizaciju sa stvarnim povjerenjem klijenata – [konkretan povod]. S malo vlasnika prodajnih organizacija radim na pristupu koji ne treba dodatni financijski proizvod i može vezati klijente uz Vašu organizaciju između savjetodavnih termina. Prije nego što Vam išta pokažem: biste li imali 20 minuta da provjerite je li to za Vas uopće relevantno? [Dan] ili [dan]?","Pogađa njegovu glavnu brigu – bez dodatnog proizvoda, bez odgovornosti – i ostavlja mu ulogu onoga koji provjerava."],["5.4","Poduzetnik terenske prodaje","WhatsApp · ti","Bok [Ime], kratko pitanje među poduzetnicima: tvoji ljudi svaki dan stoje pred stotinama vrata i trgovaca. Plaćen si za jedan jedini trenutak – zaključak. Trenutno s malo vlasnika prodaje radim na tome koliko taj kontakt može vrijediti nakon toga, a da se u vašem osnovnom poslu ništa ne promijeni. 20 minuta ovaj tjedan? [Dan] ili [dan]?","Odmah prepoznaje slijepu točku u vlastitom modelu – a nitko mu ništa nije prodao."],["5.5","Kralj otvarač vrata","E-mail · Vi","Predmet: Dodana vrijednost za Vaše [članove/franšizne partnere] – prijedlog malog pilota\n\nPoštovani/a [oslovljavanje i ime],\n\nobraćam Vam se jer [organizacija] stoji za [konkretan povod].\n\nRadimo na modelu s kojim tvrtke mogu i nakon kupnje zadržati svoje kupce – bez promjene osnovnog posla. Za to tražimo mali broj odabranih partnera za mjerljiv pilot s tri do pet tvrtki.\n\nSmijem li Vam to predstaviti u 20 minuta? Nakon toga Vi odlučujete dolazi li to za Vaše [članove] uopće u obzir.\n\nS poštovanjem\n[Ime] · [funkcija] · [telefon]","Institucionalno, kratko, jasno ograničeno. On ostaje donositelj odluke i ne postaje prodavač. Samo na poslovne adrese, poslano pojedinačno."],["5.6","Uspavani kralj","WhatsApp · ti","Hej [Ime], često mislim na vrijeme kad si izgradio [konkretno postignuće]. Ne želim ti ništa prodati niti te na išta nagovarati. Zanima me tvoja iskrena procjena nečega na čemu trenutno radim s nekoliko lidera – jer jedva da poznajem nekoga tko razumije strukture kao ti. Imaš li volje za kavu ili poziv?","Tražiš njegov savjet, ne njegovo sudjelovanje. To mu čini čast, smanjuje otpor – a tko savjetuje, počinje razmišljati s tobom."],["5.7","Topli uvod: tekst za preporučitelja","WhatsApp · ti","[Ime kralja], rado bih te povezao s [tvoje ime]. [On/Ona] upravo s malo čelnika prodaje gradi nešto zbog čega sam odmah pomislio na tebe – zbog [povod]. Bez pitcha, jednostavno mislim da biste se trebali upoznati. Smijem li vas povezati?","Posuđeno povjerenje je najjači ulaz. Prvo pitati, onda povezati – to poštuje kralja."],["5.8","Tvoj odgovor nakon uvoda","WhatsApp · ti","Hvala ti, [preporučitelj]. [Ime], drago mi je. [Preporučitelj] mi je ispričao kako si [povod]. Bit ću kratak: čujmo se 20 minuta, pa ćeš znati je li ti to zanimljivo. [Dan] ili [dan]?",""],["5.9","Zahtjev za kontakt za poslovne kontakte","LinkedIn · max. 300 znakova · Vi","[Ime], Vaš rad u [organizacija] pratim od [povod]. S malo vlasnika prodaje gradim dodatnu razinu prihoda na postojećim odnosima s klijentima i rado bih se povezao – bez pitcha.","Nakon toga: nakon prihvaćanja ne pitchaj odmah. Prvo reagiraj na objavu, zatim pošalji prilagođeni 5.3 ili 5.4."]],"reactT":"Prve reakcije · 14 odgovora","reactLead":"Svaki odgovor vodi prema razgovoru – nikad prema objašnjenju u chatu. Što se objasni u chatu, u chatu se i ocjenjuje. A u chatu gubiš.","reactRules":["Izravno pita za tvrtku? Navedi je. Izbjegavanje kod profesionalaca djeluje neozbiljno.","Bez brojki, bez PDF-ova, bez linkova prije razgovora. Brojka u chatu je obećanje.","Najviše dva praćenja. Nakon toga je kraj."],"react":[["6.1","„O čemu se radi?“","","Fer. U jednoj rečenici: radi se o tome kako velike organizacije iz svakodnevne potrošnje svojih ljudi mogu napraviti dodatnu razinu prihoda – bez mijenjanja svog posla. Sve ostalo bilo bi u chatu protraćeno. 20 minuta i znat ćeš je li ti to relevantno. [Dan] ili [dan]?",""],["6.2","„Pošalji mi informacije.“","","Rado – ali tek kad znam koje su ti informacije uopće relevantne. Inače dobiješ 20 stranica, od kojih 18 ne odgovara tvojoj organizaciji. Daj mi 15 minuta, pa ću ti poslati upravo ono što ti odgovara.",""],["6.3","„Koja tvrtka stoji iza toga?“","","Best Prime s platformom ePOINT. Ime slobodno izguglaj – samo ti ništa ne govori o mehanici o kojoj se meni radi. Nju ću ti pokazati za 20 minuta na stvarnom slučaju. Odgovara li [dan]?","Važno: odgovori iskreno. Tko kod ovog pitanja izbjegava, ispada."],["6.4","„Je li to network marketing?“","","Da, prodajna strana je postavljena kao partnerska struktura – to ti radije odmah sam kažem. Ali tebi nije zanimljiva struktura, nego mehanika iza nje: vezanost kupaca kroz stvarne kupnje kod trgovaca. Odgovara li ti to, provjerit ćemo za 20 minuta – bez slajdova.","Tko to sam izgovori, oduzima prigovoru snagu. Poricanje bi uništilo svako povjerenje."],["6.5","„Vezan sam ugovorom.“","","Dobro da to spominješ – to shvaćam ozbiljno. Ne želim da zbog nas imaš problema. Pogledajmo u razgovoru točno što tvoj ugovor dopušta, a po potrebi neka ga netko provjeri. Ako ne odgovara, sam ću ti to reći.","Ova rečenica gradi više povjerenja od bilo koje prezentacije. Štitiš njega – ne svoj zaključak."],["6.6","„Nemam vremena.“","","Razumijem – posebno kod tebe. Zato tražim 20 minuta, a ne projekt. Ako nakon toga ne odgovara, to je to. Radije sljedeći tjedan, [dan] ili [dan]?",""],["6.7","„Što ja tu zarađujem?“","","To ćemo izračunati zajedno s tvojim stvarnim brojkama i važećim planom – ne s primjerima izračuna s interneta. Sve drugo bilo bi neozbiljno. Donesi na razgovor tri brojke, pa ćeš to vidjeti crno na bijelo.","Važno: nikad brojka u chatu. Ono što napišeš čita se kao obećanje."],["6.8","„Zvuči zanimljivo.“","","Drago mi je. Onda to odmah dogovorimo: [dan] u [vrijeme] ili [dan] u [vrijeme]? Nakon toga ti pošaljem tri kratka pitanja za pripremu.",""],["6.9","Tišina · praćenje 1","nakon 4 dana","Bok [Ime], jednom se kratko javljam da ne potone u chatu. Trenutno ne odgovara, kasnije ili uopće ne? Sva tri odgovora su sasvim u redu.",""],["6.10","Tišina · praćenje 2 (zadnja poruka)","nakon još 7 dana","[Ime], pretpostavljam da trenutno nije pravo vrijeme – nema problema. Više se neću javljati. Ako jednom postaneš znatiželjan, znaš gdje me naći.","Važno: poruka je iskreno mišljena – i upravo zato često izazove odgovor. Nakon toga se stvarno više ne javljaj."],["6.11","Potvrda termina s tri brojke","","Odlično, [dan] u [vrijeme] stoji. Da dobro iskoristimo vrijeme, molim te donesi tri okvirne brojke:\n1) Koliko je ljudi aktivno u tvojoj organizaciji?\n2) Koliko njih značajno zarađuje?\n3) Koliko trgovaca i poduzetnika tvoj tim redovito viđa?\nProcjene su dovoljne.","Tko se priprema, uložio je. I počinje računati prije nego što razgovarate."],["6.12","Nakon razgovora · sažetak","","Hvala ti na otvorenom razgovoru. Meni ostaju dvije točke: [točka 1] i [točka 2]. Sljedeći korak kako smo dogovorili: [konkretna radnja] [datum]. Ako se do tada nešto promijeni, samo mi javi.",""],["6.13","Ljubazno parkirati","","Hvala ti na otvorenosti. Meni je jasno: trenutno ne odgovara – i to je sasvim u redu. Javit ću se kratko u [mjesec] da vidim je li se kod tebe nešto promijenilo. Do tada sve najbolje za [njegov projekt].",""],["6.14","Ponovni kontakt nakon 90 dana","","Bok [Ime], kako sam obećao, javljam se jednom. Od našeg zadnjeg razgovora kod nas se dogodilo [konkretan, dokaziv razvoj]. Je li ti to danas tema – ili i dalje nije? Oboje je u redu.","Uvjet: šalji samo uz stvaran, dokaziv razvoj."]],"task":"Za svog prvog A-kralja odaberi odgovarajuću prvu poruku prema njegovom tipu, svaku uglatu zagradu ispuni pojedinačno i prije slanja daj sponzoru da je pročita."},
 kgespr:{"lead":"U kraljevskom razgovoru on govori, ti pitaš. Tvoj udio u govoru ispod je 30 posto – sve do dokaza.","aT":"A · Kvalifikacijski poziv · 20 minuta","aCols":["Minuta","Faza","Što kažeš ili radiš"],"a":[["0–2","Okvir","„Blokirao sam 20 minuta. Prije svega želim razumjeti kako si postavljen. Na kraju obojica iskreno kažemo ima li smisla nastaviti razgovor. Može?“"],["2–12","On priča","Pet dijagnostičkih pitanja u nastavku. Slušati, bilježiti, ne komentirati."],["12–17","Teaser","„Neću ti pokazati tvrtku, nego izračun – s tvojim brojkama. Za to mi treba sat vremena s tobom.“"],["17–20","Odluka","„Ima li za tebe smisla proći to s tvojim brojkama?“ Da → dogovori termin. Ne → „Hvala ti, onda ostavimo.“"]],"diagT":"Pet dijagnostičkih pitanja","diag":["Koliko je ljudi u tvojoj organizaciji stvarno aktivno?","Što te trenutno najviše frustrira?","Koliko tvojih ljudi značajno zarađuje?","Što bi se moralo dogoditi da za godinu dana kažeš: to je bila jaka godina?","Koliko si ugovorno slobodan ako želiš raditi nešto dodatno?"],"bT":"B · Razgovor otvarač očiju · 60 minuta","bCols":["Faza","Trajanje","Što se događa"],"b":[["1 · Ogledalo","10 min","Sažmi što je rekao u pozivu – njegovim riječima. „Jesam li te dobro razumio?“",""],["2 · Tri pitanja","15 min","Tri pitanja otvarača očiju (u nastavku). Zatim šuti.",""],["3 · Njegov izračun","15 min","On upisuje svoje brojke. Računate s važećim planom – svaki rezultat jasno označen kao scenarij, nikad kao prognoza.",""],["4 · Dokaz","10 min","Stvarni slučaj: trgovac → kupac → kupnja → pripisivanje → isplata. Uživo u back officeu, ako je moguće.",""],["5 · Zadržano","5 min","Tek kad pita: suzarađivanje na kupnjama u cijeloj partnerskoj mreži.","samo onako kako to predviđa važeći plan"],["6 · Zaključak","5 min","Take-away umjesto pritiska (stvarna oskudica) i poziv u krug osnivača.",""]],"qT":"Tri pitanja otvarača očiju","q":["Koliko ljudi imaš u svojoj organizaciji – i koliko njih značajno zarađuje?","Što ostali ipak rade svaki mjesec? Kupuju: namirnice, gorivo, online.","Tko danas zarađuje na toj potrošnji? I što ako bi dio toga ostao u tvojoj organizaciji – a da nitko od tvojih ljudi ne mora prodavati proizvod?"],"silence":"<b>Pravilo šutnje:</b> Nakon trećeg pitanja šuti najmanje pet sekundi. Tko prvi progovori, oduzima mu spoznaju.","cT":"C · Termin s upravom · 45 minuta","cSub":"On provjerava tvrtku – ne vi njega.","c":[["Svako pitanje je dopušteno:","struktura, isplate, plan, vremenski okvir, status ePAY-a."],["Nijedan odgovor koji nije točan.","„Ne znam, razjasnit ću do [datum]“ jače je od svakog lijepog odgovora."],["ePAY nazvati pravim imenom:","planiran za 09.01.2027. – ni više ni manje."]],"task":"Pripremi svoj sljedeći poziv: rečenicu okvira napamet, pet dijagnostičkih pitanja na papiru, nakon toga ažuriraj bodove."},
 keinw:{"lead":"Iza svakog prigovora kralja krije se briga za ugled, tim ili ugovor. Odgovori na brigu, ne na rečenicu.","behind":"Iza toga:","goal":"Cilj:","search":"Traži prigovor","items":[["„Već imam posao.“","strah od zamjene","Upravo zato razgovaram s tobom. Ne treba ništa zamijeniti, nego nadograditi ono što već imaš.","okvir dodatka"],["„Sve sam to već vidio.“","umor, skepsa","Vjerojatno si vidio mnogo toga. Zato ti ne pokazujem prezentaciju, nego stvarni slučaj. Ako te ne uvjeri, gotovi smo za deset minuta.","dokaz umjesto pitcha"],["„Moj tim ne želi ništa novo.“","strah od nemira","Onda ne počinji s timom. Počni s pet ljudi kojima vjeruješ – 14 dana, tiho. Nakon toga odlučuješ.","mali pilot"],["„Što ako tvrtka to ne izdrži?“","rizik tvrtke","Opravdano pitanje. Zato prije svake odluke sjediš s upravom i postavljaš upravo to pitanje.","termin s upravom"],["„Jesu li ePAY i burza već tu?“","skepsa prema viziji","Ne. ePAY je planiran za 09.01.2027., izlazak na burzu je namjera. Ne prodajem ti ništa što još ne postoji – razgovaramo o onome što danas funkcionira.","vjerodostojnost"],["„Koliko zarađuju vaši top ljudi?“","traži dokaz","Stvarne dokaze o isplatama pokazat ću ti u razgovoru – uz suglasnost osobe, bez snimki zaslona iz grupa. Važnije je pitanje ionako: što proizlazi iz tvojih brojki?","vlastiti izračun"],["„Tko je još uključen?“","društveni dokaz","Imena navodim samo uz pristanak – kao što ni tvoje ne prosljeđujem. U krugu osnivača upoznat ćeš ostale.","povjerljivost kao vrijednost"],["„Što ja dobivam što drugi ne dobivaju?“","poseban dogovor","Nema posebnog plana – plan vrijedi za sve, inače ne bi ništa vrijedio. Što dobivaš: moje osobno vrijeme, izravnu liniju prema upravi i mjesto u krugu osnivača.","pravednost kao snaga"],["„Moram o tome razgovarati sa svojim partnerom.“","osiguranje","Vrlo dobro. Hoćemo li to proći u troje? Onda tvoj partner ima iste informacije iz prve ruke.","uključiti suodlučitelja"],["„Javi se za tri mjeseca.“","ne sada – ili izgovor","Hoću. Još jedno pitanje, da znam na što paziti: što bi se moralo promijeniti za tri mjeseca da ti odgovara?","saznati pravi razlog"],["„Nije li to piramidalna shema?“","pitanje ozbiljnosti","Opravdano pitanje – postavi ga svakoj prodaji. Moje mjerilo: iza svakog eura mora stajati stvarna protuvrijednost – trgovac, kupac, usluga. Provjerimo upravo to na stvarnom slučaju i u ugovoru, rado i s tvojim odvjetnikom.","provjera umjesto uvjeravanja"],["„Zašto bih ti vjerovao?“","temeljno pitanje","Još ne bi trebao. Povjerenje nastaje kroz dokaz – zato radimo pilot umjesto velike odluke.","pilot"]],"task":"Pročitaj dvanaest prigovora naglas i uvježbaj tri koja će tvoj sljedeći kralj najvjerojatnije iznijeti."},
 kabschl:{"lead":"Hitnost da. Izmišljena oskudica nikad. Kraljevi su godinama sami radili s pritiskom – prepoznaju ga nakon dvije rečenice. Razotkriveni trik ne košta jednog kralja, nego cijelo njegovo okruženje.","fomoT":"Stvarna oskudica: četiri FOMO pravila","fomo":[["Vaš kapacitet","„Do Frankfurta osobno pratim najviše pet čelnika prodaje.“","Okreće status: sada se on kvalificira kod tebe.","pravilo utvrđeno i poštovano"],["Trenutak","„Tko prije planiranog početka ePAY-a ima strukturu, kreće s timom umjesto sam.“","Stvarna logika svakog pokretanja tržišta.","ePAY uvijek formulirati kao „planiran“"],["Branša & regija","„Prvi u tvojoj branši koji veže trgovce i kupce – ima ih.“","Logika konkurencije koju poznaje iz vlastitog posla.","bez zaštite područja koja nije u ugovoru"],["Pozornica","„Tko do 09.01. dokazivo krene, stoji u Frankfurtu naprijed kao član osnivač.“","Status kod kraljeva vuče jače od novca.","potvrdio organizator"]],"okT":"Dopušteno i tabu","okCols":["Dopušteno","Tabu"],"ok":[["„Uzimam samo petoricu jer svakoga osobno pratim.“","„Još samo tri mjesta!“ – ako nije istina"],["„Pilot traje do [datum]. Nakon toga odlučujem s kim gradim 2027.“","rokovi koji se poslije prešutno produže"],["„Izračunajmo s tvojim brojkama.“","„Ovdje možeš zarađivati 10.000 € mjesečno.“"],["„ePAY je planiran za 09.01.2027.“","„ePAY je gotov“ ili „zajamčen“"],["„Tko prvi dođe, prvi gradi odnose.“","„ekskluzivno područje“ bez ugovora"],["status, pozornica, uloga, osobna pratnja","dionice, izlazak na burzu ili opcije kao mamac"]],"uwg":"Lažna oskudica prema UWG-u (njemački zakon o nepoštenom tržišnom natjecanju) klasičan je slučaj obmane – uz štetu za povjerenje.","closeT":"Kraljevski zaključci","close":[["9.1","Take-away zaključak","Razgovor · ti","Danas te ne želim uvjeravati. Do Frankfurta osobno pratim najviše pet čelnika prodaje i uzimam samo one kod kojih pilot pokaže da odgovara objema stranama. Ako želiš, provjerit ćemo to za 14 dana s petoro tvojih ljudi. Ako ne, sasvim u redu – onda ostajemo u kontaktu.","Spremnost na odlazak kod kraljeva je najjača privlačna sila. Uvjet: vrijedi pravilo kapaciteta."],["9.2","Zaključak pilotom za otvarače vrata","Razgovor · Vi","Ne predlažem Vam okvirni ugovor, nego pilot s tri do pet tvrtki kroz 14 dana. Nakon toga na temelju brojki odlučujete hoćete li to preporučiti svojim [članovima]. Odgovara li Vam početak [datum]?",""]],"gkT":"Krug osnivača Frankfurt","gkLead":"Ni događaj ni prezentacija: zatvorena radna runda u kojoj svaki kralj računa sa svojim brojkama i na kraju sam odlučuje.","gkFacts":[["max. 8","čelnika prodaje po rundi"],["90 min","radna sesija, bez showa"],["1 : 1","osobno pozvani"],["UPR","uprava za stolom"]],"gkCritT":"Kriteriji sudjelovanja – svi moraju biti ispunjeni","gkCrit":["bodovi ≥ 8 nakon razgovora otvarača očiju","vlastita organizacija s pristupom donositeljima odluka","ugovorni položaj provjeren i slobodan","spremnost na pilot od 14 dana s najmanje pet ljudi"],"gkFlowT":"Tijek · 90 minuta","gkCols":["Minuta","Što se događa"],"gkFlow":[["0–10","Pozdrav uprave. Pravila: povjerljivo, bez prezentacije, svako pitanje dopušteno."],["10–25","Dokazni slučaj uživo: trgovac, kupac, kupnja, pripisivanje, isplata."],["25–55","Radna sesija: svatko računa sa svojim brojkama – kao scenarij, s važećim planom."],["55–75","Otvorena pitanja upravi. Ništa nije tabu."],["75–90","Odluka: potvrda pilota ili ljubazno ne. Nakon toga kratki pojedinačni razgovori."]],"gkChain":["Krug osnivača","Pilot 14 dana","Pregled","Rollout ili stop","Pozornica 09.01."],"gkCond":"Pozornicu u Frankfurtu najavi samo ako ju je organizator potvrdio.","invT":"Pozivnice","inv":[["10.1","Poziv u krug osnivača","WhatsApp · ti","[Ime], nakon našeg razgovora želim te osobno pozvati u malu rundu: najviše osam čelnika prodaje, 90 minuta, s našom upravom. Bez prezentacije, nego radna sesija – svatko računa sa svojim brojkama, svako pitanje je dopušteno. Na kraju svatko sam odlučuje pokreće li pilot od 14 dana. [Datum], [mjesto]. Jesi li za?",""],["10.2","Poziv u krug osnivača","E-mail · Vi","Predmet: Osobni poziv – krug osnivača [datum]\n\nPoštovani/a [oslovljavanje i ime],\n\nnakon našeg razgovora želim Vas osobno pozvati u malu radnu rundu: najviše osam poduzetnika i odgovornih za prodaju, 90 minuta, zajedno s našom upravom.\n\nNema prezentacije. Svaki sudionik računa sa svojim brojkama, svako pitanje je dopušteno. Na kraju svatko sam odlučuje pokreće li pilot od 14 dana.\n\nTermin: [datum, vrijeme] · Mjesto: [mjesto]\n\nBilo bi mi drago da budete s nama.\n\nS poštovanjem\n[Ime]",""],["10.3","Dogovor o pilotu nakon potvrde","WhatsApp · ti","Kako smo dogovorili, [datum] pokrećemo pilot od 14 dana s tobom i [imena pet startera]. Mjerimo tri stvari: startove, prve razgovore s trgovcima i knjižene CP. Pregled [datum]. Nakon toga ti odlučuješ: rollout ili stop. Veselim se.",""]],"task":"Pismeno utvrdi svoje pravilo kapaciteta – i koristi samo oskudice čiji je uvjet dokazivo ispunjen."},
 kkodex:{"lead":"Kraljevi po jednoj jedinoj riječi čuju jesi li prodavač. Tvoj rječnik je tvoj prvi dokaz.","swapT":"Jezični kodeks","swapCols":["Umjesto","Reci"],"swap":[["jedinstvena prilika","model koji upravo provjeravamo s nekolicinom"],["pasivni prihod","stalna razina prihoda koja ovisi o stvarnom korištenju"],["financijska sloboda","drugi oslonac"],["Uđi odmah!","Provjerimo odgovara li."],["poslovna prilika","dodatna razina prihoda za tvoju organizaciju"],["izgraditi downline","ojačati tvoju postojeću organizaciju"],["Nemamo konkurencije.","Pokazat ću ti stvarni slučaj – prosudi sam."],["Želim ti nešto predstaviti.","Želim razumjeti kako si postavljen."],["Pogledaj ovaj video.","20 minuta, lider lideru."],["zajamčeno, sigurno","izmjereno, dokazano u pilotu"],["Moraš biti brz.","Osobno pratim samo nekolicinu."],["burza, dionice, opcije kao mamac","ne koristiti"]],"goodT":"Kraljevske riječi","good":["struktura","postojeće","poluga","pilot","dokaz","provjeriti","donositelj odluka","razina prihoda","ravnopravnost","nasljeđe","dodatak umjesto promjene"],"badT":"Tabu riječi","bad":["prilika života","obogatiti se","zajamčeno","odmah","samo danas","ekskluzivno (bez ugovora)","pasivno","auto iz snova","lifestyle"],"rulesT":"Zaštitne ograde · osam pravila, o kojima se ne pregovara","rules":[["Bez obećanja prihoda, prinosa ili dionica.","Brojke samo iz važećeg plana, uvijek označene kao scenarij."],["Bez izmišljene oskudice.","Bez rokova koji se poslije produže."],["Bez preuzimanja preko zaštićenih popisa timova drugih tvrtki.","Ugovorni položaj kralja provjerava se prije početka."],["Prvi kontakt samo preko postojećeg odnosa, preporuke ili poslovnog kanala.","Bez masovnih poruka (UWG, GDPR)."],["ePAY, burza i opcije samo kao plan ili namjera.","Nikad kao mamac."],["Bez posebnih planova za pojedine kraljeve.","Plan vrijedi za sve."],["Bez imena drugih lidera i bez dokaza o isplatama bez njihova pristanka.",""],["Bez loše priče o drugim tvrtkama","– ni kad to kralj sam radi."]],"legal":"<b>Nije pravni savjet:</b> dokumente, formulacije i prikaze nagrađivanja prije korištenja daj pravno provjeriti.","cheatT":"Podsjetnik · pročitaj jednom prije svakog kraljevskog razgovora","cheat":[["Stav","Birati, ne vrbovati. On provjerava tvrtku – ti provjeravaš njega. Udio u govoru ispod 30 posto."],["Prvi kontakt","povod · znatiželja · bez marke · pet rečenica · 20 minuta · izlaz."],["Tri pitanja","1. Koliko tvojih ljudi značajno zarađuje? 2. Što ostali ipak rade svaki mjesec? 3. Tko danas zarađuje na toj potrošnji?"],["Četiri stvarne oskudice","vaš kapacitet · trenutak prije planiranog početka ePAY-a · branša & regija · pozornica 09.01."],["Zaključak","„Danas te ne želim uvjeravati. … Ako želiš, provjerit ćemo to za 14 dana s petoro tvojih ljudi. Ako ne, sasvim u redu.“"],["Izlazna pravila","bodovi ispod 8 → ne javljaj se · 2 praćenja → parkiraj · nema vlastite poluge → ništa ne dodaješ · nema potvrde u 7 dana → siječanj."],["Nikad","obećavati prihod · izmišljati oskudicu · brojke u chatu · loše govoriti o drugim tvrtkama · preuzimati preko popisa timova · prodavati ePAY ili burzu kao gotove."]],"footer":["Poštovanje prema njegovom riziku","Dokaz prije vizije","Odabir umjesto vrbovanja"],"task":"Pročitaj podsjetnik prije svakog kraljevskog razgovora. Izbaci tabu riječi iz svojih predložaka."}
},
scripts:{"warm":[["K1 · Prijatelji & obitelj · savjet za uštedu","Hej [Ime], brzi savjet za uštedu: odnedavno koristim ePOINT, besplatnu aplikaciju s kojom dobivaš novac natrag kad normalno kupuješ – i u [trgovina koju osoba koristi]. [Samo ako je istina: prošli tjedan sam već dobio natrag …] Da ti pošaljem link? Traje dvije minute.","Prvo daj, vlastito iskustvo, sićušan korak."],["K2 · Poznanici & kolege · s povodom","Bok [Ime], nedavno si mi pričao da [stvarni povod: sve poskupljuje / puno naručujete online]. I sam koristim aplikaciju koja u tome pomaže: ePOINT – besplatno, 3 do 30 % povrata novca u trgovinama i web-shopovima koji sudjeluju. Želiš li je pogledati?","Nadovezuješ se na ono što je osoba sama rekla."],["P1 · Prijatelj / topli kontakt · birati umjesto nagovarati","Bok [Ime], pokrenuo sam usputni posao oko aplikacije za povrat novca i odmah sam pomislio na tebe, jer [stvarni razlog]. Ne znam je li to za tebe – provjerimo to za 15 minuta. Ako nije, sasvim u redu. Odgovara li ti bolje četvrtak ili subota?","Relevantnost, stav biranja, izlaz, alternativno pitanje."],["P2 · Glasovna poruka · max. 40 sekundi","Hej [Ime], baš sam mislio na tebe, jer [stvarni razlog]. Usput sam s Best Prime izgradio nešto oko aplikacije za povrat novca ePOINT. Rado ti pokažem za 15 minuta – samo mi napiši kad ti odgovara.","Tvoj glas stvara blizinu koju tekst ne stvara."],["P3 · Stari kontakt · prvo odnos, onda tema","Hej [Ime], dugo se nismo čuli – kako si ti i [stvarna poveznica]? Javljam se i zato što poslovno gradim nešto novo i pao si mi na pamet. Ali prvo mi ispričaj što je kod tebe novo!","Iskreno zanimanje na početku otvara razgovor."],["P3b · Stari kontakt · nakon njegova odgovora","Super! O mojoj temi: partner sam u Best Prime i pomažem graditi prodaju za aplikaciju za povrat novca ePOINT. Želiš li to pogledati za 15 minuta?","Jasno reći o čemu se radi – i zamoliti za mali korak."],["P4 · Reakcija na story ili objavu","Hej [Ime], vidio sam da si [story ili objava]. Odlično! Smijem li te nešto pitati: jesi li načelno otvoren za drugi izvor prihoda, ako se uklapa u tvoju svakodnevicu?","Iskren kompliment i pitanje za dopuštenje umjesto pitcha."],["P5 · Preporuka","Bok [Ime], [preporučitelj] mi je preporučio da ti se javim, jer [razlog]. Radi se o ePOINT-u i prodajnoj djelatnosti u Best Prime. Imaš li ovaj tjedan 15 minuta?","Posuđeno povjerenje – preporučitelja uvijek navedi prvog."]],"cold":[["V1 · Prodavač · u ravnini","Bok [Ime], imaš pristup ljudima i tvrtkama – upravo zato ti se javljam. S Best Prime gradim prodajno područje oko aplikacije za povrat novca ePOINT. Ne radi se o tome da zamijeniš svoj posao, nego da svojim kontaktima dodaš još jednu polugu. 15 minuta sljedeći tjedan?","Ton među jednakima, jasna korist za njegov postojeći posao."],["V2 · Voditelj prodaje · na razini strukture","Bok [Ime], za tebe postaje zanimljivo ne na razini pojedinačnih zaključaka, nego na razini tvoje strukture. Želio bih s tobom provjeriti odgovara li ePOINT kao dodatni izvor prihoda za tvoje partnere – otvorenih karata o koristi za kupce, trudu i nagrađivanju. Imaš li sljedeći tjedan 20 minuta?","Obraća se ulozi, ne pojedinačnoj prodaji. Za prave kraljeve: koristi Kraljevsku klasu."],["M1 · Udruga ili zajednica (Vi)","Dobar dan [Ime], Vi vodite [udruga ili zajednica] s mnogo članova. Imam prijedlog koji Vašim članovima donosi stvarnu korist, a Vas ništa ne košta: aplikaciju za povrat novca kojom se dobiva novac natrag pri uobičajenoj kupnji. Smijem li Vam za 10 minuta pokazati kako bi to moglo izgledati – za početak kao mali pilot?","Dodana vrijednost za njegove ljude, bez rizika, mali pilot."],["M2 · Poduzetnik, hladno (Vi · osobno, LinkedIn, Xing)","Dobar dan [Ime], na Vas sam naišao preko [konkretna poveznica]. Partner sam u Best Prime i s aplikacijom za povrat novca ePOINT gradim mrežu poduzetnika koji svojim kontaktima žele ponuditi stvarnu dodanu vrijednost. Ne znam odgovara li to Vama – rado bih to s Vama provjerio za 10 minuta. Bi li sljedeći tjedan bio moguć kratki razgovor?","Konkretna poveznica, stav biranja, nizak prag ulaska."],["H1 · Trgovac, hladno (Vi)","Dobar dan [Ime], javljam Vam se vrlo ciljano. S ePOINT-om trenutno gradimo ekosustav trgovaca i kupaca i za to tražimo tvrtke s relevantnim prometom kupaca. Ne želim Vam ništa objašnjavati telefonom – samo bih za 10 minuta provjerio ima li to za Vašu tvrtku uopće smisla.","Poštovanje prema njegovom vremenu, provjeravati umjesto prodavati."],["H2 · Trgovac, toplo","Imaš kupce koji redovito kupuju kod tebe. Upravo zato je ePOINT zanimljiv: tvoji kupci kod tebe dobivaju povrat novca i vraćaju se – a ti postaješ dio veće mreže trgovaca. Smijem li ti za 10 minuta pokazati kako to izgleda u trgovini?","Prvo njegova korist: povratak njegovih kupaca."],["T1 · Telefonski početak","Bok [Ime], imaš li dvije minute? … Zovem jer sam započeo nešto novo i odmah si mi pao na pamet. Ne želim ti to objašnjavati u prolazu – uz ekran to za 15 minuta ide puno bolje. Odgovara li ti sutra navečer ili radije vikend?","Kratko, osobno, sastanak umjesto objašnjenja."]],"fu":[["Nakon 2 dana bez odgovora","Bok [Ime], kratko se javljam, za slučaj da je moja poruka potonula: imaš li ovaj tjedan 15 minuta?","Nježno podsjetiti, bez pritiska."],["Nakon 5 dana bez odgovora","Bok [Ime], javljam se jednom, uredno: je li ti to načelno zanimljivo, da to preuzmemo kasnije ili nije za tebe? Sva tri odgovora su sasvim u redu.","Odluka s izlazom."],["Nakon dobrog prvog razgovora","Hvala ti na razgovoru! Za tebe su najvažniji bili [točka 1] i [točka 2]. Sljedeći korak: [konkretna radnja]. Odgovara li ti [dan, vrijeme]?","Zapisati ono što je dogovoreno."],["Još nesiguran","Koja je ta jedna stvar koja te trenutno sprječava da napraviš sljedeći korak? Onda razjasnimo upravo to, umjesto da sve ponovno prolazimo.","Saznati pravi razlog."],["U dogovoreno „kasnije“","Bok [Ime], rekao si da ti se javim [trenutak]. Odgovara li ti sada bolje?","Održati riječ."],["Nakon jasnog ne","Hvala ti na jasnom odgovoru. Neću ti se više javljati s tim. A ako jednom poželiš aplikaciju kao kupac, samo javi. Sve najbolje!","Sačuvati odnos – bez praćenja vezano uz posao."]]},

 start:{"sprint":"Twój 72-godzinny sprint","started":"rozpoczęty {d}","expired":"zakończony","tl":["0–15 min profil + system","15–30 potencjał","30–45 kontakt","72 h rozmowa"],"quote":["Nie musisz wiedzieć wszystkiego, zanim zaczniesz.","Musisz rozumieć na tyle, by pewnie uruchomić kolejny sensowny krok."],"task":"Przechodź moduły po kolei. Nie pomijaj zadań. Wiedza bez działania nie liczy się jako ukończony start. Złote kółko w menu oznacza: kryterium spełnione – wtedy oznacz moduł jako ukończony.","lead":"Ta Akademia nie jest książką do czytania. To twój plan pracy i twój onboardingowy niezbędnik: przewodniki, szablony i kalkulatory – a każdy etap kończy się konkretnym działaniem. Wszystko, co wpiszesz, zapisuje się automatycznie.","cards":["Wyjaśnić system w 60 sekund, samemu używać ePOINT, zrozumieć wynagrodzenie i postawę stojącą za każdym kontaktem.","Zbudować listę 100 potencjalnych kontaktów, ustalić priorytet TOP 10 i rozpoznać dźwignie sieciowe.","Wybrać właściwy szablon, aktywować kontakty, prowadzić rozmowy i uczciwie odpowiadać na obiekcje.","Powtórzyć ten sam prosty proces startu z kolejnym partnerem.","Dla liderów: wiadomości, rozmowy i strategia dla liderów sieci, szefów sprzedaży i otwieraczy drzwi."],"rulesT":"Trzy zasady całego FastTracku","rules":[["Aktywność przed teorią","Czytaj tylko to, czego potrzebujesz do następnego kroku. Potem działaj."],["Nigdy nie zaczynasz sam","Twój sponsor w ciągu 24 godzin przeprowadza z tobą call startowy i razem z tobą wysyła pierwszą wiadomość."],["Zapisz albo tego nie było","Pamięć to nie CRM. Wszystko trafia do aplikacji."]]},

 system:{"lead":"Kto nie potrafi prosto wyjaśnić systemu, nie przekaże go czysto dalej. Dlatego ten etap jest obowiązkowy.","flow":["Partner sprzedażowy","Sprzedawca","Klienci","Użytkowanie","Powrót"],"tr":"Trener 60 sekund","trHint":"Uruchom stoper i wyjaśnij cały system na głos, bez czytania. Zatrzymaj, gdy skończysz. Cel: co najmniej 3 czyste powtórzenia poniżej 60 sekund.","start":"Start","stop":"Stop","reset":"Resetuj","reps":"ważne powtórzenia (≤ 60 s)","best":"najlepszy czas","ready":"gotowy do sprawdzenia przez lidera","short":"Za krótko – wyjaśnij cały system","valid":"{s} s – ważne powtórzenie","long":"{s} s – za długo, jeszcze raz krócej","sys":[["ePOINT","Live · Sprzedawcy & klienci","Darmowa aplikacja cashback: kto kupuje u sprzedawców partnerskich w pobliżu lub w ponad 1.000 sklepów internetowych, dostaje zwrot od 3 do 30 % i może wypłacić saldo na konto."],["Best Prime","Aktywne · Sprzedaż & wzrost","Organizacja sprzedaży i społeczność, która czyni ePOINT znanym – wśród klientów, sprzedawców i nowych partnerów. Tu dostajesz szkolenia, narzędzia i swojego sponsora."],["ePAY","Planowane · Płatności & użytkowanie","Warstwa płatności i transakcji, planowana na 09.01.2027. Nie obiecuj niczego, co jeszcze nie działa."]],"ben":[["Dla klienta",["zwrot pieniędzy za zakupy, które i tak robi","za darmo, bez abonamentu","w pobliżu i online w jednej aplikacji"]],["Dla sprzedawcy",["lojalność i powrót klientów","część większej sieci sprzedawców","cyfrowa relacja z klientem"]],["Dla partnera",["jednorazowa prowizja od zamknięcia","stałe wynagrodzenie z użytkowania aktywnych klientów","budowa organizacji i duplikacja"]]],"coreL":"Twoje wyjaśnienie w 60 sekund","core":"„Znasz ePOINT? To darmowa aplikacja cashback. Robisz zakupy zupełnie normalnie – w sklepach w pobliżu albo w ponad 1.000 sklepach internetowych – i dostajesz zwrot od 3 do 30 procent, bezpośrednio na konto. Jestem partnerem w Best Prime, organizacji sprzedaży, która za tym stoi. Pokazuję ludziom aplikację, pozyskuję sprzedawców i buduję zespół. Za to dostaję wynagrodzenie według oficjalnego planu: jednorazowo za zamknięcia i na stałe z użytkowania przez moich klientów. A z ePAY planowane jest też rozwiązanie płatnicze. Mam ci szybko pokazać aplikację?“","coreWhy":"Zaczyna się od pytania, najpierw wyjaśnia korzyść dla słuchacza, otwarcie mówi, co ty z tego masz, i kończy małym następnym krokiem.","appT":"Najpierw używaj sam – twoje zadanie na dzień 1","appLead":"Kto sam dostał kiedyś cashback, nie potrzebuje już skryptu. Doświadczenie wygrywa z wyjaśnieniem.","app":["Aplikacja ePOINT zainstalowana i zarejestrowana","Znalazłem trzech sprzedawców partnerskich w pobliżu","Zrobiłem pierwszy zakup z cashbackiem"],"task":"Zainstaluj aplikację ePOINT i używaj jej sam. Następnie wyjaśnij cały system bez czytania w maksymalnie 60 sekund – aż będzie jasno, spokojnie i bez żargonu."},
 check:{"lead":"Wiedza o produkcie ma wartość tylko wtedy, gdy prostym językiem dociera do rozmówcy. Odpowiadaj bez materiałów.","right":"Dobrze.","wrong":"Nie do końca – spójrz jeszcze raz na system.","selfRight":"Świetnie – w takim razie do lidera na sprawdzenie.","selfWrong":"W takim razie przejdź jeszcze raz moduł „System w 60 sekund”.","qrule":"<b>Zasada jakości:</b> ceny, wynagrodzenia, funkcje produktów i dane rynkowe pochodzą wyłącznie z aktualnych oficjalnych materiałów Best Prime lub back office. Żadnych starych zrzutów ekranu ani wymyślonych liczb.","unlock":"Odblokowanie","unlockHint":"Dopiero gdy twój lider potwierdzi twoje 60-sekundowe wyjaśnienie, przechodzisz do pracy z potencjałem.","leaderOk":"Mój lider{l} potwierdził moje 60-sekundowe wyjaśnienie","unlocked":"Odblokowano fazę 2","locked":"Jeszcze nie odblokowano","kcT":"Szybki test: odpowiedz swobodnie","kcHint":"Na każde pytanie odpowiedz na głos. Potem porównaj z przykładową odpowiedzią i zaznacz, co umiesz.","kcShow":"Przykładowa odpowiedź","kcCan":"Potrafię swobodnie odpowiedzieć","kc":[["Co klient dostaje od ePOINT i ile go to kosztuje?","Od 3 do 30 % cashbacku u uczestniczących sprzedawców w pobliżu i w ponad 1.000 sklepach internetowych, z wypłatą na konto. Aplikacja jest darmowa, bez abonamentu."],["Czym jest Best Prime?","Organizacją sprzedaży, która czyni ePOINT znanym – wśród klientów, sprzedawców i nowych partnerów. Tu dostajesz szkolenia, narzędzia i swojego sponsora."],["Czym jest ePAY i od kiedy będzie dostępny?","Planowanym rozwiązaniem płatniczym, planowanym na 09.01.2027 – dziś jeszcze nie do użycia."],["Za co dostajesz wynagrodzenie – a za co nie?","Według oficjalnego planu: jednorazowo za zamknięcia (pakiety nowych partnerów) i na stałe z użytkowania przez aktywnych klientów. Nie za wiadomości, rozmowy czy same rejestracje."],["Jaki jest twój pierwszy krok z nowym kontaktem?","Ustalić, czy pasuje jako klient, partner czy multiplikator – i osobistą wiadomością poprosić o mały na  warm:{"note":"Przy kopiowaniu lub otwarciu w WhatsAppie wybrany kontakt automatycznie dostaje w pipeline status „NOWY”. Przed wysłaniem dopasuj szablon do swojego stylu.","doT":"To działa","dontT":"Tego unikaj","task":"Dopasuj szablon do swojego stylu i wyślij go do 2 przyjaciół / znajomych i 1 ciepłego kontaktu.","f4T":"Formuła 4 zdań – zbuduj własną wiadomość","f4":[["Kontekst","Dlaczego ty?"],["Trafność","Dlaczego ciekawe?"],["Ciekawość","Nie tłumacz wszystkiego"],["Następny krok","10 min / spotkanie"]],"copy4":"Kopiuj moją wiadomość","fill4":"Najpierw wypełnij cztery zdania","lead":"Pierwsza wiadomość ma dokładnie jeden cel: małe tak na następny krok. Nie wyjaśniaj, nie przekonuj. W razie wątpliwości zacznij od zaproszenia do darmowej aplikacji.","f4Hint":"Furtka na końcu („Jeśli nie, zupełnie w porządku“) to nie formułka grzecznościowa: kto czuje się wolny, łatwiej mówi tak. I pytaj z dwiema opcjami zamiast „Masz kiedyś czas?“.","chanT":"Właściwy kanał","chan":[["Wiadomość głosowa","dla ciepłych kontaktów. Twój głos tworzy bliskość. Maksymalnie 40 sekund."],["Telefon","jeśli jesteś closerem albo dobrze znasz tę osobę."],["Tekst","dla bardzo zajętych, zimnych kontaktów i follow-upu."]],"ansT":"Trzy typowe odpowiedzi","ans":[["„Co to dokładnie jest?“","Uczciwie w dwóch zdaniach, potem z powrotem do spotkania: „W skrócie: ePOINT to darmowa aplikacja cashback, a ja z Best Prime buduję jej sprzedaż. Co to mogłoby oznaczać dla ciebie, wolę pokazać ci w 15 minut niż w powieści. Kiedy ci pasuje?“"],["„Brzmi ciekawie.“","Od razu spotkanie z dwiema opcjami. Nie wyjaśniaj dalej."],["„Nie jestem zainteresowany.“","„Dzięki za szczerą odpowiedź! Jeśli kiedyś zechcesz aplikację jako klient, daj znać.“ Status „Brak zainteresowania“, bez dalszego biznesowego follow-upu."]],"do":["prawdziwe osobiste nawiązanie","korzyść właśnie dla tej osoby","ciekawość zamiast zasypywania informacjami","mały krok z dwiema opcjami terminu","szablon przełożony na twoje słowa"],"dont":["kopiuj-wklej bez nawiązania","długie powieści o prowizjach","aluzje do zarobków","presja albo „tylko dziś“","unikanie odpowiedzi, gdy ktoś bezpośrednio pyta o firmę"]},
 cold:{"lead":"Profesjonaliści, przedsiębiorcy i sprzedawcy nie potrzebują sztuczek. Potrzebują trafności, szacunku dla swojego czasu, rozmowy jak równy z równym i niskiego progu do następnego kroku.","rulesT":"Zasady dla profesjonalistów i przedsiębiorców","rules":["Konkretna, weryfikowalna okazja – bez kopiuj-wklej.","Maksymalnie pięć zdań, bez liczb, bez PDF-a, bez linku.","Mały następny krok: 10 do 20 minut, dwie propozycje terminu.","Kontakt tylko osobiście, przez polecenie lub kanały biznesowe, takie jak LinkedIn i Xing. Bez masowych maili, bez niezamówionych telefonów reklamowych."],"kingT":"Prawdziwi szefowie sprzedaży? Użyj Klasy Królewskiej.","king":"Dla liderów sieci, szefów sprzedaży strukturalnej i terenowej oraz otwieraczy drzwi obowiązują własne zasady: dossier, punkty, typ, własne wiadomości i dramaturgia rozmowy.","kingBtn":"Do Klasy Królewskiej","task":"Wybierz 2 kontakty ze sprzedaży + 2 przedsiębiorców lub sprzedawców. Research na kontakt maksymalnie 5 minut. Potem się odezwij."},
 pipe:{"lead":"Sprzedaż traci tempo, gdy rozmowy pozostają otwarte. Każdy kontakt potrzebuje statusu i następnego kroku z datą.","steps":[["1 · Pierwszy kontakt","Sprawdź trafność, umów krótkie spotkanie. Nie tłumacz wszystkiego na czacie."],["2 · Spotkanie","Pytania przed wyjaśnianiem: zasoby, klienci, zespoły, dostęp do sprzedawców."],["3 · Follow-up","Nigdy „odezwij się”. Zawsze ustal datę lub decyzję."],["4 · Dokumentacja","Pamięć to nie CRM. Dokumentuj od razu."]],"empty":"Tutaj pojawią się twoje kontakty TOP i wszyscy, z którymi się skontaktowałeś.","cols":["Kontakt","Status","Następny krok","Data","Odpowiedział"],"nextPh":"np. spotkanie 15 min","task":"Każdemu aktywnemu kontaktowi nadaj jasny status: NOWY · SPOTKANIE · FOLLOW-UP · DECYZJA · ROZPOCZĘTY. Daty na czerwono są przeterminowane.","rhythmT":"Dwie zasady follow-upu","rhythm":["Każdy otwarty kontakt ma datę następnego kroku.","Po dwóch follow-upach bez odpowiedzi: pauza. Po jasnym nie: bez biznesowego follow-upu."]},
 talk:{"pL":"Partner / sieć","mL":"Sprzedawca / firma","qT":"5 kluczowych pytań","mq":["Ilu mniej więcej macie klientów?","Jaki jest udział stałych klientów?","Jak dziś budujecie lojalność klientów?","Ile kosztuje was pozyskanie klienta?","Jakie są dodatkowe lokalizacje / sieci?"],"flow":["1. Zrozumieć","2. Zaklasyfikować","3. Wyjaśnić trafnie","4. Następny krok"],"quote":["Najpierw zrozum potrzebę. Potem wyjaśnij korzyść.","Im więcej mówisz przed analizą potrzeb, tym większe ryzyko, że miniesz się z prawdziwą dźwignią."],"prot":"Protokół rozmowy","f":["Kontakt / firma","Największa dźwignia","Największe otwarte pytanie","Następny krok + termin"],"save":"Zapisz rozmowę","saved":"Rozmowa zapisana","cols":["Data","Kontakt","Dźwignia","Otwarte pytanie","Następny krok"],"del":"Usuń","lead":"Dobra rozmowa to diagnoza, a nie wykład. 20 do 30 minut – a na końcu zawsze jest jasny następny krok, nawet jeśli brzmi „brak zainteresowania“.","phT":"Przebieg","ph":[["Ustalić ramy","2 min","„Cieszę się, że się udało. Moja propozycja: najpierw zadam ci kilka pytań, potem pokażę, o co chodzi, a na końcu powiesz mi szczerze, czy to dla ciebie. Może być?“"],["Pytania","5–8 min","Motyw, czas, możliwości – kluczowe pytania poniżej. Słuchać, notować."],["Pokazać","5 min","„Mogę ci szybko pokazać, jak sam z niej korzystam?“ – aplikacja na żywo i twoja historia."],["Przyporządkować","5 min","„Z tego, co opowiedziałeś, najbardziej pasuje do ciebie …, bo …“ – klient, partner, sprzedawca lub multiplikator."],["Zdecydować","3 min","Jedno z pytań zamykających poniżej – i spotkanie z datą."]],"phNote":"Dlaczego ramy są tak ważne: kto na początku usłyszy, że nie jest dozwolone, potem słucha spokojnie – zamiast wewnętrznie się bronić.","pq":["Co musiałoby się wydarzyć, żeby coś takiego ci się opłaciło?","Ile czasu realnie mógłbyś zainwestować tygodniowo?","Z iloma ludźmi masz regularny kontakt – i wolisz pracować sam czy w zespole?","Jakie branże / regiony możesz otworzyć?","Wolałbyś sam produkować czy budować organizację?"],"storyT":"Twoja historia w 60 sekund","storyHint":"Opowiadaj tylko prawdę. Nie masz jeszcze wyniku? Wtedy twoją historią jest twój impuls.","story":["Przedtem – gdzie byłem?","Impuls – co mnie zaciekawiło?","Teraz – co robię, czego sam doświadczyłem?","Dlaczego ci to pokazuję"],"storyCopy":"Kopiuj historię","storyEmpty":"Wypełnij cztery części – tutaj powstaje twoja historia.","closeT":"Pytania zamykające – otwarcie i uczciwie","close":[["Skala","„W skali od 1 do 10 – na ile cię to interesuje?“ Od 6: „Czego brakuje ci do 10?“ Poniżej 5: „To odpuśćmy biznes – czy aplikacja pasowałaby ci jako klientowi?“"],["Fokus","„Co ci się w tym najbardziej podoba?“"],["Wybrać drogę","„Wolisz zacząć najpierw jako klient czy od razu jako partner?“"],["Wyjaśnić","„Co musiałoby zostać wyjaśnione, żebyś mógł zdecydować?“"],["Termin","„To zróbmy twój call startowy z moim sponsorem – pasuje wtorek o 19:00 czy środa o 18:00?“"]],"trioT":"Rozmowa we trójkę z twoim sponsorem","trio":"W pierwszych tygodniach twój sponsor uczestniczy w ważnych rozmowach, a ty uczysz się, słuchając. Tak go przedstawiasz – tylko prawdziwymi informacjami:","edif":"„{s} zajmuje się tym od [okres] i bardzo ułatwił mi start. Zaprosiłem go, bo może lepiej niż ja odpowiedzieć na twoje pytania.“","trioRole":"Twoja rola: przedstawić, słuchać, notować. Potem we dwóch omawiacie, co poszło dobrze.","task":"W ciągu 72 godzin przeprowadź co najmniej jedną zakwalifikowaną rozmowę z prawdziwą analizą potrzeb – najlepiej jako rozmowę we trójkę ze swoim sponsorem."},
 sprint:{"lead":"Szybkość powstaje, gdy nauka i działanie są ze sobą bezpośrednio połączone.","sc":"Twój scoreboard 72 h","scHint":"Liczony automatycznie z twojej listy, pipeline i rozmów.","k":["Nazwiska na liście potencjału","Kontakty TOP ustalone","Nawiązane kontakty","Odpowiedzi / reakcje","Kwalifikowane rozmowy","Jasne następne kroki"],"quote":["Pierwsze 72 godziny nie decydują o twojej karierze.","Ale często decydują o tym, czy motywacja zamieni się w prawdziwy ruch."],"task":"Żaden partner nie kończy sprintu startowego jedynie z „obejrzałem Academy”. Zakończenie = Academy + prawdziwa aktywność."},
 week:{"lead":"Systematyczność nie bierze się z codziennej motywacji, tylko z powtarzalnego rytmu.","days":[["Poniedziałek","Fokus","Ustalić cel tygodnia, kontakty TOP, spotkania i najważniejsze dźwignie sieci."],["Środa","Umiejętności","Ćwiczyć kontakt, obiekcje, prowadzenie rozmowy lub prezentację w odgrywaniu ról."],["Piątek","Podsumowanie","Sprawdzić liczby, zapisać wnioski, zamknąć follow-upy, przygotować kolejny tydzień."]],"title":"6 liczb, które naprawdę się liczą","cols":["KPI","Ten tydzień","Cel na następny tydzień"],"close":"Zamknij tydzień: zacznij nowy tydzień","closed":"Nowy tydzień rozpoczęty – cele zostają","imp":"<b>Ważne:</b> nie mierz tylko wyników. Wskaźniki wyprzedzające, jak kontakty, rozmowy i follow-upy, pokazują znacznie wcześniej, czy nadchodzący tydzień będzie mocny.","task":"W każdy piątek 15 minut przeglądu liczb. Nie oceniaj, zanim liczby nie będą widoczne."},
