n modello, non una previsione.»","Calcoli di duplicazione come promessa di crescita"]],"sales":["chiaro invece che complicato","bisogno prima della presentazione","nessuna garanzia di guadagno","nessun dato inventato su prodotto o azienda","documenti ufficiali per le condizioni attuali","ogni contatto riceve un passo successivo chiaro","nessun pacchetto o voucher solo per qualificarsi a un rango","i dati di contatto di terzi restano a te – nessun messaggio di massa"],"task":"Dopo il FastTrack si sblocca solo ciò che ti serve adesso: Merchant Activation · Partner Building · Team Leadership · Market Building – e per i colloqui con i grandi leader la Classe dei Re. Il tuo prossimo passo: apri la tua TOP 10, scegli il contatto numero 1 e avvia la prima azione."},
 bk:{"title":"Salva / carica progressi","close":"Chiudi","hint":"I tuoi progressi sono su questo dispositivo. Per cambiare dispositivo: salva un file o copia il codice – poi caricalo sul nuovo dispositivo.","file":"Salva come file","copy":"Copia codice","loadL":"Carica backup: scegli un file o incolla il codice","codePh":"Incolla qui il codice di backup","load":"Carica backup","resetSum":"Azzera tutto","resetBtn":"Sì, elimina tutti i dati su questo dispositivo","loaded":"Backup caricato","invalid":"Questo non è un backup FastTrack valido","need":"Incolla un codice o scegli un file","saved":"Salvato","canceled":"Salvataggio annullato","reset":"Azzerato"},
 geld:{"lead":"La remunerazione nasce in due modi: una tantum, quando un nuovo partner acquista un pacchetto, e in modo continuativo dall’utilizzo dei clienti attivi. Nessuna delle due nasce solo scrivendo messaggi, e nessuna è garantita.","blocks":[["Provvigione di chiusura","una tantum","Un nuovo partner acquista un pacchetto: pacchetto Premium = 3 CP, voucher = 1 CP."],["Airtime","continuativa","I tuoi clienti attivi usano ePOINT. L’utilizzo remunerabile genera CP."],["Differenza","per occasione","Un partner nella tua linea ha un rango inferiore – ricevi la differenza tra le aliquote, ad es. Area Manager sopra Team Builder: 3 CP × 2 € = 6 €."],["Team","per occasione","Partner allo stesso livello: airtime di team nel modello 10 / 3 / 2 € per CP su tre generazioni."]],"calcT":"Calcolatore","calcHint":"CP significa Commission Points. L’importo in euro per CP è diverso per chiusura e airtime – non sommare mai le due cose.","rank":"Il tuo rango","prem":"Pacchetti Premium di nuovi partner","vou":"Voucher","cust":"Clienti attivi","cp":"CP per cliente (ipotesi)","closure":"Provvigione di chiusura · una tantum","air":"Modello airtime · per periodo di conteggio","perCp":"€ per CP","cust2":"clienti attivi","calcNote":"Calcolo modello al lordo delle imposte, nessuna previsione e nessuna promessa. 0,10 CP per cliente è un’ipotesi. Qualifica, utilizzo effettivo, costi e pagamento sono stabiliti dal piano ufficiale.","tableT":"Ranghi, qualifica e aliquote","cols":["Rango","Qualifica secondo il grafico","Chiusura € per CP","Airtime € per CP (modello)"],"ranks":[["P","Partner","Back office"],["CB","Community Builder","Basic Pack o 50 CP"],["TB","Team Builder","Premium Pack o 100 CP"],["AM","Area Manager","250 CP"],["RD","Regional Director","500 CP"],["SD","Sales Director","2.500 CP"],["CM","Country Manager","5.000 CP"],["IBM","Innercircle Board Member","10.000 CP"]],"tableNote":"Da IBM il modello aggiunge una quota del fondo mondiale: CP aziendali mondiali × 10 €, divisi per gli IBM aventi diritto. Fonte: grafico della remunerazione e disposizione provvigionale Best Prime, aggiornati al 12.10.2026; pacchetto Premium = 3 CP dal 15.09.2026. Prima di ogni promessa verifica con la versione attuale nel back office.","talkT":"Come parli di soldi","talkQ":"«Si guadagna una tantum sulle chiusure e in modo continuativo sull’utilizzo dei tuoi clienti. Quanto, dipende da ciò che fai. Ti mostro il piano ufficiale.»","talk":["Mai indicare un importo mensile come aspettativa.","Mai dire «reddito passivo».","Indicare sempre gli esempi di calcolo come modello.","Mai acquistare o far acquistare pacchetti o voucher solo per un rango."],"openT":"Da chiarire prima di ogni promessa","open":["Costi del Basic e del Premium Pack, una tantum e ricorrenti","Quando nasce il diritto e quando viene pagato","Cosa significa la regola del 50 % o del 30 % per la qualifica","Se le aliquote di chiusura di team del grafico (20 / 6 / 4 €) valgono per CP o per chiusura"],"openBtn":"Copia le domande per lo sponsor","openMsg":"Ciao{l}, prima di spiegare il piano a qualcuno voglio essere sicuro di quattro punti: 1) Quanto costano il Basic e il Premium Pack, una tantum e ricorrenti? 2) Quando nasce il diritto e quando viene pagato? 3) Cosa significa la regola del 50 % o del 30 % per la qualifica? 4) Le aliquote di chiusura di team di 20 / 6 / 4 € valgono per CP o per chiusura? Grazie!","task":"Calcola due esempi tuoi: una chiusura al tuo rango e 10 clienti attivi. Poi spiega in due frasi come nasce la remunerazione."},
 haltung:{"lead":"Le persone non reagiscono alle informazioni, ma all’atteggiamento con cui arrivi. Chi chiede un favore viene liquidato. Chi verifica se c’è corrispondenza viene preso sul serio.","core":"«Ho qualcosa di buono, cerco le persone a cui si adatta – e ho tempo per trovarle.»","coreL":"Il tuo atteggiamento in una frase","pT":"I 10 principi","whyL":"Perché funziona","howL":"Come lo usi","lineL":"Linea rossa","p":[["Selezionare invece di convincere","La pressione provoca resistenza. Chi verifica apertamente appare sicuro e affidabile.","«Non so se fa per te – verifichiamolo velocemente.»","Nessuna scarsità artificiale."],["Curiosità prima dell’informazione","Una domanda aperta nella testa vuole una risposta. Chi spiega tutto in chat invita a un giudizio senza colloquio.","Nel primo messaggio solo tema, riferimento e un piccolo passo. I dettagli nel colloquio.","È sempre chiaro di cosa si tratta. Se qualcuno chiede direttamente dell’azienda, la nomini."],["La rilevanza batte la portata","Le persone reagiscono a ciò che le riguarda.","Ogni messaggio ha una vera frase «perché tu …».","Nessun motivo inventato."],["Chi fa domande, guida","Le persone credono a ciò che dicono loro stesse. Le domande rendono visibile il bisogno.","Prima chiedi, poi mostra. Parli meno di un terzo del tempo.","Nessuna domanda suggestiva che ammette solo un sì."],["Piccoli passi di sì","Un piccolo sì è più facile di uno grande – e chi accetta tende a restare.","Chiedi sempre solo il prossimo piccolo passo: 10 minuti, uno sguardo all’app, un appuntamento.","Nessun sì strappato di sorpresa."],["L’esperienza batte la spiegazione","Un’esperienza personale convince più di qualsiasi slide.","Mostra l’app dal vivo, mostra la tua ricevuta di cashback.","Nessun risultato altrui o abbellito."],["Prima dare","Chi riceve un regalo è più aperto. L’app è gratuita – un consiglio sincero.","Inizia dal vantaggio per il cliente prima di parlare dell’attività.","Nessun «regalo» con condizioni nascoste."],["Alla pari invece di chiedere","Chi si scusa si fa piccolo. I professionisti della vendita rispettano solo il tono tra pari.","Calmo, chiaro, senza «scusa se disturbo».","Nessuna arroganza, mai parlare male di altre aziende."],["Un no è un’informazione","Chi prende i rifiuti sul personale si ferma. Chi li conta migliora.","Ringraziare, impostare lo stato, contatto successivo.","Dopo un no chiaro nessun follow-up."],["Identità e ritmo","Le persone agiscono secondo l’immagine che hanno di sé. Blocchi di lavoro fissi battono la motivazione.","«Sono una persona che ogni giorno fa 3 contatti.» Spunta ogni giorno.",""]],"fearT":"La paura del primo contatto","fear":"Ce l’hanno quasi tutti. Non sparisce leggendo, ma con i primi dieci messaggi.","fearL":[["Partire insieme","Il primo messaggio lo invii durante la call di avvio, mentre il tuo sponsor ascolta."],["Iniziare con il regalo","Un invito all’app gratuita è più facile di qualsiasi proposta d’affari."],["Contare l’attività, non i risultati","Il tuo obiettivo giornaliero è «3 messaggi inviati», non «3 sì»."]],"wordsT":"Dillo così","words":[["occasione unica","un modello che stiamo verificando con poche persone"],["reddito passivo","un livello di ricavo continuativo che dipende dall’utilizzo reale"],["Entra subito!","Verifichiamo se fa per te."],["Voglio presentarti qualcosa.","Voglio capire come sei organizzato."]],"task":"Leggi una volta per intero i 10 principi. Scegli i due che ti riescono più difficili e fai molta attenzione a questi nei tuoi prossimi cinque messaggi."},
 einw:{"lead":"Un’obiezione non è un no, ma una domanda ancora aperta. Chi la prende sul serio conquista fiducia. Chi la scaccia la perde.","method":[["Riconoscere","«Ti capisco.»"],["Chiedere","«Cosa intendi esattamente?» – spesso dietro c’è altro."],["Rispondere onestamente","Breve, con fatti, senza promesse."],["Proseguire","«Così è chiarito per te?» – poi al passo successivo."]],"listT":"Le 12 obiezioni più frequenti","search":"Cerca un’obiezione, es. tempo, soldi, piramidale","none":"Nessuna obiezione corrispondente. Chiedi al tuo sponsor – e inserisci la risposta qui sotto.","behind":"Spesso dietro c’è:","items":[["«Non ho tempo.»","paura dell’impegno","Il ritmo lo decidi tu. Quanto tempo avresti realisticamente alla settimana? Poi vediamo onestamente se basta."],["«Non so vendere.»","paura del rifiuto","Non devi. Mostri un’app gratuita che usi tu stesso – è più consigliare che vendere. E all’inizio il tuo sponsor partecipa ai colloqui."],["«Non conosco nessuno.»","rete sottovalutata","Guardiamo insieme il tuo telefono per 10 minuti – poi vediamo."],["«È un sistema piramidale?»","timore di una truffa","Buona domanda, è giusto farla. È vendita diretta con un prodotto reale: i clienti usano un’app gratuita e ricevono cashback, i commercianti fidelizzano i loro clienti. Si viene remunerati per le chiusure e per l’utilizzo di clienti reali secondo un piano ufficiale. Ti mostro i documenti, poi verifichi tu stesso."],["«È network marketing?»","riserve sul settore","Sì, la parte vendite è organizzata come struttura di partner – preferisco dirtelo io subito. Ma la parte interessante è il meccanismo dietro: fidelizzazione dei clienti tramite acquisti reali presso i commercianti. Se fa per te, lo verifichiamo in 15 minuti."],["«Quanto costa?»","valutare il rischio","Come cliente niente. Come partner ci sono pacchetti di ingresso – i prezzi esatti te li mostro dai documenti ufficiali aggiornati, non a memoria."],["«Quanto guadagni tu?»","cerca una prova","Sinceramente: [risposta vera, es. «sono ancora all’inizio»]. Conta come funziona il piano e cosa ne fai tu – te lo mostro."],["«Mandami qualche informazione.»","scusa gentile o interesse reale","Volentieri – ma solo quando so quali informazioni sono rilevanti per te. Cosa ti interessa di più: l’app come cliente o l’attività? Dopo facciamo una telefonata di 10 minuti. Giovedì o venerdì?"],["«Devo pensarci.»","una domanda aperta","Certo. Perché tu possa pensarci bene: quale punto è ancora aperto per te? (Poi fissate una data per la risposta.)"],["«Devo parlarne con il mio partner.»","decisione condivisa","Benissimo. Facciamo il prossimo colloquio in tre? Così il tuo partner ha le stesse informazioni di prima mano."],["«Di app di cashback ce ne sono tante.»","confronto","Vero. Provala e basta, non costa nulla: dal 3 al 30 % presso commercianti aderenti sul territorio e in oltre 1.000 shop online, accreditabile sul conto."],["«ePAY è già disponibile?»","curiosità per le novità","No. ePAY è previsto per il 09.01.2027. Quello che puoi usare oggi è l’app ePOINT – te la mostro."]],"copyA":"Copia risposta","mineT":"Le mie tre obiezioni più difficili","mineE":"Obiezione","mineA":"La mia risposta","task":"Allena tre obiezioni ad alta voce – con il tuo sponsor o un partner – e inserisci le tue tre obiezioni più difficili con la risposta."},
 kgesetze:{"lead":"Messaggi, colloqui e strategia per i veri grandi – network leader, responsabili vendite e apriporte. Tutto deriva da queste dieci frasi. Chi le infrange perde il re – di solito senza capire perché.","motto":"I re non si reclutano.","motto2":"Si scelgono.","pillars":[["Rispetto per il suo rischio","Ha più da perdere che da guadagnare. Dillo prima che lo pensi lui."],["Prova prima della visione","Un caso reale batte qualsiasi slide sul futuro."],["Selezione invece di pubblicità","Sei tu a verificare se lui è adatto – non il contrario."]],"lawsT":"Le 10 leggi dei re","laws":[["Scegli invece di reclutare.","Sei tu a verificare se è adatto – non il contrario. Chi fa pubblicità ha perso prima di parlare."],["Chi spiega di più perde status.","Domande invece di slide. Nel primo colloquio parli meno del 30 percento del tempo."],["Prova prima della visione.","Un commerciante reale, una transazione reale, un pagamento reale battono qualsiasi slide sul futuro. La visione solo quando la prova è solida."],["Prima il suo rischio.","Un re può perdere reputazione, team e contratto. Dillo apertamente prima che lo pensi lui."],["Calcola lui, non tu.","Ciò che calcola da solo, lo crede. Ciò che gli calcoli tu, lo mette in dubbio."],["Il marchio solo al secondo contatto.","Nessun nome di azienda al primo contatto – altrimenti cerca su Google prima di essere curioso. Se chiede direttamente, lo nomini."],["Pari rango per chi scrive.","Un re parla con un re o con la direzione. Mai con la terza fila."],["Solo scarsità vera.","La vostra capacità, il momento, la sua regione. Tutto ciò che è inventato lo smaschera – e il rispetto sparisce."],["Un colpo solo, preparato alla perfezione.","Nessun re senza dossier. Nessun colloquio senza un piano coerente."],["Saper andare via.","Con i re la disponibilità ad accettare un no è l’attrazione più forte."]],"useT":"Come usi la Classe dei Re","use":["Leggi una volta per intero le leggi dei re, la maturità per il trono, i tipi di re e la sequenza dei re. Determinano come si usa tutto il resto.","Prima di ogni re: crea il dossier, determina il tipo, scegli il messaggio adatto.","Compila sempre in modo individuale i campi tra [parentesi quadre]. Nessun messaggio parte senza modifiche.","«Condizione» significa: usa la frase solo se la condizione è dimostrabilmente soddisfatta."],"task":"Leggi ad alta voce le dieci leggi. Segna le due che finora hai infranto più spesso."},
 kreife:{"lead":"Un re ti concede un solo colpo. Se manca uno dei sei punti, non lo contatti – un re bruciato non torna e lo racconta in giro.","checkT":"Maturità per il trono: prima di contattare un re","check":[["Piano di remunerazione senza contraddizioni","Una versione originale aggiornata, un prezzo per prodotto, una matrice dei diritti. I professionisti leggono i piani come revisori dei conti."],["Caso di prova mostrabile","Un commerciante attivo, una transazione con attribuzione nel back office, una prova di pagamento – con il consenso della persona."],["Regola di capacità stabilita","Quanti re accompagnate personalmente fino al 09.01.2027? Consiglio: al massimo cinque. E la regola poi vale davvero."],["Direzione impegnata","Slot fissi per i colloqui con i re sono bloccati."],["Dossier completo, punteggio ≥ 8","Tipo, motivazione, mittente e occasione sono definiti."],["Canale di contatto ammesso","Relazione esistente, referenza o canale professionale. Nessun messaggio di massa."]],"dossT":"I tuoi dossier dei re","dossHint":"I dossier restano solo su questo dispositivo – non vengono mai trasmessi al controlling.","add":"Aggiungi re","addPh":"Nome del re","empty":"Ancora nessun dossier. Aggiungi il tuo primo re – per iniziare basta il nome.","edit":"Modifica","close":"Chiudi","del":"Elimina dossier","delSure":"Eliminare davvero?","fields":[["role","Nome & ruolo","Posizione, da quando, funzione pubblica"],["org","Organizzazione","Azienda, settore, regione"],["size","Dimensione","Organizzazione o rete – valori verificati e stimati separati"],["bind","Vincoli","Azienda attuale, presunte clausole di non concorrenza e di non storno"],["frust","Segnali di frustrazione","Cosa lo infastidisce adesso: dichiarazioni pubbliche, cambi, ritiro"],["verb","Collegamento","Chi conosce lui e voi? Contatti comuni come apriporte"],["sender","Mittente","Chi lo contatta – ed è di pari rango?"],["anlass","Occasione","Un motivo concreto e verificabile per farsi vivi ora"]],"typeL":"Tipo di re","motiveL":"Motivazione del re","stageL":"Fase","scoreL":"Punteggio del re","scoreDate":"Punteggio aggiornato il","scoreT":"Il punteggio del re · 0–2 punti per criterio","scoreCols":["Criterio","0","1","2"],"score":[["Rete & accesso ai decisori","scarsa","regionale","grande e diretta"],["Leadership","lupo solitario","piccolo team","guida altri leader"],["Affidabilità & ritmo","non chiara","altalenante","mantiene gli impegni"],["Tempo nei prossimi 30 giorni","nessuno","poco","pianificato con certezza"],["Motivazione imprenditoriale","cerca sicurezza","aperto","ragiona in strutture e rischio"]],"bands":[["8–10","Re A: contattare"],["5–7","approfondire il dossier"],["0–4","non contattare"]],"scoreNote":"Aggiorna il punteggio dopo ogni colloquio. Non ricavarlo mai dal numero di follower o da autodichiarazioni.","motT":"Le quattro motivazioni dei re","motLead":"Il denaro raramente è la motivazione – i re ce l’hanno già. Chi parla solo di soldi parla accanto al re.","motCols":["Motivazione","La riconosci da","La frase che colpisce"],"motives":[["Eredità","parla di «qualcosa che resta», successione, famiglia","Cosa resterà della tua organizzazione quando non sarai più tu a trainarla ogni giorno?",""],["Riconoscimento","palco, ranghi e premi sono importanti per lui","I primi che costruiscono questo saranno in prima fila a Francoforte.","Palco confermato dall’organizzatore"],["Libertà","frustrazione per la dipendenza da un’azienda o da un committente","Quanto dipende oggi il tuo reddito da un’unica azienda?",""],["Crescita","irrequieto, cerca il prossimo mercato","Dov’è adesso il tuo prossimo mercato?",""]],"task":"Spunta i sei punti della maturità per il trono. Poi crea il dossier per il tuo primo re e assegna il punteggio con onestà."},
 ktypen:{"lead":"Quasi ogni re appartiene a uno di cinque tipi. Il tipo lo stabilisci nel dossier – decide tono, messaggio e apriocchi.","rows":["La sua preoccupazione","Cosa lo muove","Tono","Apriocchi","Da evitare"],"types":[["I","Il re del network","tu","Top leader di un’altra azienda di network con una grande organizzazione.","Clausole contrattuali, la sua reputazione nella propria azienda, inquietudine nel team.","Un’aggiunta invece di un cambio. Una risposta al turnover e ai tanti nel suo team senza un reddito significativo.","Da leader a leader. Calmo, niente superlativi.","«La tua gente fa acquisti ogni mese. Su questi consumi oggi guadagnano tutti – tranne la tua organizzazione.»","Parlare male della sua azienda. Contattare liste del team. Pitch per farlo cambiare."],["II","Il responsabile di vendita strutturata & finanziaria","Lei o tu","Titolare o direttore di un’organizzazione di vendita finanziaria, assicurativa o strutturata.","Serietà, responsabilità, autorizzazioni e vigilanza, la sua reputazione presso i clienti.","Vantaggio per il cliente senza un ulteriore prodotto finanziario. Fidelizzazione tra un appuntamento di consulenza e l’altro. Documenti puliti.","Concreto e solido sui numeri. Forma di cortesia secondo la relazione.","«Lei vede il Suo cliente due volte l’anno. E se nel frattempo vivesse un’esperienza positiva con Lei ogni settimana?»","Rendimento, borsa o opzioni come argomento. Vocabolario da hype."],["III","L’imprenditore della vendita sul campo","tu","Titolare di una vendita porta a porta, energia, fotovoltaico, telecomunicazioni o POS.","Saturazione, pressione sui margini, turnover dei venditori, dipendenza da un solo committente.","Valore aggiuntivo dai contatti che il suo team fa comunque. Una seconda gamba.","Diretto, pratica invece di teoria.","«Il tuo team ogni giorno sta davanti a centinaia di porte e commercianti. Vieni pagato per un solo momento – la chiusura. Dopo, quel contatto per te non vale più nulla.»","Mettere in discussione il suo core business. Offrirgli di portargli via i venditori."],["IV","Il re apriporte","Lei","Franchisor, vertice di un’associazione, club di imprenditori, organizzatore di agenti di commercio, consulente con molti mandati di imprenditori.","La sua reputazione presso membri e clienti, neutralità, impegno, deontologia professionale.","Poter dare alla sua gente un vero valore aggiunto. Un pilota misurabile. Nessun ruolo da venditore.","Istituzionale, breve, con una proposta pilota concreta.","«Le Sue aziende hanno contatti con i clienti ogni giorno. Quanto di questa relazione con il cliente resta a loro dopo l’acquisto?»","Trasformarlo in un venditore. Mettere il guadagno in primo piano. E-mail di massa ai suoi membri."],["V","Il re a riposo","tu","Un tempo grande leader, oggi inattivo, deluso o tra due progetti.","Fallire di nuovo in pubblico. La sua credibilità. «Ancora una cosa nuova.»","Rispetto per la sua storia. Una ripartenza silenziosa senza annunci. Un ruolo invece di un rango.","Personale, di stima, senza pressione.","«Non devi dimostrare niente a nessuno. La domanda è solo se il tuo sapere oggi sta lavorando da qualche parte.»","Ricordargli i fallimenti. Annunci pubblici prima del pilota. Pressione."]],"task":"Stabilisci il tipo di ogni re nei tuoi dossier – e prima di ogni messaggio rileggi preoccupazione, tono e cose da evitare del suo tipo."},
 ksequenz:{"lead":"Sette fasi dal dossier al pilota. Ogni fase ha un obiettivo e un criterio di uscita. Chi salta una fase perde il re.","goalL":"Obiettivo","exitL":"Uscita","steps":[["Dossier","Giorno 0","Tipo, motivazione, mittente, occasione e punteggio sono definiti.","Punteggio sotto 8 → non contattare."],["Primo contatto","Giorno 1","Una risposta e un appuntamento di 20 minuti. Curiosità, nessun marchio.","Due follow-up senza reazione → parcheggiare per 90 giorni."],["Call di qualificazione","20 minuti","Lui racconta, tu verifichi. Aggiorna il punteggio.","Punteggio sotto 5 → parcheggiare con cortesia."],["Colloquio apriocchi","60 minuti","È lui a formulare la leva – con i suoi numeri.","Non vede alcuna leva → non insistere."],["Prova & direzione","45 minuti","Caso reale più verifica incrociata da parte della direzione.","Questione contrattuale o di condizioni aperta → pausa finché non è chiarita."],["Circolo dei fondatori","90 minuti","Impegno scritto al pilota con almeno cinque starter nominati e una data di inizio.","Nessun impegno entro 7 giorni → si riprende a gennaio."],["Pilota","14 giorni","Avvii, primi colloqui con commercianti, CP registrati.","La review decide: rollout o stop."]],"takt":"<b>Ritmo:</b> dalla fase 2 alla 6 idealmente 21 giorni. Più di 30 giorni senza fase successiva significa: il re non è nel processo, è in attesa.","stages":["Dossier","Contatto","Call","Apriocchi","Direzione","Circolo dei fondatori","Pilota","Avviato","Parcheggiato · con ripresa"],"pipeT":"La tua pipeline dei re","pipeHint":"Ogni re si trova in una sola fase – con una data e un passo successivo.","pipeCols":["Re","Punteggio","Fase","Passo successivo","Data"],"pipeEmpty":"Ancora nessun re. Aggiungili in «Maturità per il trono & dossier».","kpiT":"KPI","kpiCols":["KPI","Definizione","Ritmo"],"kpis":[["Dossier A","Re con punteggio ≥ 8 e dossier completo","settimanale"],["Primi contatti","primi messaggi inviati e adattati individualmente","settimanale"],["Tasso di risposta","risposte ÷ primi contatti","settimanale"],["Call","call di 20 minuti svolte","settimanale"],["Apriocchi","colloqui di 60 minuti svolti","settimanale"],["Impegni al pilota","per iscritto, con almeno cinque starter nominati e data di inizio","settimanale"],["Partner avviati","da piloti in corso","settimanale"],["CP registrati","da piloti, secondo il back office","settimanale"],["Re parcheggiati","con data di ripresa","mensile"]],"planT":"Ipotesi di pianificazione per le prime quattro settimane","plan":"15 dossier A → 10 primi contatti → 5 call → 3 colloqui apriocchi → 1–2 piloti","planNote":"È un’ipotesi, non un tasso misurato. Dopo quattro settimane sostituiscila con i vostri valori reali.","rhythmT":"Il ritmo settimanale","rhythm":[["Lunedì · 15 min","Review della pipeline: chi è dove? Chi tocca questa settimana? Quale re aspetta da troppo?"],["Venerdì · 15 min","Lezioni apprese: quale messaggio ha portato risposte, quale no? Adattare i testi, aggiornare il punteggio."]],"task":"Metti ogni re della tua pipeline in una sola fase – con passo successivo e data. Ogni lunedì e venerdì 15 minuti di review."},
 knachr:{"lead":"Il primo messaggio ha un solo compito: un colloquio di 20 minuti. Non informare, non convincere, non vendere.","forKing":"Per quale re?","manual":"Adatta [Nome] a mano","rulesT":"Le sei regole del primo contatto","rules":["Un’occasione concreta e verificabile – niente copia-incolla.","Nessun nome di azienda, nessun link, nessun PDF, nessun numero.","Curiosità invece di spiegazione: una domanda che non si è mai posto.","Massimo cinque frasi.","Un piccolo passo successivo: 20 minuti, due proposte di data.","Una via d’uscita: «Se non ti va, dimmelo pure.» Toglie pressione – e rende più facile rispondere."],"firstT":"Primo contatto · 9 modelli","first":[["5.1","Re del network","WhatsApp / DM · tu","Ciao [Nome], da un po’ seguo come guidi la tua organizzazione – soprattutto [occasione concreta]. Sto lavorando con pochi leader a qualcosa che non cambia nulla della tua attività attuale, ma risponde a una domanda che la maggior parte delle grandi organizzazioni non si pone mai: cosa succede in realtà ai consumi della tua gente? Ti vanno 20 minuti, da leader a leader? Se non ti va, dimmelo pure.","Riconoscimento attraverso un’occasione reale, una domanda a cui non sa rispondere subito, e parità invece di una richiesta."],["5.2","Re del network","Messaggio vocale · circa 45 sec","Ciao [Nome], sono [il tuo nome]. Ti mando apposta un vocale invece di un lungo testo. [Occasione in una frase]. Sto lavorando con alcuni leader a una cosa che non cambia nulla del tuo business, ma risponde a una domanda che trovo affascinante: cosa succede ai consumi nelle grandi organizzazioni? Non te lo spiego in un vocale – sentiamoci 20 minuti al telefono. E se non ti interessa, va benissimo. Fammi sapere.","La voce crea una vicinanza e un’autenticità che il testo non ha. Parla con calma, non leggere, niente tono da venditore."],["5.3","Responsabile di vendita strutturata & finanziaria","Messaggio · Lei","Buongiorno [Nome], La contatto in modo mirato perché ha costruito un’organizzazione con una vera fiducia dei clienti – [occasione concreta]. Lavoro con pochi titolari di reti vendita a un approccio che non richiede un ulteriore prodotto finanziario e può legare i clienti alla Sua organizzazione tra un appuntamento di consulenza e l’altro. Prima di mostrarLe qualcosa: avrebbe 20 minuti per verificare se per Lei è rilevante? [Giorno] o [giorno]?","Tocca la sua preoccupazione principale – nessun prodotto in più, nessuna responsabilità – e gli lascia il ruolo di chi verifica."],["5.4","Imprenditore della vendita sul campo","WhatsApp · tu","Ciao [Nome], una domanda veloce tra imprenditori: la tua gente ogni giorno sta davanti a centinaia di porte e commercianti. Vieni pagato per un solo momento – la chiusura. Sto lavorando con pochi titolari di reti vendita su quanto può valere quel contatto anche dopo, senza che cambi nulla del vostro core business. 20 minuti questa settimana? [Giorno] o [giorno]?","Riconosce subito un punto cieco nel suo stesso modello – e nessuno gli ha venduto nulla."],["5.5","Re apriporte","E-mail · Lei","Oggetto: Valore aggiunto per i Suoi [membri/partner in franchising] – proposta per un piccolo pilota\n\nGentile [titolo nome],\n\nLe scrivo perché [organizzazione] è sinonimo di [occasione concreta].\n\nStiamo lavorando a un modello con cui le aziende possono continuare a fidelizzare i propri clienti anche dopo l’acquisto – senza modificare il proprio core business. Per questo cerchiamo un piccolo numero di partner selezionati per un pilota misurabile con tre-cinque aziende.\n\nPosso presentarLe la proposta in 20 minuti? Dopo deciderà Lei se è un’opzione per i Suoi [membri].\n\nCordiali saluti\n[Nome] · [Funzione] · [Telefono]","Istituzionale, breve, chiaramente delimitato. Resta lui il decisore e non diventa un venditore. Solo a indirizzi professionali, inviato singolarmente."],["5.6","Re a riposo","WhatsApp · tu","Ciao [Nome], ripenso spesso al periodo in cui hai costruito [risultato concreto]. Non voglio venderti niente né convincerti di niente. Mi interessa la tua valutazione sincera su una cosa a cui sto lavorando con alcuni leader – perché non conosco quasi nessuno che capisca le strutture come te. Ti va un caffè o una call?","Chiedi il suo consiglio, non la sua partecipazione. Lo onora, abbassa le difese – e chi consiglia inizia a pensarci insieme."],["5.7","Presentazione calda: testo per chi raccomanda","WhatsApp · tu","[Nome re], vorrei metterti in contatto con [il tuo nome]. [Lui/Lei] sta costruendo qualcosa con pochi responsabili vendite e ho pensato subito a te – per via di [occasione]. Nessun pitch, credo solo che dovreste conoscervi. Posso mettervi in contatto?","La fiducia prestata è l’ingresso più forte. Prima chiedere, poi mettere in contatto – così si rispetta il re."],["5.8","La tua risposta dopo la presentazione","WhatsApp · tu","Grazie, [chi ti raccomanda]. [Nome], piacere mio. [Chi ti raccomanda] mi ha raccontato come [occasione]. Sarò breve: sentiamoci 20 minuti, così saprai se fa per te. [Giorno] o [giorno]?",""],["5.9","Richiesta di collegamento per contatti professionali","LinkedIn · max. 300 caratteri · Lei","[Nome], seguo il Suo lavoro presso [organizzazione] da [occasione]. Con pochi titolari di reti vendita sto costruendo un livello di ricavo aggiuntivo sulle relazioni con i clienti esistenti e mi farebbe piacere collegarmi – senza pitch.","Dopo: non fare subito un pitch dopo l’accettazione. Prima reagisci a un post, poi invia 5.3 o 5.4 adattato."]],"reactT":"Le prime reazioni · 14 risposte","reactLead":"Ogni risposta porta al colloquio – mai a una spiegazione in chat. Ciò che si spiega in chat viene giudicato in chat. E in chat perdi.","reactRules":["Ti chiedono direttamente dell’azienda? Nominala. Eludere sembra poco serio ai professionisti.","Niente numeri, niente PDF, niente link prima del colloquio. Un numero in chat è una promessa.","Al massimo due follow-up. Poi basta."],"react":[["6.1","«Di cosa si tratta?»","","Giusto. In una frase: si tratta di come le grandi organizzazioni possono trasformare i consumi quotidiani della loro gente in un livello di ricavo aggiuntivo – senza cambiare la propria attività. Tutto il resto in chat sarebbe sprecato. 20 minuti e saprai se è rilevante per te. [Giorno] o [giorno]?",""],["6.2","«Mandami qualche informazione.»","","Volentieri – ma solo quando so quali informazioni sono davvero rilevanti per te. Altrimenti ricevi 20 pagine, di cui 18 non si adattano alla tua organizzazione. Dammi 15 minuti, poi ti mando esattamente ciò che fa per te.",""],["6.3","«Quale azienda c’è dietro?»","","Best Prime con la piattaforma ePOINT. Il nome puoi cercarlo su Google – solo che non ti dice nulla del meccanismo di cui ti parlo. Quello te lo mostro in 20 minuti su un caso reale. Va bene [giorno]?","Importante: rispondere con onestà. Chi elude questa domanda è fuori."],["6.4","«È network marketing?»","","Sì, la parte vendite è organizzata come struttura di partner – preferisco dirtelo io subito. Ma per te l’interessante non è la struttura, è il meccanismo dietro: fidelizzazione dei clienti tramite acquisti reali presso i commercianti. Se fa per te lo verifichiamo in 20 minuti – senza slide.","Chi lo dice da sé toglie forza all’obiezione. Negarlo distruggerebbe ogni fiducia."],["6.5","«Sono vincolato da un contratto.»","","Bene che tu lo dica – lo prendo sul serio. Non voglio che tu abbia problemi per causa nostra. Nel colloquio guardiamo con attenzione cosa ti consente il contratto e, se serve, lo facciamo verificare. Se non va, te lo dico io stesso.","Questa frase crea più fiducia di qualsiasi presentazione. Proteggi lui – non la tua chiusura."],["6.6","«Non ho tempo.»","","Ti capisco – soprattutto nel tuo caso. Per questo ti chiedo 20 minuti e non un progetto. Se dopo non va, finisce lì. Meglio la prossima settimana, [giorno] o [giorno]?",""],["6.7","«Quanto guadagnerei?»","","Lo calcoliamo insieme con i tuoi numeri reali e il piano valido – non con esempi presi da internet. Tutto il resto non sarebbe serio. Porta tre numeri al colloquio, così lo vedi nero su bianco.","Importante: mai un numero in chat. Ciò che scrivi viene letto come una promessa."],["6.8","«Sembra interessante.»","","Mi fa piacere. Allora fissiamo subito: [giorno] alle [ora] o [giorno] alle [ora]? Dopo ti mando tre brevi domande per prepararti.",""],["6.9","Silenzio · follow-up 1","dopo 4 giorni","Ciao [Nome], ti riscrivo velocemente così non si perde in chat. Adesso no, più avanti o per niente? Tutte e tre le risposte vanno benissimo.",""],["6.10","Silenzio · follow-up 2 (ultimo messaggio)","dopo altri 7 giorni","[Nome], immagino che il momento non sia quello giusto – nessun problema. Non ti scriverò più. Se un giorno sarai curioso, sai dove trovarmi.","Importante: il messaggio è sincero – e proprio per questo spesso provoca una risposta. Dopo, non farti davvero più vivo."],["6.11","Conferma dell’appuntamento con tre numeri","","Perfetto, [giorno] alle [ora] è fissato. Per usare bene il tempo, porta per favore tre numeri indicativi:\n1) Quante persone sono attive nella tua organizzazione?\n2) Quante di loro hanno un reddito significativo?\n3) Quanti commercianti e imprenditori vede regolarmente il tuo team?\nBastano stime.","Chi si prepara ha investito. E inizia a fare i conti prima che parliate."],["6.12","Dopo il colloquio · riepilogo","","Grazie per il colloquio aperto. Mi restano impressi due punti: [punto 1] e [punto 2]. Prossimo passo come concordato: [azione concreta] il [data]. Se nel frattempo cambia qualcosa, fammi sapere.",""],["6.13","Parcheggiare con cortesia","","Grazie per la tua apertura. Per me è chiaro: adesso non è il momento – e va benissimo così. Mi farò vivo brevemente a [mese] per sapere se da te è cambiato qualcosa. Fino ad allora, tutto il meglio per [il suo progetto].",""],["6.14","Ripresa dopo 90 giorni","","Ciao [Nome], come promesso mi faccio vivo una volta. Dal nostro ultimo colloquio da noi è successo [sviluppo concreto e verificabile]. Oggi è un tema per te – o ancora no? Vanno bene entrambe le cose.","Condizione: invialo solo con uno sviluppo reale e verificabile."]],"task":"Per il tuo primo re A scegli il primo messaggio adatto al suo tipo, compila ogni parentesi quadra in modo individuale e fallo rileggere al tuo sponsor prima di inviarlo."},
 kgespr:{"lead":"Nel colloquio con un re parla lui, tu fai domande. Parli meno del 30 percento del tempo – fino alla prova.","aT":"A · La call di qualificazione · 20 minuti","aCols":["Minuto","Fase","Cosa dici o fai"],"a":[["0–2","Quadro","«Ho bloccato 20 minuti. Soprattutto voglio capire come sei organizzato. Alla fine ci diciamo entrambi sinceramente se ha senso continuare a parlarne. Va bene?»"],["2–12","Lui racconta","Le cinque domande diagnostiche qui sotto. Ascoltare, annotare, non commentare."],["12–17","Teaser","«Non ti mostro l’azienda, ma un calcolo – con i tuoi numeri. Per questo mi serve un’ora con te.»"],["17–20","Decisione","«Ha senso per te esaminarlo con i tuoi numeri?» Sì → fissare l’appuntamento. No → «Grazie, allora lasciamo stare.»"]],"diagT":"Le cinque domande diagnostiche","diag":["Quante persone sono davvero attive nella tua organizzazione?","Cosa ti frustra di più in questo momento?","Quante delle tue persone hanno un reddito significativo?","Cosa dovrebbe succedere perché tra un anno tu dica: è stato un anno forte?","Quanto sei libero contrattualmente se vuoi fare qualcosa in più?"],"bT":"B · Il colloquio apriocchi · 60 minuti","bCols":["Fase","Durata","Cosa succede"],"b":[["1 · Specchio","10 min","Riassumi ciò che ha detto nella call – con le sue parole. «Ti ho capito bene?»",""],["2 · Tre domande","15 min","Le tre domande apriocchi (qui sotto). Poi taci.",""],["3 · Il suo calcolo","15 min","Inserisce i suoi numeri. Calcolate con il piano valido – ogni risultato chiaramente indicato come scenario, mai come previsione.",""],["4 · La prova","10 min","Un caso reale: commerciante → cliente → acquisto → attribuzione → pagamento. Dal vivo nel back office, se possibile.",""],["5 · Ciò che era stato tenuto da parte","5 min","Solo quando chiede: guadagnare anche sugli acquisti dell’intera rete di partner.","solo come previsto dal piano valido"],["6 · Chiusura","5 min","Take-away invece di pressione (scarsità vera) e invito al circolo dei fondatori.",""]],"qT":"Le tre domande apriocchi","q":["Quante persone hai nella tua organizzazione – e quante di loro hanno un reddito significativo?","Cosa fanno comunque gli altri ogni mese? Fanno acquisti: alimentari, carburante, online.","Chi guadagna oggi su questi consumi? E se una parte restasse nella tua organizzazione – senza che nessuno dei tuoi debba vendere un prodotto?"],"silence":"<b>Regola del silenzio:</b> dopo la terza domanda taci per almeno cinque secondi. Chi parla per primo gli toglie la scoperta.","cT":"C · L’incontro con la direzione · 45 minuti","cSub":"È lui a verificare l’azienda – non voi lui.","c":[["Ogni domanda è ammessa:","struttura, pagamenti, piano, tempistiche, stato di ePAY."],["Nessuna risposta che non sia vera.","«Non lo so, lo chiarisco entro [data]» è più forte di qualsiasi bella risposta."],["Chiamare ePAY con il suo nome:","previsto per il 09.01.2027 – né più né meno."]],"task":"Prepara la tua prossima call: frase del quadro a memoria, le cinque domande diagnostiche su un foglietto, poi aggiorna il punteggio."},
 keinw:{"lead":"Dietro ogni obiezione di un re c’è una preoccupazione per reputazione, team o contratto. Rispondi alla preoccupazione, non alla frase.","behind":"Dietro:","goal":"Obiettivo:","search":"Cerca un’obiezione","items":[["«Ho già un’attività.»","paura della sostituzione","Proprio per questo parlo con te. Non deve sostituire nulla, ma costruire su ciò che hai già.","Cornice di aggiunta"],["«Ho già visto di tutto.»","stanchezza, scetticismo","Probabilmente hai visto molto. Per questo non ti mostro una presentazione, ma un caso reale. Se non ti convince, in dieci minuti abbiamo finito.","Prova invece di pitch"],["«Il mio team non vuole novità.»","paura dell’inquietudine","Allora non iniziare dal team. Inizia con cinque persone di cui ti fidi – 14 giorni, in silenzio. Poi decidi.","Piccolo pilota"],["«E se l’azienda non regge?»","rischio aziendale","Domanda legittima. Per questo prima di ogni decisione ti siedi con la direzione e fai proprio questa domanda.","Incontro con la direzione"],["«ePAY e la quotazione in borsa ci sono già?»","scetticismo sulla visione","No. ePAY è previsto per il 09.01.2027, la quotazione in borsa è un’intenzione. Non ti vendo nulla che non ci sia ancora – parliamo di ciò che funziona oggi.","Credibilità"],["«Quanto guadagnano i vostri top?»","vuole una prova","Prove di pagamento reali te le mostro nel colloquio – con il consenso della persona, niente screenshot dai gruppi. La domanda più importante comunque è: cosa risulta con i tuoi numeri?","Il suo calcolo"],["«Chi altro c’è?»","riprova sociale","Faccio nomi solo con il consenso – così come non passo il tuo. Gli altri li conoscerai nel circolo dei fondatori.","La riservatezza come valore"],["«Cosa ricevo io che gli altri non ricevono?»","accordo speciale","Nessun piano speciale – il piano vale per tutti, altrimenti non varrebbe nulla. Quello che ricevi: il mio tempo personale, un filo diretto con la direzione e un posto nel circolo dei fondatori.","L’equità come forza"],["«Devo parlarne con il mio partner.»","rassicurazione","Benissimo. Lo vediamo in tre? Così il tuo partner ha le stesse informazioni di prima mano.","Coinvolgere chi decide con lui"],["«Rifatti vivo tra tre mesi.»","non ora – oppure una scusa","Lo farò. Ancora una domanda, così so a cosa fare attenzione: cosa dovrebbe essere cambiato tra tre mesi perché faccia per te?","Scoprire il motivo vero"],["«Non è un sistema piramidale?»","questione di serietà","Domanda legittima – falla a ogni rete vendita. Il mio criterio: dietro ogni euro deve esserci un valore reale – un commerciante, un cliente, una prestazione. Verifichiamolo proprio su un caso reale e sul contratto, volentieri anche con il tuo avvocato.","Verifica invece di rassicurazioni"],["«Perché dovrei fidarmi di te?»","domanda di fondo","Non dovresti ancora. La fiducia nasce dalla prova – per questo facciamo un pilota invece di una grande decisione.","Pilota"]],"task":"Leggi ad alta voce le dodici obiezioni e allena le tre che il tuo prossimo re probabilmente solleverà."},
 kabschl:{"lead":"Urgenza sì. Scarsità inventata mai. I re hanno lavorato per anni con la pressione – la riconoscono dopo due frasi. Un trucco scoperto non costa un re, ma tutto il suo ambiente.","fomoT":"Scarsità vera: le quattro regole FOMO","fomo":[["La vostra capacità","«Fino a Francoforte accompagno personalmente al massimo cinque responsabili vendite.»","Ribalta lo status: adesso è lui a qualificarsi con te.","Regola stabilita e rispettata"],["Il momento","«Chi ha una struttura prima del lancio previsto di ePAY parte con un team invece che da solo.»","La vera logica di ogni avvio di mercato.","Formulare sempre ePAY come «previsto»"],["Settore & regione","«Il primo nel tuo settore che fidelizza commercianti e clienti, li ha.»","Logica di concorrenza che conosce dalla sua attività.","nessuna esclusiva territoriale che non sia nel contratto"],["Il palco","«Chi entro il 09.01. è partito in modo dimostrabile, a Francoforte sta in prima fila come membro fondatore.»","Per i re lo status attira più del denaro.","confermato dall’organizzatore"]],"okT":"Ammesso e tabù","okCols":["Ammesso","Tabù"],"ok":[["«Ne prendo solo cinque, perché accompagno ciascuno personalmente.»","«Solo tre posti rimasti!» – se non è vero"],["«Il pilota dura fino al [data]. Dopo decido con chi costruire nel 2027.»","Scadenze che poi vengono prorogate in silenzio"],["«Calcoliamo con i tuoi numeri.»","«Qui puoi fare 10.000 € al mese.»"],["«ePAY è previsto per il 09.01.2027.»","«ePAY è pronto» o «garantito»"],["«Chi arriva prima costruisce prima le relazioni.»","«Territorio esclusivo» senza contratto"],["Status, palco, ruolo, accompagnamento personale","Azioni, quotazione in borsa od opzioni come esca"]],"uwg":"Secondo la legge tedesca contro la concorrenza sleale (UWG), la falsa scarsità è un classico caso di pubblicità ingannevole – oltre al danno alla fiducia.","closeT":"Le chiusure dei re","close":[["9.1","La chiusura take-away","Colloquio · tu","Oggi non voglio convincerti. Fino a Francoforte accompagno personalmente al massimo cinque responsabili vendite, e prendo solo quelli per cui il pilota dimostra che funziona per entrambe le parti. Se vuoi, lo verifichiamo in 14 giorni con cinque dei tuoi. Se no, va benissimo – allora restiamo in contatto.","Con i re la disponibilità ad andarsene è l’attrazione più forte. Condizione: vale la regola di capacità."],["9.2","La chiusura pilota per gli apriporte","Colloquio · Lei","Non Le propongo un accordo quadro, ma un pilota con tre-cinque aziende per 14 giorni. Dopo deciderà Lei, sulla base dei numeri, se raccomandarlo ai Suoi [membri]. Le andrebbe bene un avvio il [data]?",""]],"gkT":"Il circolo dei fondatori di Francoforte","gkLead":"Nessun evento, nessuna presentazione: una sessione di lavoro chiusa in cui ogni re calcola con i propri numeri e alla fine decide da solo.","gkFacts":[["max. 8","responsabili vendite per sessione"],["90 min","sessione di lavoro, nessuno show"],["1 : 1","invitati personalmente"],["DIR","direzione al tavolo"]],"gkCritT":"Criteri di partecipazione – devono essere tutti soddisfatti","gkCrit":["Punteggio ≥ 8 dopo il colloquio apriocchi","Propria organizzazione con accesso ai decisori","Situazione contrattuale verificata e libera","Disponibilità a un pilota di 14 giorni con almeno cinque persone"],"gkFlowT":"Lo svolgimento · 90 minuti","gkCols":["Minuto","Cosa succede"],"gkFlow":[["0–10","Benvenuto da parte della direzione. Regole: riservatezza, nessuna presentazione, ogni domanda è ammessa."],["10–25","Il caso di prova dal vivo: commerciante, cliente, acquisto, attribuzione, pagamento."],["25–55","Sessione di lavoro: ognuno calcola con i propri numeri – come scenario, con il piano valido."],["55–75","Domande aperte alla direzione. Niente è tabù."],["75–90","Decisione: impegno al pilota o un no cortese. Poi brevi colloqui individuali."]],"gkChain":["Circolo dei fondatori","Pilota 14 giorni","Review","Rollout o stop","Palco 09.01."],"gkCond":"Annuncia il palco a Francoforte solo quando l’organizzatore lo ha confermato.","invT":"Gli inviti","inv":[["10.1","Invito al circolo dei fondatori","WhatsApp · tu","[Nome], dopo il nostro colloquio vorrei invitarti personalmente in un piccolo gruppo: al massimo otto responsabili vendite, 90 minuti, con la nostra direzione. Nessuna presentazione, ma una sessione di lavoro – ognuno calcola con i propri numeri, ogni domanda è ammessa. Alla fine ognuno decide per sé se avviare un pilota di 14 giorni. [Data], [luogo]. Ci sei?",""],["10.2","Invito al circolo dei fondatori","E-mail · Lei","Oggetto: Invito personale – circolo dei fondatori il [data]\n\nGentile [titolo nome],\n\ndopo il nostro colloquio desidero invitarLa personalmente a una piccola sessione di lavoro: al massimo otto imprenditori e responsabili vendite, 90 minuti, insieme alla nostra direzione.\n\nNon c’è alcuna presentazione. Ogni partecipante calcola con i propri numeri, ogni domanda è ammessa. Alla fine ognuno decide da sé se avviare un pilota di 14 giorni.\n\nData: [data, ora] · Luogo: [luogo]\n\nSarei lieto di averLa con noi.\n\nCordiali saluti\n[Nome]",""],["10.3","Accordo pilota dopo l’impegno","WhatsApp · tu","Come concordato, il [data] partiamo con il pilota di 14 giorni con te e [nomi dei cinque starter]. Misuriamo tre cose: avvii, primi colloqui con commercianti e CP registrati. Review il [data]. Poi decidi tu: rollout o stop. Non vedo l’ora.",""]],"task":"Metti per iscritto la tua regola di capacità – e usa solo scarsità la cui condizione è dimostrabilmente soddisfatta."},
 kkodex:{"lead":"I re capiscono da una sola parola se sei un venditore. Il tuo vocabolario è la tua prima prova.","swapT":"Il codice linguistico","swapCols":["Invece di","Di’"],"swap":[["occasione unica","un modello che stiamo verificando con poche persone"],["reddito passivo","un livello di ricavo continuativo che dipende dall’utilizzo reale"],["libertà finanziaria","una seconda gamba"],["Entra subito!","Verifichiamo se fa per te."],["opportunità di business","un livello di ricavo aggiuntivo per la tua organizzazione"],["costruire una downline","rafforzare la tua organizzazione esistente"],["Non abbiamo concorrenza.","Ti mostro un caso reale – giudica tu."],["Voglio presentarti qualcosa.","Voglio capire come sei organizzato."],["Guarda il video.","20 minuti, da leader a leader."],["garantito, sicuro","misurato, dimostrato nel pilota"],["Devi essere veloce.","Accompagno personalmente solo pochi."],["Borsa, azioni, opzioni come esca","non usare"]],"goodT":"Parole da re","good":["struttura","base esistente","leva","pilota","prova","verificare","decisore","livello di ricavo","pari rango","eredità","aggiunta invece di cambio"],"badT":"Parole tabù","bad":["occasione della vita","diventare ricchi","garantito","subito","solo oggi","esclusivo (senza contratto)","passivo","auto dei sogni","lifestyle"],"rulesT":"I paletti · otto regole, non negoziabili","rules":[["Nessuna promessa di reddito, rendimento o azioni.","Numeri solo dal piano valido, sempre indicati come scenario."],["Nessuna scarsità inventata.","Nessuna scadenza che poi viene prorogata."],["Nessuno storno tramite liste protette di team di altre aziende.","La situazione contrattuale del re viene verificata prima dell’avvio."],["Primo contatto solo tramite relazione esistente, referenza o canale professionale.","Nessun messaggio di massa (UWG, GDPR)."],["ePAY, borsa e opzioni solo come piano o intenzione.","Mai come esca."],["Nessun piano speciale per singoli re.","Il piano vale per tutti."],["Nessun nome di altri leader e nessuna prova di pagamento senza il loro consenso.",""],["Non parlare male di altre aziende","– nemmeno se lo fa il re stesso."]],"legal":"<b>Nessuna consulenza legale:</b> fai verificare legalmente documenti, formulazioni e presentazioni della remunerazione prima dell’uso.","cheatT":"Il promemoria · da leggere una volta prima di ogni colloquio con un re","cheat":[["L’atteggiamento","Scegliere, non fare pubblicità. Lui verifica l’azienda – tu verifichi lui. Parli meno del 30 percento."],["Il primo contatto","Occasione · curiosità · nessun marchio · cinque frasi · 20 minuti · una via d’uscita."],["Le tre domande","1. Quante delle tue persone hanno un reddito significativo? 2. Cosa fanno comunque gli altri ogni mese? 3. Chi guadagna oggi su questi consumi?"],["Le quattro scarsità vere","La vostra capacità · il momento prima del lancio previsto di ePAY · settore & regione · il palco il 09.01."],["La chiusura","«Oggi non voglio convincerti. … Se vuoi, lo verifichiamo in 14 giorni con cinque dei tuoi. Se no, va benissimo.»"],["Le regole di uscita","Punteggio sotto 8 → non contattare · 2 follow-up → parcheggiare · nessuna leva propria → non insistere · nessun impegno in 7 giorni → gennaio."],["Mai","promettere guadagni · inventare scarsità · numeri in chat · parlare male di altre aziende · stornare liste di team · vendere ePAY o la borsa come già pronti."]],"footer":["Rispetto per il suo rischio","Prova prima della visione","Selezione invece di pubblicità"],"task":"Leggi il promemoria prima di ogni colloquio con un re. Elimina le parole tabù dai tuoi modelli."}

scripts:{"warm":[["C1 · Amici & famiglia · il consiglio per risparmiare","Ciao [Nome], un consiglio veloce per risparmiare: da poco uso ePOINT, un’app gratuita con cui ricevi indietro dei soldi quando fai la spesa normalmente – anche da [negozio che la persona usa]. [Solo se vero: la settimana scorsa ho già ricevuto indietro …] Ti mando il link? Ci vogliono due minuti.","Prima dare, esperienza personale, passo piccolissimo."],["C2 · Conoscenti & colleghi · con un motivo","Ciao [Nome], qualche giorno fa mi hai raccontato che [motivo vero: tutto diventa più caro / ordinate molto online]. Io uso un’app che aiuta proprio in questo: ePOINT – gratuita, dal 3 al 30 % di cashback nei negozi e shop aderenti. Vuoi darci un’occhiata?","Riprendi ciò che la persona stessa ha detto."],["P1 · Amico / contatto caldo · selezionare invece di convincere","Ciao [Nome], ho avviato un’attività parallela attorno a un’app di cashback e ho pensato subito a te, perché [motivo vero]. Non so se fa per te – verifichiamolo in 15 minuti. Se no, va benissimo. Ti va meglio giovedì o sabato?","Rilevanza, atteggiamento di selezione, via d’uscita, domanda alternativa."],["P2 · Messaggio vocale · max. 40 secondi","Ciao [Nome], stavo proprio pensando a te, perché [motivo vero]. Ho costruito qualcosa in parallelo con Best Prime, attorno all’app di cashback ePOINT. Te lo mostro volentieri in 15 minuti – scrivimi quando ti va bene.","La tua voce crea una vicinanza che il testo non crea."],["P3 · Vecchio contatto · prima la relazione, poi il tema","Ciao [Nome], quanto tempo – come stai tu e [riferimento vero]? Ti scrivo anche perché sto costruendo qualcosa di nuovo nel lavoro e mi sei venuto in mente. Ma prima raccontami come va da te!","Prima l’interesse sincero apre la conversazione."],["P3b · Vecchio contatto · dopo la sua risposta","Bello! Sul mio tema: sono partner di Best Prime e sto contribuendo a costruire la rete vendite per l’app di cashback ePOINT. Ti va di vederla in 15 minuti?","Dire chiaramente di cosa si tratta – e chiedere un piccolo passo."],["P4 · Reazione a una storia o a un post","Ciao [Nome], ho visto che [storia o post]. Forte! Posso chiederti una cosa: in linea di principio saresti aperto a una seconda entrata, se si adatta alla tua quotidianità?","Un complimento sincero e una domanda di permesso invece di un pitch."],["P5 · Referenza","Ciao [Nome], [chi ti raccomanda] mi ha consigliato di contattarti, perché [motivo]. Si tratta di ePOINT e dell’attività di vendita con Best Prime. Hai 15 minuti questa settimana?","Fiducia prestata – nomina sempre per primo chi ti ha raccomandato."]],"cold":[["V1 · Venditore · alla pari","Ciao [Nome], hai accesso a persone e aziende – proprio per questo ti scrivo. Con Best Prime sto costruendo un campo di vendita attorno all’app di cashback ePOINT. Non si tratta di sostituire la tua attività, ma di aggiungere una leva in più ai tuoi contatti. 15 minuti la prossima settimana?","Tono tra pari, vantaggio chiaro per la sua attività attuale."],["V2 · Responsabile vendite · a livello di struttura","Ciao [Nome], per te diventa interessante non a livello di singole chiusure, ma a livello della tua struttura. Vorrei verificare con te se ePOINT è adatto come fonte di ricavo aggiuntiva per i tuoi partner – a carte scoperte su vantaggio per il cliente, impegno e remunerazione. Hai 20 minuti la prossima settimana?","Si rivolge al ruolo, non alla singola vendita. Per i veri re: usa la Classe dei Re."],["M1 · Associazione o community (Lei)","Buongiorno [Nome], Lei segue [associazione o community] con molti membri. Ho una proposta che porta ai Suoi membri un vantaggio reale e a Lei non costa nulla: un’app di cashback con cui si ricevono indietro soldi facendo acquisti normalmente. Posso mostrarLe in 10 minuti come potrebbe funzionare – inizialmente come piccolo progetto pilota?","Valore aggiunto per la sua gente, nessun rischio, un piccolo pilota."],["M2 · Imprenditore, a freddo (Lei · di persona, LinkedIn, Xing)","Buongiorno [Nome], mi sono imbattuto in Lei tramite [riferimento concreto]. Sono partner di Best Prime e con l’app di cashback ePOINT sto costruendo una rete di imprenditori che vogliono offrire ai propri contatti un vero valore aggiunto. Non so se fa per Lei – vorrei verificarlo con Lei in 10 minuti. Sarebbe possibile un breve scambio la prossima settimana?","Riferimento concreto, atteggiamento di selezione, ingresso facile."],["H1 · Commerciante, a freddo (Lei)","Buongiorno [Nome], La contatto in modo molto mirato. Con ePOINT stiamo costruendo un ecosistema di commercianti e clienti e cerchiamo aziende con un flusso di clienti rilevante. Non voglio spiegarLe nulla al telefono – vorrei solo verificare in 10 minuti se ha senso per la Sua azienda.","Rispetto per il suo tempo, verificare invece di vendere."],["H2 · Commerciante, caldo","Hai una clientela che acquista regolarmente da te. Proprio per questo ePOINT è interessante: i tuoi clienti ricevono cashback da te e tornano – e tu fai parte di una rete di commercianti più grande. Posso mostrarti in 10 minuti come funziona nel tuo negozio?","Prima il suo vantaggio: il ritorno dei suoi clienti."],["T1 · Apertura telefonica","Ciao [Nome], hai due minuti? … Ti chiamo perché ho iniziato qualcosa di nuovo e mi sei venuto in mente subito. Non voglio spiegartelo di fretta – con uno schermo in 15 minuti funziona molto meglio. Ti va meglio domani sera o nel weekend?","Breve, personale, un appuntamento invece di una spiegazione."]],"fu":[["Dopo 2 giorni senza risposta","Ciao [Nome], ti riscrivo nel caso il mio messaggio sia finito sotto: hai 15 minuti questa settimana?","Ricordare con delicatezza, senza pressione."],["Dopo 5 giorni senza risposta","Ciao [Nome], ti riscrivo una volta per bene: ti interessa in linea di principio, lo riprendiamo più avanti, o non fa per te? Tutte e tre le risposte vanno benissimo.","Una decisione con via d’uscita."],["Dopo un buon primo colloquio","Grazie per lo scambio! Per te i punti più importanti erano [punto 1] e [punto 2]. Prossimo passo: [azione concreta]. Ti va bene [giorno, ora]?","Fissare ciò che è stato concordato."],["Ancora incerto","Qual è l’unico punto che al momento ti trattiene dal fare un passo avanti? Allora chiariamo proprio quello, invece di ripassare tutto da capo.","Scoprire il motivo vero."],["Al “più avanti” concordato","Ciao [Nome], mi avevi detto di rifarmi vivo [momento]. Adesso va meglio?","Mantenere la parola."],["Dopo un no chiaro","Grazie per la risposta chiara. Non ti scriverò più su questo. E se un giorno vuoi l’app come cliente, fammi sapere. Tutto il meglio!","Mantenere la relazione – nessun follow-up sull’attività."]]},

 start:{"sprint":"Tvoj sprint od 72 sata","started":"pokrenut {d}","expired":"završio","tl":["0–15 min profil + sustav","15–30 potencijal","30–45 pristup","72 h razgovor"],"quote":["Ne moraš znati sve prije nego što kreneš.","Moraš razumjeti dovoljno da sigurno pokreneš sljedeći smisleni korak."],"task":"Prolazi module redom. Ne preskači zadatke. Znanje bez aktivnosti ne vrijedi kao završen start. Zlatni krug u izborniku znači: kriterij ispunjen – tada označi modul kao završen.","lead":"Ova Akademija nije knjiga za čitanje. Ona je tvoj radni plan i tvoj onboarding-kovčeg: vodiči, predlošci i kalkulatori – i svaka faza završava konkretnom radnjom. Sve što uneseš automatski se sprema.","cards":["Objasniti sustav u 60 sekundi, osobno koristiti ePOINT, razumjeti nagrađivanje i stav iza svakog kontakta.","Izgraditi listu od 100 potencijalnih kontakata, odrediti prioritet TOP 10 i prepoznati mrežne poluge.","Odabrati pravi predložak, aktivirati kontakte, voditi razgovore i iskreno odgovarati na prigovore.","Ponoviti isti jednostavni proces pokretanja sa sljedećim partnerom.","Za lidere: poruke, razgovori i strategija za network lidere, voditelje prodaje i otvarače vrata."],"rulesT":"Tri pravila za cijeli FastTrack","rules":[["Aktivnost prije teorije","Čitaj samo ono što ti treba za sljedeći korak. Onda djeluj."],["Nikad ne počinješ sam","Tvoj sponzor unutar 24 sata s tobom obavlja početni poziv i zajedno s tobom šalje prvu poruku."],["Zapiši ili se nije dogodilo","Pamćenje nije CRM. Sve ide u aplikaciju."]]},

 system:{"lead":"Tko ne može jednostavno objasniti sustav, ne može ga čisto prenijeti dalje. Zato je ova faza obavezna.","flow":["Prodajni partner","Trgovac","Kupci","Korištenje","Povratak"],"tr":"Trener od 60 sekundi","trHint":"Pokreni štopericu i naglas objasni cijeli sustav bez čitanja. Zaustavi kad završiš. Cilj: najmanje 3 čista ponavljanja ispod 60 sekundi.","start":"Start","stop":"Stop","reset":"Poništi","reps":"valjana ponavljanja (≤ 60 s)","best":"najbolje vrijeme","ready":"spreman za provjeru leadera","short":"Prekratko – objasni cijeli sustav","valid":"{s} s – valjano ponavljanje","long":"{s} s – predugo, još jednom kraće","sys":[["ePOINT","Live · Trgovci & kupci","Besplatna aplikacija za povrat novca: tko kupuje kod partnerskih trgovaca u blizini ili u više od 1.000 web-shopova, dobiva natrag 3 do 30 % i može dati isplatiti saldo na račun."],["Best Prime","Aktivno · Prodaja & rast","Prodajna organizacija i zajednica koja ePOINT čini poznatim – među kupcima, trgovcima i novim partnerima. Ovdje dobivaš obuku, alate i svog sponzora."],["ePAY","Planirano · Plaćanje & korištenje","Razina plaćanja i transakcija, planirana za 09.01.2027. Ne obećavaj ništa što još nije aktivno."]],"ben":[["Za kupca",["novac natrag za kupnje koje ionako obavlja","besplatno, bez pretplate","u blizini i online u jednoj aplikaciji"]],["Za trgovca",["vjernost i povratak kupaca","dio veće mreže trgovaca","digitalni odnos s kupcem"]],["Za partnera",["jednokratna provizija za zaključak","stalno nagrađivanje iz korištenja aktivnih kupaca","izgradnja organizacije i dupliciranje"]]],"coreL":"Tvoje objašnjenje u 60 sekundi","core":"„Znaš li ePOINT? To je besplatna aplikacija za povrat novca. Kupuješ sasvim normalno – u trgovinama u blizini ili u više od 1.000 web-shopova – i dobivaš natrag 3 do 30 posto, izravno na račun. Partner sam u Best Prime, prodajnoj organizaciji iza toga. Ljudima pokazujem aplikaciju, pridobivam trgovce i gradim tim. Za to sam nagrađen prema službenom planu: jednokratno za zaključke i trajno iz korištenja mojih kupaca. A s ePAY-em je planirano i rješenje za plaćanje. Da ti brzo pokažem aplikaciju?“","coreWhy":"Počinje pitanjem, prvo objašnjava korist za slušatelja, otvoreno kaže što ti od toga imaš i završava malim sljedećim korakom.","appT":"Prvo je sam koristi – tvoj zadatak za 1. dan","appLead":"Tko je sam jednom dobio povrat novca, više ne treba skriptu. Iskustvo pobjeđuje objašnjenje.","app":["Aplikacija ePOINT instalirana i registrirana","Pronašao tri partnerska trgovca u blizini","Obavio prvu kupnju s povratom novca"],"task":"Instaliraj aplikaciju ePOINT i koristi je sam. Zatim objasni cijeli sustav bez čitanja u najviše 60 sekundi – dok ne bude jasno, mirno i bez žargona."},
 check:{"lead":"Znanje o proizvodu vrijedi samo ako jednostavnim jezikom stigne do sugovornika. Odgovori bez materijala.","right":"Točno.","wrong":"Ne baš – pogledaj sustav još jednom.","selfRight":"Odlično – onda na provjeru kod leadera.","selfWrong":"Onda još jednom prođi modul „Sustav u 60 sekundi”.","qrule":"<b>Pravilo kvalitete:</b> cijene, naknade, značajke proizvoda i tržišni podaci koriste se samo iz aktualnih službenih Best Prime materijala ili back officea. Bez starih snimki zaslona i izmišljenih brojeva.","unlock":"Otključavanje","unlockHint":"Tek kada tvoj leader potvrdi tvoje objašnjenje od 60 sekundi, prelaziš na rad s potencijalom.","leaderOk":"Moj leader{l} potvrdio je moje objašnjenje od 60 sekundi","unlocked":"Otključano za fazu 2","locked":"Još nije otključano","kcT":"Brza provjera: odgovori slobodno","kcHint":"Na svako pitanje odgovori naglas. Zatim usporedi s oglednim odgovorom i označi ono što znaš.","kcShow":"Ogledni odgovor","kcCan":"Mogu slobodno odgovoriti","kc":[["Što kupac dobiva od ePOINT-a i koliko ga to košta?","3 do 30 % povrata novca kod trgovaca koji sudjeluju u blizini i u više od 1.000 web-shopova, isplativo na račun. Aplikacija je besplatna, bez pretplate."],["Što je Best Prime?","Prodajna organizacija koja ePOINT čini poznatim – među kupcima, trgovcima i novim partnerima. Ovdje dobivaš obuku, alate i svog sponzora."],["Što je ePAY i od kada će biti dostupan?","Planirano rješenje za plaćanje, planirano za 09.01.2027. – danas još nije upotrebljivo."],["Za što si nagrađen – a za što ne?","Prema službenom planu: jednokratno za zaključke (paketi novih partnera) i trajno iz korištenja aktivnih kupaca. Ne za poruke, razgovore ili puke registracije."],["Koji je tvoj prvi korak s novim kontaktom?","Odrediti odgovara li kao kupac, partner ili multiplikator – i osobnom porukom zamoliti za mali sljedeći korak."]]},

 warm:{"note":"Kod kopiranja ili otvaranja u WhatsAppu odabrani kontakt u pipelineu automatski dobiva status „NOVO”. Prije slanja prilagodi predložak svom stilu.","doT":"Ovo funkcionira","dontT":"Ovo izbjegavaj","task":"Prilagodi jedan predložak svom stilu i pošalji ga 2 prijatelja / poznanika i 1 toplom kontaktu.","f4T":"Formula od 4 rečenice – sastavi svoju poruku","f4":[["Kontekst","Zašto ti?"],["Relevantnost","Zašto zanimljivo?"],["Znatiželja","Ne objašnjavaj sve"],["Sljedeći korak","10 min / sastanak"]],"copy4":"Kopiraj moju poruku","fill4":"Prvo ispuni četiri rečenice","lead":"Prva poruka ima točno jedan cilj: malo da za sljedeći korak. Ne objašnjavaj, ne uvjeravaj. U dvojbi počni s pozivom u besplatnu aplikaciju.","f4Hint":"Izlaz na kraju („Ako ne, sasvim u redu“) nije fraza iz pristojnosti: tko se osjeća slobodno, lakše kaže da. I pitaj s dvije opcije umjesto „Imaš li kad vremena?“.","chanT":"Pravi kanal","chan":[["Glasovna poruka","za tople kontakte. Tvoj glas stvara blizinu. Najviše 40 sekundi."],["Poziv","ako si closer ili osobu dobro poznaješ."],["Tekst","za vrlo zauzete, hladne kontakte i praćenje."]],"ansT":"Tri tipična odgovora","ans":[["„Što je to točno?“","Iskreno u dvije rečenice, pa natrag na sastanak: „Ukratko: ePOINT je besplatna aplikacija za povrat novca, a ja s Best Prime gradim prodaju za nju. Što bi to moglo značiti za tebe, radije ću ti pokazati za 15 minuta nego u romanu. Kad ti odgovara?“"],["„Zvuči zanimljivo.“","Odmah sastanak s dvije opcije. Ne objašnjavaj dalje."],["„Nisam zainteresiran.“","„Hvala na iskrenom odgovoru! Ako jednom poželiš aplikaciju kao kupac, samo javi.“ Status „Nema interesa“, bez daljnjeg praćenja vezano uz posao."]],"do":["prava osobna poveznica","korist upravo za tu osobu","znatiželja umjesto zatrpavanja informacijama","mali korak s dvije opcije za sastanak","predložak preveden tvojim riječima"],"dont":["kopiraj-zalijepi bez poveznice","dugi romani o provizijama","nagovještaji o zaradi","pritisak ili „samo danas“","izbjegavanje kad netko izravno pita za tvrtku"]},
 cold:{"lead":"Profesionalcima, poduzetnicima i trgovcima ne treba trik. Treba im relevantnost, poštovanje njihova vremena, razgovor u ravnini i nizak prag za sljedeći korak.","rulesT":"Pravila za profesionalce i poduzetnike","rules":["Konkretan, provjerljiv povod – bez kopiraj-zalijepi.","Najviše pet rečenica, bez brojki, bez PDF-a, bez linka.","Mali sljedeći korak: 10 do 20 minuta, dva prijedloga termina.","Kontakt samo osobno, preko preporuke ili poslovnih kanala kao što su LinkedIn i Xing. Bez masovnih e-mailova, bez nenaručenih reklamnih poziva."],"kingT":"Pravi voditelji prodaje? Koristi Kraljevsku klasu.","king":"Za network lidere, voditelje strukturne i terenske prodaje i otvarače vrata vrijede posebna pravila: dosje, bodovi, tip, vlastite poruke i dramaturgija razgovora.","kingBtn":"U Kraljevsku klasu","task":"Odaberi 2 prodajna kontakta + 2 poduzetnika ili trgovca. Istraživanje po kontaktu najviše 5 minuta. Zatim se javi."},
 pipe:{"lead":"Prodaja gubi brzinu kad razgovori ostanu otvoreni. Svaki kontakt treba status i sljedeći korak s datumom.","steps":[["1 · Prvi kontakt","Provjeri relevantnost, dogovori kratak sastanak. Ne objašnjavaj sve u chatu."],["2 · Sastanak","Pitanja prije objašnjavanja: resursi, kupci, timovi, pristup trgovcima."],["3 · Follow-up","Nikad „javi se”. Uvijek zabilježi datum ili odluku."],["4 · Dokumentacija","Pamćenje nije CRM. Odmah dokumentiraj."]],"empty":"Ovdje se pojavljuju tvoji TOP kontakti i svi kojima si se javio.","cols":["Kontakt","Status","Sljedeći korak","Datum","Odgovorio"],"nextPh":"npr. sastanak 15 min","task":"Svakom aktivnom kontaktu postavi jasan status: NOVO · SASTANAK · FOLLOW-UP · ODLUKA · POKRENUTO. Crveno označeni datumi su prekoračeni.","rhythmT":"Dva pravila za praćenje","rhythm":["Svaki otvoreni kontakt ima datum za sljedeći korak.","Nakon dvije poruke praćenja bez odgovora: pauza. Nakon jasnog ne: bez praćenja vezano uz posao."]},
 talk:{"pL":"Partner / mreža","mL":"Trgovac / tvrtka","qT":"5 ključnih pitanja","mq":["Koliko otprilike imate kupaca?","Koliki je udio stalnih kupaca?","Kako danas vežete kupce?","Koliko vas košta pridobivanje kupca?","Koje dodatne lokacije / mreže postoje?"],"flow":["1. Razumjeti","2. Svrstati","3. Objasniti prikladno","4. Sljedeći korak"],"quote":["Prvo razumij potrebu. Zatim objasni korist.","Što više pričaš prije analize potreba, veća je opasnost da argumentiraš mimo stvarne poluge."],"prot":"Zapisnik razgovora","f":["Kontakt / tvrtka","Najveća poluga","Najveće otvoreno pitanje","Sljedeći korak + termin"],"save":"Spremi razgovor","saved":"Razgovor spremljen","cols":["Datum","Kontakt","Poluga","Otvoreno pitanje","Sljedeći korak"],"del":"Obriši","lead":"Dobar razgovor je dijagnoza, a ne predavanje. 20 do 30 minuta – a na kraju uvijek stoji jasan sljedeći korak, čak i ako je to „nema interesa“.","phT":"Tijek","ph":[["Postaviti okvir","2 min","„Drago mi je da je uspjelo. Moj prijedlog: prvo ti postavim nekoliko pitanja, onda ti pokažem o čemu se radi, a na kraju mi iskreno kažeš je li to za tebe. Može?“"],["Pitanja","5–8 min","Motiv, vrijeme, mogućnosti – ključna pitanja u nastavku. Slušati, bilježiti."],["Pokazati","5 min","„Smijem li ti brzo pokazati kako je sam koristim?“ – aplikacija uživo i tvoja priča."],["Svrstati","5 min","„Prema onome što si ispričao, tebi najviše odgovara …, jer …“ – kupac, partner, trgovac ili multiplikator."],["Odlučiti","3 min","Jedno od zaključnih pitanja u nastavku – i sastanak s datumom."]],"phNote":"Zašto je okvir tako važan: tko na početku čuje da je ne dopušten, poslije opušteno sluša – umjesto da se iznutra brani.","pq":["Što bi se moralo dogoditi da ti se ovako nešto isplati?","Koliko vremena bi realno mogao uložiti tjedno?","S koliko ljudi si redovito u kontaktu – i radiš li radije sam ili u timu?","Koje branše / regije možeš otvoriti?","Bi li radije sam proizvodio ili gradio organizaciju?"],"storyT":"Tvoja priča u 60 sekundi","storyHint":"Pričaj samo istinu. Još nemaš rezultat? Onda je tvoj okidač tvoja priča.","story":["Prije – gdje sam bio?","Okidač – što me učinilo znatiželjnim?","Sada – što radim, što sam sam doživio?","Zašto ti to pokazujem"],"storyCopy":"Kopiraj priču","storyEmpty":"Ispuni četiri dijela – ovdje nastaje tvoja priča.","closeT":"Zaključna pitanja – otvoreno i iskreno","close":[["Ljestvica","„Na ljestvici od 1 do 10 – koliko ti je to zanimljivo?“ Od 6: „Što ti nedostaje do 10?“ Ispod 5: „Onda ostavimo posao – bi li ti aplikacija kao kupcu odgovarala?“"],["Fokus","„Što ti se od toga najviše sviđa?“"],["Odabrati put","„Želiš li prvo početi kao kupac ili odmah kao partner?“"],["Razjasniti","„Što bi moralo biti razjašnjeno da možeš odlučiti?“"],["Termin","„Onda obavimo tvoj početni poziv s mojim sponzorom – odgovara li utorak u 19 h ili srijeda u 18 h?“"]],"trioT":"Razgovor u troje s tvojim sponzorom","trio":"Prvih tjedana tvoj sponzor sudjeluje u važnim razgovorima, a ti učiš slušajući. Ovako ga predstavljaš – samo s istinitim podacima:","edif":"„{s} se time bavi već [razdoblje] i jako mi je olakšao početak. Uključio sam ga jer može bolje od mene odgovoriti na tvoja pitanja.“","trioRole":"Tvoja uloga: uvesti, slušati, bilježiti. Nakon toga u dvoje razgovarate o tome što je bilo dobro.","task":"Unutar 72 sata vodi barem jedan kvalificirani razgovor s pravom analizom potreba – najbolje kao razgovor u troje sa svojim sponzorom."},
 sprint:{"lead":"Brzina nastaje kada su učenje i djelovanje izravno povezani.","sc":"Tvoj scoreboard 72 h","scHint":"Automatski se izračunava iz tvoje liste, pipelinea i razgovora.","k":["Imena na listi potencijala","TOP kontakti prioritizirani","Javljanja kontaktima","Odgovori / reakcije","Kvalificirani razgovori","Jasni sljedeći koraci"],"quote":["Prva 72 sata ne odlučuju o tvojoj karijeri.","Ali često odlučuju hoće li motivacija postati stvarno kretanje."],"task":"Nijedan partner ne završava startni sprint samo s „pogledao Academy”. Završetak = Academy + stvarna aktivnost."},

 dup:{"notT":"NE radiš","insT":"UMJESTO TOGA radiš","title":"Tvoj prvi zadatak dupliciranja","partner":"Ime tvog novog partnera","cols":["Korak","Termin","Gotovo"],"link":"Kopiraj link Academy za partnera","linkHint":"Svaki partner radi sa svojim napretkom.","lead":"Tvoj posao raste kad novi partner postane aktivan u prvih 48 sati – upravo s ovim FastTrackom, ne s vlastitom verzijom.","callT":"Početni poziv: 30 minuta, unutar 24 sata","callCols":["Minuta","Što radite","Rezultat"],"call":[["0–5","Razjasniti zašto i cilj, početni tip, vrijeme tjedno","Motiv je jasan"],["5–10","Instalirati aplikaciju ePOINT, registrirati se, pokazati partnerske trgovce u blizini","Partner je i sam korisnik"],["10–15","Jednom pokazati objašnjenje u 60 sekundi, jednom ga dati ponoviti","Objašnjenje otprilike sjedi"],["15–25","Zapisati 10 imena, dodijeliti K/P/M, jedan predložak preoblikovati vlastitim riječima","Lista je pokrenuta"],["25–30","Zajedno poslati prvu poruku, odrediti termine za 3. i 7. dan","Prva poruka je poslana"]],"weekT":"Tvoja pratnja u 1. tjednu","week":["<b>1. dan:</b> početni poziv","<b>2. dan:</b> kratka poruka: „Koliko imena već imaš?“","<b>3. dan:</b> provjera od 10 minuta: lista, TOP 10, prvi odgovori","<b>4. do 6. dan:</b> razgovori u troje s prvim zainteresiranima","<b>7. dan:</b> pregled od 15 minuta s brojkama"],"flow":["1. Početni poziv","2. Aplikacija + sustav","3. 100 + TOP 10","4. Obraćanje","5. Akcija 72 h"],"not":["sve umjesto novog partnera","svaki kontakt sam","višesatne posebne obuke","pritisak kad zapne"],"ins":["prve korake zajedno","pokazati, pa pustiti da radi","isti FastTrack za svakoga","novi početni poziv umjesto prigovora"],"quote":["Ne „Koliko ljudi mogu sam dosegnuti?“","Nego „Koliko lako to moj sljedeći partner može ponoviti?“"],"task":"Čim tvoj prvi novi partner krene, unutar 24 sata obavi početni poziv i provedi ga točno kroz ovaj FastTrack – ne kroz vlastitu verziju."},
