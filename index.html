<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FastTrack">
<title>Vertriebs-FastTrack</title>
<meta name="theme-color" content="#0b1a22">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Poppins:wght@400;500;600;700&display=swap">
<style>
/* Layout: Arbeits-App – Sidebar mit 4 Phasen / 19 Modulen + optionale Königsklasse (9 Module) links, Arbeitsfläche rechts; mobil Top-Bar + Modul-Drawer + Weiter-Leiste */
:root{
  --bg:#0b1a22; --panel:#11252e; --panel2:#17313c; --line:#24434f;
  --fg:#e9f2f4; --muted:#8ea6ae; --teal:#48bdc8; --teal-d:#289bad; --gold:#d9b45c;
  --ok:#5fcf9a; --warn:#e3a54c; --bad:#e07a6f;
  --display:"Anton","Impact","Arial Narrow",sans-serif;
  --body:"Poppins","Segoe UI",system-ui,-apple-system,Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:15px;line-height:1.55;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--teal)}
h1,h2,h3{text-wrap:balance;margin:0}
h1{font-family:var(--display);font-weight:400;font-size:clamp(30px,5vw,46px);line-height:1.02;letter-spacing:.01em;text-transform:uppercase}
h2{font-family:var(--display);font-weight:400;font-size:22px;letter-spacing:.02em;text-transform:uppercase}
h3{font-size:16px;font-weight:600}
p{margin:0}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--teal)}
.muted{color:var(--muted)}
.small{font-size:13px}
.tab{font-variant-numeric:tabular-nums}

/* App shell */
.app{display:grid;grid-template-columns:290px minmax(0,1fr);min-height:100vh}
.side{background:var(--panel);border-right:1px solid var(--line);padding:22px 16px;position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;gap:18px}
.brand{font-weight:700;font-size:15px;letter-spacing:-.01em}
.brand .p{color:var(--teal)}.brand .sep{color:var(--muted);padding:0 4px}
.me{display:flex;align-items:center;gap:12px}
.ring{width:54px;height:54px;flex:none}
.ring circle{fill:none;stroke-width:6}
.ring .bgc{stroke:var(--line)}.ring .fgc{stroke:var(--gold);stroke-linecap:round;transition:stroke-dashoffset .4s}
.ring text{fill:var(--fg);font:600 13px var(--body)}
.phase{display:flex;flex-direction:column;gap:2px}
.phase-h{display:flex;justify-content:space-between;font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:0 8px 4px}
.nav{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:8px;cursor:pointer;color:var(--fg);font-size:14px}
.nav:hover{background:var(--panel2)}
.nav.on{background:var(--panel2);box-shadow:inset 3px 0 0 var(--teal)}
.dot{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line);flex:none;display:grid;place-items:center;font-size:11px;color:var(--muted)}
.dot.done{background:var(--ok);border-color:var(--ok);color:#0b1a22}
.dot.auto{border-color:var(--gold);color:var(--gold)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:6px}

.main{min-width:0;padding-block:28px 110px;padding-inline:clamp(16px,4vw,48px)}
.wrap{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.topbar{display:none}

/* Elements */
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;min-width:0}
.card.hi{border-color:var(--teal-d);background:linear-gradient(160deg,#143843,#11252e)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.lead{font-size:16px;color:var(--muted);max-width:62ch}
.task{border-left:3px solid var(--gold);background:#1a2b2a;border-radius:0 10px 10px 0;padding:14px 16px}
.task b{color:var(--gold);letter-spacing:.08em;font-size:12px;text-transform:uppercase;display:block;margin-bottom:3px}
.quote{font-family:var(--display);font-size:22px;line-height:1.2;text-transform:uppercase;letter-spacing:.01em;color:var(--fg)}
.quote small{display:block;font-family:var(--body);text-transform:none;font-size:14px;color:var(--muted);margin-top:6px;letter-spacing:0}
.label{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--teal);margin-bottom:6px}
ul.clean{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
ul.clean li{padding-left:16px;position:relative}
ul.clean li:before{content:"";position:absolute;left:0;top:.62em;width:7px;height:7px;border-radius:50%;background:var(--teal)}
ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--panel2);border-radius:9px;padding:9px 14px;cursor:pointer;font-weight:500;font-size:14px;text-decoration:none;color:var(--fg)}
.btn:hover{border-color:var(--teal)}
.btn.pri{background:var(--teal);border-color:var(--teal);color:#08161c;font-weight:600}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#1a1405;font-weight:600}
.btn.ghost{background:none}
.btn.sm{padding:6px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

input[type=text],input[type=number],input[type=date],select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-size:14px}
textarea{min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--teal)}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>span{font-size:13px;color:var(--muted)}

.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:500;background:var(--panel2);cursor:pointer}
.pill.on{background:var(--teal);color:#08161c;border-color:var(--teal)}
.badge{display:inline-block;border-radius:999px;padding:2px 9px;font-size:11px;font-weight:600;letter-spacing:.04em}
.b-ok{background:rgba(95,207,154,.15);color:var(--ok)}
.b-warn{background:rgba(227,165,76,.15);color:var(--warn)}
.b-mut{background:var(--panel2);color:var(--muted)}

.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:8px;border-bottom:1px solid var(--line)}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
td input,td select{padding:6px 8px}

.stars{display:inline-flex;gap:3px}
.stars button{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);background:none;cursor:pointer;font-size:12px;color:var(--muted)}
.stars button.on{background:var(--teal-d);border-color:var(--teal-d);color:#fff}

.flow{display:flex;gap:8px;flex-wrap:wrap}
.flow span{flex:1 1 120px;text-align:center;border:1px solid var(--line);border-radius:8px;padding:10px 6px;font-weight:600;font-size:13px;background:var(--panel)}

.kpi{display:flex;flex-direction:column;gap:2px}
.kpi b{font-family:var(--display);font-weight:400;font-size:34px;line-height:1;color:var(--gold)}
.kpi span{font-size:12px;color:var(--muted)}

.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--teal);border-radius:99px;transition:width .3s}

.script{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px}
.script .t{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--teal)}
.script p{font-size:14.5px}
.script mark{background:rgba(217,180,92,.18);color:var(--gold);border-radius:3px;padding:0 3px}

.opt{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:9px;padding:10px 12px;cursor:pointer;background:var(--bg)}
.opt.sel{border-color:var(--teal)}
.opt.right{border-color:var(--ok);background:rgba(95,207,154,.08)}
.opt.wrong{border-color:var(--bad);background:rgba(224,122,111,.08)}

.timer{font-family:var(--display);font-size:72px;line-height:1;color:var(--fg);font-variant-numeric:tabular-nums}
.timer.run{color:var(--teal)}.timer.over{color:var(--bad)}

.modfoot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:18px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--gold);color:#1a1405;padding:9px 16px;border-radius:9px;font-weight:600;font-size:14px;z-index:60;box-shadow:0 6px 20px rgba(0,0,0,.4)}

.listrow{display:grid;grid-template-columns:34px minmax(0,1.2fr) minmax(0,1.3fr) 130px 120px 34px;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.listrow .n{color:var(--muted);font-size:12px}
.iconbtn{width:30px;height:30px;border-radius:7px;border:1px solid var(--line);background:none;cursor:pointer;color:var(--muted)}
.iconbtn:hover{color:var(--bad);border-color:var(--bad)}

.cert{border:2px solid var(--gold);border-radius:16px;padding:32px;background:radial-gradient(circle at 85% 10%,rgba(72,189,200,.16),transparent 55%),var(--panel);text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.cert .lv{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.cert .lv span{border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:600;font-size:13px;color:var(--muted)}
.cert .lv span.on{border-color:var(--gold);color:var(--gold)}

/* Koffer + Königsklasse */
.b-bad{background:rgba(224,122,111,.15);color:var(--bad)}
.b-teal{background:rgba(72,189,200,.14);color:var(--teal)}
.cond{display:inline-block;border:1px solid #8f7fd6;color:#b7a9f2;border-radius:999px;padding:1px 9px;font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.nohead thead{display:none}
td.num,th.num{text-align:right}
tr.sel td{background:rgba(217,180,92,.10)}
.opttag{font-size:9.5px;letter-spacing:.08em;color:var(--gold);border:1px solid rgba(217,180,92,.5);border-radius:999px;padding:1px 6px;margin-left:4px}
.kingph .nav .dot{border-color:rgba(217,180,92,.5);color:var(--gold)}
.kingcard{border-color:var(--gold)!important;background:linear-gradient(160deg,#2a2614,#11252e)!important}
.kpmtag{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:6px;background:var(--panel2);color:var(--teal);font-size:11px;font-weight:700;margin-left:4px}
.fillbox{white-space:pre-wrap;background:var(--bg);border:1px dashed var(--line);border-radius:10px;padding:12px 14px;min-height:46px;font-size:14.5px}
.result{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:4px}
.result .big{font-family:var(--display);font-weight:400;font-size:34px;line-height:1.1;color:var(--gold)}
details.acc{border:1px solid var(--line);border-radius:10px;background:var(--panel)}
details.acc>summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;align-items:center;gap:12px;font-weight:600;font-size:14.5px}
details.acc>summary::-webkit-details-marker{display:none}
details.acc .pl{margin-left:auto;width:24px;height:24px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;flex:none;color:var(--teal)}
details.acc[open] .pl{transform:rotate(45deg)}
details.acc .accb{padding:0 14px 14px;display:flex;flex-direction:column;gap:10px}
.num{font-family:var(--display);color:var(--gold);font-size:20px;min-width:24px;flex:none;font-weight:400}
.phase-row{display:flex;gap:14px;align-items:flex-start}
.law{position:relative}
.lawn{font-family:var(--display);color:var(--gold);font-size:24px;line-height:1;display:block;margin-bottom:6px;flex:none;min-width:30px}
.roman{font-family:var(--display);color:var(--gold);font-size:30px;line-height:1}
.kingtype th{width:150px;font-size:10.5px;vertical-align:top;border-bottom:1px solid var(--line)}
.seq{position:relative}
.seqstep{display:flex;gap:14px;align-items:flex-start}
.seqn{width:38px;height:38px;border-radius:50%;border:2px solid var(--gold);color:var(--gold);display:grid;place-items:center;font-family:var(--display);font-size:18px;flex:none}
.kingrow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg)}
.kingrow.on{border-color:var(--gold)}
.kingedit{border-color:var(--gold);margin-top:-4px}
.pill.badw{text-decoration:line-through;color:var(--bad);cursor:default}
.kfooter{justify-content:space-between;border-top:1px solid var(--line);padding-top:14px;font-family:var(--display);font-size:18px;text-transform:uppercase;letter-spacing:.02em}
.cheatlast{grid-column:1 / -1}
.kingtpl p{font-size:14.5px}

.welcome{max-width:760px;margin:0 auto;padding-block:clamp(28px,7vh,80px) 60px;padding-inline:16px;display:flex;flex-direction:column;gap:26px}
.steps4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.steps4 div{padding:14px 12px;border-right:1px solid var(--line)}
.steps4 div:last-child{border-right:0}
.steps4 b{display:block;font-size:12px;letter-spacing:.08em;color:var(--teal)}
.steps4 span{font-size:13px;color:var(--muted)}

.langs{display:flex;flex-wrap:wrap;gap:4px}
.langs button{border:1px solid var(--line);background:none;border-radius:6px;padding:3px 7px;font-size:11px;font-weight:600;letter-spacing:.06em;cursor:pointer;color:var(--muted)}
.langs button.on{background:var(--teal);border-color:var(--teal);color:#08161c}
.topbar .langsel{width:auto;padding:5px 8px;font-size:13px}
.mobnav{display:none}
.overlay{display:none}

@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;left:0;top:0;bottom:0;width:min(86vw,320px);z-index:50;transform:translateX(-105%);transition:transform .25s;padding-top:calc(22px + env(safe-area-inset-top,0px))}
  .side.open{transform:none}
  .overlay.open{display:block;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:40}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 16px}
  .main{padding-block:20px 110px}
  .grid2,.grid3,.grid4,.steps4{grid-template-columns:minmax(0,1fr)}
  .steps4 div{border-right:0;border-bottom:1px solid var(--line)}
  .listrow{grid-template-columns:28px minmax(0,1fr) 34px;row-gap:6px}
  .listrow .ctx,.listrow .cat,.listrow .kpm{grid-column:2 / 3}
  .kingrow{grid-template-columns:minmax(0,1fr);}
  .kingtype th{width:auto}
  .mobnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--panel);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));gap:10px}
  .mobnav .btn{flex:1}
  .timer{font-size:56px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{.side,.topbar,.mobnav,.modfoot,.noprint{display:none!important}.app{display:block}body{background:#fff;color:#000}}
</style>
</head>

scripts:{
 warm:[
  ["K1 · Freunde & Familie · der Spartipp","Hey [Name], kurzer Spartipp: Ich nutze seit Kurzem ePOINT, eine kostenlose App, mit der du beim normalen Einkaufen Geld zurückbekommst – auch bei [Shop oder Geschäft, das die Person nutzt]. [Nur wenn wahr: Ich hab letzte Woche schon … zurückbekommen.] Soll ich dir den Link schicken? Dauert zwei Minuten.","Erst geben, eigenes Erleben, winziger Schritt."],
  ["K2 · Bekannte & Kollegen · mit Anlass","Hi [Name], du hattest neulich erzählt, dass [echter Anlass: alles teurer wird / ihr viel online bestellt]. Ich nutze selbst eine App, die da hilft: ePOINT – kostenlos, 3 bis 30 % Cashback bei teilnehmenden Shops und Geschäften. Willst du sie dir mal anschauen?","Du greifst auf, was die Person selbst gesagt hat."],
  ["P1 · Freund / warmer Kontakt · sortieren statt überreden","Servus [Name], ich hab nebenbei ein Geschäft rund um eine Cashback-App gestartet und musste sofort an dich denken, weil du [echter Grund]. Ich weiß nicht, ob es was für dich ist – lass es uns in 15 Minuten prüfen. Wenn nicht, auch völlig okay. Passt dir Donnerstag oder eher Samstag?","Relevanz, Sortier-Haltung, Ausweg, Alternativfrage."],
  ["P2 · Sprachnachricht · max. 40 Sekunden","Hey [Name], ich hab gerade an dich gedacht, weil du [echter Grund]. Ich hab nebenbei mit Best Prime etwas aufgebaut, rund um die Cashback-App ePOINT. Ich zeig’s dir gern in 15 Minuten – schreib mir einfach, wann es dir passt.","Deine Stimme schafft Nähe, die Text nicht schafft."],
  ["P3 · Alter Kontakt · erst Beziehung, dann Thema","Hey [Name], lange nichts gehört – wie geht’s dir und [echter Bezug]? Ich melde mich auch, weil ich gerade beruflich etwas Neues aufbaue und du mir dabei eingefallen bist. Aber erzähl erst mal, was bei dir los ist!","Echtes Interesse zuerst öffnet das Gespräch."],
  ["P3b · Alter Kontakt · nach seiner Antwort","Klingt gut! Zu meinem Thema: Ich bin Partner bei Best Prime und baue den Vertrieb für die Cashback-App ePOINT mit auf. Magst du es dir in 15 Minuten anschauen?","Klar sagen, worum es geht – und um einen kleinen Schritt bitten."],
  ["P4 · Reaktion auf Story oder Post","Hey [Name], ich hab gesehen, dass du [Story oder Post]. Stark! Darf ich dich was fragen: Bist du grundsätzlich offen für ein zweites Standbein, wenn es zu deinem Alltag passt?","Ehrliches Kompliment und eine Erlaubnisfrage statt eines Pitches."],
  ["P5 · Empfehlung","Hallo [Name], [Empfehlungsgeber] hat mir empfohlen, mich bei dir zu melden, weil du [Grund]. Es geht um ePOINT und die Vertriebstätigkeit bei Best Prime. Hast du diese Woche 15 Minuten?","Geliehenes Vertrauen – nenne den Empfehlungsgeber immer zuerst."]],
 cold:[
  ["V1 · Vertriebsmensch · auf Augenhöhe","Servus [Name], du hast Zugang zu Menschen und Unternehmen – genau deshalb melde ich mich. Ich baue mit Best Prime ein Vertriebsfeld rund um die Cashback-App ePOINT auf. Es geht nicht darum, dein Geschäft zu ersetzen, sondern deine Kontakte um einen zusätzlichen Hebel zu erweitern. 15 Minuten nächste Woche?","Peer-Ton, klarer Nutzen für sein bestehendes Geschäft."],
  ["V2 · Vertriebskopf · auf Strukturebene","Servus [Name], spannend wird es bei dir nicht auf Ebene einzelner Abschlüsse, sondern auf Ebene deiner Struktur. Ich möchte mit dir prüfen, ob ePOINT als zusätzliches Ertragsfeld für deine Partner passt – mit offenen Karten zu Kundennutzen, Aufwand und Vergütung. Hast du nächste Woche 20 Minuten?","Spricht die Rolle an, nicht den Einzelverkauf. Für echte Könige: Königsklasse nutzen."],
  ["M1 · Verein oder Community (Sie)","Guten Tag [Name], Sie betreuen [Verein oder Community] mit vielen Mitgliedern. Ich habe einen Vorschlag, der Ihren Mitgliedern einen echten Vorteil bringt und Sie nichts kostet: eine Cashback-App, mit der man beim normalen Einkaufen Geld zurückbekommt. Darf ich Ihnen in 10 Minuten zeigen, wie das aussehen könnte – zunächst als kleiner Pilot?","Mehrwert für seine Leute, kein Risiko, kleiner Pilot."],
  ["M2 · Unternehmer, kalt (Sie · persönlich, LinkedIn, Xing)","Guten Tag [Name], ich bin über [konkreter Bezug] auf Sie aufmerksam geworden. Ich bin Partner bei Best Prime und baue mit der Cashback-App ePOINT ein Netzwerk aus Unternehmern auf, die ihren Kontakten einen echten Mehrwert bieten wollen. Ob das für Sie passt, weiß ich nicht – ich würde es gern in 10 Minuten mit Ihnen prüfen. Wäre nächste Woche ein kurzer Austausch möglich?","Konkreter Bezug, Sortier-Haltung, niedriger Einstieg."],
  ["H1 · Händler, kalt (Sie)","Guten Tag [Name], ich melde mich sehr gezielt bei Ihnen. Wir bauen aktuell mit ePOINT ein Händler- und Kundenökosystem auf und suchen dafür Unternehmen mit relevantem Kundenverkehr. Ich möchte Ihnen nichts am Telefon erklären – ich würde nur gern in 10 Minuten prüfen, ob das für Ihr Unternehmen überhaupt Sinn ergibt.","Respekt vor seiner Zeit, Prüfen statt Verkaufen."],
  ["H2 · Händler, warm","Du hast einen Kundenstamm, der regelmäßig bei dir einkauft. Genau deshalb ist ePOINT spannend: Deine Kunden bekommen bei dir Cashback und kommen wieder – und du bist Teil eines größeren Händlernetzwerks. Darf ich dir in 10 Minuten zeigen, wie das im Laden aussieht?","Sein Nutzen zuerst: Wiederkehr seiner Kunden."],
  ["T1 · Telefon-Einstieg","Hi [Name], hast du gerade zwei Minuten? … Ich ruf an, weil ich etwas Neues angefangen habe und du mir sofort eingefallen bist. Ich will dir das nicht zwischen Tür und Angel erklären – mit Bildschirm geht das in 15 Minuten viel besser. Passt dir morgen Abend oder eher am Wochenende?","Kurz, persönlich, Termin statt Erklärung."]],
 fu:[
  ["Nach 2 Tagen ohne Antwort","Hi [Name], kurz nachgehakt, falls meine Nachricht untergegangen ist: Hast du diese Woche 15 Minuten?","Sanft erinnern, ohne Druck."],
  ["Nach 5 Tagen ohne Antwort","Hi [Name], ich hake einmal sauber nach: Ist das grundsätzlich interessant, sollen wir es später aufnehmen, oder passt es nicht? Alles drei ist völlig okay.","Entscheidung mit Ausweg."],
  ["Nach einem guten Erstgespräch","Danke dir für den Austausch! Für dich waren vor allem [Punkt 1] und [Punkt 2] wichtig. Nächster Schritt: [konkrete Aktion]. Passt dir [Tag, Uhrzeit]?","Festhalten, was vereinbart ist."],
  ["Noch unsicher","Was ist aktuell der eine Punkt, der dich davon abhält, einen nächsten Schritt zu machen? Dann klären wir genau den, statt alles noch einmal durchzugehen.","Den echten Grund erfahren."],
  ["Zum vereinbarten „später“","Hi [Name], du hattest gesagt, ich soll mich [Zeitpunkt] wieder melden. Passt es jetzt besser?","Wort halten."],
  ["Nach einem klaren Nein","Danke dir für die klare Antwort. Ich melde mich dazu nicht weiter. Und falls du die App als Kunde mal willst, sag einfach Bescheid. Alles Gute!","Beziehung erhalten – kein Nachfassen zum Geschäft."]]

m:{

 coreL:"Deine 60-Sekunden-Erklärung",
 core:"„Kennst du ePOINT? Das ist eine kostenlose Cashback-App. Du kaufst ganz normal ein – bei Geschäften vor Ort oder in über 1.000 Onlineshops – und bekommst 3 bis 30 Prozent zurück, direkt aufs Konto. Ich bin Partner bei Best Prime, der Vertriebsorganisation dahinter. Ich zeige Menschen die App, gewinne Händler und baue ein Team auf. Dafür werde ich nach einem offiziellen Plan vergütet: einmalig für Abschlüsse und laufend aus der Nutzung meiner Kunden. Und mit ePAY ist eine Zahlungslösung geplant. Soll ich dir die App mal kurz zeigen?“",
 coreWhy:"Beginnt mit einer Frage, erklärt zuerst den Nutzen für den Zuhörer, nennt offen, was du davon hast, und endet mit einem kleinen nächsten Schritt.",

 kc:[["Was bekommt ein Kunde von ePOINT, und was kostet es ihn?","3 bis 30 % Cashback bei teilnehmenden Händlern vor Ort und in über 1.000 Onlineshops, auszahlbar aufs Konto. Die App ist kostenlos, ohne Abo."],["Was ist Best Prime?","Die Vertriebsorganisation, die ePOINT bekannt macht – bei Kunden, Händlern und neuen Partnern. Hier bekommst du Ausbildung, Werkzeuge und deinen Sponsor."],["Was ist ePAY, und ab wann gibt es das?","Die geplante Zahlungslösung, geplant für den 09.01.2027 – heute noch nicht nutzbar."],["Wofür wirst du vergütet – und wofür nicht?","Nach dem offiziellen Plan: einmalig für Abschlüsse (Pakete neuer Partner) und laufend aus der Nutzung aktiver Kunden. Nicht für Nachrichten, Gespräche oder bloße Registrierungen."],["Was ist dein erster Schritt mit einem neuen Kontakt?","Festlegen, ob Kunde, Partner oder Multiplikator passt – und mit einer persönlichen Nachricht um einen kleinen nächsten Schritt bitten."]],

 talkT:"So sprichst du über Geld",talkQ:"„Verdient wird einmalig an Abschlüssen und laufend an der Nutzung deiner Kunden. Wie viel, hängt davon ab, was du tust. Ich zeige dir den offiziellen Plan.“",

 openBtn:"Fragen an den Sponsor kopieren",

haltung:{lead:"Menschen reagieren nicht auf Informationen, sondern auf die Haltung, mit der du kommst. Wer bittet, wird abgewimmelt. Wer prüft, ob es passt, wird ernst genommen.",
 core:"„Ich habe etwas Gutes, ich suche die Menschen, für die es passt – und ich habe Zeit, sie zu finden.“",coreL:"Deine Haltung in einem Satz",
 pT:"Die 10 Prinzipien",whyL:"Warum es wirkt",howL:"So setzt du es ein",lineL:"Rote Linie",
 p:[["Sortieren statt überzeugen","Druck löst Abwehr aus. Wer offen prüft, wirkt souverän und vertrauenswürdig.","„Ich weiß nicht, ob das was für dich ist – lass es uns kurz prüfen.“","Keine künstliche Verknappung."],
  ["Neugier vor Information","Eine offene Frage im Kopf will beantwortet werden. Wer alles im Chat erklärt, lädt zum Urteil ohne Gespräch ein.","Im ersten Text nur Thema, Bezug und kleiner nächster Schritt. Details im Gespräch.","Worum es geht, ist immer klar. Fragt jemand direkt nach der Firma, nennst du sie."],
  ["Relevanz schlägt Reichweite","Menschen reagieren auf das, was sie betrifft.","Jede Nachricht hat einen echten „weil du …“-Satz.","Keine erfundenen Anlässe."],
  ["Wer fragt, führt","Menschen glauben, was sie selbst sagen. Fragen machen den Bedarf sichtbar.","Erst fragen, dann zeigen. Dein Redeanteil liegt unter einem Drittel.","Keine Suggestivfragen, die nur ein Ja zulassen."],
  ["Kleine Ja-Schritte","Ein kleines Ja fällt leichter als ein großes – und wer zusagt, bleibt eher dabei.","Immer nur den nächsten kleinen Schritt erfragen: 10 Minuten, ein Blick auf die App, ein Termin.","Kein Ja durch Überrumpeln."],
  ["Erleben schlägt Erklären","Eine eigene Erfahrung überzeugt mehr als jede Folie.","App live zeigen, deinen eigenen Cashback-Beleg zeigen.","Keine fremden oder geschönten Ergebnisse."],
  ["Erst geben","Wer etwas geschenkt bekommt, ist offener. Die App ist kostenlos – ein echter Tipp.","Mit dem Kundennutzen einsteigen, bevor du über das Geschäft sprichst.","Kein „Geschenk“ mit versteckter Bedingung."],
  ["Augenhöhe statt Bitte","Wer sich entschuldigt, macht sich klein. Vertriebsprofis respektieren nur den Ton unter Gleichen.","Ruhig, klar, ohne „Sorry, dass ich störe“.","Keine Arroganz, nie andere Firmen schlechtmachen."],
  ["Ein Nein ist eine Information","Wer Absagen persönlich nimmt, hört auf. Wer sie zählt, wird besser.","Danken, Status setzen, nächster Kontakt.","Nach einem klaren Nein kein Nachfassen."],

 listT:"Die 12 häufigsten Einwände",search:"Einwand suchen, z. B. Zeit, Geld, Schneeball",none:"Kein passender Einwand. Frag deinen Sponsor – und trag die Antwort unten ein.",behind:"Steckt oft dahinter:",
 items:[["„Ich hab keine Zeit.“","Angst vor Aufwand","Du bestimmst das Tempo. Wie viel Zeit hättest du realistisch pro Woche? Dann schauen wir ehrlich, ob das reicht."],
  ["„Ich kann nicht verkaufen.“","Angst vor Ablehnung","Musst du auch nicht. Du zeigst eine kostenlose App, die du selbst nutzt – das ist eher Empfehlen als Verkaufen. Und am Anfang führt dein Sponsor die Gespräche mit."],
  ["„Ich kenne niemanden.“","unterschätztes Netzwerk","Lass uns 10 Minuten zusammen dein Handy durchgehen – dann sehen wir es."],
  ["„Ist das ein Schneeballsystem?“","Sorge vor Betrug","Gute Frage, die solltest du stellen. Es ist Direktvertrieb mit einem echten Produkt: Kunden nutzen eine kostenlose App und bekommen Cashback, Händler binden ihre Kunden. Vergütet wird für Abschlüsse und für die Nutzung echter Kunden nach einem offiziellen Plan. Ich zeig dir die Unterlagen, dann prüfst du selbst."],
  ["„Ist das Network-Marketing?“","Vorbehalt gegen die Branche","Ja, die Vertriebsseite ist als Partnerstruktur aufgebaut – das sage ich dir lieber gleich selbst. Spannend ist aber die Mechanik dahinter: Kundenbindung über echte Einkäufe bei Händlern. Ob das zu dir passt, prüfen wir in 15 Minuten."],
  ["„Was kostet das?“","Risiko abschätzen","Als Kunde nichts. Als Partner gibt es Einstiegspakete – die genauen Preise zeige ich dir aus den aktuellen offiziellen Unterlagen, nicht aus dem Kopf."],
  ["„Was verdienst du damit?“","sucht einen Beweis","Ehrlich: [wahre Antwort, z. B. „Ich stehe noch am Anfang“]. Entscheidend ist, wie der Plan funktioniert und was du daraus machst – den zeige ich dir."],
  ["„Schick mir mal Infos.“","höfliches Ausweichen oder echtes Interesse","Mach ich gern – aber erst, wenn ich weiß, welche Infos für dich relevant sind. Was interessiert dich mehr: die App als Kunde oder das Geschäft? Lass uns danach 10 Minuten telefonieren. Donnerstag oder Freitag?"],
  ["„Ich muss darüber nachdenken.“","eine offene Frage","Klar. Damit du gut nachdenken kannst: Welcher Punkt ist für dich noch offen? (Dann einen Termin für die Rückmeldung vereinbaren.)"],
  ["„Ich muss mit meinem Partner sprechen.“","gemeinsame Entscheidung","Sehr gut. Wollen wir das nächste Gespräch zu dritt machen? Dann hat dein Partner dieselben Infos aus erster Hand."],
  ["„Cashback-Apps gibt es viele.“","Vergleich","Stimmt. Probier sie einfach aus, sie kostet nichts: 3 bis 30 % bei teilnehmenden Händlern vor Ort und in über 1.000 Onlineshops, auszahlbar aufs Konto."],
  ["„Ist ePAY schon verfügbar?“","Neugier auf Neues","Nein. ePAY ist für den 09.01.2027 geplant. Was du heute nutzen kannst, ist die ePOINT-App – die zeig ich dir."]],

/* ---------- Königsklasse (Königsbibel, Stand 25.10.2026) ---------- */
kgesetze:{lead:"Nachrichten, Gespräche und Strategie für die ganz Großen – Network-Leader, Vertriebsköpfe und Türöffner. Alles folgt aus diesen zehn Sätzen. Wer sie bricht, verliert den König – meist ohne zu merken, warum.",
 motto:"Könige wirbt man nicht an.",motto2:"Man wählt sie aus.",
 pillars:[["Respekt vor seinem Risiko","Er verliert mehr, als er gewinnen kann. Sprich es aus, bevor er es denkt."],["Beweis vor Vision","Ein echter Fall schlägt jede Zukunftsfolie."],["Auswahl statt Werbung","Du prüfst, ob er passt – nicht umgekehrt."]],
 lawsT:"Die 10 Königsgesetze",
 laws:[["Wähle aus, statt zu werben.","Du prüfst, ob er passt – nicht umgekehrt. Wer wirbt, hat verloren, bevor er spricht."],["Wer mehr erklärt, verliert Status.","Fragen statt Folien. Dein Redeanteil im ersten Gespräch liegt unter 30 Prozent."],["Beweis vor Vision.","Ein echter Händler, eine echte Transaktion, eine echte Auszahlung schlagen jede Zukunftsfolie. Vision erst, wenn der Beweis sitzt."],["Sein Risiko zuerst.","Ein König kann Ruf, Team und Vertrag verlieren. Sprich das aus, bevor er es denkt."],["Er rechnet, nicht du.","Was er selbst ausrechnet, glaubt er. Was du ihm vorrechnest, zweifelt er an."],["Marke erst im zweiten Kontakt.","Kein Firmenname im Erstkontakt – sonst googelt er, bevor er neugierig ist. Fragt er direkt, nennst du ihn."],["Gleichrang beim Absender.","Ein König spricht mit einem König oder mit der Geschäftsleitung. Nie mit der dritten Reihe."],["Nur echte Knappheit.","Eure Kapazität, der Zeitpunkt, seine Region. Alles Erfundene durchschaut er – und dann ist der Respekt weg."],["Ein Schuss, perfekt vorbereitet.","Kein König ohne Dossier. Kein Gespräch ohne widerspruchsfreien Plan."],["Gehen können.","Die Bereitschaft, ein Nein zu akzeptieren, ist bei Königen der stärkste Sog."]],
 useT:"So nutzt du die Königsklasse",use:["Lies die Königsgesetze, Thronreife, Königstypen und Königssequenz einmal komplett. Sie bestimmen, wie alles andere eingesetzt wird.","Vor jedem König: Dossier anlegen, Typ bestimmen, passende Nachricht wählen.","Felder in [eckigen Klammern] immer individuell füllen. Keine Nachricht geht ungeändert raus.","„Bedingung“ heißt: Satz nur verwenden, wenn die Bedingung nachweislich erfüllt ist."],
 task:"Lies die zehn Gesetze laut. Markiere die zwei, gegen die du bisher am häufigsten verstoßen hast."},
kreife:{lead:"Ein König gibt dir einen Schuss. Fehlt einer der sechs Punkte, wird nicht angesprochen – ein verbrannter König kommt nicht zurück und erzählt es weiter.",
 checkT:"Thronreife: bevor du einen König ansprichst",
 check:[["Vergütungsplan widerspruchsfrei","Eine aktuelle Originalfassung, ein Preis je Produkt, eine Anspruchsmatrix. Profis lesen Pläne wie Wirtschaftsprüfer."],["Beweisfall zeigbar","Ein aktiver Händler, eine Transaktion mit Zuordnung im Backoffice, ein Auszahlungsnachweis – mit Einverständnis der Person."],["Kapazitätsregel festgelegt","Wie viele Könige begleitet ihr bis zum 09.01.2027 persönlich? Empfehlung: maximal fünf. Die Regel gilt dann auch wirklich."],["Geschäftsleitung zugesagt","Feste Termin-Slots für Königsgespräche sind geblockt."],["Dossier ausgefüllt, Score ≥ 8","Typ, Motiv, Absender und Anlass stehen fest."],["Zulässiger Kontaktweg","Bestehende Beziehung, Empfehlung oder geschäftlicher Kanal. Keine Massennachrichten."]],

 score:[["Netzwerk & Entscheiderzugang","kaum","regional","groß und direkt"],["Führung","Einzelkämpfer","kleines Team","führt Führungskräfte"],["Verlässlichkeit & Tempo","unklar","schwankend","hält Zusagen"],["Zeit in den nächsten 30 Tagen","keine","wenig","fest eingeplant"],["Unternehmerische Motivation","sucht Sicherheit","offen","denkt in Strukturen und Risiko"]],

 motT:"Die vier Königsmotive",motLead:"Geld ist selten das Motiv – das haben Könige. Wer nur über Geld redet, redet am König vorbei.",motCols:["Motiv","Erkennst du an","Satz, der trifft"],
 motives:[["Vermächtnis","spricht von „etwas Bleibendem“, Nachfolge, Familie","Was bleibt von deiner Organisation, wenn du nicht mehr jeden Tag ziehst?",""],["Anerkennung","Bühne, Ränge und Auszeichnungen sind ihm wichtig","Die Ersten, die das aufbauen, stehen in Frankfurt vorne.","Bühne vom Veranstalter bestätigt"],["Freiheit","Frust über Abhängigkeit von einer Firma oder einem Auftraggeber","Wie abhängig ist dein Einkommen heute von einer einzigen Firma?",""],["Wachstum","unruhig, sucht den nächsten Markt","Wo liegt bei dir gerade der nächste Markt?",""]],
 task:"Hak die sechs Punkte der Thronreife ab. Lege dann für deinen ersten König ein Dossier an und vergib den Score ehrlich."},
ktypen:{lead:"Fast jeder König gehört zu einem von fünf Typen. Den Typ bestimmst du im Dossier – er entscheidet über Ton, Nachricht und Augenöffner.",
 rows:["Seine Sorge","Was ihn bewegt","Ton","Augenöffner","No-Go"],
 types:[["I","Der Network-König","du","Top-Leader eines anderen Network-Unternehmens mit großer Organisation.","Vertragsklauseln, sein Ruf in der eigenen Firma, Unruhe im Team.","Zusatz statt Wechsel. Eine Antwort auf Fluktuation und auf die vielen in seinem Team ohne nennenswertes Einkommen.","Leader zu Leader. Ruhig, keine Superlative.","„Deine Leute kaufen jeden Monat ein. An diesem Konsum verdient heute jeder – außer deiner Organisation.“","Seine Firma schlechtreden. Teamlisten ansprechen. Wechsel-Pitch."],
  ["II","Der Struktur- & Finanzvertriebskopf","Sie oder du","Inhaber oder Direktor einer Finanz-, Versicherungs- oder Strukturvertriebsorganisation.","Seriosität, Haftung, Erlaubnisse und Aufsicht, sein Ruf bei Kunden.","Kundennutzen ohne weiteres Finanzprodukt. Kundenbindung zwischen den Beratungsterminen. Saubere Unterlagen.","Sachlich und zahlenfest. Anrede nach Beziehung.","„Sie sehen Ihren Kunden zweimal im Jahr. Was wäre, wenn er Sie dazwischen jede Woche positiv erlebt?“","Rendite, Börse oder Optionen als Argument. Hype-Vokabular."],
  ["III","Der Feldvertriebs-Unternehmer","du","Inhaber eines D2D-, Energie-, PV-, Telekom- oder POS-Vertriebs.","Auslastung, Margendruck, Fluktuation seiner Verkäufer, Abhängigkeit von einem Auftraggeber.","Zusätzlicher Wert aus Kontakten, die sein Team ohnehin macht. Ein zweites Standbein.","Direkt, Praxis statt Theorie.","„Dein Team steht jeden Tag vor Hunderten Türen und Händlern. Bezahlt wirst du für einen Moment – den Abschluss. Danach ist der Kontakt für dich nichts mehr wert.“","Sein Kerngeschäft infrage stellen. Ihm anbieten, seine Verkäufer abzuwerben."],
  ["IV","Der Türöffner-König","Sie","Franchisegeber, Verbandsspitze, Unternehmerclub, Handelsvertreter-Organisator, Berater mit vielen Unternehmermandaten.","Sein Ruf bei Mitgliedern und Mandanten, Neutralität, Aufwand, Berufsrecht.","Seinen Leuten einen echten Mehrwert geben zu können. Ein messbarer Pilot. Keine Verkäuferrolle.","Institutionell, kurz, mit konkretem Pilotvorschlag.","„Ihre Betriebe haben täglich Kundenkontakt. Wie viel dieser Kundenbeziehung bleibt nach dem Kauf bei ihnen?“","Ihn zum Verkäufer machen. Einkommen in den Vordergrund stellen. Massenmails an seine Mitglieder."],
  ["V","Der ruhende König","du","Früher großer Leader, heute inaktiv, enttäuscht oder zwischen zwei Projekten.","Noch einmal öffentlich scheitern. Seine Glaubwürdigkeit. „Schon wieder ein neues Ding.“","Respekt vor seiner Geschichte. Ein leiser Neustart ohne Ankündigung. Eine Rolle statt eines Rangs.","Persönlich, wertschätzend, ohne Druck.","„Du musst niemandem etwas beweisen. Die Frage ist nur, ob dein Wissen gerade irgendwo arbeitet.“","An Misserfolge erinnern. Öffentliche Ankündigung vor dem Pilot. Druck."]],

 steps:[["Dossier","Tag 0","Typ, Motiv, Absender, Anlass und Score stehen fest.","Score unter 8 → nicht ansprechen."],["Erstkontakt","Tag 1","Antwort und ein 20-Minuten-Termin. Neugier, keine Marke.","Zwei Follow-ups ohne Reaktion → 90 Tage parken."],["Qualifizierungs-Call","20 Minuten","Er erzählt, du prüfst. Score aktualisieren.","Score unter 5 → freundlich parken."],["Augenöffner-Gespräch","60 Minuten","Er formuliert den Hebel selbst – mit seinen eigenen Zahlen.","Er sieht keinen Hebel → nichts nachschieben."],["Beweis & Geschäftsleitung","45 Minuten","Echter Fall plus Gegenprüfung durch die Geschäftsleitung.","Offene Vertrags- oder Konditionsfrage → Pause, bis sie geklärt ist."],["Gründerkreis","90 Minuten","Schriftliche Pilotzusage mit mindestens fünf benannten Startern und Startdatum.","Keine Zusage innerhalb von 7 Tagen → Wiedervorlage im Januar."],["Pilot","14 Tage","Starts, erste Händlergespräche, gebuchte CP.","Das Review entscheidet: Rollout oder Stopp."]],

 planT:"Planungsannahme für die ersten vier Wochen",plan:"15 A-Dossiers → 10 Erstkontakte → 5 Calls → 3 Augenöffner-Gespräche → 1–2 Piloten",planNote:"Das ist eine Annahme, keine gemessene Quote. Nach vier Wochen durch eure echten Werte ersetzen.",
 rhythmT:"Der Wochenrhythmus",rhythm:[["Montag · 15 Min","Pipeline-Review: Wer steht wo? Wer ist diese Woche dran? Welcher König wartet zu lange?"],["Freitag · 15 Min","Learnings: Welche Nachricht hat Antworten gebracht, welche nicht? Texte anpassen, Score aktualisieren."]],
 task:"Setz jeden König in deiner Pipeline auf genau eine Stufe – mit nächstem Schritt und Datum. Montags und freitags je 15 Minuten Review."},
knachr:{lead:"Die erste Nachricht hat genau eine Aufgabe: ein 20-Minuten-Gespräch. Nicht informieren, nicht überzeugen, nicht verkaufen.",
 forKing:"Für welchen König?",manual:"[Name] manuell anpassen",
 rulesT:"Die sechs Regeln des Erstkontakts",rules:["Ein konkreter, nachweisbarer Anlass – kein Copy-Paste.","Kein Firmenname, kein Link, kein PDF, keine Zahlen.","Neugier statt Erklärung: eine Frage, die er sich noch nie gestellt hat.","Maximal fünf Sätze.","Ein kleiner nächster Schritt: 20 Minuten, zwei Terminvorschläge.","Ein Ausweg: „Wenn’s nicht passt, sag’s einfach.“ Das nimmt Druck – und macht eine Antwort leichter."],
 firstT:"Erstkontakt · 9 Vorlagen",
 first:[["5.1","Network-König","WhatsApp / DM · du","Hi [Name], ich verfolge seit einiger Zeit, wie du deine Organisation führst – vor allem [konkreter Anlass]. Ich arbeite gerade mit wenigen Leadern an etwas, das nichts an deinem bestehenden Geschäft ändert, aber eine Frage beantwortet, die sich die meisten großen Organisationen nie stellen: Was passiert eigentlich mit dem Konsum deiner Leute? Hast du Lust auf 20 Minuten, Leader zu Leader? Wenn’s nicht passt, sag’s einfach.","Anerkennung über einen echten Anlass, eine Frage, die er nicht sofort beantworten kann, und Gleichrang statt Bitte."],
  ["5.2","Network-König","Sprachnachricht · ca. 45 Sek.","Hey [Name], [dein Name] hier. Ich schicke dir bewusst eine Sprachnachricht statt eines langen Textes. [Anlass in einem Satz]. Ich arbeite gerade mit ein paar Leadern an einer Sache, die nichts an deinem Business ändert, aber eine Frage beantwortet, die ich spannend finde: Was passiert mit dem Konsum in großen Organisationen? Das erkläre ich dir nicht per Sprachnachricht – lass uns einfach 20 Minuten telefonieren. Und wenn es dich nicht interessiert, ist das völlig okay. Sag einfach Bescheid.","Die Stimme schafft Nähe und Echtheit, die Text nicht hat. Ruhig sprechen, nicht ablesen, kein Verkäuferton."],
  ["5.3","Struktur- & Finanzvertriebskopf","Nachricht · Sie","Guten Tag [Name], ich melde mich gezielt bei Ihnen, weil Sie eine Organisation mit echtem Kundenvertrauen aufgebaut haben – [konkreter Anlass]. Ich arbeite mit wenigen Vertriebsinhabern an einem Ansatz, der ohne zusätzliches Finanzprodukt auskommt und Kunden zwischen den Beratungsterminen an Ihre Organisation binden kann. Bevor ich Ihnen etwas zeige: Hätten Sie 20 Minuten, um zu prüfen, ob das für Sie überhaupt relevant ist? [Tag] oder [Tag]?","Trifft seine Kernsorge – kein weiteres Produkt, keine Haftung – und lässt ihm die Rolle des Prüfers."],
  ["5.4","Feldvertriebs-Unternehmer","WhatsApp · du","Hi [Name], kurze Frage unter Unternehmern: Deine Leute stehen jeden Tag vor Hunderten Türen und Händlern. Bezahlt wirst du für einen einzigen Moment – den Abschluss. Ich arbeite gerade mit wenigen Vertriebsinhabern daran, was dieser Kontakt danach noch wert sein kann, ohne dass sich an eurem Kerngeschäft etwas ändert. 20 Minuten diese Woche? [Tag] oder [Tag]?","Er erkennt sofort einen blinden Fleck in seinem eigenen Modell – und niemand hat ihm etwas verkauft."],
  ["5.5","Türöffner-König","E-Mail · Sie","Betreff: Mehrwert für Ihre [Mitglieder/Franchisepartner] – Vorschlag für einen kleinen Pilot\n\nSehr geehrte/r [Anrede Name],\n\nich wende mich an Sie, weil [Organisation] für [konkreter Anlass] steht.\n\nWir arbeiten an einem Modell, mit dem Betriebe ihre Kunden auch nach dem Kauf weiter binden können – ohne ihr Kerngeschäft zu verändern. Dafür suchen wir eine kleine Zahl ausgewählter Partner für einen messbaren Pilot mit drei bis fünf Betrieben.\n\nDarf ich Ihnen das in 20 Minuten vorstellen? Sie entscheiden danach, ob es für Ihre [Mitglieder] überhaupt in Frage kommt.\n\nMit freundlichen Grüßen\n[Name] · [Funktion] · [Telefon]","Institutionell, kurz, klar begrenzt. Er bleibt Entscheider und wird nicht zum Verkäufer. Nur an geschäftliche Adressen, einzeln versendet."],
  ["5.6","Ruhender König","WhatsApp · du","Hey [Name], ich denke immer wieder an die Zeit, als du [konkrete Leistung] aufgebaut hast. Ich will dir nichts verkaufen und dich zu nichts überreden. Mich interessiert deine ehrliche Einschätzung zu etwas, an dem ich gerade mit ein paar Leadern arbeite – weil ich kaum jemanden kenne, der Strukturen so versteht wie du. Hast du Lust auf einen Kaffee oder einen Call?","Du bittest um seinen Rat, nicht um seine Teilnahme. Das ehrt ihn, senkt die Abwehr – und wer berät, beginnt mitzudenken."],
  ["5.7","Warm-Intro: Text für den Empfehlungsgeber","WhatsApp · du","[Name König], ich möchte dich gern mit [dein Name] verbinden. [Er/Sie] baut gerade mit wenigen Vertriebsköpfen etwas auf, bei dem ich sofort an dich denken musste – wegen [Anlass]. Kein Pitch, ich glaube einfach, ihr solltet euch kennenlernen. Darf ich euch verbinden?","Geliehenes Vertrauen ist der stärkste Einstieg. Erst fragen, dann verbinden – das respektiert den König."],
  ["5.8","Deine Antwort nach dem Intro","WhatsApp · du","Danke dir, [Empfehlungsgeber]. [Name], freut mich sehr. [Empfehlungsgeber] hat mir erzählt, wie du [Anlass]. Ich mache es kurz: Lass uns 20 Minuten sprechen, dann weißt du, ob es für dich spannend ist. [Tag] oder [Tag]?",""],
  ["5.9","Kontaktanfrage für Geschäftskontakte","LinkedIn · max. 300 Zeichen · Sie","[Name], Ihre Arbeit bei [Organisation] verfolge ich seit [Anlass]. Ich baue mit wenigen Vertriebsinhabern eine zusätzliche Ertragsebene auf bestehenden Kundenbeziehungen auf und würde mich gern vernetzen – ohne Pitch.","Danach: Nach der Annahme nicht sofort pitchen. Erst auf einen Beitrag reagieren, dann 5.3 oder 5.4 angepasst senden."]],
 reactT:"Die ersten Reaktionen · 14 Antworten",reactLead:"Jede Antwort führt zum Gespräch – nie in eine Erklärung im Chat. Was im Chat erklärt wird, wird im Chat bewertet. Und im Chat verlierst du.",
 reactRules:["Direkt nach der Firma gefragt? Nenne sie. Ausweichen wirkt bei Profis unseriös.","Keine Zahlen, keine PDFs, keine Links vor dem Gespräch. Eine Zahl im Chat ist ein Versprechen.","Maximal zwei Follow-ups. Danach ist Schluss."],
 react:[["6.1","„Worum geht’s denn?“","","Fair. In einem Satz: Es geht darum, wie große Organisationen aus dem Alltagskonsum ihrer Leute eine zusätzliche Ertragsebene machen können – ohne ihr Geschäft zu ändern. Alles Weitere wäre im Chat verschenkt. 20 Minuten, und du weißt, ob es für dich relevant ist. [Tag] oder [Tag]?",""],
  ["6.2","„Schick mir mal Infos.“","","Mache ich gern – aber erst, wenn ich weiß, welche Infos für dich überhaupt relevant sind. Sonst bekommst du 20 Seiten, von denen 18 nicht zu deiner Organisation passen. Gib mir 15 Minuten, dann schicke ich dir genau das, was zu dir passt.",""],
  ["6.3","„Welche Firma steckt dahinter?“","","Best Prime mit der Plattform ePOINT. Den Namen kannst du gern googeln – er sagt dir nur nichts über die Mechanik, um die es mir geht. Die zeige ich dir in 20 Minuten an einem echten Fall. Passt [Tag]?","Wichtig: Ehrlich antworten. Wer bei dieser Frage ausweicht, ist raus."],
  ["6.4","„Ist das Network-Marketing?“","","Ja, die Vertriebsseite ist als Partnerstruktur aufgebaut – das sage ich dir lieber gleich selbst. Spannend ist für dich aber nicht die Struktur, sondern die Mechanik dahinter: Kundenbindung über echte Einkäufe bei Händlern. Ob das zu dir passt, prüfen wir in 20 Minuten – ohne Folien.","Wer es selbst ausspricht, nimmt dem Einwand die Kraft. Leugnen würde jedes Vertrauen zerstören."],
  ["6.5","„Ich bin vertraglich gebunden.“","","Gut, dass du das ansprichst – das nehme ich ernst. Ich will nicht, dass du wegen uns Ärger bekommst. Lass uns im Gespräch genau anschauen, was dein Vertrag erlaubt, und ihn bei Bedarf prüfen lassen. Wenn es nicht passt, sage ich dir das selbst.","Dieser Satz baut mehr Vertrauen auf als jede Präsentation. Du schützt ihn – nicht deinen Abschluss."],
  ["6.6","„Keine Zeit.“","","Verstehe ich – gerade bei dir. Deshalb frage ich nach 20 Minuten und nicht nach einem Projekt. Wenn es danach nicht passt, war’s das. Lieber nächste Woche, [Tag] oder [Tag]?",""],
  ["6.7","„Was verdiene ich da?“","","Das rechnen wir gemeinsam mit deinen echten Zahlen und dem gültigen Plan aus – nicht mit Beispielrechnungen aus dem Internet. Alles andere wäre unseriös. Bring zum Gespräch drei Zahlen mit, dann siehst du es schwarz auf weiß.","Wichtig: Niemals eine Zahl im Chat. Was du schreibst, wird als Versprechen gelesen."],
  ["6.8","„Klingt spannend.“","","Freut mich. Dann lass es uns gleich festmachen: [Tag] um [Uhrzeit] oder [Tag] um [Uhrzeit]? Ich schicke dir danach drei kurze Fragen zur Vorbereitung.",""],
  ["6.9","Funkstille · Follow-up 1","nach 4 Tagen","Hi [Name], ich hake einmal kurz nach, damit es nicht im Chat untergeht. Passt gerade nicht, später oder gar nicht? Alles drei ist völlig okay.",""],
  ["6.10","Funkstille · Follow-up 2 (letzte Nachricht)","nach weiteren 7 Tagen","[Name], ich nehme an, das Timing passt gerade nicht – kein Thema. Ich melde mich nicht weiter. Wenn du irgendwann neugierig bist, weißt du, wo du mich findest.","Wichtig: Die Nachricht ist ehrlich gemeint – und löst gerade deshalb oft eine Antwort aus. Danach wirklich nicht mehr melden."],
  ["6.11","Terminbestätigung mit drei Zahlen","","Top, [Tag] um [Uhrzeit] steht. Damit wir die Zeit gut nutzen, bring bitte drei grobe Zahlen mit:\n1) Wie viele Menschen sind in deiner Organisation aktiv?\n2) Wie viele davon verdienen nennenswert?\n3) Wie viele Händler und Unternehmer sieht dein Team regelmäßig?\nSchätzwerte reichen.","Wer sich vorbereitet, hat investiert. Und er beginnt zu rechnen, bevor ihr sprecht."],
  ["6.12","Nach dem Gespräch · Zusammenfassung","","Danke dir für das offene Gespräch. Für mich bleiben zwei Punkte hängen: [Punkt 1] und [Punkt 2]. Nächster Schritt wie besprochen: [konkrete Aktion] am [Datum]. Wenn sich bis dahin etwas ändert, sag mir einfach Bescheid.",""],
  ["6.13","Freundlich parken","","Danke dir für deine Offenheit. Für mich ist klar: Gerade passt es nicht – und das ist völlig in Ordnung. Ich melde mich im [Monat] einmal kurz, ob sich bei dir etwas verändert hat. Bis dahin alles Gute für [sein Projekt].",""],
  ["6.14","Wiedervorlage nach 90 Tagen","","Hi [Name], wie versprochen melde ich mich einmal. Seit unserem letzten Gespräch hat sich bei uns [konkrete, belegbare Entwicklung] getan. Ist das für dich heute ein Thema – oder weiterhin nicht? Beides ist okay.","Bedingung: Nur mit einer echten, belegbaren Entwicklung senden."]],
 task:"Wähle für deinen ersten A-König die passende Erstnachricht nach seinem Typ, fülle jede eckige Klammer individuell und lass sie vor dem Senden von deinem Sponsor gegenlesen."},
kgespr:{lead:"Im Königsgespräch redet er, du fragst. Dein Redeanteil liegt unter 30 Prozent – bis zum Beweis.",
 aT:"A · Der Qualifizierungs-Call · 20 Minuten",aCols:["Minute","Phase","Was du sagst oder tust"],
 a:[["0–2","Rahmen","„Ich habe 20 Minuten geblockt. Ich will vor allem verstehen, wie du aufgestellt bist. Am Ende sagen wir beide ehrlich, ob es Sinn macht weiterzureden. Okay?“"],["2–12","Er erzählt","Die fünf Diagnosefragen unten. Zuhören, notieren, nicht kommentieren."],["12–17","Teaser","„Ich zeige dir nicht die Firma, sondern eine Rechnung – mit deinen Zahlen. Dafür brauche ich eine Stunde mit dir.“"],["17–20","Entscheidung","„Macht es für dich Sinn, das mit deinen Zahlen durchzugehen?“ Ja → Termin festmachen. Nein → „Danke dir, dann lassen wir’s.“"]],
 diagT:"Die fünf Diagnosefragen",diag:["Wie viele Menschen sind in deiner Organisation wirklich aktiv?","Was frustriert dich gerade am meisten?","Wie viele deiner Leute verdienen nennenswert?","Was müsste passieren, damit du in einem Jahr sagst: Das war ein starkes Jahr?","Wie frei bist du vertraglich, wenn du etwas Zusätzliches machen willst?"],
 bT:"B · Das Augenöffner-Gespräch · 60 Minuten",bCols:["Phase","Dauer","Was passiert"],
 b:[["1 · Spiegel","10 Min","Fasse zusammen, was er im Call gesagt hat – in seinen Worten. „Habe ich dich richtig verstanden?“",""],["2 · Drei Fragen","15 Min","Die drei Augenöffner-Fragen (unten). Danach schweigen.",""],["3 · Seine Rechnung","15 Min","Er trägt seine Zahlen ein. Ihr rechnet mit dem gültigen Plan – jedes Ergebnis klar als Szenario gekennzeichnet, nie als Prognose.",""],["4 · Der Beweis","10 Min","Ein echter Fall: Händler → Kunde → Kauf → Zuordnung → Auszahlung. Live im Backoffice, wenn möglich.",""],["5 · Das Zurückgehaltene","5 Min","Erst wenn er fragt: das Mitverdienen an Einkäufen im gesamten Partnernetz.","nur so, wie es der gültige Plan vorsieht"],["6 · Abschluss","5 Min","Take-away statt Druck (Echte Knappheit) und Einladung in den Gründerkreis.",""]],
 qT:"Die drei Augenöffner-Fragen",q:["Wie viele Menschen hast du in deiner Organisation – und wie viele davon verdienen nennenswert?","Was machen die anderen trotzdem jeden Monat? Sie kaufen ein: Lebensmittel, Tanken, online.","Wer verdient heute an diesem Konsum? Und was wäre, wenn ein Teil davon in deiner Organisation bliebe – ohne dass einer deiner Leute ein Produkt verkaufen muss?"],
 silence:"<b>Schweigeregel:</b> Nach der dritten Frage mindestens fünf Sekunden schweigen. Wer zuerst redet, nimmt ihm die Erkenntnis.",
 cT:"C · Der Geschäftsleitungs-Termin · 45 Minuten",cSub:"Er prüft die Firma – nicht ihr ihn.",
 c:[["Jede Frage ist erlaubt:","Struktur, Auszahlungen, Plan, Zeitplan, ePAY-Status."],["Keine Antwort, die nicht stimmt.","„Weiß ich nicht, kläre ich bis [Datum]“ ist stärker als jede schöne Antwort."],["ePAY beim Namen nennen:","für den 09.01.2027 geplant – nicht mehr und nicht weniger."]],
 task:"Bereite deinen nächsten Call vor: Rahmen-Satz auswendig, fünf Diagnosefragen auf einem Zettel, Score danach aktualisieren."},
keinw:{lead:"Hinter jedem Einwand eines Königs steckt eine Sorge um Ruf, Team oder Vertrag. Beantworte die Sorge, nicht den Satz.",
 behind:"Dahinter:",goal:"Ziel:",search:"Einwand suchen",
 items:[["„Ich habe schon ein Business.“","Angst vor Ersatz","Genau deshalb rede ich mit dir. Es soll nichts ersetzen, sondern auf dem aufbauen, was du schon hast.","Zusatz-Rahmen"],
  ["„Das habe ich alles schon gesehen.“","Müdigkeit, Skepsis","Wahrscheinlich hast du vieles gesehen. Deshalb zeige ich dir keine Präsentation, sondern einen echten Fall. Überzeugt er dich nicht, sind wir in zehn Minuten durch.","Beweis statt Pitch"],
  ["„Mein Team will nichts Neues.“","Angst vor Unruhe","Dann fang nicht mit dem Team an. Fang mit fünf Leuten an, denen du vertraust – 14 Tage, leise. Danach entscheidest du.","Kleiner Pilot"],
  ["„Was, wenn die Firma das nicht durchhält?“","Firmenrisiko","Berechtigte Frage. Deshalb sitzt du vor jeder Entscheidung mit der Geschäftsleitung zusammen und stellst genau diese Frage.","GL-Termin"],
  ["„Sind ePAY und die Börse schon da?“","Vision-Skepsis","Nein. ePAY ist für den 09.01.2027 geplant, der Börsengang ist eine Absicht. Ich verkaufe dir nichts, was noch nicht da ist – wir reden über das, was heute funktioniert.","Glaubwürdigkeit"],
  ["„Was verdienen eure Top-Leute?“","will Beweis","Echte Auszahlungsnachweise zeige ich dir im Gespräch – mit Einverständnis der Person, keine Screenshots aus Gruppen. Die wichtigere Frage ist ohnehin: Was ergibt sich mit deinen Zahlen?","Eigene Rechnung"],
  ["„Wer ist sonst noch dabei?“","Social Proof","Namen nenne ich nur mit Zustimmung – genau wie ich deinen nicht weitergebe. Im Gründerkreis lernst du die anderen kennen.","Vertraulichkeit als Wert"],
  ["„Was bekomme ich, was andere nicht bekommen?“","Sonderdeal","Keinen Sonderplan – der Plan gilt für alle, sonst wäre er nichts wert. Was du bekommst: meine persönliche Zeit, den direkten Draht zur Geschäftsleitung und einen Platz im Gründerkreis.","Fairness als Stärke"],
  ["„Das muss ich mit meinem Partner besprechen.“","Absicherung","Sehr gut. Wollen wir es zu dritt durchgehen? Dann hat dein Partner dieselben Infos aus erster Hand.","Mitentscheider dazuholen"],
  ["„Melde dich in drei Monaten.“","nicht jetzt – oder Ausrede","Mache ich. Eine Frage noch, damit ich weiß, worauf ich achte: Was müsste sich in drei Monaten verändert haben, damit es für dich passt?","Echten Grund erfahren"],
  ["„Ist das nicht ein Schneeballsystem?“","Seriositätsfrage","Berechtigte Frage – stell sie jedem Vertrieb. Mein Maßstab: Hinter jedem Euro muss ein echter Gegenwert stehen – ein Händler, ein Kunde, eine Leistung. Lass uns genau das am echten Fall und am Vertrag prüfen, gern auch mit deinem Anwalt.","Prüfung statt Beteuerung"],
  ["„Warum sollte ich dir vertrauen?“","Grundsatzfrage","Solltest du noch nicht. Vertrauen entsteht durch Beweis – deshalb machen wir einen Pilot statt einer großen Entscheidung.","Pilot"]],
 task:"Lies die zwölf Einwände laut und übe die drei, die dein nächster König am wahrscheinlichsten bringt."},
kabschl:{lead:"Dringlichkeit ja. Erfundene Knappheit nie. Könige haben jahrelang selbst mit Druck gearbeitet – sie erkennen ihn nach zwei Sätzen. Ein aufgeflogener Trick kostet nicht einen König, sondern sein ganzes Umfeld.",
 fomoT:"Echte Knappheit: die vier FOMO-Regeln",
 fomo:[["Eure Kapazität","„Ich begleite bis Frankfurt persönlich maximal fünf Vertriebsköpfe.“","Dreht den Status: Jetzt qualifiziert er sich bei dir.","Regel festgelegt und eingehalten"],["Der Zeitpunkt","„Wer vor dem geplanten ePAY-Start Struktur hat, startet mit Team statt allein.“","Die echte Logik jedes Marktstarts.","ePAY immer als „geplant“ formulieren"],["Branche & Region","„Der Erste in deiner Branche, der Händler und Kunden bindet, hat sie.“","Wettbewerbslogik, die er aus seinem eigenen Geschäft kennt.","kein Gebietsschutz, der nicht im Vertrag steht"],["Die Bühne","„Wer bis zum 09.01. nachweislich gestartet ist, steht in Frankfurt als Gründungsmitglied vorne.“","Status zieht bei Königen stärker als Geld.","vom Veranstalter bestätigt"]],
 okT:"Erlaubt und tabu",okCols:["Erlaubt","Tabu"],
 ok:[["„Ich nehme nur fünf, weil ich jeden persönlich begleite.“","„Nur noch drei Plätze!“ – wenn es nicht stimmt"],["„Der Pilot läuft bis [Datum]. Danach entscheide ich, mit wem ich 2027 aufbaue.“","Fristen, die danach stillschweigend verlängert werden"],["„Rechnen wir mit deinen Zahlen.“","„Du kannst hier 10.000 € im Monat machen.“"],["„ePAY ist für den 09.01.2027 geplant.“","„ePAY ist fertig“ oder „garantiert“"],["„Wer zuerst kommt, baut zuerst Beziehungen auf.“","„Exklusives Gebiet“ ohne Vertrag"],["Status, Bühne, Rolle, persönliche Begleitung","Aktien, Börsengang oder Optionen als Lockmittel"]],
 uwg:"Falsche Verknappung ist nach UWG ein klassischer Irreführungsfall – zusätzlich zum Vertrauensschaden.",
 closeT:"Die Königs-Abschlüsse",
 close:[["9.1","Der Take-away-Abschluss","Gespräch · du","Ich will dich heute nicht überzeugen. Ich begleite bis Frankfurt maximal fünf Vertriebsköpfe persönlich, und ich nehme nur die, bei denen der Pilot zeigt, dass es für beide Seiten passt. Wenn du willst, prüfen wir das in 14 Tagen mit fünf deiner Leute. Wenn nicht, völlig okay – dann bleiben wir in Kontakt.","Die Bereitschaft zu gehen ist bei Königen der stärkste Sog. Bedingung: Kapazitätsregel gilt."],["9.2","Der Pilot-Abschluss für Türöffner","Gespräch · Sie","Ich schlage Ihnen keinen Rahmenvertrag vor, sondern einen Pilot mit drei bis fünf Betrieben über 14 Tage. Danach entscheiden Sie anhand der Zahlen, ob Sie das Ihren [Mitgliedern] empfehlen. Passt Ihnen ein Start am [Datum]?",""]],

 invT:"Die Einladungen",
 inv:[["10.1","Einladung in den Gründerkreis","WhatsApp · du","[Name], nach unserem Gespräch möchte ich dich persönlich in eine kleine Runde einladen: maximal acht Vertriebsköpfe, 90 Minuten, mit unserer Geschäftsleitung. Keine Präsentation, sondern eine Arbeitssitzung – jeder rechnet mit seinen eigenen Zahlen, jede Frage ist erlaubt. Am Ende entscheidet jeder für sich, ob er einen 14-Tage-Pilot startet. [Datum], [Ort]. Bist du dabei?",""],["10.2","Einladung in den Gründerkreis","E-Mail · Sie","Betreff: Persönliche Einladung – Gründerkreis am [Datum]\n\nSehr geehrte/r [Anrede Name],\n\nnach unserem Gespräch möchte ich Sie persönlich in eine kleine Arbeitsrunde einladen: höchstens acht Unternehmer und Vertriebsverantwortliche, 90 Minuten, gemeinsam mit unserer Geschäftsleitung.\n\nEs gibt keine Präsentation. Jeder Teilnehmer rechnet mit den eigenen Zahlen, jede Frage ist erlaubt. Am Ende entscheidet jeder selbst, ob er einen 14-tägigen Pilot startet.\n\nTermin: [Datum, Uhrzeit] · Ort: [Ort]\n\nIch würde mich freuen, Sie dabei zu haben.\n\nMit freundlichen Grüßen\n[Name]",""],["10.3","Pilot-Vereinbarung nach der Zusage","WhatsApp · du","Wie besprochen starten wir am [Datum] den 14-Tage-Pilot mit dir und [Namen der fünf Starter]. Wir messen drei Dinge: Starts, erste Händlergespräche und gebuchte CP. Review am [Datum]. Danach entscheidest du: Rollout oder Stopp. Ich freue mich drauf.",""]],

 start:{"sprint":"Your 72-hour sprint","started":"started on {d}","expired":"finished","tl":["0–15 min profile + system","15–30 potential","30–45 outreach","72 h conversation"],"quote":["You don't need to know everything before you start.","You need to understand enough to confidently trigger the next sensible step."],"task":"Work through the modules in order. Don't skip any tasks. Knowledge without activity doesn't count as a completed start. A gold circle in the menu means the criterion is met – then mark the module as done.","lead":"This Academy is not a book to read. It is your work plan and your onboarding toolkit: guides, templates and calculators – and every stage ends with a concrete action. Everything you enter is saved automatically.","cards":["Explain the system in 60 seconds, use ePOINT yourself, understand compensation and the mindset behind every contact.","Build your list of 100 potential contacts, prioritise the TOP 10 and spot network levers.","Choose the right template, activate contacts, lead conversations and answer objections honestly.","Repeat the same simple start process with the next partner.","For leaders: messages, conversations and strategy for network leaders, sales heads and door-openers."],"rulesT":"Three rules for the whole FastTrack","rules":[["Activity before theory","Only read what you need for the next step. Then act."],["You never start alone","Your sponsor does the start call with you within 24 hours and sends the first message together with you."],["Write it down or it didn’t happen","Memory is not a CRM. Everything goes into the app."]]},

 system:{"lead":"If you can't explain the system simply, you can't pass it on cleanly. That's why this stage is mandatory.","flow":["Sales partner","Merchant","Customers","Usage","Return visits"],"tr":"60-second trainer","trHint":"Start the timer and explain the whole system out loud without reading. Stop when you're done. Goal: at least 3 clean runs under 60 seconds.","start":"Start","stop":"Stop","reset":"Reset","reps":"valid runs (≤ 60 s)","best":"best time","ready":"ready for leader check","short":"Too short – explain the whole system","valid":"{s} s – valid run","long":"{s} s – too long, try again shorter","sys":[["ePOINT","Live · Merchants & customers","The free cashback app: anyone who shops at partner merchants locally or in more than 1,000 online shops gets 3 to 30 % back and can have the balance paid out to their bank account."],["Best Prime","Active · Sales & growth","The sales and community organisation that makes ePOINT known – among customers, merchants and new partners. This is where you get training, tools and your sponsor."],["ePAY","Planned · Payment & usage","The payment and transaction layer, planned for 09.01.2027. Don’t promise anything that isn’t live yet."]],"ben":[["For the customer",["money back on purchases they make anyway","free, no subscription","local and online in one app"]],["For the merchant",["customer loyalty and repeat visits","part of a larger merchant network","a digital customer relationship"]],["For the partner",["one-time closing commission","ongoing compensation from active customers’ usage","building an organisation and duplicating"]]],"coreL":"Your 60-second explanation","core":"“Do you know ePOINT? It’s a free cashback app. You shop as usual – in local stores or in more than 1,000 online shops – and get 3 to 30 percent back, straight to your bank account. I’m a partner at Best Prime, the sales organisation behind it. I show people the app, win merchants and build a team. For that I’m paid according to an official plan: once for closings and on an ongoing basis from my customers’ usage. And with ePAY a payment solution is planned. Shall I quickly show you the app?”","coreWhy":"It starts with a question, explains the benefit for the listener first, says openly what you get out of it, and ends with a small next step.","appT":"Use it yourself first – your task for day 1","appLead":"Anyone who has received cashback themselves no longer needs a script. Experience beats explanation.","app":["ePOINT app installed and registered","Found three partner merchants near me","Made my first purchase with cashback"],"task":"Install the ePOINT app and use it yourself. Then explain the whole system without reading it out in 60 seconds at most – until it works clearly, calmly and without jargon."},
 check:{"lead":"Product knowledge is only valuable if it reaches the other person in simple language. Answer without notes.","right":"Correct.","wrong":"Not quite – take another look at the system.","selfRight":"Great – on to the leader check.","selfWrong":"Then go through the module “The system in 60 seconds” once more.","qrule":"<b>Quality rule:</b> Prices, compensation, product features and market data are only taken from the current official Best Prime documents or the back office. No old screenshots and no made-up figures.","unlock":"Unlock","unlockHint":"Only once your leader has confirmed your 60-second explanation do you move on to working on your potential.","leaderOk":"My leader{l} has confirmed my 60-second explanation","unlocked":"Unlocked for phase 2","locked":"Not unlocked yet","kcT":"Quick check: answer freely","kcHint":"Answer each question out loud. Then compare with the model answer and tick off what you’ve got.","kcShow":"Model answer","kcCan":"I can answer this freely","kc":[["What does a customer get from ePOINT, and what does it cost them?","3 to 30 % cashback at participating local merchants and in more than 1,000 online shops, paid out to their bank account. The app is free, no subscription."],["What is Best Prime?","The sales organisation that makes ePOINT known – among customers, merchants and new partners. This is where you get training, tools and your sponsor."],["What is ePAY, and when will it be available?","The planned payment solution, planned for 09.01.2027 – not usable yet today."],["What are you paid for – and what not?","According to the official plan: once for closings (packages of new partners) and on an ongoing basis from the usage of active customers. Not for messages, conversations or mere registrations."],["What is your first step with a new contact?","Decide whether customer, partner or multiplier fits – and ask for a small next step with a personal message."]]},

 warm:{"note":"When you copy a template or open it in WhatsApp, the selected contact is automatically set to “NEW” in the pipeline. Adapt the template to your own style before sending.","doT":"What works","dontT":"What to avoid","task":"Adapt a template to your own style and send it to 2 friends / acquaintances and 1 warm contact.","f4T":"The 4-sentence formula – build your own message","f4":[["Context","Why you?"],["Relevance","Why interesting?"],["Curiosity","Don't explain everything"],["Next step","10 min / meeting"]],"copy4":"Copy my message","fill4":"Fill in the four sentences first","lead":"The first message has exactly one goal: a small yes to the next step. Don’t explain, don’t persuade. When in doubt, start with the invitation to the free app.","f4Hint":"The way out at the end (“If not, totally fine”) is not a polite phrase: whoever feels free says yes more easily. And ask with two options instead of “Do you have time sometime?”.","chanT":"The right channel","chan":[["Voice message","for warm contacts. Your voice creates closeness. 40 seconds max."],["Call","if you’re a closer or know the person well."],["Text","for busy people, cold contacts and follow-ups."]],"ansT":"The three typical replies","ans":[["“What is it exactly?”","Honest in two sentences, then back to the meeting: “In short: ePOINT is a free cashback app, and I’m building sales for it with Best Prime. What that could mean for you, I’d rather show you in 15 minutes than in an essay. When suits you?”"],["“Sounds interesting.”","Set a meeting right away with two options. Don’t explain further."],["“Not interested.”","“Thanks for the honest answer! If you ever want the app as a customer, just let me know.” Status “Not interested”, no further follow-up about the business."]],"do":["a genuine personal connection","a benefit for exactly this person","curiosity instead of an info dump","a small step with two meeting options","the template translated into your own words"],"dont":["copy-paste without a  cold:{"lead":"Professionals, entrepreneurs and merchants don’t need a trick. They need relevance, respect for their time, eye level and a low-threshold next step.","rulesT":"Rules for professionals and entrepreneurs","rules":["A specific, verifiable reason – no copy-paste.","Five sentences max., no numbers, no PDF, no link.","A small next step: 10 to 20 minutes, two suggested dates.","Contact only in person, through a referral or business channels such as LinkedIn and Xing. No mass emails, no unsolicited advertising calls."],"kingT":"Real sales heads? Use the Royal Class.","king":"Network leaders, heads of structured and field sales, and door-openers have their own rules: dossier, score, type, their own messages and conversation dramaturgy.","kingBtn":"To the Royal Class","task":"Choose 2 sales contacts + 2 entrepreneurs or merchants. Research per contact 5 minutes max. Then reach out."},
 pipe:{"lead":"Sales loses speed when conversations end open. Every contact needs a status and a next step with a date.","steps":[["1 · First contact","Check relevance, set a short meeting. Don't explain everything in the chat."],["2 · Meeting","Questions before explanations: resources, customers, teams, merchant access."],["3 · Follow-up","Never “just let me know”. Always agree a date or a decision."],["4 · Records","Memory is not a CRM. Document immediately."]],"empty":"Your TOP contacts and everyone you've reached out to will appear here.","cols":["Contact","Status","Next step","Date","Replied"],"nextPh":"e.g. meeting 15 min","task":"Give every active contact a clear status: NEW · MEETING · FOLLOW-UP · DECISION · STARTED. Dates marked red are overdue.","rhythmT":"Two rules for following up","rhythm":["Every open contact has a date for the next step.","After two follow-ups without a reply: pause. After a clear no: no follow-up about the business."]},
 talk:{"pL":"Partner / network","mL":"Merchant / business","qT":"5 key questions","mq":["Roughly how many customers do you have?","What share are regular customers?","How do you build customer loyalty today?","What does customer acquisition cost you?","Which other locations / networks are there?"],"flow":["1. Understand","2. Classify","3. Explain what fits","4. Next step"],"quote":["Understand needs first. Then explain the benefit.","The more you talk before the needs analysis, the greater the risk of arguing past the real lever."],"prot":"Conversation log","f":["Contact / business","Biggest lever","Biggest open question","Next step + date"],"save":"Save conversation","saved":"Conversation saved","cols":["Date","Contact","Lever","Open question","Next step"],"del":"Delete","lead":"A good conversation is a diagnosis, not a lecture. 20 to 30 minutes – and at the end there is always a clear next step, even if it is “not interested”.","phT":"The flow","ph":[["Set the frame","2 min","“Great that it worked out. My suggestion: I’ll ask you a few questions first, then I’ll show you what it’s about, and at the end you tell me honestly whether it’s for you. Agreed?”"],["Questions","5–8 min","Motive, time, possibilities – the core questions below. Listen, take notes."],["Show","5 min","“May I quickly show you how I use it myself?” – the app live and your story."],["Classify","5 min","“From what you’ve told me, the best fit for you is …, because …” – customer, partner, merchant or multiplier."],["Decide","3 min","One of the closing questions below – and a meeting with a date."]],"phNote":"Why the frame matters so much: whoever hears at the start that a no is allowed listens relaxed afterwards – instead of defending themselves inwardly.","pq":["What would have to happen for something like this to be worth it for you?","How much time could you realistically invest per week?","How many people are you regularly in contact with – and do you prefer working alone or in a team?","Which
