26’dan itibaren 3 CP. Her vaatten önce back office’teki güncel sürümle karşılaştır.","talkT":"Para hakkında nasıl konuşursun","talkQ":"“Kapanışlardan tek seferlik, müşterilerinin kullanımından sürekli kazanılır. Ne kadar olduğu ne yaptığına bağlı. Sana resmi planı göstereceğim.”","talk":["Asla aylık bir tutarı beklenti olarak söyleme.","Asla “pasif gelir” deme.","Örnek hesaplamaları her zaman model olarak işaretle.","Asla sadece rütbe için paket veya kupon alma ya da aldırma."],"openT":"Her vaatten önce netleştir","open":["Basic ve Premium Pack’in maliyetleri, tek seferlik ve düzenli","Hak ne zaman doğar ve ödeme ne zaman yapılır","%50 veya %30 kuralı hak kazanma için ne anlama gelir","Grafiğe göre ekip kapanış oranları (20 / 6 / 4 €) CP başına mı yoksa kapanış başına mı geçerli"],"openBtn":"Sponsor için soruları kopyala","openMsg":"Merhaba{l}, planı kimseye açıklamadan önce dört noktadan emin olmak istiyorum: 1) Basic ve Premium Pack tek seferlik ve düzenli olarak ne kadar? 2) Hak ne zaman doğar ve ödeme ne zaman yapılır? 3) %50 veya %30 kuralı hak kazanma için ne anlama gelir? 4) 20 / 6 / 4 €’luk ekip kapanış oranları CP başına mı yoksa kapanış başına mı geçerli? Teşekkürler!","task":"Kendi iki örneğini hesapla: kendi rütbende bir kapanış ve 10 aktif müşteri. Sonra kazancın nasıl oluştuğunu iki cümleyle açıkla."},
 haltung:{"lead":"İnsanlar bilgiye değil, geldiğin tutuma tepki verir. Yalvaran geri çevrilir. Uyup uymadığını kontrol eden ciddiye alınır.","core":"“Elimde iyi bir şey var, ona uyan insanları arıyorum – ve onları bulmak için zamanım var.”","coreL":"Tek cümlede tutumun","pT":"10 ilke","whyL":"Neden işe yarar","howL":"Nasıl uygularsın","lineL":"Kırmızı çizgi","p":[["İkna etmek yerine seçmek","Baskı direnç doğurur. Açıkça kontrol eden kendinden emin ve güvenilir görünür.","“Sana uyar mı bilmiyorum – hızlıca bakalım.”","Yapay kıtlık yok."],["Bilgiden önce merak","Kafadaki açık bir soru cevap arar. Her şeyi sohbette açıklayan, görüşmeden yargılamaya davet eder.","İlk mesajda sadece konu, bağlantı ve küçük bir sonraki adım. Ayrıntılar görüşmede.","Ne hakkında olduğu her zaman bellidir. Biri şirketi doğrudan sorarsa, söylersin."],["İlgililik erişimi yener","İnsanlar kendilerini ilgilendiren şeye tepki verir.","Her mesajda gerçek bir “çünkü sen …” cümlesi olur.","Uydurma vesileler yok."],["Soran yönetir","İnsanlar kendi söylediklerine inanır. Sorular ihtiyacı görünür kılar.","Önce sor, sonra göster. Zamanın üçte birinden azında konuşursun.","Sadece evet dedirten yönlendirici sorular yok."],["Evete küçük adımlar","Küçük bir evet büyükten kolaydır – ve kabul eden daha sık kalır.","Her zaman sadece bir sonraki küçük adımı iste: 10 dakika, uygulamaya bir bakış, bir randevu.","Sürprizle koparılmış evet yok."],["Deneyim açıklamayı yener","Kendi deneyimi herhangi bir slayttan daha ikna edicidir.","Uygulamayı canlı göster, kendi para iadesi kanıtını göster.","Başkalarının veya süslenmiş sonuçlar yok."],["Önce ver","Hediye alan daha açık olur. Uygulama ücretsiz – samimi bir ipucu.","İşten bahsetmeden önce müşteri faydasıyla başla.","Gizli koşullu “hediye” yok."],["Rica yerine eşit düzeyde","Özür dileyen küçük görünür. Satış profesyonelleri yalnızca eşit düzeyde tona saygı duyar.","Sakin, net, “Rahatsız ettiğim için kusura bakma” olmadan.","Kibir yok, başka şirketler hakkında asla kötü konuşma."],["Hayır bir bilgidir","Retleri kişisel alan bırakır. Onları sayan daha iyi olur.","Teşekkür et, durumu ayarla, sonraki kişi.","Net bir hayırdan sonra takip yok."],["Kimlik ve ritim","İnsanlar kendileri hakkındaki imaja göre davranır. Sabit çalışma blokları motivasyonu yener.","“Ben her gün 3 temas kuran biriyim.” Her günü işaretle.",""]],"fearT":"İlk temas korkusu","fear":"Neredeyse herkeste var. Okumakla geçmez, ilk on mesajla geçer.","fearL":[["Birlikte başlayın","İlk mesajı başlangıç görüşmesinde, sponsorun dinlerken gönderirsin."],["Bir hediyeyle başla","Ücretsiz uygulamaya davet, herhangi bir iş sorusundan daha kolaydır."],["Sonucu değil aktiviteyi say","Günlük hedefin “3 olumlu cevap” değil, “3 gönderilmiş mesaj”."]],"wordsT":"Şöyle söyle","words":[["eşsiz fırsat","şu anda az sayıda kişiyle test ettiğimiz bir model"],["pasif gelir","gerçek kullanıma bağlı sürekli bir gelir katmanı"],["Hemen katıl!","Uyup uymadığına bakalım."],["Sana bir şey tanıtmak istiyorum.","Nasıl konumlandığını anlamak istiyorum."]],"task":"10 ilkeyi bir kez baştan sona oku. Sana en zor gelen ikisini seç ve sonraki beş mesajında özellikle onlara dikkat et."},
 einw:{"lead":"İtiraz bir hayır değil, henüz açık olan bir sorudur. Onu ciddiye alan güven kazanır. Geçiştiren kaybeder.","method":[["Kabul et","“Anlıyorum.”"],["Sor","“Bununla tam olarak neyi kastediyorsun?” – çoğu zaman arkasında başka bir şey vardır."],["Dürüstçe cevapla","Kısa, olgularla, vaatsiz."],["Devam et","“Bu soruna cevap oldu mu?” – sonra bir sonraki adıma."]],"listT":"En sık 12 itiraz","search":"İtiraz ara, örn. zaman, para, piramit","none":"Uygun itiraz yok. Sponsoruna sor – ve cevabı aşağıya yaz.","behind":"Çoğu zaman arkasında:","items":[["“Vaktim yok.”","emek korkusu","Tempoyu sen belirlersin. Haftada gerçekçi olarak ne kadar zamanın olurdu? Sonra bunun yetip yetmediğine dürüstçe bakarız."],["“Satış yapamam.”","reddedilme korkusu","Zorunda değilsin. Kendin de kullandığın ücretsiz bir uygulamayı gösteriyorsun – bu satmaktan çok tavsiye etmek. Ve başlangıçta sponsorun görüşmelere katılır."],["“Kimseyi tanımıyorum.”","küçümsenen ağ","Birlikte 10 dakika telefonuna bakalım – o zaman görürüz."],["“Bu bir piramit sistemi mi?”","dolandırılma korkusu","İyi soru, sormalısın. Bu gerçek bir ürünle doğrudan satış: müşteriler ücretsiz uygulamayı kullanır ve para iadesi alır, satıcılar müşterilerini elde tutar. Kazanç, resmi plana göre kapanışlar ve gerçek müşterilerin kullanımı için ödenir. Sana belgeleri gösteririm, kendin kontrol et."],["“Bu network marketing mi?”","sektöre çekince","Evet, satış tarafı partner yapısı olarak kurulmuş – bunu hemen kendim söylemeyi tercih ederim. Ama ilginç olan arkasındaki mekanizma: satıcılardaki gerçek alışverişlerle müşteri sadakati. Sana uyup uymadığını 15 dakikada kontrol ederiz."],["“Ne kadar tutuyor?”","risk değerlendirmesi","Müşteri olarak hiçbir şey. Partner olarak başlangıç paketleri var – kesin fiyatları ezberden değil, güncel resmi belgelerden gösteririm."],["“Sen ne kadar kazanıyorsun?”","kanıt arıyor","Dürüstçe: [doğru cevap, örn. “Daha başındayım”]. Önemli olan planın nasıl işlediği ve senin bundan ne çıkardığın – bunu sana gösteririm."],["“Bana bilgi gönder.”","kibar kaçış veya gerçek ilgi","Memnuniyetle – ama hangi bilgilerin senin için önemli olduğunu bildiğimde. Seni daha çok ne ilgilendiriyor: müşteri olarak uygulama mı, iş mi? Sonra telefonda 10 dakika. Perşembe mi cuma mı?"],["“Düşünmem lazım.”","açık soru","Tabii. İyi düşünebilmen için: senin için hâlâ açık olan nokta ne? (Sonra cevap için bir tarih belirleyin.)"],["“Eşimle / ortağımla konuşmam lazım.”","ortak karar","Harika. Bir sonraki görüşmeyi üçlü yapalım mı? O zaman o da aynı bilgileri birinci elden alır."],["“Bir sürü cashback uygulaması var.”","karşılaştırma","Doğru. Sadece dene, bir şey tutmuyor: yakındaki katılımcı satıcılarda ve 1.000’den fazla online mağazada %3 ile %30 arası, hesaba çekilebilir."],["“ePAY şimdiden kullanılabiliyor mu?”","yeniye merak","Hayır. ePAY 09.01.2027 için planlandı. Bugün kullanabileceğin ePOINT uygulaması – sana göstereyim."]],"copyA":"Cevabı kopyala","mineT":"En zor üç itirazım","mineE":"İtiraz","mineA":"Cevabım","task":"Üç itirazı yüksek sesle çalış – sponsorunla veya partnerle – ve en zor üç itirazını cevabıyla birlikte yaz."},
 kgesetze:{"lead":"En büyükler için mesajlar, görüşmeler ve strateji – network liderleri, satış liderleri ve kapı açıcılar. Her şey bu on cümleden çıkar. Onları çiğneyen kralı kaybeder – çoğu zaman nedenini fark etmeden.","motto":"Krallar ikna edilip kazanılmaz.","motto2":"Krallar seçilir.","pillars":[["Onun riskine saygı","Kazanabileceğinden fazlasını kaybedebilir. O düşünmeden önce sen söyle."],["Vizyondan önce kanıt","Tek bir gerçek vaka, her gelecek slaytını yener."],["Reklam yerine seçim","Onun uyup uymadığını sen kontrol edersin – tersi değil."]],"lawsT":"10 kraliyet yasası","laws":[["İkna etmeye çalışma, seç.","Onun uyup uymadığını sen kontrol edersin – tersi değil. Reklam yapan, konuşmadan kaybetmiştir."],["Fazla açıklayan statü kaybeder.","Slayt yerine soru. İlk görüşmede konuşma payın yüzde 30’un altındadır."],["Vizyondan önce kanıt.","Gerçek bir satıcı, gerçek bir işlem, gerçek bir ödeme her gelecek slaytını yener. Vizyon ancak kanıt oturduğunda."],["Önce onun riski.","Bir kral itibarını, ekibini ve sözleşmesini kaybedebilir. O düşünmeden önce sen söyle."],["O hesaplar, sen değil.","Kendi hesapladığına inanır. Senin ona hesapladığından şüphe eder."],["Marka ancak ikinci temasta.","İlk temasta şirket adı yok – yoksa merak etmeden önce Google’lar. Doğrudan sorarsa söylersin."],["Gönderende eşit düzey.","Bir kral bir kralla ya da yönetimle konuşur. Asla üçüncü sırayla değil."],["Sadece gerçek kıtlık.","Sizin kapasiteniz, zamanlama, onun bölgesi. Uydurulan her şeyi fark eder – ve o zaman saygı biter."],["Tek atış, mükemmel hazırlanmış.","Dosyasız kral yok. Çelişkisiz plan olmadan görüşme yok."],["Gidebilmek.","Bir hayırı kabul etmeye hazır olmak, krallarda en güçlü çekim gücüdür."]],"useT":"Kraliyet Sınıfı’nı nasıl kullanırsın","use":["Kraliyet yasalarını, taht olgunluğunu, kral tiplerini ve kraliyet sekansını bir kez baştan sona oku. Geri kalan her şeyin nasıl kullanılacağını onlar belirler.","Her kraldan önce: dosya oluştur, tipi belirle, uygun mesajı seç.","[Köşeli parantez] içindeki alanları her zaman kişiye özel doldur. Hiçbir mesaj değiştirilmeden gönderilmez.","“Koşul” şu demek: cümleyi sadece koşul kanıtlanabilir şekilde sağlandığında kullan."],"task":"On yasayı yüksek sesle oku. Şimdiye kadar en sık çiğnediğin ikisini işaretle."},
 kreife:{"lead":"Bir kral sana tek bir atış hakkı verir. Altı noktadan biri eksikse ulaşılmaz – yanmış bir kral geri dönmez ve bunu başkalarına anlatır.","checkT":"Taht olgunluğu: bir krala ulaşmadan önce","check":[["Çelişkisiz kazanç planı","Tek bir güncel orijinal sürüm, ürün başına tek fiyat, tek bir hak matrisi. Profesyoneller planları denetçi gibi okur."],["Gösterilebilir kanıt vakası","Aktif bir satıcı, back office’te eşleştirilmiş bir işlem, bir ödeme kanıtı – kişinin onayıyla."],["Kapasite kuralı belirlendi","09.01.2027’ye kadar kaç krala bizzat eşlik ediyorsunuz? Öneri: en fazla beş. Kural o zaman gerçekten geçerlidir."],["Yönetim onay verdi","Kraliyet görüşmeleri için sabit randevu dilimleri ayrıldı."],["Dosya dolduruldu, puan ≥ 8","Tip, motif, gönderen ve vesile belirlendi."],["İzin verilen iletişim yolu","Mevcut ilişki, tavsiye veya iş kanalı. Toplu mesaj yok."]],"dossT":"Kral dosyaların","dossHint":"Dosyalar sadece bu cihazda kalır – asla controlling’e aktarılmaz.","add":"Kral ekle","addPh":"Kralın adı","empty":"Henüz dosya yok. İlk kralını ekle – başlangıç için isim yeterli.","edit":"Düzenle","close":"Kapat","del":"Dosyayı sil","delSure":"Gerçekten silinsin mi?","fields":[["role","İsim & rol","Pozisyon, ne zamandan beri, kamusal işlev"],["org","Organizasyon","Şirket, sektör, bölge"],["size","Büyüklük","Organizasyon veya ağ – doğrulanmış ve tahmini değerler ayrı"],["bind","Bağlılık","Mevcut şirket, muhtemel rekabet ve ayartma yasağı maddeleri"],["frust","Hayal kırıklığı sinyalleri","Şu anda onu ne rahatsız ediyor: kamuya açık açıklamalar, değişiklikler, geri çekilme"],["verb","Bağlantı","Onu ve sizi kim tanıyor? Kapı açıcı olarak ortak tanıdıklar"],["sender","Gönderen","Ona kim ulaşıyor – ve bu eşit düzey mi?"],["anlass","Vesile","Şimdi ulaşmak için somut, kanıtlanabilir bir sebep"]],"typeL":"Kral tipi","motiveL":"Kral motifi","stageL":"Aşama","scoreL":"Kral puanı","scoreDate":"Puan güncellendi","scoreT":"Kral puanı · kriter başına 0–2 puan","scoreCols":["Kriter","0","1","2"],"score":[["Ağ & karar vericilere erişim","neredeyse yok","bölgesel","büyük ve doğrudan"],["Liderlik","tek başına","küçük ekip","yöneticileri yönetir"],["Güvenilirlik & tempo","belirsiz","değişken","sözünü tutar"],["Önümüzdeki 30 gündeki zaman","yok","az","kesin planlı"],["Girişimci motivasyon","güvenlik arıyor","açık","yapı ve risk üzerine düşünür"]],"bands":[["8–10","A-kral: ulaş"],["5–7","dosyayı derinleştir"],["0–4","ulaşma"]],"scoreNote":"Puanı her görüşmeden sonra güncelle. Asla takipçi sayısından veya kişinin kendi beyanlarından çıkarma.","motT":"Dört kral motifi","motLead":"Para nadiren motiftir – krallarda zaten var. Sadece paradan bahseden, kralı ıskalar.","motCols":["Motif","Şundan tanırsın","İsabet eden cümle"],"motives":[["Miras","“kalıcı bir şeyden”, haleften, aileden bahseder","Artık her gün çekmediğinde organizasyonundan geriye ne kalır?",""],["Takdir","sahne, rütbeler ve ödüller onun için önemli","Bunu ilk kuranlar Frankfurt’ta önde duracak.","Sahne organizatör tarafından onaylandı"],["Özgürlük","bir şirkete veya işverene bağımlılıktan duyulan rahatsızlık","Gelirin bugün tek bir şirkete ne kadar bağlı?",""],["Büyüme","huzursuz, bir sonraki pazarı arıyor","Senin için bir sonraki pazar şu anda nerede?",""]],"task":"Taht olgunluğunun altı noktasını işaretle. Sonra ilk kralın için bir dosya oluştur ve puanı dürüstçe ver."},
 ktypen:{"lead":"Neredeyse her kral beş tipten birine aittir. Tipi dosyada belirlersin – ton, mesaj ve göz açıcıya o karar verir.","rows":["Endişesi","Onu harekete geçiren","Ton","Göz açıcı","Asla"],"types":[["I","Network kralı","sen","Büyük bir organizasyona sahip başka bir network şirketinin üst düzey lideri.","Sözleşme maddeleri, kendi şirketindeki itibarı, ekipteki huzursuzluk.","Değişim yerine ek. Kayıp oranına ve ekibinde kayda değer geliri olmayan birçok kişiye bir cevap.","Liderden lidere. Sakin, süperlatif yok.","“İnsanların her ay alışveriş yapıyor. Bu tüketimden bugün herkes kazanıyor – senin organizasyonun hariç.”","Şirketini kötülemek. Ekip listelerine ulaşmak. Geçiş pitch’i."],["II","Yapısal & finansal satış lideri","siz veya sen","Bir finans, sigorta veya yapısal satış organizasyonunun sahibi ya da direktörü.","Ciddiyet, sorumluluk, izinler ve denetim, müşterilerindeki itibarı.","Ek bir finans ürünü olmadan müşteri faydası. Danışmanlık randevuları arasında müşteri bağlılığı. Düzgün belgeler.","Nesnel ve rakamlara hâkim. Hitap ilişkiye göre.","“Müşterinizi yılda iki kez görüyorsunuz. Ya arada her hafta sizi olumlu bir şekilde deneyimleseydi?”","Getiri, borsa veya opsiyonlar argüman olarak. Hype kelimeleri."],["III","Saha satışı girişimcisi","sen","Bir D2D, enerji, GES, telekom veya POS satış şirketinin sahibi.","Kapasite kullanımı, marj baskısı, satışçılarının kaybı, tek bir işverene bağımlılık.","Ekibinin zaten kurduğu temaslardan ek değer. İkinci bir ayak.","Doğrudan, teori yerine pratik.","“Ekibin her gün yüzlerce kapının ve satıcının önünde duruyor. Sana tek bir an için ödeme yapılıyor – kapanış. Sonrasında o temasın senin için hiçbir değeri kalmıyor.”","Ana işini sorgulamak. Ona satışçılarını ayartmayı teklif etmek."],["IV","Kapı açıcı kral","siz","Franchise veren, birlik başkanı, girişimci kulübü, ticari temsilci organizatörü, birçok girişimci müvekkili olan danışman.","Üyeleri ve müvekkilleri nezdindeki itibarı, tarafsızlık, emek, meslek hukuku.","İnsanlarına gerçek bir katma değer sunabilmek. Ölçülebilir bir pilot. Satışçı rolü yok.","Kurumsal, kısa, somut bir pilot önerisiyle.","“İşletmelerinizin her gün müşteri teması var. Bu müşteri ilişkisinin ne kadarı satın almadan sonra onlarda kalıyor?”","Onu satışçıya dönüştürmek. Geliri ön plana koymak. Üyelerine toplu e-posta."],["V","Uykudaki kral","sen","Bir zamanlar büyük lider, bugün pasif, hayal kırıklığına uğramış veya iki proje arasında.","Bir kez daha herkesin önünde başarısız olmak. Güvenilirliği. “Yine yeni bir şey.”","Geçmişine saygı. Duyurusuz, sessiz bir yeniden başlangıç. Rütbe yerine bir rol.","Kişisel, takdirkâr, baskısız.","“Kimseye bir şey kanıtlamak zorunda değilsin. Soru sadece, bilgin şu anda bir yerde çalışıyor mu?”","Başarısızlıkları hatırlatmak. Pilottan önce kamuya duyuru. Baskı."]],"task":"Dosyalarındaki her kral için tipi belirle – ve her mesajdan önce tipinin endişesini, tonunu ve yasaklarını oku."},
 ksequenz:{"lead":"Dosyadan pilota yedi aşama. Her aşamanın bir hedefi ve bir çıkış kriteri var. Bir aşamayı atlayan kralı kaybeder.","goalL":"Hedef","exitL":"Çıkış","steps":[["Dosya","Gün 0","Tip, motif, gönderen, vesile ve puan belirlendi.","Puan 8’in altında → ulaşma."],["İlk temas","Gün 1","Cevap ve 20 dakikalık randevu. Merak, marka yok.","Tepkisiz iki takip → 90 gün beklet."],["Niteleme görüşmesi","20 dakika","O anlatır, sen kontrol edersin. Puanı güncelle.","Puan 5’in altında → nazikçe beklet."],["Göz açıcı görüşme","60 dakika","Kaldıracı kendisi formüle eder – kendi rakamlarıyla.","Kaldıraç görmüyor → hiçbir şey ekleme."],["Kanıt & yönetim","45 dakika","Gerçek vaka artı yönetimin karşı kontrolü.","Açık sözleşme veya koşul sorusu → netleşene kadar ara."],["Kurucular çemberi","90 dakika","En az beş isimli başlatıcı ve başlangıç tarihiyle yazılı pilot taahhüdü.","7 gün içinde taahhüt yok → ocakta tekrar."],["Pilot","14 gün","Başlangıçlar, ilk satıcı görüşmeleri, kaydedilmiş CP.","Değerlendirme karar verir: yaygınlaştırma veya durdurma."]],"takt":"<b>Ritim:</b> 2. aşamadan 6. aşamaya ideal olarak 21 gün. Sonraki aşama olmadan 30 günden fazla şu demektir: kral süreçte değil, beklemede.","stages":["Dosya","Temas","Görüşme","Göz açıcı","Yönetim","Kurucular çemberi","Pilot","Başladı","Bekletildi · tekrar tarihiyle"],"pipeT":"Kraliyet pipeline’ın","pipeHint":"Her kral tam olarak bir aşamada durur – tarih ve sonraki adımla.","pipeCols":["Kral","Puan","Aşama","Sonraki adım","Tarih"],"pipeEmpty":"Henüz kral yok. Onları “Taht olgunluğu & dosya” altında ekle.","kpiT":"KPI’lar","kpiCols":["KPI","Tanım","Ritim"],"kpis":[["A-dosyalar","puanı ≥ 8 ve dosyası eksiksiz olan krallar","haftalık"],["İlk temaslar","gönderilmiş, kişiye özel uyarlanmış ilk mesajlar","haftalık"],["Cevap oranı","cevaplar ÷ ilk temaslar","haftalık"],["Görüşmeler","yapılan 20 dakikalık görüşmeler","haftalık"],["Göz açıcılar","yapılan 60 dakikalık görüşmeler","haftalık"],["Pilot taahhütleri","yazılı, en az beş isimli başlatıcı ve başlangıç tarihiyle","haftalık"],["Başlayan partnerler","devam eden pilotlardan","haftalık"],["Kaydedilmiş CP","pilotlardan, back office’e göre","haftalık"],["Bekletilen krallar","tekrar tarihiyle","aylık"]],"planT":"İlk dört hafta için planlama varsayımı","plan":"15 A-dosya → 10 ilk temas → 5 görüşme → 3 göz açıcı görüşme → 1–2 pilot","planNote":"Bu bir varsayım, ölçülmüş bir oran değil. Dört hafta sonra kendi gerçek değerlerinizle değiştirin.","rhythmT":"Haftalık ritim","rhythm":[["Pazartesi · 15 dk","Pipeline değerlendirmesi: kim nerede? Bu hafta sıra kimde? Hangi kral çok uzun bekliyor?"],["Cuma · 15 dk","Öğrenimler: hangi mesaj cevap getirdi, hangisi getirmedi? Metinleri uyarla, puanı güncelle."]],"task":"Pipeline’ındaki her kralı tam olarak bir aşamaya yerleştir – sonraki adım ve tarihle. Pazartesi ve cuma 15’er dakika değerlendirme."},
 knachr:{"lead":"İlk mesajın tam olarak tek bir görevi var: 20 dakikalık bir görüşme. Bilgilendirmek, ikna etmek, satmak değil.","forKing":"Hangi kral için?","manual":"[İsim] alanını elle uyarla","rulesT":"İlk temasın altı kuralı","rules":["Somut, kanıtlanabilir bir vesile – kopyala-yapıştır yok.","Şirket adı yok, link yok, PDF yok, rakam yok.","Açıklama yerine merak: kendine hiç sormadığı bir soru.","En fazla beş cümle.","Küçük bir sonraki adım: 20 dakika, iki randevu önerisi.","Bir çıkış kapısı: “Uymuyorsa söylemen yeterli.” Bu baskıyı alır – ve cevap vermeyi kolaylaştırır."],"firstT":"İlk temas · 9 şablon","first":[["5.1","Network kralı","WhatsApp / DM · sen","Selam [İsim], bir süredir organizasyonunu nasıl yönettiğini takip ediyorum – özellikle [somut vesile]. Şu anda az sayıda liderle mevcut işinde hiçbir şeyi değiştirmeyen, ama büyük organizasyonların çoğunun kendine hiç sormadığı bir soruyu cevaplayan bir şey üzerinde çalışıyorum: insanlarının tüketimine aslında ne oluyor? Liderden lidere 20 dakikaya ne dersin? Uymuyorsa söylemen yeterli.","Gerçek bir vesileyle takdir, hemen cevaplayamayacağı bir soru ve rica yerine eşit düzey."],["5.2","Network kralı","Sesli mesaj · yakl. 45 sn","Selam [İsim], ben [senin adın]. Uzun bir metin yerine bilerek sesli mesaj gönderiyorum. [Tek cümlede vesile]. Şu anda birkaç liderle işinde hiçbir şeyi değiştirmeyen, ama bence heyecan verici bir soruyu cevaplayan bir şey üzerinde çalışıyorum: büyük organizasyonlarda tüketime ne oluyor? Bunu sesli mesajla anlatmayacağım – gel 20 dakika telefonda konuşalım. İlgilenmiyorsan da tamamen olur. Haber vermen yeterli.","Ses, metnin sahip olmadığı yakınlığı ve samimiyeti yaratır. Sakin konuş, okuma, satışçı tonu yok."],["5.3","Yapısal & finansal satış lideri","Mesaj · siz","İyi günler [İsim], size bilerek ulaşıyorum, çünkü gerçek müşteri güvenine sahip bir organizasyon kurdunuz – [somut vesile]. Az sayıda satış organizasyonu sahibiyle, ek bir finans ürünü gerektirmeyen ve müşterileri danışmanlık randevuları arasında organizasyonunuza bağlayabilen bir yaklaşım üzerinde çalışıyorum. Size bir şey göstermeden önce: bunun sizin için ilgili olup olmadığını kontrol etmek için 20 dakikanız olur mu? [Gün] mü [gün] mü?","Ana endişesine dokunur – ek ürün yok, sorumluluk yok – ve ona kontrol eden rolünü bırakır."],["5.4","Saha satışı girişimcisi","WhatsApp · sen","Selam [İsim], girişimciler arası kısa bir soru: ekibin her gün yüzlerce kapının ve satıcının önünde duruyor. Sana tek bir an için ödeme yapılıyor – kapanış. Şu anda az sayıda satış şirketi sahibiyle, ana işinizde hiçbir şey değişmeden bu temasın sonrasında ne değeri olabileceği üzerinde çalışıyorum. Bu hafta 20 dakika? [Gün] mü [gün] mü?","Kendi modelindeki bir kör noktayı hemen fark eder – ve kimse ona bir şey satmamıştır."],["5.5","Kapı açıcı kral","E-posta · siz","Konu: [Üyeleriniz/franchise partnerleriniz] için katma değer – küçük bir pilot önerisi\n\nSayın [hitap ve isim],\n\nsize ulaşıyorum, çünkü [organizasyon] [somut vesile] ile tanınıyor.\n\nİşletmelerin ana işlerini değiştirmeden müşterilerini satın almadan sonra da bağlı tutabildiği bir model üzerinde çalışıyoruz. Bunun için üç ila beş işletmeyle ölçülebilir bir pilot için az sayıda seçilmiş partner arıyoruz.\n\nBunu size 20 dakikada sunabilir miyim? Sonrasında bunun [üyeleriniz] için söz konusu olup olmadığına siz karar verirsiniz.\n\nSaygılarımla\n[İsim] · [görev] · [telefon]","Kurumsal, kısa, net sınırlı. Karar verici olarak kalır ve satışçıya dönüşmez. Sadece iş adreslerine, tek tek gönderilir."],["5.6","Uykudaki kral","WhatsApp · sen","Selam [İsim], [somut başarı]yı kurduğun zamanı sık sık düşünüyorum. Sana bir şey satmak ya da seni bir şeye ikna etmek istemiyorum. Birkaç liderle şu anda üzerinde çalıştığım bir şey hakkında dürüst değerlendirmeni merak ediyorum – çünkü yapıları senin kadar anlayan neredeyse kimseyi tanımıyorum. Bir kahveye ya da bir görüşmeye ne dersin?","Katılımını değil, tavsiyesini istiyorsun. Bu onu onurlandırır, savunmasını düşürür – ve tavsiye veren birlikte düşünmeye başlar."],["5.7","Sıcak tanıştırma: tavsiye eden için metin","WhatsApp · sen","[Kralın adı], seni [senin adın] ile tanıştırmak istiyorum. [O] şu anda az sayıda satış lideriyle bir şey kuruyor ve aklıma hemen sen geldin – [vesile] yüzünden. Pitch yok, sadece tanışmanız gerektiğini düşünüyorum. Sizi tanıştırabilir miyim?","Ödünç alınmış güven en güçlü giriştir. Önce sor, sonra tanıştır – bu krala saygıdır."],["5.8","Tanıştırmadan sonra senin cevabın","WhatsApp · sen","Teşekkürler, [tavsiye eden]. [İsim], çok memnun oldum. [Tavsiye eden] bana senin nasıl [vesile] anlattı. Kısa tutayım: 20 dakika konuşalım, sonra senin için ilginç olup olmadığını bilirsin. [Gün] mü [gün] mü?",""],["5.9","İş bağlantıları için bağlantı isteği","LinkedIn · en fazla 300 karakter · siz","[İsim], [organizasyon]daki çalışmalarınızı [vesile]dan beri takip ediyorum. Az sayıda satış şirketi sahibiyle mevcut müşteri ilişkileri üzerine ek bir gelir katmanı kuruyorum ve bağlantı kurmak isterim – pitch olmadan.","Sonrasında: kabulden sonra hemen pitch yapma. Önce bir gönderisine tepki ver, sonra uyarlanmış 5.3 veya 5.4’ü gönder."]],"reactT":"İlk tepkiler · 14 cevap","reactLead":"Her cevap görüşmeye götürür – asla sohbette bir açıklamaya değil. Sohbette açıklanan, sohbette değerlendirilir. Ve sohbette kaybedersin.","reactRules":["Şirketi doğrudan mı soruyor? Söyle. Kaçamak cevap profesyonellere ciddiyetsiz gelir.","Görüşmeden önce rakam, PDF, link yok. Sohbetteki bir rakam bir vaattir.","En fazla iki takip. Sonrası bitti."],"react":[["6.1","“Ne hakkında peki?”","","Adil. Tek cümlede: büyük organizasyonların insanlarının günlük tüketiminden, işlerini değiştirmeden, nasıl ek bir gelir katmanı yapabilecekleri hakkında. Gerisi sohbette ziyan olur. 20 dakika, ve senin için ilgili olup olmadığını bilirsin. [Gün] mü [gün] mü?",""],["6.2","“Bana bilgi gönder.”","","Memnuniyetle – ama önce hangi bilgilerin senin için ilgili olduğunu bilmem lazım. Yoksa 18’i organizasyonuna uymayan 20 sayfa alırsın. Bana 15 dakika ver, sonra sana tam olarak uyanı göndereyim.",""],["6.3","“Arkasında hangi şirket var?”","","ePOINT platformuyla Best Prime. İsmi rahatça Google’layabilirsin – sadece benim derdim olan mekanizma hakkında sana bir şey söylemez. Onu 20 dakikada gerçek bir vaka üzerinde gösteririm. [Gün] uyar mı?","Önemli: dürüst cevap ver. Bu soruda kaçamak yapan oyun dışı kalır."],["6.4","“Bu network marketing mi?”","","Evet, satış tarafı partner yapısı olarak kurulmuş – bunu hemen kendim söylemeyi tercih ederim. Ama senin için ilginç olan yapı değil, arkasındaki mekanizma: satıcılardaki gerçek alışverişlerle müşteri sadakati. Sana uyup uymadığını 20 dakikada kontrol ederiz – slaytsız.","Kendisi söyleyen, itirazın gücünü alır. İnkâr etmek tüm güveni yok ederdi."],["6.5","“Sözleşmeyle bağlıyım.”","","Bunu söylemen iyi – bunu ciddiye alıyorum. Bizim yüzümüzden başının derde girmesini istemem. Görüşmede sözleşmenin tam olarak neye izin verdiğine bakalım ve gerekirse kontrol ettirelim. Uymuyorsa bunu sana kendim söylerim.","Bu cümle herhangi bir sunumdan daha fazla güven oluşturur. Kendi kapanışını değil – onu korursun."],["6.6","“Vaktim yok.”","","Anlıyorum – hele sende. Bu yüzden bir proje değil, 20 dakika istiyorum. Sonrasında uymazsa, o kadar. Gelecek hafta daha mı iyi, [gün] mü [gün] mü?",""],["6.7","“Ben bundan ne kazanırım?”","","Bunu senin gerçek rakamların ve geçerli planla birlikte hesaplarız – internetteki örnek hesaplamalarla değil. Gerisi ciddiyetsiz olur. Görüşmeye üç rakam getir, sonra siyah üzerine beyaz görürsün.","Önemli: sohbette asla rakam yok. Yazdığın şey vaat olarak okunur."],["6.8","“Kulağa ilginç geliyor.”","","Sevindim. O zaman hemen netleştirelim: [gün] saat [saat] mi, yoksa [gün] saat [saat] mi? Sonra hazırlık için sana üç kısa soru gönderirim.",""],["6.9","Sessizlik · takip 1","4 gün sonra","Selam [İsim], sohbette kaybolmasın diye bir kez kısaca hatırlatıyorum. Şu an uymuyor mu, sonra mı, yoksa hiç mi? Üçü de tamamen olur.",""],["6.10","Sessizlik · takip 2 (son mesaj)","7 gün daha sonra","[İsim], sanırım zamanlama şu an uygun değil – sorun değil. Bir daha yazmayacağım. Bir gün merak edersen, beni nerede bulacağını biliyorsun.","Önemli: mesaj içtenlikle yazılmıştır – ve tam da bu yüzden çoğu zaman bir cevap tetikler. Sonrasında gerçekten bir daha yazma."],["6.11","Üç rakamla randevu teyidi","","Harika, [gün] saat [saat] kesin. Zamanı iyi kullanmak için lütfen üç kaba rakam getir:\n1) Organizasyonunda kaç kişi aktif?\n2) Bunlardan kaçı kayda değer kazanıyor?\n3) Ekibin düzenli olarak kaç satıcı ve girişimciyle görüşüyor?\nTahminler yeterli.","Hazırlanan yatırım yapmıştır. Ve siz konuşmadan önce hesaplamaya başlar."],["6.12","Görüşmeden sonra · özet","","Açık görüşme için teşekkürler. Bende iki nokta kaldı: [nokta 1] ve [nokta 2]. Konuştuğumuz gibi sonraki adım: [tarih] tarihinde [somut eylem]. O zamana kadar bir şey değişirse, haber vermen yeterli.",""],["6.13","Nazikçe beklet","","Açıklığın için teşekkürler. Benim için net: şu an uymuyor – ve bu tamamen olur. [ay] ayında bir kez kısaca yazıp sende bir şey değişmiş mi diye soracağım. O zamana kadar [onun projesi] için her şey gönlünce olsun.",""],["6.14","90 gün sonra tekrar","","Selam [İsim], söz verdiğim gibi bir kez yazıyorum. Son görüşmemizden beri bizde [somut, belgelenebilir gelişme] oldu. Bu bugün senin için bir konu mu – yoksa hâlâ değil mi? İkisi de olur.","Koşul: sadece gerçek, belgelenebilir bir gelişme varsa gönder."]],"task":"İlk A-kralın için tipine uygun ilk mesajı seç, her köşeli parantezi kişiye özel doldur ve göndermeden önce sponsoruna okut."},
 kgespr:{"lead":"Kraliyet görüşmesinde o konuşur, sen sorarsın. Konuşma payın yüzde 30’un altındadır – kanıta kadar.","aT":"A · Niteleme görüşmesi · 20 dakika","aCols":["Dakika","Aşama","Ne söylersin veya yaparsın"],"a":[["0–2","Çerçeve","“20 dakika ayırdım. Her şeyden önce nasıl konumlandığını anlamak istiyorum. Sonunda ikimiz de konuşmaya devam etmenin anlamlı olup olmadığını dürüstçe söyleriz. Olur mu?”"],["2–12","O anlatır","Aşağıdaki beş teşhis sorusu. Dinle, not al, yorum yapma."],["12–17","Teaser","“Sana şirketi değil, bir hesabı göstereceğim – senin rakamlarınla. Bunun için seninle bir saate ihtiyacım var.”"],["17–20","Karar","“Bunu kendi rakamlarınla gözden geçirmek senin için anlamlı mı?” Evet → randevuyu kesinleştir. Hayır → “Teşekkürler, o zaman bırakalım.”"]],"diagT":"Beş teşhis sorusu","diag":["Organizasyonunda gerçekten kaç kişi aktif?","Şu anda seni en çok ne rahatsız ediyor?","İnsanlarından kaçı kayda değer kazanıyor?","Bir yıl sonra “Bu güçlü bir yıldı” demen için ne olması gerekir?","Ek bir şey yapmak istersen sözleşme açısından ne kadar özgürsün?"],"bT":"B · Göz açıcı görüşme · 60 dakika","bCols":["Aşama","Süre","Ne olur"],"b":[["1 · Ayna","10 dk","Görüşmede söylediklerini özetle – onun kelimeleriyle. “Seni doğru anladım mı?”",""],["2 · Üç soru","15 dk","Üç göz açıcı soru (aşağıda). Sonra sus.",""],["3 · Onun hesabı","15 dk","Rakamlarını o girer. Geçerli planla hesaplarsınız – her sonuç açıkça senaryo olarak işaretlenir, asla tahmin olarak değil.",""],["4 · Kanıt","10 dk","Gerçek bir vaka: satıcı → müşteri → alışveriş → eşleştirme → ödeme. Mümkünse back office’te canlı.",""],["5 · Saklanan","5 dk","Ancak sorarsa: tüm partner ağındaki alışverişlerden pay almak.","sadece geçerli planın öngördüğü şekilde"],["6 · Kapanış","5 dk","Baskı yerine take-away (gerçek kıtlık) ve kurucular çemberine davet.",""]],"qT":"Üç göz açıcı soru","q":["Organizasyonunda kaç kişi var – ve bunlardan kaçı kayda değer kazanıyor?","Diğerleri yine de her ay ne yapıyor? Alışveriş: gıda, yakıt, online.","Bugün bu tüketimden kim kazanıyor? Ya bunun bir kısmı senin organizasyonunda kalsaydı – insanlarından hiçbiri bir ürün satmak zorunda kalmadan?"],"silence":"<b>Susma kuralı:</b> Üçüncü sorudan sonra en az beş saniye sus. İlk konuşan, ondan keşfi alır.","cT":"C · Yönetim randevusu · 45 dakika","cSub":"Şirketi o kontrol eder – siz onu değil.","c":[["Her soru serbest:","yapı, ödemeler, plan, zaman çizelgesi, ePAY durumu."],["Doğru olmayan hiçbir cevap yok.","“Bilmiyorum, [tarih]e kadar netleştiririm” her güzel cevaptan güçlüdür."],["ePAY’i adıyla söyle:","09.01.2027 için planlandı – ne fazla ne eksik."]],"task":"Bir sonraki görüşmeni hazırla: çerçeve cümlesi ezberde, beş teşhis sorusu bir kâğıtta, sonrasında puanı güncelle."},
 keinw:{"lead":"Bir kralın her itirazının arkasında itibar, ekip veya sözleşme endişesi vardır. Cümleye değil, endişeye cevap ver.","behind":"Arkasında:","goal":"Hedef:","search":"İtiraz ara","items":[["“Zaten bir işim var.”","yerine geçme korkusu","Tam da bu yüzden seninle konuşuyorum. Hiçbir şeyin yerine geçmemeli, zaten sahip olduğunun üzerine inşa etmeli.","ek çerçevesi"],["“Bunların hepsini gördüm.”","yorgunluk, şüphecilik","Muhtemelen çok şey gördün. Bu yüzden sana sunum değil, gerçek bir vaka gösteriyorum. Seni ikna etmezse on dakikada işimiz biter.","pitch yerine kanıt"],["“Ekibim yeni bir şey istemiyor.”","huzursuzluk korkusu","O zaman ekiple başlama. Güvendiğin beş kişiyle başla – 14 gün, sessizce. Sonra karar verirsin.","küçük pilot"],["“Şirket bunu sürdüremezse?”","şirket riski","Haklı bir soru. Bu yüzden her karardan önce yönetimle oturur ve tam olarak bu soruyu sorarsın.","yönetim randevusu"],["“ePAY ve borsa şimdiden var mı?”","vizyon şüphesi","Hayır. ePAY 09.01.2027 için planlandı, halka arz bir niyet. Sana henüz olmayan bir şey satmıyorum – bugün işleyen şeyden bahsediyoruz.","güvenilirlik"],["“Sizin en iyileriniz ne kazanıyor?”","kanıt istiyor","Gerçek ödeme kanıtlarını görüşmede gösteririm – kişinin onayıyla, gruplardan ekran görüntüsü değil. Daha önemli soru zaten şu: senin rakamlarınla ne çıkıyor?","kendi hesabı"],["“Başka kim var?”","sosyal kanıt","İsimleri sadece onayla söylerim – seninkini de başkasına vermediğim gibi. Diğerleriyle kurucular çemberinde tanışırsın.","değer olarak gizlilik"],["“Başkalarının almadığı ne alacağım?”","özel anlaşma","Özel plan yok – plan herkes için geçerli, yoksa hiçbir değeri olmazdı. Senin aldığın: benim kişisel zamanım, yönetime doğrudan hat ve kurucular çemberinde bir yer.","güç olarak adalet"],["“Bunu eşimle / ortağımla konuşmam lazım.”","güvence","Çok iyi. Üçümüz birlikte mi gözden geçirelim? O zaman o da aynı bilgileri birinci elden alır.","ortak karar vericiyi dahil et"],["“Üç ay sonra yaz.”","şimdi değil – veya bahane","Yazarım. Neye dikkat edeceğimi bilmek için bir soru daha: sana uyması için üç ay içinde neyin değişmiş olması gerekir?","gerçek sebebi öğren"],["“Bu bir saadet zinciri değil mi?”","ciddiyet sorusu","Haklı soru – bunu her satışa sor. Benim ölçütüm: her euronun arkasında gerçek bir karşılık olmalı – bir satıcı, bir müşteri, bir hizmet. Tam olarak bunu gerçek vaka ve sözleşme üzerinde kontrol edelim, istersen avukatınla da.","güvence vermek yerine kontrol"],["“Sana neden güveneyim?”","temel soru","Henüz güvenmemelisin. Güven kanıtla oluşur – bu yüzden büyük bir karar yerine pilot yapıyoruz.","pilot"]],"task":"On iki itirazı yüksek sesle oku ve bir sonraki kralının en büyük olasılıkla getireceği üçünü çalış."},
 kabschl:{"lead":"Aciliyet evet. Uydurma kıtlık asla. Krallar yıllarca kendileri baskıyla çalıştı – onu iki cümlede tanırlar. Ortaya çıkan bir hile tek bir krala değil, tüm çevresine mal olur.","fomoT":"Gerçek kıtlık: dört FOMO kuralı","fomo":[["Sizin kapasiteniz","“Frankfurt’a kadar en fazla beş satış liderine bizzat eşlik ediyorum.”","Statüyü çevirir: artık o sana karşı kendini kanıtlıyor.","kural belirlendi ve uygulanıyor"],["Zamanlama","“Planlanan ePAY başlangıcından önce yapısı olan, tek başına değil ekiple başlar.”","Her pazar açılışının gerçek mantığı.","ePAY’i her zaman “planlandı” diye ifade et"],["Sektör & bölge","“Sektöründe satıcıları ve müşterileri ilk bağlayan, onlara sahip olur.”","Kendi işinden bildiği rekabet mantığı.","sözleşmede olmayan bölge koruması yok"],["Sahne","“09.01.’e kadar kanıtlanabilir şekilde başlayan, Frankfurt’ta kurucu üye olarak önde durur.”","Statü krallarda paradan daha güçlü çeker.","organizatör tarafından onaylandı"]],"okT":"Serbest ve yasak","okCols":["Serbest","Yasak"],"ok":[["“Sadece beş kişi alıyorum, çünkü her birine bizzat eşlik ediyorum.”","“Sadece üç yer kaldı!” – doğru değilse"],["“Pilot [tarih]e kadar sürüyor. Sonra 2027’de kiminle kuracağıma karar veriyorum.”","sonrasında sessizce uzatılan süreler"],["“Senin rakamlarınla hesaplayalım.”","“Burada ayda 10.000 € kazanabilirsin.”"],["“ePAY 09.01.2027 için planlandı.”","“ePAY hazır” veya “garantili”"],["“İlk gelen, ilişkileri ilk kurar.”","sözleşmesiz “özel bölge”"],["statü, sahne, rol, kişisel eşlik","yem olarak hisse, halka arz veya opsiyonlar"]],"uwg":"Sahte kıtlık, UWG’ye (Alman haksız rekabet yasası) göre klasik bir yanıltma vakasıdır – güven kaybına ek olarak.","closeT":"Kraliyet kapanışları","close":[["9.1","Take-away kapanışı","Görüşme · sen","Bugün seni ikna etmek istemiyorum. Frankfurt’a kadar en fazla beş satış liderine bizzat eşlik ediyorum ve sadece pilotun iki taraf için de uyduğunu gösterdiği kişileri alıyorum. İstersen bunu 14 günde senin beş insanınla kontrol ederiz. İstemezsen tamamen olur – o zaman iletişimde kalırız.","Gitmeye hazır olmak, krallarda en güçlü çekim gücüdür. Koşul: kapasite kuralı geçerli."],["9.2","Kapı açıcılar için pilot kapanışı","Görüşme · siz","Size bir çerçeve sözleşme değil, 14 gün boyunca üç ila beş işletmeyle bir pilot öneriyorum. Sonrasında bunu [üyelerinize] tavsiye edip etmeyeceğinize rakamlara bakarak siz karar verirsiniz. [tarih] tarihinde başlamak size uyar mı?",""]],"gkT":"Frankfurt kurucular çemberi","gkLead":"Etkinlik değil, sunum değil: her kralın kendi rakamlarıyla hesapladığı ve sonunda kendisinin karar verdiği kapalı bir çalışma oturumu.","gkFacts":[["en fazla 8","oturum başına satış lideri"],["90 dk","çalışma oturumu, şov değil"],["1 : 1","kişisel davetli"],["YÖN","yönetim masada"]],"gkCritT":"Katılım kriterleri – hepsi sağlanmalı","gkCrit":["göz açıcı görüşmeden sonra puan ≥ 8","karar vericilere erişimi olan kendi organizasyonu","sözleşme durumu kontrol edildi ve serbest","en az beş kişiyle 14 günlük pilota hazır olmak"],"gkFlowT":"Akış · 90 dakika","gkCols":["Dakika","Ne olur"],"gkFlow":[["0–10","Yönetimin karşılaması. Kurallar: gizli, sunum yok, her soru serbest."],["10–25","Canlı kanıt vakası: satıcı, müşteri, alışveriş, eşleştirme, ödeme."],["25–55","Çalışma oturumu: herkes kendi rakamlarıyla hesaplar – senaryo olarak, geçerli planla."],["55–75","Yönetime açık sorular. Hiçbir şey yasak değil."],["75–90","Karar: pilot taahhüdü veya nazik bir hayır. Ardından kısa birebir görüşmeler."]],"gkChain":["Kurucular çemberi","14 gün pilot","Değerlendirme","Yaygınlaştırma veya durdurma","Sahne 09.01."],"gkCond":"Frankfurt’taki sahneyi sadece organizatör onayladıysa duyur.","invT":"Davetler","inv":[["10.1","Kurucular çemberine davet","WhatsApp · sen","[İsim], görüşmemizden sonra seni bizzat küçük bir gruba davet etmek istiyorum: en fazla sekiz satış lideri, 90 dakika, yönetimimizle. Sunum değil, bir çalışma oturumu – herkes kendi rakamlarıyla hesaplar, her soru serbest. Sonunda herkes 14 günlük bir pilot başlatıp başlatmayacağına kendisi karar verir. [Tarih], [yer]. Var mısın?",""],["10.2","Kurucular çemberine davet","E-posta · siz","Konu: Kişisel davet – [tarih] kurucular çemberi\n\nSayın [hitap ve isim],\n\ngörüşmemizden sonra sizi bizzat küçük bir çalışma oturumuna davet etmek istiyorum: en fazla sekiz girişimci ve satış sorumlusu, 90 dakika, yönetimimizle birlikte.\n\nSunum yok. Her katılımcı kendi rakamlarıyla hesaplar, her soru serbesttir. Sonunda herkes 14 günlük bir pilot başlatıp başlatmayacağına kendisi karar verir.\n\nTarih: [tarih, saat] · Yer: [yer]\n\nSizi aramızda görmekten memnuniyet duyarım.\n\nSaygılarımla\n[İsim]",""],["10.3","Taahhütten sonra pilot anlaşması","WhatsApp · sen","Konuştuğumuz gibi [tarih] tarihinde seninle ve [beş başlatıcının isimleri] ile 14 günlük pilotu başlatıyoruz. Üç şeyi ölçüyoruz: başlangıçlar, ilk satıcı görüşmeleri ve kaydedilmiş CP. Değerlendirme [tarih]. Sonra sen karar verirsin: yaygınlaştırma veya durdurma. Sabırsızlanıyorum.",""]],"task":"Kapasite kuralını yazılı olarak belirle – ve sadece koşulu kanıtlanabilir şekilde sağlanan kıtlıkları kullan."},

gal":"<b>Hukuki tavsiye değildir:</b> belgeleri, ifadeleri ve kazanç sunumlarını kullanmadan önce hukuken kontrol ettir.","cheatT":"Kopya kâğıdı · her kraliyet görüşmesinden önce bir kez oku","cheat":[["Tutum","Seç, ikna etmeye çalışma. O şirketi kontrol eder – sen onu kontrol edersin. Konuşma payı yüzde 30’un altında."],["İlk temas","vesile · merak · marka yok · beş cümle · 20 dakika · bir çıkış kapısı."],["Üç soru","1. İnsanlarından kaçı kayda değer kazanıyor? 2. Diğerleri yine de her ay ne yapıyor? 3. Bugün bu tüketimden kim kazanıyor?"],["Dört gerçek kıtlık","sizin kapasiteniz · planlanan ePAY başlangıcından önceki zamanlama · sektör & bölge · 09.01. sahnesi"],["Kapanış","“Bugün seni ikna etmek istemiyorum. … İstersen bunu 14 günde senin beş insanınla kontrol ederiz. İstemezsen tamamen olur.”"],["Çıkış kuralları","puan 8’in altında → ulaşma · 2 takip → beklet · kendi kaldıracı yok → hiçbir şey ekleme · 7 günde taahhüt yok → ocak."],["Asla","gelir vaat etmek · kıtlık uydurmak · sohbette rakam · başka şirketleri kötülemek · ekip listelerinden ayartmak · ePAY’i veya borsayı hazır diye satmak."]],"footer":["Onun riskine saygı","Vizyondan önce kanıt","Reklam yerine seçim"],"task":"Her kraliyet görüşmesinden önce kopya kâğıdını oku. Yasak kelimeleri şablonlarından çıkar."}

scripts:{"warm":[["K1 · Arkadaşlar & aile · tasarruf ipucu","Selam [İsim], kısa bir tasarruf ipucu: bir süredir ePOINT kullanıyorum, normal alışveriş yaparken para iade eden ücretsiz bir uygulama – [kişinin kullandığı mağaza] dahil. [Sadece doğruysa: geçen hafta bile … geri aldım] Linki göndereyim mi? İki dakika sürer.","Önce ver, kendi deneyimin, minicik bir adım."],["K2 · Tanıdıklar & iş arkadaşları · bir vesileyle","Merhaba [İsim], geçenlerde bana [gerçek vesile: her şey pahalanıyor / çok online sipariş veriyorsunuz] demiştin. Ben de buna yardımcı olan bir uygulama kullanıyorum: ePOINT – ücretsiz, katılımcı mağazalarda ve online mağazalarda %3 ile %30 arası para iadesi. Bir bakmak ister misin?","Kişinin kendi söylediğine bağlanıyorsun."],["P1 · Arkadaş / sıcak kişi · ikna etmek yerine seçmek","Merhaba [İsim], bir cashback uygulaması etrafında yan iş başlattım ve aklıma hemen sen geldin, çünkü [gerçek sebep]. Sana uyar mı bilmiyorum – 15 dakikada birlikte bakalım. Uymazsa hiç sorun değil. Perşembe mi daha iyi olur, cumartesi mi?","İlgililik, seçme tutumu, çıkış kapısı, alternatif soru."],["P2 · Sesli mesaj · en fazla 40 saniye","Selam [İsim], tam seni düşünüyordum, çünkü [gerçek sebep]. Best Prime ile yan olarak cashback uygulaması ePOINT etrafında bir şey kurdum. Sana 15 dakikada göstermek isterim – ne zaman uygun olduğunu yazman yeterli.","Sesin, metnin yaratmadığı bir yakınlık yaratır."],["P3 · Eski tanıdık · önce ilişki, sonra konu","Selam [İsim], uzun zamandır konuşmadık – sen ve [gerçek bağlantı] nasılsınız? Ayrıca yazıyorum çünkü iş olarak yeni bir şey kuruyorum ve aklıma sen geldin. Ama önce anlat, sende neler yeni!","Başta gösterilen içten ilgi konuşmayı açar."],["P3b · Eski tanıdık · onun cevabından sonra","Harika! Benim konuma gelince: Best Prime’da partnerim ve cashback uygulaması ePOINT’in satışını kurmaya yardım ediyorum. 15 dakikalığına bakmak ister misin?","Ne hakkında olduğunu net söyle – ve küçük bir adım iste."],["P4 · Story veya gönderiye tepki","Selam [İsim], [story veya gönderi] gördüm. Harika! Sana bir şey sorabilir miyim: günlük hayatına uyuyorsa, prensipte ikinci bir gelir kaynağına açık mısın?","Pitch yerine içten bir iltifat ve izin sorusu."],["P5 · Tavsiye","Merhaba [İsim], [tavsiye eden] sana ulaşmamı önerdi, çünkü [sebep]. Konu ePOINT ve Best Prime’da bir satış faaliyeti. Bu hafta 15 dakikan var mı?","Ödünç alınmış güven – tavsiye edeni her zaman önce an."]],"cold":[["V1 · Satışçı · eşit düzeyde","Merhaba [İsim], insanlara ve şirketlere erişimin var – tam da bu yüzden yazıyorum. Best Prime ile cashback uygulaması ePOINT etrafında bir satış alanı kuruyorum. Mesele işini bırakman değil, kişilerine ek bir kaldıraç eklemen. Gelecek hafta 15 dakika?","Eşit düzeyde bir ton, mevcut işi için net fayda."],["V2 · Satış lideri · yapı düzeyinde","Merhaba [İsim], senin için ilginç olan tek tek kapanışlar değil, yapın düzeyinde olan. ePOINT’in partnerlerin için ek gelir kaynağı olarak uyup uymadığını seninle birlikte kontrol etmek isterim – müşteri faydası, emek ve kazanç konusunda açık kartlarla. Gelecek hafta 20 dakikan var mı?","Tek satışa değil, role hitap eder. Gerçek krallar için: Kraliyet Sınıfı’nı kullan."],["M1 · Dernek veya topluluk (siz)","İyi günler [İsim], çok üyeli [dernek veya topluluk] yönetiyorsunuz. Üyelerinize gerçek fayda sağlayan ve size hiçbir maliyeti olmayan bir önerim var: normal alışverişte para iadesi sağlayan bir cashback uygulaması. Bunun nasıl görünebileceğini 10 dakikada – başlangıç için küçük bir pilot olarak – size gösterebilir miyim?","Onun insanlarına katma değer, risksiz, küçük pilot."],["M2 · Girişimci, soğuk (siz · yüz yüze, LinkedIn, Xing)","İyi günler [İsim], size [somut bağlantı] üzerinden ulaştım. Best Prime’da partnerim ve cashback uygulaması ePOINT ile, kişilerine gerçek katma değer sunmak isteyen girişimcilerden bir ağ kuruyorum. Size uyar mı bilmiyorum – bunu 10 dakikada birlikte kontrol etmek isterim. Gelecek hafta kısa bir görüşme mümkün olur mu?","Somut bağlantı, seçme tutumu, düşük giriş eşiği."],["H1 · Satıcı, soğuk (siz)","İyi günler [İsim], size çok hedefli olarak ulaşıyorum. ePOINT ile şu anda bir satıcı ve müşteri ekosistemi kuruyoruz ve bunun için müşteri trafiği anlamlı olan işletmeler arıyoruz. Size telefonda bir şey anlatmak istemiyorum – sadece 10 dakikada işletmeniz için bunun bir anlamı olup olmadığını kontrol etmek istiyorum.","Zamanına saygı, satmak yerine kontrol etmek."],["H2 · Satıcı, sıcak","Senden düzenli alışveriş yapan müşterilerin var. Tam da bu yüzden ePOINT ilginç: müşterilerin sende para iadesi alıyor ve geri geliyor – sen de daha büyük bir satıcı ağının parçası oluyorsun. Mağazada bunun nasıl göründüğünü 10 dakikada gösterebilir miyim?","Önce onun faydası: müşterilerinin geri gelmesi."],["T1 · Telefon girişi","Merhaba [İsim], iki dakikan var mı? … Arıyorum çünkü yeni bir şeye başladım ve aklıma hemen sen geldin. Bunu ayaküstü anlatmak istemiyorum – ekran başında 15 dakikada çok daha iyi olur. Yarın akşam mı uyar, yoksa hafta sonu mu?","Kısa, kişisel, açıklama yerine randevu."]],"fu":[["2 gün cevap gelmezse","Merhaba [İsim], mesajım kaybolduysa diye kısaca yazıyorum: bu hafta 15 dakikan var mı?","Nazikçe hatırlat, baskı yok."],["5 gün cevap gelmezse","Merhaba [İsim], bir kez, düzgünce soruyorum: prensipte ilgini çekiyor mu, sonra mı konuşalım, yoksa senlik değil mi? Üç cevap da tamamen olur.","Çıkış kapısı olan bir karar."],["İyi bir ilk görüşmeden sonra","Görüşme için teşekkürler! Senin için en önemlisi [nokta 1] ve [nokta 2] idi. Sonraki adım: [somut eylem]. [gün, saat] uyar mı?","Kararlaştırılanı yazıya dök."],["Hâlâ emin değil","Şu anda seni bir sonraki adımdan alıkoyan o tek şey ne? O zaman her şeyi baştan konuşmak yerine tam olarak onu netleştirelim.","Gerçek sebebi öğren."],["Kararlaştırılan “sonra”da","Merhaba [İsim], [zaman] tekrar yazmamı söylemiştin. Şimdi daha mı uygun?","Sözünü tut."],["Net bir hayırdan sonra","Net cevabın için teşekkürler. Bu konuda bir daha yazmayacağım. Bir gün uygulamayı müşteri olarak istersen, haber vermen yeterli. Her şey gönlünce olsun!","İlişkiyi koru – iş takibi yok."]]},

function isObj(o){ return !!o && typeof o==="object" && !Array.isArray(o); }
function withDe(o,base){
  if(!isObj(base)) return o!==undefined?o:base;
  var r={}, k;
  for(k in base){ if(Object.prototype.hasOwnProperty.call(base,k)) r[k]=(isObj(o)&&Object.prototype.hasOwnProperty.call(o,k))?(isObj(base[k])?withDe(o[k],base[k]):o[k]):base[k]; }
  if(isObj(o)) for(k in o){ if(Object.prototype.hasOwnProperty.call(o,k) && !(k in r)) r[k]=o[k]; }
  return r;
}

document.addEventListener("click",function(e){

  var el=e.target.closest("[data-act]"); if(!el) return;
  var a=el.getAttribute("data-act"), id=el.getAttribute("data-id");
  switch(a){
   case "lang": switchLang(el.getAttribute("data-v")); break;
   case "consent": S.consent=true; save(); render(); sync(false); break;
   case "openside": document.getElementById("side").classList.add("open"); document.getElementById("ov").classList.add("open"); break;
   case "closeside": closeSide(); break;
   case "toggleDone": S.done[id]=!S.done[id]; save(); render(); if(S.done[id]) toast(L.ui.toastDone); break;
   case "setType": S.diag.type=+el.getAttribute("data-v"); save(); render(); break;
   case "quiz": S.quiz[+el.getAttribute("data-q")]=+el.getAttribute("data-a"); save(); render(); break;
   case "pitchStart": pitchToggle(); break;
   case "pitchReset": pitchStop(false); S.pitch={reps:0,best:0,leaderOk:S.pitch.leaderOk}; save(); render(); break;
   case "addCat": addCat=+el.getAttribute("data-v"); [].forEach.call(document.querySelectorAll("#catpills .pill"),function(p){p.classList.toggle("on",p===el);}); break;
   case "bulkAdd": var lines=document.getElementById("bulk").value.split(/\n+/).map(function(s){return s.trim();}).filter(Boolean); lines.forEach(function(n){ S.list.push({id:uid(),name:n,ctx:"",cat:addCat}); }); save(); render(); toast(F(L.m.list.bulkToast,{n:lines.length})); break;
   case "delC": S.list=S.list.filter(function(c){return c.id!==id;}); save(); keepScroll(render); break;
   case "rate": var c=findC(id); c[el.getAttribute("data-k")]=+el.getAttribute("data-v"); save(); keepScroll(render); break;
   case "copyScript": var grp=el.getAttribute("data-g"), sc=scripts(grp).filter(function(s){return s.id===id;})[0]; copyText(fill(sc.x,findC(pick[grp]))); S.sent[id]=(S.sent[id]||0)+1; markContacted(grp); save(); setTimeout(function(){ keepScroll(render); },50); break;
   case "waScript": S.sent[id]=(S.sent[id]||0)+1; markContacted(el.getAttribute("data-g")); save(); setTimeout(function(){ keepScroll(render); },300); break;
   case "copy4": var t=[0,1,2,3].map(function(i){return (S.sent["f4_"+i]||"").trim();}).filter(Boolean).join(" "); if(t) copyText(t); else toast(L.m.warm.fill4); break;
   case "copyStory": var st=[0,1,2,3].map(function(i){return (S.story[i]||"").trim();}).filter(Boolean).join(" "); if(st) copyText(st); else toast(L.m.talk.storyEmpty); break;
   case "copyTxt": copyText(el.getAttribute("data-t")); break;
   case "kcopy": var arr=L.m[el.getAttribute("data-k")][el.getAttribute("data-f")], row=arr[+el.getAttribute("data-i")]; if(row) copyText(fillKing(row[3])); break;
   case "kedit": S.kedit=S.kedit===id?"":id; kDelPending=""; save(); keepScroll(render); break;
   case "kdel": if(kDelPending!==id){ kDelPending=id; keepScroll(render); break; } S.kings=S.kings.filter(function(k){return k.id!==id;}); if(S.kpick===id) S.kpick=""; S.kedit=""; kDelPending=""; save(); keepScroll(render); break;
   case "kpickGo": S.kpick=id; save(); go("knachr"); break;
   case "delTalk": S.talks.splice(+el.getAttribute("data-i"),1); save(); keepScroll(render); break;
   case "weekNext": for(var i=0;i<6;i++) S.kpi["t"+i]=""; save(); render(); toast(L.m.week.closed); break;
   case "copyLink": copyText(location.href.split("#")[0]+"#"+S.lang); break;
   case "print": window.print(); break;
   case "backup": showBackup(); break;
   case "closeBackup": var b=document.getElementById("backupbox"); if(b){ if(S.startedAt) b.parentNode.removeChild(b); else b.innerHTML=""; } break;
   case "exportFile": exportFile(); break;
   case "exportCopy": copyText(JSON.stringify(S)); break;
   case "importCode": var v=document.getElementById("impcode").value.trim(); if(v) importData(v); else toast(L.m.bk.need); break;
   case "resetAll": try{ localStorage.removeItem(KEY); }catch(err){} S=blank(S.lang); lastSent=0; lastSync=0; render(); toast(L.m.bk.reset); break;
  }
});
document.addEventListener("change",function(e){
  var el=e.target, act=el.getAttribute("data-act");
  if(el.id==="impfile" && el.files && el.files[0]){ var r=new FileReader(); r.onload=function(){ importData(String(r.result)); }; r.readAsText(el.files[0]); return; }
  if(act==="langsel"){ switchLang(el.value); return; }
  if(act==="topToggle"){ var c=findC(el.getAttribute("data-id")); c.top=el.checked; if(!c.top) c.first5=false; save(); keepScroll(render); return; }
  if(act==="first5"){ var c2=findC(el.getAttribute("data-id")), n5=S.list.filter(function(x){return x.first5;}).length; if(el.checked && n5>=5){ el.checked=false; toast(L.m.top.max5); return; } c2.first5=el.checked; save(); return; }
  if(act==="pick"){ pick[el.getAttribute("data-g")]=el.value; keepScroll(render); return; }
  if(el.hasAttribute("data-kbind")){ kbind(el); if(el.hasAttribute("data-rr")) keepScroll(render); return; }
  if(el.hasAttribute("data-cbind") && (el.tagName==="SELECT"||el.type==="checkbox"||el.type==="date")){ cbind(el); if(el.hasAttribute("data-rr")) keepScroll(render); return; }
  if(el.hasAttribute("data-bind") && el.type==="checkbox"){ setPath(el.getAttribute("data-bind"),el.checked); save(); keepScroll(render); return; }
  if(el.hasAttribute("data-bind") && el.hasAttribute("data-rr")){ setPath(el.getAttribute("data-bind"),el.value); save(); keepScroll(render); return; }
});
document.addEventListener("input",function(e){
  var el=e.target;
  if(el.id==="einwq"){ filterList("einwq","einwlist","einwnone"); return; }
  if(el.id==="keinwq"){ filterList("keinwq","keinwlist"); return; }
  if(el.hasAttribute("data-bind") && el.type!=="checkbox"){ setPath(el.getAttribute("data-bind"),el.value); save(); liveUpd(); return; }
  if(el.hasAttribute("data-kbind") && el.tagName!=="SELECT" && el.type!=="date"){ kbind(el); return; }
  if(el.hasAttribute("data-cbind") && el.type==="text"){ cbind(el); return; }
  if(el.hasAttribute("data-mbind")){ S.multi[el.getAttribute("data-mbind")]=el.value; save(); document.getElementById("multibody").innerHTML=multiRows(); return; }
  if(el.id==="lfilter"){ listFilter=el.value; var pos=el.selectionStart; render(); var f=document.getElementById("lfilter"); if(f){ f.focus(); try{f.setSelectionRange(pos,pos);}catch(x){} } }
});
function cbind(el){
  var p=el.getAttribute("data-cbind").split("."), c=findC(p[0]); if(!c) return;
  var v= el.type==="checkbox"?el.checked:el.value;
  if(p[1]==="cat" && v!=="") v=+v;
  c[p[1]]=v; save();
}
function kbind(el){
  var p=el.getAttribute("data-kbind").split("."), k=findK(p[0]); if(!k) return;
  if(p[1]==="sc"){ if(!k.sc) k.sc={}; k.sc[p[2]]=+el.value; if(!k.scDate) k.scDate=new Date().toISOString().slice(0,10); }
  else k[p[1]]= (p[1]==="stage")?+el.value:el.value;
  save();
}
document.addEventListener("submit",function(e){
  e.preventDefault();
  var f=e.target;
  if(f.id==="startform"){
    var n=document.getElementById("w_name").value.trim(); if(!n){ toast(L.ui.needName); return; }
    var cb=document.getElementById("w_consent"); if(SYNC && cb && !cb.checked){ toast(L.ui.consentNeed); return; }
    S.name=n; S.leader=document.getElementById("w_leader").value.trim(); S.consent=!!(cb&&cb.checked); S.startedAt=Date.now(); S.view="start"; save(); render(); sync(false); return; }
  if(f.id==="addform"){ var inp=document.getElementById("add_name"), nm=inp.value.trim(); if(!nm){ inp.focus(); return; } S.list.push({id:uid(),name:nm,ctx:document.getElementById("add_ctx").value.trim(),cat:addCat}); save(); keepScroll(render); var ni=document.getElementById("add_name"); if(ni) ni.focus(); if(S.list.length===30) toast(L.m.list.t30); if(S.list.length===100) toast(L.m.list.t100); return; }
  if(f.id==="kingform"){ var ki=document.getElementById("k_name"), kn=ki.value.trim(); if(!kn){ ki.focus(); return; } var nk={id:uid(),name:kn,type:"",motive:"",sc:{},stage:0,next:"",date:""}; S.kings.push(nk); S.kedit=nk.id; save(); keepScroll(render); return; }
  if(f.id==="talkform"){ var w=document.getElementById("t_who").value.trim(); if(!w) return; S.talks.unshift({at:Date.now(),who:w,lever:document.getElementById("t_lever").value,q:document.getElementById("t_q").value,next:document.getElementById("t_next").value}); var c=S.list.filter(function(x){return x.name===w;})[0]; if(c && (!c.status||c.status==="NEU")) c.status="TERMIN"; save(); render(); toast(L.m.talk.saved); return; }
});

/* ---------- Pitch timer ---------- */
var pT=null, pStart=0;
function pitchToggle(){ if(pT){ pitchStop(true); } else { pStart=Date.now(); document.getElementById("pitchBtn").textContent=L.m.system.stop; pT=setInterval(tick,200); tick(); } }
function tick(){ var el=document.getElementById("timer"); if(!el){ clearInterval(pT); pT=null; return; } var s=(Date.now()-pStart)/1000, left=Math.ceil(60-s); el.textContent=left>0?left:"+"+Math.floor(s-60); el.className="timer tab "+(left>0?"run":"over"); }
function pitchStop(count){
  if(!pT) return; clearInterval(pT); pT=null;
  var s=Math.round((Date.now()-pStart)/1000), m=L.m.system;
  if(count){
    if(s<15) toast(m.short);
    else if(s<=60){ S.pitch.reps++; if(!S.pitch.best||s<S.pitch.best) S.pitch.best=s; save(); toast(F(m.valid,{s:s})); }
    else toast(F(m.long,{s:s}));
  }
  render();
}

/* ---------- Boot ---------- */
var hadSaved=false;
try{ hadSaved=!!localStorage.getItem(KEY); }catch(e){}
load();
var hash=(location.hash||"").replace("#","").toLowerCase();
if(LANGS.indexOf(hash)>=0 && (!hadSaved || !S.startedAt)) S.lang=hash;
setLang(S.lang);
if(hash && L.mods[hash] && S.startedAt) S.view=hash;
if(!L.mods[S.view]) S.view="start";
try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){}
render();
if(S.startedAt) setTimeout(function(){ if(!S.updatedAt) S.updatedAt=Date.now(); sync(false); },1500);
})();

</script>
